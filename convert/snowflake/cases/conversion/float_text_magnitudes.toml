# FLOAT text by magnitude, deciding the digits Snowflake writes between the recorded bands.
category = "conversion"
construct = "node:cast"
session_profile = "utc-v1"

[[case]]
id = "float_text_many_rows_two_to_five_whole_digits"
description = "FLOAT text over many rows, which Snowflake cannot fold: 17 significant digits with 2 to 5 whole digits, where the rule writes 11 to 14."
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["12.345678901234567"],
  ["98.76543210987654"],
  ["123.45678901234567"],
  ["987.6543210987654"],
  ["1234.5678901234567"],
  ["9876.543210987654"],
  ["12345.678901234567"],
  ["98765.43210987654"],
  ["10.000000000000002"],
  ["12.5"],
  ["NULL"],
]
query = "SELECT x::VARCHAR AS fx, TO_VARCHAR(x) AS tv, OBJECT_CONSTRUCT('k', x):k::VARCHAR AS o FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "boundary", "negative"]

