[[case]]
id = "float_text_from_text"
description = "Text read as a FLOAT and written back, at the undecided magnitudes; unreadable text is NULL."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'12.345678901234567'"],
  ["'1234567.8901234567'"],
  ["'0.012345678901234567'"],
  ["'not a number'"],
  ["''"],
  ["NULL"],
]
query = "SELECT TRY_TO_DOUBLE(s)::VARCHAR AS fx FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "invalid", "boundary"]
