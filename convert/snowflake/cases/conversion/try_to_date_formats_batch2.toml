# TRY_TO_DATE and TO_DATE with the formats models use.
category = "conversion"
construct = "fn:TRY_TO_DATE"
session_profile = "utc-v1"

[[case]]
id = "try_to_date_dd_mm_yyyy_1"
description = "TRY_TO_DATE with the format DD-MM-YYYY."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'29-02-2024'"],
  ["'1-2-2024'"],
  ["'31-04-2024'"],
  ["'2024-02-29'"],
  ["' 29-02-2024'"],
  ["''"],
  ["NULL"],
]
expression = "TRY_TO_DATE(s, 'DD-MM-YYYY')"
tags = ["null", "invalid", "boundary"]

[[case]]
id = "to_date_dd_mm_yyyy_1"
description = "TO_DATE with the format DD-MM-YYYY over text spelled in it."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'29-02-2024'"],
  ["NULL"],
]
expression = "TO_DATE(s, 'DD-MM-YYYY')"
tags = ["null", "invalid", "boundary"]

