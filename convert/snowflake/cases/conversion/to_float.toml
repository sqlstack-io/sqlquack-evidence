category = "conversion"
construct = "cast:FLOAT"
session_profile = "utc-v1"

[[case]]
id = "text_to_float"
description = "Text to FLOAT, including exponents and special values."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'1.5'"],
  ["'1e3'"],
  ["'-0'"],
  ["'0.1'"],
  ["NULL"],
]
expression = "CAST(s AS FLOAT)"
tags = ["null", "boundary"]

[[case]]
id = "text_to_float_lenient"
description = "Special and lenient FLOAT spellings."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["' 2 '"],
  ["'NaN'"],
  ["'nan'"],
  ["'inf'"],
  ["'Infinity'"],
  ["'-Infinity'"],
  ["'1e400'"],
  ["'.5'"],
]
expression = "TRY_CAST(s AS FLOAT)"
tags = ["boundary", "invalid"]

[[case]]
id = "text_to_float_invalid"
description = "Text that is not a float."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'one'"],
]
expression = "CAST(s AS FLOAT)"
tags = ["invalid"]

[[case]]
id = "number_to_float"
description = "NUMBER to FLOAT."
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["99999999999999999999999999999999999999"],
  ["NULL"],
]
expression = "a::FLOAT"
tags = ["null", "boundary"]

[[case]]
id = "decimal_to_double"
description = "NUMBER(10,2) to DOUBLE."
columns = [{ name = "a", type = "NUMBER(10,2)" }]
rows = [
  ["0.10"],
  ["-0.30"],
  ["NULL"],
]
expression = "a::DOUBLE"
tags = ["null"]

[[case]]
id = "text_float_spellings"
description = "Non-finite words in other cases, signs, underflow and whitespace."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'-inf'"],
  ["'+inf'"],
  ["'INF'"],
  ["'NAN'"],
  ["'-nan'"],
  ["'1e-400'"],
  ["'+1.5'"],
  ["' 1e3 '"],
  ["'\\t2'"],
  ["'1_000'"],
  ["NULL"],
]
expression = "TRY_CAST(s AS FLOAT)"
tags = ["null", "invalid", "boundary"]

[[case]]
id = "text_float_overflow"
description = "CAST of decimal text beyond the double range."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'1e400'"],
]
expression = "CAST(s AS FLOAT)"
tags = ["invalid", "boundary"]
