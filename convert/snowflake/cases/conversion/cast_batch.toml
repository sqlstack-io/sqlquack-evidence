[[case]]
id = "ntz_to_varchar_rounding"
description = "TIMESTAMP_NTZ(9) cast to VARCHAR where truncating and rounding to milliseconds differ."
columns = [{ name = "n", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.9996'"],
  ["'2024-02-29 13:45:01.9999999'"],
  ["'2024-02-29 23:59:59.9995'"],
  ["'2024-02-29 13:45:01.1235'"],
  ["NULL"],
]
expression = "n::VARCHAR"
tags = ["null", "boundary", "invalid"]
expected_divergence = "timestamp_text_rounding"
