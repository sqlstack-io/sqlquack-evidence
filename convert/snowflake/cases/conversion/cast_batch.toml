# Casts models use: FLOAT to text and numbers, zoned timestamps, and VARIANT text to TIMESTAMP_TZ.
category = "conversion"
construct = "node:cast"
session_profile = "utc-v1"

[[case]]
id = "float_varchar_integers"
description = "FLOAT cast to VARCHAR: integers."
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0"],
  ["1"],
  ["-1"],
  ["42"],
  ["100"],
  ["123456789"],
  ["-0"],
  ["NULL"],
]
expression = "x::VARCHAR"
tags = ["null", "boundary", "invalid"]

