[[case]]
id = "tz_to_ntz_direct"
description = "TIMESTAMP_TZ cast directly to TIMESTAMP_NTZ: the wall time at its own offset."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'2024-03-10 02:30:00 -05:00'"],
  ["'2024-06-01 12:00:00.5 +05:30'"],
  ["'2024-12-31 23:59:59.999999999 -08:00'"],
  ["'2024-01-01 00:30:00 +14:00'"],
  ["'1970-01-01 00:00:00 +00:00'"],
  ["NULL"],
]
expression = "t::TIMESTAMP_NTZ"
tags = ["null", "boundary", "invalid"]

[[case]]
id = "tz_to_ntz_cast_syntax"
description = "CAST(t AS TIMESTAMP) of a TIMESTAMP_TZ, then CAST AS TIMESTAMP_NTZ."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'2024-03-10 02:30:00 -05:00'"],
  ["'2024-06-01 12:00:00.5 +05:30'"],
  ["'2024-12-31 23:59:59.999999999 -08:00'"],
  ["'2024-01-01 00:30:00 +14:00'"],
  ["'1970-01-01 00:00:00 +00:00'"],
  ["NULL"],
]
expression = "CAST(CAST(t AS TIMESTAMP) AS TIMESTAMP_NTZ)"
tags = ["null", "boundary", "invalid"]

[[case]]
id = "tz_to_date_direct"
description = "TIMESTAMP_TZ cast directly to DATE: the date at its own offset."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'2024-03-10 02:30:00 -05:00'"],
  ["'2024-06-01 12:00:00.5 +05:30'"],
  ["'2024-12-31 23:59:59.999999999 -08:00'"],
