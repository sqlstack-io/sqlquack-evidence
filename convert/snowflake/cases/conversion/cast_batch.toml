]
expression = "t::DATE"
tags = ["null", "boundary", "invalid"]

[[case]]
id = "tz_coalesce_ntz"
description = "COALESCE of a TIMESTAMP_TZ cast to TIMESTAMP_NTZ with an NTZ fallback."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }, { name = "n", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-03-10 02:30:00 -05:00'", "'2024-01-01 00:00:00'"],
  ["NULL", "'2024-01-01 00:00:00'"],
  ["NULL", "NULL"],
]
expression = "COALESCE(t::TIMESTAMP_NTZ, n)"
tags = ["null", "boundary", "invalid"]

[[case]]
id = "ntz_to_varchar"
description = "TIMESTAMP_NTZ cast to VARCHAR: fractions, midnight and edge years."
columns = [{ name = "n", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01'"],
  ["'2024-02-29 13:45:01.5'"],
  ["'2024-02-29 13:45:01.123456789'"],
  ["'2024-02-29 00:00:00'"],
  ["'0001-01-01 00:00:00'"],
  ["NULL"],
]
expression = "n::VARCHAR"
tags = ["null", "boundary", "invalid"]
expected_divergence = "timestamp_range"

[[case]]
id = "ltz_to_ntz"
description = "TIMESTAMP_LTZ cast to TIMESTAMP_NTZ in a UTC session."
columns = [{ name = "l", type = "TIMESTAMP_LTZ(9)" }]
rows = [
  ["'2024-03-10 02:30:00 -05:00'"],
  ["'2024-06-01 12:00:00.5 +05:30'"],
  ["'2024-01-01 00:00:00 +00:00'"],
  ["NULL"],
]
expression = "l::TIMESTAMP_NTZ"
tags = ["null", "boundary", "invalid"]

[[case]]
id = "variant_to_tz"
description = "A VARIANT string cast to TIMESTAMP_TZ: Z, offsets and no offset; JSON null and missing keys."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"t\":\"2024-02-29T13:45:01Z\"}')"],
  ["PARSE_JSON('{\"t\":\"2024-02-29T13:45:01.123456+02:00\"}')"],
  ["PARSE_JSON('{\"t\":\"2024-02-29 13:45:01\"}')"],
  ["PARSE_JSON('{\"t\":\"2024-02-29T13:45:01.5-05:30\"}')"],
  ["PARSE_JSON('{\"t\":null}')"],
  ["PARSE_JSON('{}')"],
  ["NULL"],
]
expression = "v:t::TIMESTAMP_TZ"
tags = ["null", "boundary", "invalid"]

[[case]]
id = "variant_to_tz_lower"
description = "The same cast spelled timestamp_tz, read back in UTC."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"t\":\"2024-02-29T13:45:01Z\"}')"],
  ["PARSE_JSON('{\"t\":\"2024-02-29T13:45:01.123456+02:00\"}')"],
  ["PARSE_JSON('{\"t\":\"2024-02-29 13:45:01\"}')"],
  ["PARSE_JSON('{\"t\":\"2024-02-29T13:45:01.5-05:30\"}')"],
  ["PARSE_JSON('{\"t\":null}')"],
  ["PARSE_JSON('{}')"],
]
expression = "CONVERT_TIMEZONE('UTC', v:t::timestamp_tz)::TIMESTAMP_NTZ"
tags = ["null", "boundary", "invalid"]

