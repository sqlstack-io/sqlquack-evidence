[[case]]
id = "float_round_then_number_3_4"
description = "ROUND of a FLOAT to 3 and 4 places, then cast to NUMBER(6,3) and NUMBER(9,4), as weights and rates are stored."
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["1.2345"],
  ["0.1235"],
  ["2.99995"],
  ["-1.0005"],
  ["0.00015"],
  ["NULL"],
]
query = "SELECT ROUND(x, 3)::NUMBER(6,3) AS w3, ROUND(x, 4)::NUMBER(9,4) AS r4 FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "boundary", "invalid"]
