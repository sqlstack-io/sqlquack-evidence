# FLOAT to NUMBER at scales 3, 4, 5 and 10, with values whose exact double and shortest decimal reading round differently.
category = "conversion"
construct = "node:cast"
session_profile = "utc-v1"

[[case]]
id = "float_number_10_3"
description = "FLOAT cast to NUMBER(10,3): halves whose double lies below or above them, negatives and nine scaled digits."
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0"],
  ["1.0005"],
  ["-1.0005"],
  ["4.0035"],
  ["1.2345"],
  ["0.1235"],
  ["2.0015"],
  ["0.0125"],
  ["9876543.2105"],
  ["1234567.8915"],
  ["1/3"],
  ["NULL"],
]
expression = "x::NUMBER(10,3)"
tags = ["null", "boundary", "invalid"]

