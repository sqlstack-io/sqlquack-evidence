category = "conversion"
construct = "node:cast"
session_profile = "utc-v1"

[[case]]
id = "date_part_tz"
description = "DATE_PART fields of zoned timestamps: in the value's own offset or in the session zone."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123456 +05:30'"],
  ["'2024-12-31 23:30:00 -08:00'"],
  ["'2024-01-01 00:15:00 +01:00'"],
  ["'1969-12-31 23:59:59.5 +00:00'"],
  ["'2024-03-10 02:30:00 -05:00'"],
  ["NULL"],
]
query = "SELECT DATE_PART(year, t) AS y, DATE_PART(month, t) AS mo, DATE_PART(day, t) AS d, DATE_PART(hour, t) AS h, DATE_PART(minute, t) AS mi, DATE_PART(second, t) AS s, DATE_PART(dayofweek, t) AS dow, DATE_PART(epoch_second, t) AS e FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "boundary"]

[[case]]
id = "date_part_tz_offset"
description = "DATE_PART timezone_hour and timezone_minute of zoned timestamps."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123456 +05:30'"],
  ["'2024-12-31 23:30:00 -08:00'"],
  ["'2024-01-01 00:15:00 +01:00'"],
  ["'1969-12-31 23:59:59.5 +00:00'"],
  ["'2024-03-10 02:30:00 -05:00'"],
  ["NULL"],
]
query = "SELECT DATE_PART(timezone_hour, t) AS th, DATE_PART(timezone_minute, t) AS tm FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "boundary"]

[[case]]
id = "date_trunc_tz"
description = "DATE_TRUNC of zoned timestamps to day, hour and month, written with their offset."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123456 +05:30'"],
  ["'2024-12-31 23:30:00 -08:00'"],
  ["'2024-01-01 00:15:00 +01:00'"],
  ["'1969-12-31 23:59:59.5 +00:00'"],
  ["'2024-03-10 02:30:00 -05:00'"],
  ["NULL"],
]
query = "SELECT TO_VARCHAR(DATE_TRUNC('day', t), 'YYYY-MM-DD HH24:MI:SS TZH:TZM') AS d, TO_VARCHAR(DATE_TRUNC('hour', t), 'YYYY-MM-DD HH24:MI:SS TZH:TZM') AS h, TO_VARCHAR(DATE_TRUNC('month', t), 'YYYY-MM-DD HH24:MI:SS TZH:TZM') AS m FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "boundary"]

[[case]]
id = "tz_to_ntz"
description = "Zoned timestamps cast to TIMESTAMP_NTZ: the local wall time kept, the offset dropped."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123456 +05:30'"],
  ["'2024-12-31 23:30:00 -08:00'"],
  ["'2024-01-01 00:15:00 +01:00'"],
  ["'1969-12-31 23:59:59.5 +00:00'"],
  ["'2024-03-10 02:30:00 -05:00'"],
  ["NULL"],
]
expression = "t::TIMESTAMP_NTZ"
tags = ["null", "boundary"]

[[case]]
id = "tz_to_date"
description = "Zoned timestamps cast to DATE."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123456 +05:30'"],
  ["'2024-12-31 23:30:00 -08:00'"],
  ["'2024-01-01 00:15:00 +01:00'"],
  ["'1969-12-31 23:59:59.5 +00:00'"],
  ["'2024-03-10 02:30:00 -05:00'"],
