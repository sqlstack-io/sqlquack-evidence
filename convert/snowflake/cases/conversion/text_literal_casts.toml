# Casts of string literals in the case's own expression, outside the input fixture.
category = "conversion"
construct = "node:cast"
session_profile = "utc-v1"

[[case]]
id = "text_literal_casts"
description = "String literals cast to NUMBER, FLOAT, BOOLEAN, DATE and TIMESTAMP_NTZ beside an input column."
columns = [{ name = "x", type = "NUMBER(10,0)" }]
rows = [["1"], ["NULL"]]
query = "SELECT x, CAST('12.50' AS NUMBER(10,2)) AS n, CAST('-0.0' AS NUMBER(10,1)) AS z, CAST('1.5e3' AS FLOAT) AS f, CAST('true' AS BOOLEAN) AS b, CAST('2024-01-05' AS DATE) AS d, CAST('2024-01-05 10:11:12.5' AS TIMESTAMP_NTZ) AS t FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "zero", "boundary", "negative"]

[[case]]
id = "text_literal_cast_invalid"
description = "A string literal that is not a number cast to NUMBER."
columns = [{ name = "x", type = "NUMBER(10,0)" }]
rows = [["1"]]
query = "SELECT CAST('twelve' AS NUMBER(10,0)) AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["invalid"]

[[case]]
id = "number_literal_casts_to_text"
description = "Integer and decimal literals cast to VARCHAR and VARCHAR(10) beside an input column."
columns = [{ name = "x", type = "NUMBER(10,0)" }]
rows = [["1"], ["NULL"]]
query = "SELECT x, CAST(501 AS VARCHAR) AS a, 501::VARCHAR(10) AS b, CAST(-7 AS VARCHAR) AS c, CAST(0 AS VARCHAR) AS d, CAST(1.50 AS VARCHAR) AS e FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "zero", "negative"]

[[case]]
id = "text_literal_minute_timestamps"
description = "String literals with minutes but no seconds cast to TIMESTAMP_NTZ, TIMESTAMP_NTZ(3) and DATE."
columns = [{ name = "x", type = "NUMBER(10,0)" }]
rows = [["1"], ["NULL"]]
query = "SELECT x, CAST('2024-05-01 15:00' AS TIMESTAMP_NTZ) AS t, '2024-05-01 09:05'::TIMESTAMP_NTZ(3) AS t3, CAST('2024-05-01T15:00' AS TIMESTAMP_NTZ) AS iso FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "boundary"]

[[case]]
id = "integer_literal_casts_to_text"
description = "Integer literals cast to VARCHAR and VARCHAR(16) beside an input column: positive, negative, zero and thirteen digits."
columns = [{ name = "x", type = "NUMBER(10,0)" }]
rows = [["1"], ["NULL"]]
query = "SELECT x, CAST(501 AS VARCHAR) AS a, 501::VARCHAR(16) AS b, CAST(-7 AS VARCHAR) AS c, CAST(0 AS VARCHAR) AS d, CAST(1234567890123 AS VARCHAR) AS e FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "zero", "negative"]
