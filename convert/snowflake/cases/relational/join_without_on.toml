# JOIN and INNER JOIN without ON, which Snowflake runs as a cross join, and the outer joins without ON.
category = "relational"
construct = "join:inner"
session_profile = "utc-v1"

[[case]]
id = "join_without_on"
description = "JOIN with no ON is a cross join: every left row with every right row, 12 rows."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'l'", "NULL", "'ln'"],
  ["'l'", "2", "'l2b'"],
  ["'r'", "2", "'r2'"],
  ["'r'", "3", "'r3'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT l.v AS lv, r.v AS rv FROM (SELECT k, v FROM input WHERE side = 'l') l JOIN (SELECT k, v FROM input WHERE side = 'r') r"
order = "bag"
tags = ["null", "duplicates"]

[[case]]
id = "inner_join_without_on"
description = "INNER JOIN with no ON is a cross join too."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'l'", "NULL", "'ln'"],
  ["'l'", "2", "'l2b'"],
  ["'r'", "2", "'r2'"],
  ["'r'", "3", "'r3'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT l.v AS lv, r.v AS rv FROM (SELECT k, v FROM input WHERE side = 'l') l INNER JOIN (SELECT k, v FROM input WHERE side = 'r') r"
order = "bag"
tags = ["null", "duplicates"]

[[case]]
id = "join_without_on_filtered"
description = "JOIN with no ON, then the key match in WHERE: NULL keys never match."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'l'", "NULL", "'ln'"],
  ["'l'", "2", "'l2b'"],
  ["'r'", "2", "'r2'"],
  ["'r'", "3", "'r3'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT l.v AS lv, r.v AS rv FROM (SELECT k, v FROM input WHERE side = 'l') l JOIN (SELECT k, v FROM input WHERE side = 'r') r WHERE l.k = r.k"
order = "bag"
tags = ["null", "duplicates"]

