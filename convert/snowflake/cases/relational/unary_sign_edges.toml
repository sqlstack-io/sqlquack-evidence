# Unary signs before a literal or a column: which doubled forms Snowflake rejects, how it types a
# unary plus over a literal, and binary operators before a unary sign. Main converts all of them today.
category = "relational"
construct = "node:alias"
session_profile = "utc-v1"

[[case]]
id = "unaliased_plus_minus"
description = "A unary plus before a unary minus. Unaliased, with FROM on its own line."
columns = [{ name = "x", type = "NUMBER(10,0)" }]
rows = [
  ["2"],
]
query = "SELECT +-1\nFROM input"
order = "ordered"
compile_error = true
tags = ["boundary"]

