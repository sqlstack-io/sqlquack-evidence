category = "relational"
construct = "node:select"
session_profile = "utc-v1"

[[case]]
id = "trailing_line_comment_integer"
description = "An unaliased integer followed by a line comment, with FROM on the next line: whether the column name keeps the comment."
columns = [{ name = "order_id", type = "NUMBER(38,0)" }]
rows = [["1"]]
query = "SELECT 1 -- trailing comment\nFROM input"
order = "ordered"
tags = ["boundary"]

