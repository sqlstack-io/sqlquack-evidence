[[case]]
id = "order_by_limit"
description = "ORDER BY with explicit NULL placement and LIMIT."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'l'", "NULL", "'ln'"],
  ["'l'", "2", "'l2b'"],
  ["'r'", "2", "'r2'"],
  ["'r'", "3", "'r3'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT v FROM input ORDER BY k DESC NULLS LAST, v LIMIT 3"
order = "ordered"
tags = ["null", "duplicates"]

[[case]]
id = "not_in_where_with_null"
description = "NOT IN in WHERE against a subquery holding NULL keeps no rows."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'l'", "NULL", "'ln'"],
  ["'l'", "2", "'l2b'"],
  ["'r'", "2", "'r2'"],
  ["'r'", "3", "'r3'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT v FROM input WHERE side = 'l' AND k NOT IN (SELECT k FROM input WHERE side = 'r')"
order = "bag"
tags = ["null", "duplicates", "empty-input"]

[[case]]
id = "not_in_where_without_null"
