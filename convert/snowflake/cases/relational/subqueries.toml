id = "select_distinct"
description = "SELECT DISTINCT treats NULLs as one value."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
