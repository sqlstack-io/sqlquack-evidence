category = "relational"
construct = "node:exists"
session_profile = "utc-v1"

[[case]]
id = "in_subquery"
description = "IN with a subquery holding NULL."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'l'", "NULL", "'ln'"],
  ["'l'", "2", "'l2b'"],
  ["'r'", "2", "'r2'"],
  ["'r'", "3", "'r3'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT v, k IN (SELECT k FROM (SELECT k, v FROM input WHERE side = 'r') r) AS found FROM (SELECT k, v FROM input WHERE side = 'l') l"
order = "bag"
tags = ["null", "duplicates"]

[[case]]
id = "not_in_subquery"
compile_error = true
description = "NOT IN with a subquery holding NULL is never true."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'l'", "NULL", "'ln'"],
  ["'l'", "2", "'l2b'"],
  ["'r'", "2", "'r2'"],
  ["'r'", "3", "'r3'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT v, k NOT IN (SELECT k FROM (SELECT k, v FROM input WHERE side = 'r') r) AS missing FROM (SELECT k, v FROM input WHERE side = 'l') l"
order = "bag"
tags = ["null", "duplicates"]

[[case]]
id = "exists"
description = "Correlated EXISTS and NOT EXISTS."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'l'", "NULL", "'ln'"],
  ["'l'", "2", "'l2b'"],
  ["'r'", "2", "'r2'"],
  ["'r'", "3", "'r3'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT l.v, EXISTS (SELECT 1 FROM (SELECT k, v FROM input WHERE side = 'r') r WHERE r.k = l.k) AS found, NOT EXISTS (SELECT 1 FROM (SELECT k, v FROM input WHERE side = 'r') r WHERE r.k = l.k) AS missing FROM (SELECT k, v FROM input WHERE side = 'l') l"
order = "bag"
tags = ["null", "duplicates"]

[[case]]
id = "where_filters"
description = "WHERE with AND, OR and IS NULL."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'l'", "NULL", "'ln'"],
  ["'l'", "2", "'l2b'"],
  ["'r'", "2", "'r2'"],
  ["'r'", "3", "'r3'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT v FROM input WHERE (k > 1 AND side = 'l') OR k IS NULL"
order = "bag"
tags = ["null", "duplicates"]

