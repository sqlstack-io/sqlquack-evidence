category = "relational"
construct = "join:inner"
session_profile = "utc-v1"

[[case]]
id = "inner_join"
description = "INNER JOIN never matches NULL keys and repeats duplicates."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'l'", "NULL", "'ln'"],
  ["'l'", "2", "'l2b'"],
  ["'r'", "2", "'r2'"],
  ["'r'", "3", "'r3'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT l.v AS lv, r.v AS rv FROM (SELECT k, v FROM input WHERE side = 'l') l INNER JOIN (SELECT k, v FROM input WHERE side = 'r') r ON l.k = r.k"
order = "bag"
tags = ["null", "duplicates"]

