category = "relational"
construct = "node:star"
session_profile = "utc-v1"

[[case]]
id = "select_star"
description = "SELECT * returns every input column, ordinal included."
columns = [{ name = "customer", type = "VARCHAR" }, { name = "amount", type = "NUMBER(10,2)" }]
rows = [
  ["'a'", "1.50"],
  ["'b'", "NULL"],
  ["NULL", "-2"],
  ["'a'", "1.50"],
]
query = "SELECT * FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "duplicates"]

[[case]]
id = "qualified_star_join"
description = "t.* from one side of a join."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(10,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'r'", "1", "'r1'"],
  ["'r'", "1", "'r1b'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT l.*, r.v AS rv FROM (SELECT k, v FROM input WHERE side = 'l') l LEFT JOIN (SELECT k, v FROM input WHERE side = 'r') r ON l.k = r.k"
order = "bag"
tags = ["null", "duplicates"]

[[case]]
id = "star_empty_input"
description = "SELECT * over a filter that keeps nothing."
columns = [{ name = "k", type = "NUMBER(10,0)" }]
rows = [
  ["1"],
  ["NULL"],
]
query = "SELECT * FROM input WHERE k > 5"
order = "bag"
tags = ["null", "empty-input"]

[[case]]
id = "star_exclude_list"
description = "SELECT * EXCLUDE a parenthesised list drops those columns and keeps the rest in order."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(10,0)" }, { name = "v", type = "VARCHAR" }, { name = "n", type = "NUMBER(10,2)" }]
rows = [
  ["'l'", "1", "'x'", "1.5"],
  ["'r'", "NULL", "NULL", "-2"],
  ["'l'", "1", "'x'", "1.5"],
]
query = "SELECT * EXCLUDE (ordinal, side, n) FROM input"
order = "bag"
tags = ["null", "duplicates"]

[[case]]
id = "star_exclude_single_mixed_case"
description = "SELECT * EXCLUDE one unparenthesised name written in another case than the column."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(10,0)" }]
rows = [
  ["'l'", "1"],
  ["NULL", "NULL"],
]
query = "SELECT * EXCLUDE Ordinal FROM input"
order = "bag"
tags = ["null"]

[[case]]
id = "qualified_star_exclude_join"
description = "t.* EXCLUDE from one side of a join, next to a column of the other side."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(10,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'r'", "1", "'r1'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT l.* EXCLUDE (v), r.v AS rv FROM (SELECT k, v FROM input WHERE side = 'l') l LEFT JOIN (SELECT k, v FROM input WHERE side = 'r') r ON l.k = r.k"
order = "bag"
tags = ["null"]

[[case]]
id = "star_exclude_join_shared_name"
compile_error = true
description = "An unqualified * EXCLUDE over a join naming a column both sides have: Snowflake rejects the name as ambiguous."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(10,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'r'", "1", "'r1'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT * EXCLUDE (k) FROM (SELECT k, v FROM input WHERE side = 'l') l INNER JOIN (SELECT k, v AS w FROM input WHERE side = 'r') r ON l.k = r.k"
order = "bag"
tags = ["invalid"]

[[case]]
id = "qualified_star_exclude_join_shared_name"
description = "l.* EXCLUDE naming a column both join sides have, beside r.*: only the left side's copy is dropped."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(10,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'r'", "1", "'r1'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT l.* EXCLUDE (k), r.* FROM (SELECT k, v FROM input WHERE side = 'l') l INNER JOIN (SELECT k, v AS w FROM input WHERE side = 'r') r ON l.k = r.k"
order = "bag"
tags = ["null"]

[[case]]
id = "star_exclude_union_all_by_name"
description = "UNION ALL BY NAME of stars where one branch EXCLUDEs a column the others have: that branch fills NULL."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(10,0)" }, { name = "v", type = "VARCHAR" }, { name = "n", type = "NUMBER(10,2)" }]
rows = [
  ["'l'", "1", "'x'", "1.5"],
  ["'l'", "2", "NULL", "NULL"],
  ["'r'", "3", "'z'", "-2"],
  ["'r'", "NULL", "NULL", "0"],
]
query = "WITH a AS (SELECT k, v, n::NUMBER(10,5) AS rate FROM input WHERE side = 'l'), b AS (SELECT v, k, n::NUMBER(38,0) AS rate FROM input WHERE side = 'r'), c AS (SELECT k, v, k::NUMBER(38,0) AS rate FROM input WHERE side = 'r') SELECT k, v, rate::NUMBER(38,10) AS rate FROM (SELECT * FROM a UNION ALL BY NAME SELECT * FROM b UNION ALL BY NAME SELECT * EXCLUDE (rate) FROM c)"
order = "bag"
tags = ["null"]

[[case]]
id = "star_exclude_unknown"
compile_error = true
description = "SELECT * EXCLUDE a column the relation does not have."
columns = [{ name = "k", type = "NUMBER(10,0)" }]
rows = [
  ["1"],
]
query = "SELECT * EXCLUDE (missing_column) FROM input"
order = "bag"
tags = ["invalid"]
