category = "relational"
construct = "node:union"
session_profile = "utc-v1"

[[case]]
id = "union_all"
description = "UNION ALL keeps duplicates."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'l'", "NULL", "'ln'"],
  ["'l'", "2", "'l2b'"],
  ["'r'", "2", "'r2'"],
  ["'r'", "3", "'r3'"],
  ["'r'", "NULL", "'rn'"],
]
query = "SELECT k FROM (SELECT k, v FROM input WHERE side = 'l') l UNION ALL SELECT k FROM (SELECT k, v FROM input WHERE side = 'r') r"
order = "bag"
tags = ["null", "duplicates"]

