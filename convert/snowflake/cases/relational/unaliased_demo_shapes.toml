# The names Snowflake gives the unaliased expressions the demo queries write, which the demo corpora
# still refuse: function calls in upper and mixed case, an empty string, a VARIANT path and a positional
# reference. The recorded column names are the receipts.
category = "relational"
construct = "node:alias"
session_profile = "utc-v1"

[[case]]
id = "demo_functions"
description = "Unaliased function calls a demo query writes: SUBSTR, FLOOR, CEIL, NULLIF, TO_DATE and MONTH."
columns = [{ name = "status", type = "VARCHAR" }, { name = "total", type = "NUMBER(12,2)" }, { name = "ordered_at", type = "TIMESTAMP_NTZ(9)" }, { name = "payload", type = "VARIANT" }]
rows = [
  ["'shipped'", "10.50", "'2026-01-15 10:30:00'", "PARSE_JSON('{\"page\":\"home\"}')"],
  ["'shipped'", "10.50", "'2026-01-15 10:30:00'", "PARSE_JSON('{\"page\":\"home\"}')"],
  ["'pending'", "3.25", "'2026-02-28 23:59:59.123456789'", "PARSE_JSON('{\"other\":1}')"],
  ["NULL", "-2.75", "'2026-03-01 00:00:00'", "NULL"],
  ["'returned'", "NULL", "'2025-12-31 12:00:00'", "PARSE_JSON('{\"page\":\"cart\"}')"],
]
query = "SELECT SUBSTR(status, 1, 3), FLOOR(total), CEIL(total), NULLIF(status, 'shipped'), TO_DATE(ordered_at), MONTH(ordered_at) FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "duplicates"]

[[case]]
id = "demo_functions_mixed_case"
description = "The same calls written in mixed case, to show whether the name is the source text uppercased."
columns = [{ name = "status", type = "VARCHAR" }, { name = "total", type = "NUMBER(12,2)" }, { name = "ordered_at", type = "TIMESTAMP_NTZ(9)" }, { name = "payload", type = "VARIANT" }]
rows = [
  ["'shipped'", "10.50", "'2026-01-15 10:30:00'", "PARSE_JSON('{\"page\":\"home\"}')"],
  ["'shipped'", "10.50", "'2026-01-15 10:30:00'", "PARSE_JSON('{\"page\":\"home\"}')"],
  ["'pending'", "3.25", "'2026-02-28 23:59:59.123456789'", "PARSE_JSON('{\"other\":1}')"],
  ["NULL", "-2.75", "'2026-03-01 00:00:00'", "NULL"],
  ["'returned'", "NULL", "'2025-12-31 12:00:00'", "PARSE_JSON('{\"page\":\"cart\"}')"],
]
query = "SELECT SUbSTr(StATUS, 1, 3), fLoor(tOTaL), cEiL(TOTal), NUlLIf(staTus, 'shipped'), tO_dATe(OrDERED_AT), MOnTh(ORDered_At) FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "duplicates"]

