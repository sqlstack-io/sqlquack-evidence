[[case]]
id = "demo_variant_path"
description = "An unaliased VARIANT path, over a row with the key, one without it and a NULL."
columns = [{ name = "status", type = "VARCHAR" }, { name = "total", type = "NUMBER(12,2)" }, { name = "ordered_at", type = "TIMESTAMP_NTZ(9)" }, { name = "payload", type = "VARIANT" }]
rows = [
  ["'shipped'", "10.50", "'2026-01-15 10:30:00'", "PARSE_JSON('{\"page\":\"home\"}')"],
  ["'shipped'", "10.50", "'2026-01-15 10:30:00'", "PARSE_JSON('{\"page\":\"home\"}')"],
  ["'pending'", "3.25", "'2026-02-28 23:59:59.123456789'", "PARSE_JSON('{\"other\":1}')"],
  ["NULL", "-2.75", "'2026-03-01 00:00:00'", "NULL"],
  ["'returned'", "NULL", "'2025-12-31 12:00:00'", "PARSE_JSON('{\"page\":\"cart\"}')"],
]
query = "SELECT payload:page FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "duplicates", "missing-key"]

[[case]]
id = "demo_positional"
description = "An unaliased positional reference to the first authored column ($1 is the fixture's ordinal)."
columns = [{ name = "status", type = "VARCHAR" }, { name = "total", type = "NUMBER(12,2)" }, { name = "ordered_at", type = "TIMESTAMP_NTZ(9)" }, { name = "payload", type = "VARIANT" }]
rows = [
  ["'shipped'", "10.50", "'2026-01-15 10:30:00'", "PARSE_JSON('{\"page\":\"home\"}')"],
  ["'shipped'", "10.50", "'2026-01-15 10:30:00'", "PARSE_JSON('{\"page\":\"home\"}')"],
  ["'pending'", "3.25", "'2026-02-28 23:59:59.123456789'", "PARSE_JSON('{\"other\":1}')"],
  ["NULL", "-2.75", "'2026-03-01 00:00:00'", "NULL"],
  ["'returned'", "NULL", "'2025-12-31 12:00:00'", "PARSE_JSON('{\"page\":\"cart\"}')"],
]
query = "SELECT $2 FROM input ORDER BY ordinal"
