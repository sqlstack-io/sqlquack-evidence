category = "relational"
construct = "clause:union_by_name"
session_profile = "utc-v1"

[[case]]
id = "union_all_by_name_reordered"
description = "UNION ALL BY NAME matches columns by name when the branches list them in different orders; the first branch's order names the result."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }, { name = "n", type = "NUMBER(10,2)" }]
rows = [
  ["'l'", "1", "'x'", "1.5"],
  ["'l'", "2", "'y'", "NULL"],
  ["'l'", "2", "'y'", "NULL"],
  ["'l'", "NULL", "NULL", "0"],
  ["'r'", "2", "'y'", "NULL"],
  ["'r'", "3", "'z'", "-2"],
  ["'r'", "NULL", "NULL", "0"],
]
query = "SELECT k, v FROM (SELECT * FROM input WHERE side = 'l') l UNION ALL BY NAME SELECT v, k FROM (SELECT * FROM input WHERE side = 'r') r"
order = "bag"
tags = ["null", "duplicates"]

