# JOIN USING a key NUMBER(18,0) on one side and NUMBER(38,0) on the other, each join kind alone,
# and union columns NULL in every branch.
category = "relational"
construct = "node:join"
session_profile = "utc-v1"

[[case]]
id = "join_using_widths_inner_a_first"
description = "JOIN USING a key NUMBER(18,0) on the left and NUMBER(38,0) on the right: the merged and both qualified key types."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(18,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["'l'", "1", "'l1'"],
  ["'l'", "2", "'l2'"],
  ["'r'", "2", "'r2'"],
  ["'r'", "3", "'r3'"],
  ["'l'", "NULL", "'ln'"],
]
query = "WITH a AS (SELECT k, v FROM input WHERE side = 'l'), e AS (SELECT CAST(k AS NUMBER(38,0)) AS k, v AS w FROM input WHERE side = 'r') SELECT k, a.k AS ak, e.k AS ek, v, w FROM a JOIN e USING (k) ORDER BY k NULLS LAST, v NULLS LAST, w NULLS LAST"
order = "ordered"
tags = ["null", "mixed-types"]

