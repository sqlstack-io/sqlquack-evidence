[[case]]
id = "union_null_column"
description = "A column NULL in every branch of a UNION ALL: its type."
columns = [{ name = "k", type = "NUMBER(4,0)" }]
rows = [
  ["1"],
  ["2"],
]
query = "SELECT k, NULL AS n FROM input UNION ALL SELECT k, NULL FROM input ORDER BY k"
order = "ordered"
tags = ["null"]

[[case]]
id = "union_null_column_typed_branch"
description = "A column NULL in one branch and a NUMBER in the other."
columns = [{ name = "k", type = "NUMBER(4,0)" }]
rows = [
  ["1"],
  ["2"],
]
query = "SELECT k, NULL AS n FROM input UNION ALL SELECT k, k * 2 FROM input ORDER BY k, n NULLS FIRST"
order = "ordered"
tags = ["null"]
