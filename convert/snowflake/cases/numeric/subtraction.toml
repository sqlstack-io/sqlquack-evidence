category = "numeric"
construct = "node:sub"
session_profile = "utc-v1"

[[case]]
id = "mixed_scales"
description = "Subtracting numbers of different scales."
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(12,4)" }]
rows = [
  ["1.25", "0.0001"],
  ["-0.01", "0"],
  ["0", "99999999.9999"],
  ["NULL", "1"],
]
expression = "a - b"
tags = ["null", "zero", "negative", "boundary"]

[[case]]
id = "integers"
description = "Integer subtraction down to the smallest 38-digit value."
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["5", "7"],
  ["0", "0"],
  ["NULL", "1"],
  ["-99999999999999999999999999999999999998", "1"],
]
expression = "a - b"
tags = ["null", "zero", "negative", "boundary"]

[[case]]
id = "unary_minus"
description = "Negating decimals, zero and NULL."
columns = [{ name = "a", type = "NUMBER(10,2)" }]
rows = [
  ["1.25"],
  ["-3.00"],
  ["0"],
  ["NULL"],
  ["99999999.99"],
]
expression = "-a"
tags = ["null", "zero", "negative", "boundary"]
