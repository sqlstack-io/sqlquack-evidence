# MOD and the numeric literals models write.
category = "numeric"
construct = "fn:MOD"
session_profile = "utc-v1"

[[case]]
id = "mod_integers"
description = "MOD of integers with negative operands."
columns = [{ name = "a", type = "NUMBER(10,0)" }, { name = "b", type = "NUMBER(10,0)" }]
rows = [
  ["7", "3"],
  ["-7", "3"],
  ["7", "-3"],
  ["-7", "-3"],
  ["0", "5"],
  ["NULL", "3"],
  ["5", "NULL"],
]
expression = "MOD(a, b)"
tags = ["null", "zero", "negative", "boundary"]

[[case]]
id = "mod_zero_divisor"
description = "MOD by zero."
columns = [{ name = "a", type = "NUMBER(10,0)" }, { name = "b", type = "NUMBER(10,0)" }]
rows = [
  ["7", "0"],
]
expression = "MOD(a, b)"
tags = ["null", "zero", "negative", "boundary"]

[[case]]
id = "mod_decimal"
description = "MOD of decimals."
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,1)" }]
rows = [
  ["7.25", "2.0"],
  ["-7.25", "2.5"],
  ["0.10", "0.3"],
]
expression = "MOD(a, b)"
tags = ["null", "zero", "negative", "boundary"]

[[case]]
id = "mod_float"
description = "MOD of a FLOAT by an integer."
columns = [{ name = "a", type = "FLOAT" }]
rows = [
  ["52.5"],
  ["-52.5"],
  ["49.999"],
  ["NULL"],
]
expression = "MOD(a, 50)"
tags = ["null", "zero", "negative", "boundary"]

[[case]]
id = "mod_expression"
description = "MOD of an expression, as models compute weekday offsets."
columns = [{ name = "a", type = "NUMBER(10,0)" }]
rows = [
  ["1"],
  ["12"],
  ["13"],
  ["-2"],
]
expression = "MOD(12 - a, 7)"
tags = ["null", "zero", "negative", "boundary"]

[[case]]
id = "mod_operator"
description = "The % operator beside MOD."
columns = [{ name = "a", type = "NUMBER(10,0)" }, { name = "b", type = "NUMBER(10,0)" }]
rows = [
  ["7", "3"],
  ["-7", "3"],
]
expression = "a % b"
tags = ["null", "zero", "negative", "boundary"]

