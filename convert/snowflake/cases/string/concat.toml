category = "string"
construct = "fn:CONCAT"
session_profile = "utc-v1"

[[case]]
id = "concat_function"
description = "CONCAT with NULL, empty, whitespace and non-ASCII arguments."
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'gift'", "'wrap'"],
  ["'gift'", "NULL"],
  ["NULL", "NULL"],
  ["''", "'wrap'"],
  ["'  '", "'café'"],
]
expression = "CONCAT(a, b)"
tags = ["null", "empty", "whitespace", "unicode"]

[[case]]
id = "concat_operator"
description = "The || operator on the same inputs."
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'gift'", "'wrap'"],
  ["'gift'", "NULL"],
  ["NULL", "NULL"],
  ["''", "'wrap'"],
  ["'  '", "'café'"],
]
expression = "a || b"
tags = ["null", "empty", "whitespace", "unicode"]

[[case]]
id = "concat_three"
description = "CONCAT of three arguments with one NULL."
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }, { name = "c", type = "VARCHAR" }]
rows = [
  ["'a'", "'b'", "'c'"],
  ["'a'", "NULL", "'c'"],
  ["''", "''", "''"],
]
expression = "CONCAT(a, b, c)"
tags = ["null", "empty"]

[[case]]
id = "concat_number"
description = "|| with a NUMBER operand converts it to text."
columns = [{ name = "s", type = "VARCHAR" }, { name = "a", type = "NUMBER(10,2)" }]
rows = [
  ["'n='", "1.50"],
  ["'n='", "NULL"],
  ["''", "0"],
]
expression = "s || a"
tags = ["null", "empty"]

[[case]]
id = "concat_ws_absent"
description = "|| with whitespace and non-ASCII text."
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["' '"],
  ["'é'"],
]
expression = "a || a"
tags = ["whitespace", "unicode"]

[[case]]
id = "dollar_quoted_strings"
description = "Dollar-quoted string literals holding quotes, a line break, non-ASCII text and nothing."
columns = [{ name = "k", type = "VARCHAR" }]
rows = [["'x'"]]
query = "SELECT $$it's \"x\"$$ AS a, $$two\nlines$$ AS b, LENGTH($$€*$$) AS c, $$$$ AS d, $$a$$ || k AS e FROM input"
order = "ordered"
tags = ["unicode", "empty"]
