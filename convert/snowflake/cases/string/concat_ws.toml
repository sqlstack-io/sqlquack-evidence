category = "string"
construct = "fn:CONCAT_WS"
session_profile = "utc-v1"

[[case]]
id = "concat_ws_text"
description = "CONCAT_WS of text parts with NULL, empty, whitespace and non-ASCII parts and separators."
columns = [{ name = "s", type = "VARCHAR" }, { name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'-'", "'gift'", "'wrap'"],
  ["'-'", "'gift'", "NULL"],
  ["'-'", "NULL", "'wrap'"],
  ["NULL", "'gift'", "'wrap'"],
  ["''", "'gift'", "'wrap'"],
  ["'-'", "''", "''"],
  ["' | '", "'  '", "'café'"],
  ["'→'", "'ü'", "'日本'"],
]
expression = "CONCAT_WS(s, a, b)"
tags = ["null", "empty", "whitespace", "unicode"]

[[case]]
id = "concat_ws_one_part"
description = "CONCAT_WS of a single part: the part, or NULL when the part or separator is NULL."
columns = [{ name = "s", type = "VARCHAR" }, { name = "a", type = "VARCHAR" }]
rows = [["'-'", "'gift'"], ["NULL", "'gift'"], ["'-'", "NULL"], ["'-'", "''"]]
expression = "CONCAT_WS(s, a)"
tags = ["null", "empty"]

[[case]]
id = "concat_ws_many_parts"
description = "CONCAT_WS of four parts, one of them NULL in some rows."
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }, { name = "c", type = "VARCHAR" }]
rows = [["'x'", "'y'", "'z'"], ["'x'", "NULL", "'z'"], ["''", "''", "''"]]
expression = "CONCAT_WS(',', a, b, c, 'end')"
tags = ["null", "empty"]

[[case]]
id = "concat_ws_typed_parts"
description = "CONCAT_WS of NUMBER, BOOLEAN and DATE parts, formatted as Snowflake writes them."
columns = [{ name = "n", type = "NUMBER(10,2)" }, { name = "i", type = "NUMBER(38,0)" }, { name = "f", type = "BOOLEAN" }, { name = "d", type = "DATE" }]
rows = [
  ["1.50", "-7", "TRUE", "'2024-02-29'"],
  ["0", "0", "FALSE", "'0001-01-01'"],
  ["-0.01", "12345678901234567890", "NULL", "'9999-12-31'"],
  ["NULL", "1", "TRUE", "'2024-07-04'"],
]
expression = "CONCAT_WS('/', n, i, f, d)"
tags = ["null", "zero", "negative", "boundary"]

[[case]]
id = "concat_ws_null_literal"
description = "CONCAT_WS with a literal NULL part or separator."
columns = [{ name = "a", type = "VARCHAR" }]
rows = [["'gift'"], ["NULL"]]
query = "SELECT CONCAT_WS('-', a, NULL) AS p, CONCAT_WS(NULL, a, 'x') AS q FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
