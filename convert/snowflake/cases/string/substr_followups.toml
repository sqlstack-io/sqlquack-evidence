# SUBSTR at starts before the text, nearer than the far starts recorded.
category = "string"
construct = "node:substring"
session_profile = "utc-v1"

[[case]]
id = "substr_start_before_text"
description = "SUBSTR at literal negative starts reaching before the text, with and without a length."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'abc'"],
  ["''"],
  ["' a'"],
  ["'é😀a'"],
  ["NULL"],
]
query = "SELECT SUBSTR(s, -5) AS a, SUBSTR(s, -5, 3) AS b, SUBSTR(s, -4, 2) AS c, SUBSTR(s, -3, 1) AS d, SUBSTR(s, -2147483648, 2) AS e FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "empty", "whitespace", "unicode"]

[[case]]
id = "substr_column_start_before_text"
description = "SUBSTR at a start column reaching before the text."
columns = [{ name = "s", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'abc'", "-4"],
  ["'abc'", "-100"],
  ["''", "-1"],
  ["' a'", "-3"],
  ["'é😀a'", "-2147483647"],
  ["'é😀a'", "-2147483648"],
  ["NULL", "-1"],
]
expression = "SUBSTR(s, n)"
tags = ["null", "empty", "whitespace", "unicode"]
