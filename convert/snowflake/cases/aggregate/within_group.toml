[[case]]
id = "percentile_cont"
description = "PERCENTILE_CONT at 0.5 and 0.25 within each group, interpolating between values."
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "s", type = "VARCHAR" }, { name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["'a'", "3", "'c'", "1.50"],
  ["'a'", "1", "'a'", "2.00"],
  ["'a'", "2", "NULL", "NULL"],
  ["'a'", "2", "'b'", "4.25"],
  ["'b'", "1", "'z'", "-1.00"],
  ["'b'", "NULL", "'y'", "0.00"],
  ["'c'", "1", "NULL", "NULL"],
  ["NULL", "5", "'n'", "7.00"],
]
query = "SELECT g, PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY x) AS median, PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY x) AS q1 FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null", "duplicates"]
expected_divergence = "percentile_interpolation"

