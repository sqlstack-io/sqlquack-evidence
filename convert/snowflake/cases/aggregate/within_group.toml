category = "aggregate"
construct = "node:within_group"
session_profile = "utc-v1"

[[case]]
id = "listagg_within_group"
description = "LISTAGG ordered within each group: NULL values skipped, ties broken by a second key."
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "s", type = "VARCHAR" }, { name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["'a'", "3", "'c'", "1.50"],
  ["'a'", "1", "'a'", "2.00"],
  ["'a'", "2", "NULL", "NULL"],
  ["'a'", "2", "'b'", "4.25"],
  ["'b'", "1", "'z'", "-1.00"],
  ["'b'", "NULL", "'y'", "0.00"],
  ["'c'", "1", "NULL", "NULL"],
  ["NULL", "5", "'n'", "7.00"],
]
query = "SELECT g, LISTAGG(s, ',') WITHIN GROUP (ORDER BY k, s) AS joined FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null", "duplicates"]

