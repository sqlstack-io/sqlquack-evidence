[[case]]
id = "array_agg_ties_signed_zero_values"
description = "ARRAY_AGG WITHIN GROUP of whole numbers read from text as -0 and 0 under a tied key."
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(10,0)" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'a'", "1", "'-0'"],
  ["'a'", "1", "'0'"],
  ["'a'", "2", "'7'"],
]
query = "SELECT g, ARRAY_AGG(TO_NUMBER(x)) WITHIN GROUP (ORDER BY k) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null", "empty-input", "duplicates"]
