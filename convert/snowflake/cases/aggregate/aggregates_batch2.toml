[[case]]
id = "count_if_window_frames"
compile_error = true
description = "COUNT_IF, BOOLOR_AGG and BOOLAND_AGG over explicit ROWS frames, empty for the first rows."
columns = [{ name = "g", type = "VARCHAR" }, { name = "b", type = "BOOLEAN" }]
rows = [
  ["'a'", "TRUE"],
  ["'a'", "FALSE"],
  ["'a'", "NULL"],
  ["'a'", "TRUE"],
  ["'b'", "TRUE"],
]
query = "SELECT g, COUNT_IF(b) OVER (PARTITION BY g ORDER BY ordinal ROWS BETWEEN 2 PRECEDING AND 1 PRECEDING) AS n, BOOLOR_AGG(b) OVER (PARTITION BY g ORDER BY ordinal ROWS BETWEEN 2 PRECEDING AND 1 PRECEDING) AS any_set, BOOLAND_AGG(b) OVER (PARTITION BY g ORDER BY ordinal ROWS BETWEEN 1 FOLLOWING AND UNBOUNDED FOLLOWING) AS all_set FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "empty-input", "duplicates"]

