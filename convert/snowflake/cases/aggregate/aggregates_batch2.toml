# ANY_VALUE, COUNT_IF, OBJECT_AGG, ARRAY_AGG forms, BOOLOR_AGG, MAX_BY, MODE and windowed COUNT(DISTINCT).
category = "aggregate"
construct = "fn:ANY_VALUE"
session_profile = "utc-v1"

[[case]]
id = "any_value_single_valued"
description = "ANY_VALUE of text, DATE, NUMBER and VARIANT columns with one distinct value per group."
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }, { name = "d", type = "DATE" }, { name = "n", type = "NUMBER(10,2)" }, { name = "v", type = "VARIANT" }]
rows = [
  ["'a'", "'open'", "'2024-02-29'", "1.50", "PARSE_JSON('{\"k\":1}')"],
  ["'a'", "'open'", "'2024-02-29'", "1.50", "PARSE_JSON('{\"k\":1}')"],
  ["'b'", "NULL", "NULL", "NULL", "NULL"],
  ["'c'", "'shipped'", "'2024-01-01'", "-2.00", "PARSE_JSON('[1,\"x\"]')"],
]
query = "SELECT g, ANY_VALUE(x) AS x, ANY_VALUE(d) AS d, ANY_VALUE(n) AS n, ANY_VALUE(v) AS v FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null", "empty-input", "duplicates"]

