category = "translation"
construct = "sf.query.with.select.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_recursive"
description = "Numbers 1 to 5 from a recursive CTE. Catches: the recursion stopping after one step, or running past 5"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT i FROM (WITH RECURSIVE n (i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 5) SELECT i FROM n) ORDER BY i"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_hierarchy"
description = "A recursive walk over the data from employee 102 to the next id in department 2, reaching 103 at depth 2. Catches: the anchor repeated"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT id, depth FROM (WITH RECURSIVE r (id, depth) AS (SELECT employee_id, 1 FROM input WHERE department_id = 2 AND employee_id = 102 UNION ALL SELECT e.employee_id, r.depth + 1 FROM input e JOIN r ON e.employee_id = r.id + 1 AND e.department_id = 2) SELECT id, depth FROM r) ORDER BY id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_stop"
description = "A recursive clause whose condition becomes NULL stops adding rows. Catches: NULL treated as TRUE, recursing forever"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT i FROM (WITH RECURSIVE n (i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE IFF(i < 3, TRUE, NULL)) SELECT i FROM n) ORDER BY i"
order = "ordered"
tags = ["null"]
