category = "translation"
construct = "sf.query.limit.limit"
session_profile = "utc-v1"

[[case]]
id = "t001_offset"
description = "Rows 2 and 3 of the ordered input. Catches: OFFSET counted from 1, or ignored"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal FROM input ORDER BY ordinal LIMIT 2 OFFSET 1"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_zero"
description = "LIMIT 0, which returns no rows. Catches: LIMIT 0 read as no limit"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal FROM input ORDER BY ordinal LIMIT 0"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_count"
description = "LIMIT NULL; the page says \"The values NULL, empty string ('') and $$$$ are also accepted and are treated as \"unlimited\"\", so every row returns. Catches: an error, or fewer rows than the input"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal FROM input ORDER BY ordinal LIMIT NULL"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_offset"
description = "LIMIT 2 OFFSET NULL; the page treats a NULL offset as 0 (its LIMIT NULL OFFSET NULL example returns every row), so rows 1 and 2 return. Catches: an error, or the offset applied as something other than 0"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal FROM input ORDER BY ordinal LIMIT 2 OFFSET NULL"
order = "ordered"
tags = ["null"]
