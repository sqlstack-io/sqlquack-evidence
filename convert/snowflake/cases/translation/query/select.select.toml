  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * EXCLUDE (first_name, department_id) FROM input ORDER BY employee_id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_alias_star"
description = "A table alias star over a join with the departments, which takes only that table's columns. Catches: both tables' columns returned"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT e.* FROM input e JOIN (SELECT * FROM (VALUES (1, 'Engineering'), (2, 'Customer Support'), (3, 'Finance')) AS d (department_id, department_name)) d ON e.department_id = d.department_id ORDER BY e.employee_id"
order = "ordered"
tags = ["type-combination"]

