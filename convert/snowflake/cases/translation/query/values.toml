category = "translation"
construct = "sf.query.values"
session_profile = "utc-v1"

[[case]]
id = "t001_aliases"
description = "Three rows of an inline VALUES table with the table alias v and the column aliases n and s. Catches: the aliases dropped (COLUMN1, COLUMN2)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT v.n, v.s FROM (VALUES (1, 'one'), (3, 'three'), (2, 'two')) AS v (n, s) ORDER BY v.n"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_common_type"
description = "Rows of 1 and 2.5 in one column, which take a common numeric type. Catches: the first row's type used, so 2.5 truncated"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT column1 AS r FROM (VALUES (1), (2.5)) ORDER BY column1"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_value"
description = "A NULL beside a string in one column. Catches: NULL typed apart from the column, or refused"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT n, s FROM (VALUES (1, NULL), (2, 'b')) AS v (n, s) ORDER BY n"
order = "ordered"
tags = ["null"]
