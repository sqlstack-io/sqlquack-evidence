category = "translation"
construct = "sf.query.join-lateral"
session_profile = "utc-v1"

[[case]]
id = "t001_lateral"
description = "For each employee, the count of colleagues in the same department, from a LATERAL subquery. Catches: the subquery evaluated once, uncorrelated"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT e.employee_id, l.n FROM input e, LATERAL (SELECT COUNT(*) AS n FROM input c WHERE c.department_id = e.department_id) l ORDER BY e.employee_id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_key"
description = "Row 104 counts no colleagues, since its key is NULL; the other rows count colleagues other than themselves. Catches: the self-exclusion ignored, so each count is one higher"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT e.employee_id, l.n FROM input e, LATERAL (SELECT COUNT(*) AS n FROM input c WHERE c.department_id = e.department_id AND c.employee_id <> e.employee_id) l ORDER BY e.employee_id"
order = "ordered"
tags = ["null"]
