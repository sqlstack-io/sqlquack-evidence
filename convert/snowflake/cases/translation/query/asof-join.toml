category = "translation"
construct = "sf.query.asof-join"
session_profile = "utc-v1"

[[case]]
id = "t001_ge"
description = "Each trade with the latest quote at or before it, per symbol; the trade at time 1 has none. Catches: the closest quote after the trade taken, or symbols mixed"
columns = [{ name = "kind", type = "VARCHAR" }, { name = "sym", type = "VARCHAR" }, { name = "ts", type = "NUMBER(38,0)" }, { name = "px", type = "NUMBER(38,0)" }]
rows = [
  ["'t'", "'A'", "5", "NULL"],
  ["'t'", "'A'", "10", "NULL"],
  ["'t'", "'B'", "7", "NULL"],
  ["'t'", "'A'", "1", "NULL"],
  ["'q'", "'A'", "4", "100"],
  ["'q'", "'A'", "9", "101"],
  ["'q'", "'B'", "7", "200"],
  ["'q'", "'B'", "8", "NULL"],
]
query = "SELECT t.sym, t.ts, q.ts AS qts, q.px FROM (SELECT sym, ts FROM input WHERE kind = 't') t ASOF JOIN (SELECT sym, ts, px FROM input WHERE kind = 'q') q MATCH_CONDITION (t.ts >= q.ts) ON t.sym = q.sym ORDER BY t.sym, t.ts"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_lt"
description = "The first quote strictly after each trade; an equal time does not match. Catches: a non-strict comparison (B at 7 matching the quote at 7)"
columns = [{ name = "kind", type = "VARCHAR" }, { name = "sym", type = "VARCHAR" }, { name = "ts", type = "NUMBER(38,0)" }, { name = "px", type = "NUMBER(38,0)" }]
rows = [
  ["'t'", "'A'", "5", "NULL"],
  ["'t'", "'A'", "10", "NULL"],
  ["'t'", "'B'", "7", "NULL"],
  ["'t'", "'A'", "1", "NULL"],
  ["'q'", "'A'", "4", "100"],
  ["'q'", "'A'", "9", "101"],
  ["'q'", "'B'", "7", "200"],
  ["'q'", "'B'", "8", "NULL"],
]
query = "SELECT t.sym, t.ts, q.ts AS qts FROM (SELECT sym, ts FROM input WHERE kind = 't') t ASOF JOIN (SELECT sym, ts, px FROM input WHERE kind = 'q') q MATCH_CONDITION (t.ts < q.ts) ON t.sym = q.sym ORDER BY t.sym, t.ts"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_value"
description = "Quotes shifted back by 2: B's sit at 5 (price 200) and 6 (NULL price), so B at 7 matches the NULL-price quote at 6 and returns its NULL. Catches: NULL-price rows skipped when matching (B at 7 returning 200)"
columns = [{ name = "kind", type = "VARCHAR" }, { name = "sym", type = "VARCHAR" }, { name = "ts", type = "NUMBER(38,0)" }, { name = "px", type = "NUMBER(38,0)" }]
rows = [
  ["'t'", "'A'", "5", "NULL"],
  ["'t'", "'A'", "10", "NULL"],
  ["'t'", "'B'", "7", "NULL"],
  ["'t'", "'A'", "1", "NULL"],
  ["'q'", "'A'", "4", "100"],
  ["'q'", "'A'", "9", "101"],
  ["'q'", "'B'", "7", "200"],
  ["'q'", "'B'", "8", "NULL"],
]
query = "SELECT t.sym, t.ts, q.px FROM (SELECT sym, ts FROM input WHERE kind = 't') t ASOF JOIN (SELECT sym, ts - 2 AS ts, px FROM input WHERE kind = 'q') q MATCH_CONDITION (t.ts >= q.ts) ON t.sym = q.sym ORDER BY t.sym, t.ts"
order = "ordered"
tags = ["null"]
