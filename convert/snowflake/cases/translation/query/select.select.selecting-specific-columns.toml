category = "translation"
construct = "sf.query.select.select.selecting-specific-columns"
session_profile = "utc-v1"

[[case]]
id = "t001_expressions"
description = "Two columns, an expression and an alias in double quotes, which keeps its case. Catches: the quoted alias upper-cased"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT last_name, employee_id * 2 AS \"doubled\" FROM input ORDER BY employee_id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_distinct"
description = "DISTINCT department_id, with the NULL department as one row. Catches: DISTINCT ignored, or NULL dropped"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT DISTINCT department_id FROM input ORDER BY department_id NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_positions"
description = "Positional references over an inline VALUES subquery. Catches: the positions read as literals"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT $2 AS s, $1 AS n FROM (VALUES (1, 'x'), (2, 'y')) ORDER BY $1"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expression"
description = "first_name concatenated: NULL for row 104. Catches: NULL read as an empty string"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT employee_id, first_name || ' ' || last_name AS full_name FROM input ORDER BY employee_id"
order = "ordered"
tags = ["null"]
