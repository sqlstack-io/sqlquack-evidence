rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT employee_id FROM input TABLESAMPLE BERNOULLI (0) ORDER BY employee_id"
