category = "translation"
construct = "sf.query.order-by.orderitem"
session_profile = "utc-v1"

[[case]]
id = "t001_asc_default"
description = "n ascending with no NULLS clause: NULL last. Catches: NULLs first ascending"
columns = [{ name = "s", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'b'", "2"],
  ["'B'", "10"],
  ["'a'", "NULL"],
  ["'ab'", "-1"],
  ["NULL", "2"],
]
query = "SELECT ordinal, n FROM input ORDER BY n, ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_text_bytes"
description = "Text by byte value: 'B' before 'a', 'a' before 'ab' before 'b', NULL last. Catches: a case-insensitive or locale collation"
columns = [{ name = "s", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'b'", "2"],
  ["'B'", "10"],
  ["'a'", "NULL"],
  ["'ab'", "-1"],
  ["NULL", "2"],
]
query = "SELECT s FROM input ORDER BY s, ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_position_nulls"
description = "ORDER BY 2 DESC NULLS LAST, 1 NULLS FIRST: column positions with explicit NULL placements. Catches: the position read as a constant, or the NULLS clause ignored"
columns = [{ name = "s", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'b'", "2"],
  ["'B'", "10"],
  ["'a'", "NULL"],
  ["'ab'", "-1"],
  ["NULL", "2"],
]
query = "SELECT s, n FROM input ORDER BY 2 DESC NULLS LAST, 1 NULLS FIRST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_key"
description = "NULLS FIRST on an ascending key. Catches: NULLS FIRST ignored"
columns = [{ name = "s", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'b'", "2"],
  ["'B'", "10"],
  ["'a'", "NULL"],
  ["'ab'", "-1"],
  ["NULL", "2"],
]
query = "SELECT ordinal FROM input ORDER BY n NULLS FIRST, ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_expression"
description = "An expression key, n modulo 3, with ordinal breaking ties. Catches: the expression ignored"
columns = [{ name = "s", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'b'", "2"],
  ["'B'", "10"],
  ["'a'", "NULL"],
  ["'ab'", "-1"],
  ["NULL", "2"],
]
query = "SELECT ordinal, n FROM input ORDER BY MOD(n, 3) NULLS LAST, ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_null_default"
description = "DESC without a NULLS clause, which puts NULL first by default. Catches: NULL placed last"
columns = [{ name = "s", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'b'", "2"],
  ["'B'", "10"],
  ["'a'", "NULL"],
  ["'ab'", "-1"],
  ["NULL", "2"],
]
query = "SELECT ordinal FROM input ORDER BY n DESC, ordinal"
order = "ordered"
tags = ["null"]
