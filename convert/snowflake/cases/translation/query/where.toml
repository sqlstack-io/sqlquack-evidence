category = "translation"
construct = "sf.query.where"
session_profile = "utc-v1"

[[case]]
id = "t001_compound"
description = "x > 1 AND g <> 'b' over rows with NULLs in both columns. Catches: NULL predicates kept as TRUE"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal FROM input WHERE x > 1 AND g <> 'b' ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_predicate"
description = "x = NULL, which is never TRUE, and x IS NULL, which is. Catches: x = NULL treated as IS NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal, (SELECT COUNT(*) FROM input WHERE x = NULL) AS eq_null FROM input WHERE x IS NULL ORDER BY ordinal"
order = "ordered"
tags = ["null"]
