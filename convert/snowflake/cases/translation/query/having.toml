category = "translation"
construct = "sf.query.having"
session_profile = "utc-v1"

[[case]]
id = "t001_aggregate"
description = "Groups with more than one row and a set maximum: a and b; the NULL group has two rows and max 4. Catches: HAVING applied to rows before grouping"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT g, COUNT(*) AS n FROM input GROUP BY g HAVING COUNT(*) > 1 AND MAX(x) IS NOT NULL ORDER BY g NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_alias"
description = "HAVING on a select-list alias; the page does not say; the recording decides whether the alias resolves. Catches: the alias refused where Snowflake resolves it (or the reverse)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT g, SUM(x) AS total FROM input GROUP BY g HAVING total > 2 ORDER BY g NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_values"
description = "Groups holding a NULL x, found by COUNT(x) < COUNT(*): b and the NULL group. Catches: COUNT(x) counting NULLs, so no group qualifies"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT g, COUNT(*) - COUNT(x) AS nulls FROM input GROUP BY g HAVING COUNT(x) < COUNT(*) ORDER BY g NULLS LAST"
order = "ordered"
tags = ["null"]
