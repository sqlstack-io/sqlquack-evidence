category = "translation"
construct = "sf.query.from"
session_profile = "utc-v1"

[[case]]
id = "t001_subquery"
description = "A derived table with a column alias list. Catches: the column aliases ignored"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT t.id, t.dept FROM (SELECT employee_id, department_id FROM input) AS t (id, dept) ORDER BY t.id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_values"
description = "A derived table that filters to the NULL department. Catches: the NULL row dropped"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT s.employee_id FROM (SELECT * FROM input WHERE department_id IS NULL) s ORDER BY s.employee_id"
order = "ordered"
tags = ["null"]
