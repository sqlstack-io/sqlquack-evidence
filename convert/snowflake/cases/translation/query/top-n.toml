category = "translation"
construct = "sf.query.top-n"
session_profile = "utc-v1"

[[case]]
id = "t001_top"
description = "TOP 3 with ORDER BY x DESC NULLS LAST. Catches: TOP applied before the ORDER BY"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT TOP 3 ordinal, x FROM input ORDER BY x DESC NULLS LAST, ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_top_zero"
description = "TOP 0, which returns no rows. Catches: TOP 0 read as no limit"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT TOP 0 ordinal FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_top_distinct"
description = "SELECT DISTINCT TOP 2 g: duplicates removed before the limit. Catches: the limit applied before DISTINCT"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT DISTINCT TOP 2 g FROM input ORDER BY g NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_key"
description = "TOP 2 over x descending with no NULLS clause, which puts NULL first by default. Catches: NULL placed last, so 4 and 3 returned"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT TOP 2 ordinal, x FROM input ORDER BY x DESC, ordinal"
order = "ordered"
tags = ["null"]
