category = "translation"
construct = "sf.query.group-by-cube"
session_profile = "utc-v1"

[[case]]
id = "t001_cube"
description = "CUBE over two items: (g, x), (g), (x) and (). Catches: a ROLLUP (missing (x)) instead"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT g, x, GROUPING(g) AS gg, GROUPING(x) AS gx, COUNT(*) AS n FROM input GROUP BY CUBE (g, x) ORDER BY gg, gx, g NULLS LAST, x NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_with_plain"
description = "A plain item before CUBE, which the page allows: (g, x) and (g). Catches: the plain item rolled into the cube"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT g, x, GROUPING(x) AS gx, COUNT(*) AS n FROM input GROUP BY g, CUBE (x) ORDER BY g NULLS LAST, gx, x NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_key"
description = "Rows where x is NULL in the data next to the x subtotal, told apart by GROUPING(x). Catches: the two merged"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT x, GROUPING(x) AS gx, COUNT(*) AS n FROM input GROUP BY CUBE (x) ORDER BY gx, x NULLS LAST"
order = "ordered"
tags = ["null"]
