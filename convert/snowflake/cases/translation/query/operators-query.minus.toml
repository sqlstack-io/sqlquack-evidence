category = "translation"
construct = "sf.query.operators-query.minus"
session_profile = "utc-v1"

[[case]]
id = "t001_rows"
description = "x of groups a and NULL MINUS b and NULL: the values only the first returns, once each. Catches: the operands swapped, or duplicates kept"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT x FROM (SELECT x FROM input WHERE g = 'a' OR g IS NULL) MINUS SELECT x FROM (SELECT x FROM input WHERE g = 'b' OR g IS NULL) ORDER BY x NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_rows"
description = "A NULL in both queries, which MINUS removes like any value. Catches: the NULL kept as never equal"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT x FROM input WHERE g IS NULL MINUS SELECT x FROM input WHERE g = 'b' ORDER BY x NULLS LAST"
order = "ordered"
tags = ["null"]
