category = "translation"
construct = "sf.query.limit.fetch"
session_profile = "utc-v1"

[[case]]
id = "t001_offset_fetch"
description = "The ANSI form for rows 2 and 3. Catches: OFFSET or FETCH ignored"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal FROM input ORDER BY ordinal OFFSET 1 ROWS FETCH NEXT 2 ROWS ONLY"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_first_row"
description = "FETCH FIRST 1 ROW without OFFSET or ONLY. Catches: the singular ROW refused"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal FROM input ORDER BY ordinal DESC FETCH FIRST 1 ROW"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_fetch_zero"
description = "FETCH FIRST 0 ROWS ONLY, which returns no rows. Catches: FETCH 0 read as no limit"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal FROM input ORDER BY ordinal FETCH FIRST 0 ROWS ONLY"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_key"
description = "FETCH FIRST 3 ROWS ONLY over x ascending with NULLS FIRST: the two NULL rows come first. Catches: NULLS FIRST ignored before the fetch"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal, x FROM input ORDER BY x NULLS FIRST, ordinal FETCH FIRST 3 ROWS ONLY"
order = "ordered"
tags = ["null"]
