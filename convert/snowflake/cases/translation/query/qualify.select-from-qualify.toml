category = "translation"
construct = "sf.query.qualify.select-from-qualify"
session_profile = "utc-v1"

[[case]]
id = "t001_row_number"
description = "The largest x of each group, with NULL x last and ordinal breaking ties. Catches: QUALIFY applied before the window is computed, or all rows kept"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT g, x FROM input QUALIFY ROW_NUMBER() OVER (PARTITION BY g ORDER BY x DESC NULLS LAST, ordinal) = 1 ORDER BY g NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_after_having"
description = "Groups with two or more rows, then the group with the largest count by RANK. Catches: QUALIFY applied before HAVING"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT g, COUNT(*) AS n FROM input GROUP BY g HAVING COUNT(*) >= 2 QUALIFY RANK() OVER (ORDER BY COUNT(*) DESC) = 1 ORDER BY g NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_window"
description = "A window value that is NULL for one row (LAG over the first row): QUALIFY drops it. Catches: the NULL row kept"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal FROM input QUALIFY LAG(ordinal) OVER (ORDER BY ordinal) >= 1 ORDER BY ordinal"
order = "ordered"
tags = ["null"]
