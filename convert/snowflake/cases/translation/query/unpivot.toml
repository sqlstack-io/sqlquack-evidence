category = "translation"
construct = "sf.query.unpivot"
session_profile = "utc-v1"

[[case]]
id = "t001_basic"
description = "Two quarter columns into rows; the NULL q1 of id 2 is left out. Catches: NULL values kept by default"
columns = [{ name = "id", type = "NUMBER(38,0)" }, { name = "q1", type = "NUMBER(38,0)" }, { name = "q2", type = "NUMBER(38,0)" }]
rows = [
  ["1", "10", "20"],
  ["2", "NULL", "40"],
]
query = "SELECT id, k, v FROM (SELECT id, q1, q2 FROM input) UNPIVOT (v FOR k IN (q1, q2)) ORDER BY id, k"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_include_nulls"
description = "INCLUDE NULLS keeps the NULL q1 row. Catches: INCLUDE NULLS ignored"
columns = [{ name = "id", type = "NUMBER(38,0)" }, { name = "q1", type = "NUMBER(38,0)" }, { name = "q2", type = "NUMBER(38,0)" }]
rows = [
  ["1", "10", "20"],
  ["2", "NULL", "40"],
]
query = "SELECT id, k, v FROM (SELECT id, q1, q2 FROM input) UNPIVOT INCLUDE NULLS (v FOR k IN (q1, q2)) ORDER BY id, k"
order = "ordered"
tags = ["null"]
