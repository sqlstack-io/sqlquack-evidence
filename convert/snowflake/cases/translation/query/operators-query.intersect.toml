category = "translation"
construct = "sf.query.operators-query.intersect"
session_profile = "utc-v1"

[[case]]
id = "t001_rows"
description = "x of groups a and NULL against b and NULL: only the values both return, once each. Catches: UNION or EXCEPT semantics, or duplicates kept"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT x FROM (SELECT x FROM input WHERE g = 'a' OR g IS NULL) INTERSECT SELECT x FROM (SELECT x FROM input WHERE g = 'b' OR g IS NULL) ORDER BY x NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_rows"
description = "A NULL on both sides, which INTERSECT matches as one row like any value. Catches: NULL treated as never equal (no row)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT x FROM input WHERE g IS NULL INTERSECT SELECT x FROM input WHERE g = 'b' ORDER BY x NULLS LAST"
order = "ordered"
tags = ["null"]
