category = "translation"
construct = "sf.query.group-by.all"
session_profile = "utc-v1"

[[case]]
id = "t001_all"
description = "GROUP BY ALL with g and an expression of g as the non-aggregate items. Catches: only the first item grouped, or the aggregate grouped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT g, g || '!' AS h, COUNT(*) AS n FROM input GROUP BY ALL ORDER BY g NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_key"
description = "GROUP BY ALL over x, with two NULLs. Catches: two NULL groups"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT x, COUNT(*) AS n FROM input GROUP BY ALL ORDER BY x NULLS LAST"
order = "ordered"
tags = ["null"]
