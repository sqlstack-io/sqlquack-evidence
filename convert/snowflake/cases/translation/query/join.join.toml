category = "translation"
construct = "sf.query.join.join"
session_profile = "utc-v1"

[[case]]
id = "t001_inner"
description = "Employees with their departments; row 104 has no department and drops out. Catches: the NULL key matched"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT e.employee_id, d.department_name FROM input e INNER JOIN (SELECT * FROM (VALUES (1, 'Engineering'), (2, 'Customer Support'), (3, 'Finance')) AS d (department_id, department_name)) d ON e.department_id = d.department_id ORDER BY e.employee_id NULLS LAST, d.department_id NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_left"
description = "Every employee; row 104 with a NULL department name. Catches: row 104 dropped"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT e.employee_id, d.department_name FROM input e LEFT OUTER JOIN (SELECT * FROM (VALUES (1, 'Engineering'), (2, 'Customer Support'), (3, 'Finance')) AS d (department_id, department_name)) d ON e.department_id = d.department_id ORDER BY e.employee_id NULLS LAST, d.department_id NULLS LAST"
order = "ordered"
tags = ["type-combination"]

