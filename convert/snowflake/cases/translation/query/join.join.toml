[[case]]
id = "t005_self_join"
description = "Pairs of employees in the same department, each pair once. Catches: the NULL department paired with itself"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT a.employee_id AS a, b.employee_id AS b FROM input a JOIN input b ON a.department_id = b.department_id AND a.employee_id < b.employee_id ORDER BY a, b"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_null_key"
description = "A LEFT JOIN on a condition that compares to NULL. Catches: NULL = NULL treated as a match"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT a.employee_id, b.employee_id AS other FROM input a LEFT JOIN input b ON a.department_id = b.department_id AND a.employee_id <> b.employee_id ORDER BY a.employee_id, other NULLS LAST"
order = "ordered"
tags = ["null"]
