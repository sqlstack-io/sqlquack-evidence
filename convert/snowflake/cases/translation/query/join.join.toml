]
query = "SELECT e.employee_id, d.department_name FROM input e RIGHT JOIN (SELECT * FROM (VALUES (1, 'Engineering'), (2, 'Customer Support'), (3, 'Finance')) AS d (department_id, department_name)) d ON e.department_id = d.department_id ORDER BY e.employee_id NULLS LAST, d.department_id NULLS LAST"
