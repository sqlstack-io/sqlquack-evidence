category = "translation"
construct = "sf.query.join.join-2"
session_profile = "utc-v1"

[[case]]
id = "t001_natural"
description = "NATURAL JOIN on the one shared column, department_id, which appears once. Catches: the column duplicated, or a cross product"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * FROM input NATURAL JOIN (SELECT * FROM (VALUES (1, 'Engineering'), (2, 'Customer Support'), (3, 'Finance')) AS d (department_id, department_name)) d ORDER BY employee_id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_cross"
description = "Every employee with every department: 12 rows. Catches: a join on department_id"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT e.employee_id, d.department_id FROM input e CROSS JOIN (SELECT * FROM (VALUES (1, 'Engineering'), (2, 'Customer Support'), (3, 'Finance')) AS d (department_id, department_name)) d ORDER BY e.employee_id, d.department_id"
order = "ordered"
tags = ["type-combination"]

