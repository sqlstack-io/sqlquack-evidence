category = "translation"
construct = "sf.query.operators-query.union"
session_profile = "utc-v1"

[[case]]
id = "t001_distinct"
description = "x of groups a and NULL against b and NULL: duplicates (2, 2 and 4) and the two NULLs collapse. Catches: UNION ALL semantics, or NULLs kept apart"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT x FROM (SELECT x FROM input WHERE g = 'a' OR g IS NULL) UNION SELECT x FROM (SELECT x FROM input WHERE g = 'b' OR g IS NULL) ORDER BY x NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_all"
description = "The same two queries with UNION ALL: every row kept, 9 rows. Catches: duplicates removed"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT x FROM (SELECT x FROM input WHERE g = 'a' OR g IS NULL) UNION ALL SELECT x FROM (SELECT x FROM input WHERE g = 'b' OR g IS NULL) ORDER BY x NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_by_name"
description = "Two queries with their columns in different orders and a column only the second has, which the page says is filled with NULL. Catches: columns matched by position, or the missing column refused"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT * FROM (SELECT g, x FROM input WHERE g = 'a' UNION ALL BY NAME SELECT x + 10 AS x, g, 'extra' AS e FROM input WHERE g = 'b') ORDER BY g, x NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_rows"
description = "Rows holding only NULL from both sides: UNION keeps one of them. Catches: two NULL rows kept, or none"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT x FROM input WHERE x IS NULL UNION SELECT x FROM input WHERE x IS NULL ORDER BY x"
order = "ordered"
tags = ["null"]
