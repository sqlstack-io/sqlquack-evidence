category = "translation"
construct = "sf.query.join.join.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_using"
description = "USING (department_id) with SELECT *: the joined column once, first. Catches: the column returned twice"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * FROM input JOIN (SELECT * FROM (VALUES (1, 'Engineering'), (2, 'Customer Support'), (3, 'Finance')) AS d (department_id, department_name)) d USING (department_id) ORDER BY employee_id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_key"
description = "FULL JOIN USING with the NULL-department employee and the employee-less department; the page gives the position of USING columns under SELECT * but not their value under FULL JOIN, so the page does not say; the recording decides. Catches: a value where Snowflake returns NULL, or the reverse"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT department_id, employee_id FROM input FULL JOIN (SELECT * FROM (VALUES (1, 'Engineering'), (2, 'Customer Support'), (3, 'Finance')) AS d (department_id, department_name)) d USING (department_id) ORDER BY department_id NULLS LAST, employee_id"
order = "ordered"
tags = ["null"]
