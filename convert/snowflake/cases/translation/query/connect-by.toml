category = "translation"
construct = "sf.query.connect-by"
session_profile = "utc-v1"

[[case]]
id = "t001_tree"
description = "The tree from the root with LEVEL; the orphan is not reached. Catches: PRIOR on the wrong side (walking up), or the orphan included"
columns = [{ name = "id", type = "NUMBER(38,0)" }, { name = "parent", type = "NUMBER(38,0)" }, { name = "name", type = "VARCHAR" }]
rows = [
  ["1", "NULL", "'root'"],
  ["2", "1", "'a'"],
  ["3", "1", "'b'"],
  ["4", "2", "'a1'"],
  ["5", "9", "'orphan'"],
]
query = "SELECT id, name, LEVEL AS lvl FROM input START WITH parent IS NULL CONNECT BY parent = PRIOR id ORDER BY id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_subtree"
description = "The subtree of node 2. Catches: the whole tree returned"
columns = [{ name = "id", type = "NUMBER(38,0)" }, { name = "parent", type = "NUMBER(38,0)" }, { name = "name", type = "VARCHAR" }]
rows = [
  ["1", "NULL", "'root'"],
  ["2", "1", "'a'"],
  ["3", "1", "'b'"],
  ["4", "2", "'a1'"],
  ["5", "9", "'orphan'"],
]
query = "SELECT id, LEVEL AS lvl FROM input START WITH id = 2 CONNECT BY parent = PRIOR id ORDER BY id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_parent"
description = "The root's NULL parent matches no PRIOR id, so it appears only as a start row. Catches: the root repeated as a child"
columns = [{ name = "id", type = "NUMBER(38,0)" }, { name = "parent", type = "NUMBER(38,0)" }, { name = "name", type = "VARCHAR" }]
rows = [
  ["1", "NULL", "'root'"],
  ["2", "1", "'a'"],
  ["3", "1", "'b'"],
  ["4", "2", "'a1'"],
  ["5", "9", "'orphan'"],
]
query = "SELECT id, LEVEL AS lvl FROM input START WITH id IN (1, 2) CONNECT BY parent = PRIOR id ORDER BY id, lvl"
order = "ordered"
tags = ["null"]
