category = "translation"
construct = "sf.functions.percentile-disc.by"
session_profile = "utc-v1"

[[case]]
id = "t001_quarter"
description = "The 75th percentile of 1, 2, 4, 8. Catches: an interpolated value (5) instead of an input value (4), or the percentile read as 0-100 (1)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "8"],
  ["'q'", "5"],
  ["'p'", "1"],
  ["'p'", "4"],
  ["'p'", "2"],
]
query = "SELECT g, PERCENTILE_DISC(0.75) WITHIN GROUP (ORDER BY x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_desc"
description = "The same percentile with a descending order. Catches: DESC ignored (the ascending answer)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "8"],
  ["'q'", "5"],
  ["'p'", "1"],
  ["'p'", "4"],
  ["'p'", "2"],
]
query = "SELECT g, PERCENTILE_DISC(0.25) WITHIN GROUP (ORDER BY x DESC) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_ends"
description = "The documented end points. Catches: the end points rejected, or 1.0 past the last value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "8"],
  ["'q'", "5"],
  ["'p'", "1"],
  ["'p'", "4"],
  ["'p'", "2"],
]
query = "SELECT g, PERCENTILE_DISC(0) WITHIN GROUP (ORDER BY x) AS lo, PERCENTILE_DISC(1) WITHIN GROUP (ORDER BY x) AS hi FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t004_float"
description = "FLOAT values at the median. Catches: a fixed-point result"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0.5"],
  ["2.25"],
  ["1"],
]
query = "SELECT PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_order_by_expr"
description = "NULL values, which are ignored, and a group of only NULL. Catches: NULL counted as the lowest or highest value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "NULL"],
  ["'p'", "1"],
  ["'p'", "3"],
  ["'p'", "NULL"],
]
query = "SELECT g, PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_empty_input"
description = "No rows. Catches: an error instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY x) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
