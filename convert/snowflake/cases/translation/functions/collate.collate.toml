category = "translation"
construct = "sf.functions.collate.collate"
session_profile = "utc-v1"

[[case]]
id = "t001_case_insensitive"
description = "Equality under a case-insensitive collation. Catches: the collation dropped (FALSE for ABC = abc)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'ABC'", "'abc'"],
  ["'abc'", "'abd'"],
]
query = "SELECT (COLLATE(a, 'en-ci')) = b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_locale_order"
description = "Ordering under a locale collation. Catches: binary order kept ('a' < 'B' is FALSE in byte order, TRUE in en), or a case-insensitive comparison standing in for 'en' (a < A)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'a'", "'B'"],
  ["'b'", "'A'"],
  ["'a'", "'A'"],
]
query = "SELECT (COLLATE(a, 'en')) < b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_value_unchanged"
description = "The returned string itself, with trailing blanks. Catches: the string case-folded or trimmed by the copy (the page: \"The string itself is unchanged\")"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'MiXed  '"],
]
query = "SELECT COLLATE(a, 'en-ci-rtrim') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_string_expression"
description = "NULL string next to a set one. Catches: NULL compared as an empty string"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["NULL", "''"],
  ["'A'", "'a'"],
]
query = "SELECT (COLLATE(a, 'en-ci')) = b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_rtrim_compare"
description = "Equality under an rtrim collation, beside the same comparison without rtrim. Catches: the rtrim specifier dropped in comparisons (FALSE for 'ab  ' = 'AB')"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'ab  '", "'AB'"],
  ["'ab'", "'AB '"],
]
query = "SELECT (COLLATE(a, 'en-ci-rtrim')) = b AS r, (COLLATE(a, 'en-ci')) = b AS c FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]
