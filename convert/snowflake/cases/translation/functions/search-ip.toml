category = "translation"
construct = "sf.functions.search-ip"
session_profile = "utc-v1"

[[case]]
id = "t001_ipv4"
description = "An address inside text, and a longer address with the same prefix. Catches: a substring match (TRUE for 192.0.2.10)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'host 192.0.2.1 up'"],
  ["'192.0.2.10'"],
  ["'none'"],
]
query = "SELECT SEARCH_IP(a, '192.0.2.1') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_cidr"
description = "A CIDR range. Catches: the range read as a single address"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'x 192.0.2.77'"],
  ["'192.0.3.1'"],
]
query = "SELECT SEARCH_IP(a, '192.0.2.0/24') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_leading_zeros"
description = "A search string with leading zeros. Catches: leading zeros compared as text"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'192.0.2.1'"],
]
query = "SELECT SEARCH_IP(a, '192.000.002.001') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_search_data"
description = "NULL data. Catches: NULL read as empty (FALSE)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'10.0.0.1'"],
]
query = "SELECT SEARCH_IP(a, '10.0.0.1') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_ipv6"
description = "An IPv6 address written in two forms. Catches: an IPv4-only search, or IPv6 compared as text (leading zeros)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'addr 2001:db8::1 up'"],
  ["'2001:db8::2'"],
]
query = "SELECT SEARCH_IP(a, '2001:0db8::0001') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]
