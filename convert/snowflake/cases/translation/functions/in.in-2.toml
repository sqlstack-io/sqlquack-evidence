category = "translation"
construct = "sf.functions.in.in-2"
session_profile = "utc-v1"

[[case]]
id = "t001_subquery"
description = "Values in and out of a subquery. Catches: duplicates in the subquery changing the result (a join-based translation repeating the row)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["2"],
  ["5"],
]
query = "SELECT x IN (SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 2) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_not"
description = "NOT IN against a subquery. Catches: NOT dropped"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["5"],
]
query = "SELECT x NOT IN (SELECT 1 UNION ALL SELECT 2) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_value"
description = "NULL value. Catches: FALSE instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT x IN (SELECT 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_subquery"
description = "A subquery returning NULL and no match, used as a filter: only x = 1 passes IN, and nothing passes NOT IN. Catches: TRUE for NOT IN when the subquery holds a NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["9"],
  ["1"],
]
query = "SELECT x, 'in' AS k FROM input WHERE x IN (SELECT 1 UNION ALL SELECT NULL) UNION ALL SELECT x, 'not in' FROM input WHERE x NOT IN (SELECT 1 UNION ALL SELECT NULL) ORDER BY k, x"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_empty_subquery"
description = "A subquery with no rows. Catches: NULL instead of FALSE/TRUE for an empty subquery"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["NULL"],
]
query = "SELECT x IN (SELECT 1 WHERE FALSE) AS r, x NOT IN (SELECT 1 WHERE FALSE) AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]
