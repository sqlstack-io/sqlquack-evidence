category = "translation"
construct = "sf.functions.in.in"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "Values in and out of the list, across scales. Catches: scale compared (1.00 not found)"
columns = [{ name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["1.00"],
  ["3.50"],
  ["4.00"],
]
query = "SELECT x IN (1, 2, 3.5) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_not"
description = "NOT IN with a match and without. Catches: NOT applied to one element only"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["9"],
  ["2"],
]
query = "SELECT x NOT IN (1, 2) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_varchar"
description = "Strings differing in case. Catches: case-insensitive matching"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'a'"],
  ["'A'"],
]
query = "SELECT x IN ('a', 'b') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_value"
description = "NULL value against a list holding NULL. Catches: TRUE for NULL IN (NULL)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT x IN (1, NULL) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_value_1"
description = "NULL in the list without a match. Catches: FALSE for 9 IN (1, NULL) and TRUE for 9 NOT IN (1, NULL), instead of NULL for both"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["9"],
  ["1"],
]
query = "SELECT x IN (1, NULL) AS r, x NOT IN (1, NULL) AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
