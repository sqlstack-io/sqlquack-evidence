category = "translation"
construct = "sf.functions.ntile"
session_profile = "utc-v1"

[[case]]
id = "t001_uneven"
description = "Five rows into two buckets, and one row into two. Catches: the larger bucket last (1,1,2,2,2), or buckets numbered from 0"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, NTILE(2) OVER (PARTITION BY p ORDER BY o, ordinal) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_more_buckets"
description = "Five rows into four buckets. Catches: buckets left empty at the front (2,3,4,...)"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, NTILE(4) OVER (PARTITION BY p ORDER BY o, ordinal) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_zero"
description = "Zero buckets; the page requires a positive integer. Catches: every row put in bucket 0 or 1"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, NTILE(0) OVER (PARTITION BY p ORDER BY o, ordinal) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null_order_expr"
description = "NULL order keys sorted last, ties broken by ordinal. Catches: NULL rows given a NULL bucket"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "NULL"],
  ["'a'", "2"],
  ["'a'", "NULL"],
  ["'a'", "1"],
]
query = "SELECT ordinal, NTILE(2) OVER (PARTITION BY p ORDER BY o, ordinal) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
