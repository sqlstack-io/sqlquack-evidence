category = "translation"
construct = "sf.functions.hll-accumulate.hll-accumulate-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Per-partition states, read through HLL_ESTIMATE. Catches: the whole input's state"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT HLL_ESTIMATE(HLL_ACCUMULATE(x) OVER (PARTITION BY g)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_expr"
description = "A partition of only NULL. Catches: NULL counted as a value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "1"],
]
query = "SELECT HLL_ESTIMATE(HLL_ACCUMULATE(x) OVER (PARTITION BY g)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_null_expr1"
description = "NULL partition keys. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1"],
  ["'p'", "1"],
  ["NULL", "2"],
]
query = "SELECT HLL_ESTIMATE(HLL_ACCUMULATE(x) OVER (PARTITION BY g)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
