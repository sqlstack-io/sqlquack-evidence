category = "translation"
construct = "sf.functions.like-all"
session_profile = "utc-v1"

[[case]]
id = "t001_patterns"
description = "LIKE ALL where one, both or neither pattern matches. Catches: ANY and ALL confused (one-of-two matching gives TRUE for ANY, FALSE for ALL) or an unanchored match"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "VARCHAR" }, { name = "r", type = "VARCHAR" }]
rows = [
  ["'abc'", "'a%'", "'%z'"],
  ["'abz'", "'a%'", "'%z'"],
  ["'xaz'", "'a%'", "'%z'"],
  ["'b'", "'a%'", "'%b%'"],
]
query = "SELECT a LIKE ALL (p, r) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_case"
description = "Patterns in another case. Catches: case sensitivity reversed (TRUE for ABC against a%)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "VARCHAR" }, { name = "r", type = "VARCHAR" }]
rows = [
  ["'ABC'", "'a%'", "'%c'"],
  ["'\u00c9a'", "'\u00e9%'", "'%A'"],
]
query = "SELECT a LIKE ALL (p, r) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_escape"
description = "An escape character before %. Catches: the escape ignored (50 matches 5!%)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "VARCHAR" }, { name = "r", type = "VARCHAR" }]
rows = [
  ["'5%'", "'5!%'", "'%'"],
  ["'50'", "'5!%'", "'%'"],
]
query = "SELECT a LIKE ALL (p, r) ESCAPE '!' AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_subject"
description = "NULL subject. Catches: NULL read as an empty string (FALSE instead of NULL)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "VARCHAR" }, { name = "r", type = "VARCHAR" }]
rows = [
  ["NULL", "'%'", "'x'"],
  ["''", "'%'", "'x'"],
]
query = "SELECT a LIKE ALL (p, r) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_pattern"
description = "One NULL pattern beside a matching and a non-matching one. Catches: NULL patterns ignored (TRUE) where three-valued ALL gives NULL"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "VARCHAR" }, { name = "r", type = "VARCHAR" }]
rows = [
  ["'abc'", "'a%'", "NULL"],
  ["'xyz'", "'a%'", "NULL"],
  ["NULL", "NULL", "'a'"],
]
query = "SELECT a LIKE ALL (p, r) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_empty"
description = "An empty subject against an empty and a % pattern. Catches: the empty pattern matching a non-empty subject"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "VARCHAR" }, { name = "r", type = "VARCHAR" }]
rows = [
  ["''", "''", "'%'"],
  ["'a'", "''", "''"],
]
query = "SELECT a LIKE ALL (p, r) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]
