category = "translation"
construct = "sf.functions.st-intersection"
session_profile = "utc-v1"

[[case]]
id = "t001_overlap"
description = "Bands over longitudes 0-2 and 1-3, whose intersection is half the first (0.5). Catches: the union returned (1.5), or the first shape returned"
columns = [{ name = "v", type = "VARCHAR" }, { name = "w", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,2 0,2 2,0 2,0 0))'", "'POLYGON((1 0,3 0,3 2,1 2,1 0))'"],
]
query = "SELECT ROUND(ST_AREA(ST_INTERSECTION(TO_GEOGRAPHY(v), TO_GEOGRAPHY(w))) / ST_AREA(TO_GEOGRAPHY(v)), 2) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_disjoint"
description = "Disjoint bands, whose empty intersection the page represents as NULL. Catches: an empty collection returned instead of NULL"
columns = [{ name = "v", type = "VARCHAR" }, { name = "w", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,1 0,1 2,0 2,0 0))'", "'POLYGON((5 0,6 0,6 2,5 2,5 0))'"],
]
query = "SELECT ST_INTERSECTION(TO_GEOGRAPHY(v), TO_GEOGRAPHY(w)) IS NULL AS n FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_geography_expression_1"
description = "A NULL first shape; the page does not say; the recording decides. Catches: an error, or a value returned"
columns = [{ name = "v", type = "VARCHAR" }, { name = "w", type = "VARCHAR" }]
rows = [
  ["NULL", "'POINT(10 20)'"],
]
query = "SELECT ST_INTERSECTION(TO_GEOGRAPHY(v), TO_GEOGRAPHY(w)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
