category = "translation"
construct = "sf.functions.h3-grid-path"
session_profile = "utc-v1"

[[case]]
id = "t001_integer"
description = "The path from a cell to a cell two steps away, as JSON text: 3 cells from the first to the second. Catches: the end cells left out, or the path reversed"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["617700169957507071", "617700169960652799"],
]
query = "SELECT TO_JSON(H3_GRID_PATH(a, b)) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "The same pair as hexadecimal IDs, which the page says give hexadecimal IDs. Catches: INTEGER IDs returned for VARCHAR IDs"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'89283082803ffff'", "'89283082833ffff'"],
]
query = "SELECT TO_JSON(H3_GRID_PATH(a, b)) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_cell_id_1"
description = "A NULL first ID; the page does not say; the recording decides. Catches: an error, or an empty array returned"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "617700169957507071"],
]
query = "SELECT H3_GRID_PATH(a, b) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
