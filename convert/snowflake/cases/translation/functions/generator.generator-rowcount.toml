category = "translation"
construct = "sf.functions.generator.generator-rowcount"
session_profile = "utc-v1"

[[case]]
id = "t001_rowcount"
description = "ROWCOUNT 5 and 0, and 5 with a generous TIMELIMIT. Catches: an off-by-one count, or TIMELIMIT taking precedence"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT (SELECT COUNT(*) FROM TABLE(GENERATOR(ROWCOUNT => 5))) AS five, (SELECT COUNT(*) FROM TABLE(GENERATOR(ROWCOUNT => 0))) AS zero, (SELECT COUNT(*) FROM TABLE(GENERATOR(ROWCOUNT => 5, TIMELIMIT => 60))) AS limited FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_negative"
compile_error = true
description = "ROWCOUNT -1, which the page says must be non-negative; Snowflake refuses it when compiling (1046). Catches: 0 rows returned"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT COUNT(*) AS n FROM TABLE(GENERATOR(ROWCOUNT => -1))"
order = "ordered"
tags = ["error"]

[[case]]
id = "t003_null_count"
description = "A NULL ROWCOUNT, which the page says is ignored and gives 0 rows. Catches: an error"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT COUNT(*) AS n FROM TABLE(GENERATOR(ROWCOUNT => NULL))"
order = "ordered"
tags = ["null"]
