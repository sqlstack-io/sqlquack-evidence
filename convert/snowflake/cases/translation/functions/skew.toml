category = "translation"
construct = "sf.functions.skew"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "Right- and left-skewed groups. Catches: population skewness (no small-sample correction), or the sign flipped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "1"],
  ["'p'", "2"],
  ["'q'", "8"],
  ["'p'", "3"],
  ["'q'", "9"],
  ["'p'", "10"],
  ["'q'", "10"],
]
query = "SELECT g, SKEW(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_two_rows"
description = "Two values, below the documented minimum of three. Catches: a value (0) instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["5"],
]
query = "SELECT SKEW(x) AS r FROM input"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t003_varchar"
description = "Numeric text. Catches: text rejected"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'1'"],
  ["'2'"],
  ["'9'"],
]
query = "SELECT SKEW(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr"
description = "Three rows of which one is NULL. Catches: NULL counted as a row"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["NULL"],
  ["7"],
]
query = "SELECT SKEW(x) AS r FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_empty_input"
description = "No rows. Catches: an error instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT SKEW(x) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
