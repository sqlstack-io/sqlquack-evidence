category = "translation"
construct = "sf.functions.pi"
session_profile = "utc-v1"

[[case]]
id = "t001_value"
description = "PI() in arithmetic, at full double precision. Catches: a rounded constant (3.14159) or a NUMBER"
columns = [{ name = "k", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["-2"],
  ["1000000"],
]
query = "SELECT PI() * k AS r, PI() / 4 AS s FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]
