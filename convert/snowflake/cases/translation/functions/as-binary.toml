category = "translation"
construct = "sf.functions.as-binary"
session_profile = "utc-v1"

[[case]]
id = "t001_match"
description = "A BINARY value cast to VARIANT. Catches: the bytes returned as hexadecimal text"
columns = [{ name = "b", type = "BINARY" }]
rows = [
  ["'ABCD'"],
  ["''"],
]
query = "SELECT AS_BINARY(b::VARIANT) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_mismatch"
description = "A string of hexadecimal digits and a number. Catches: the hexadecimal text decoded to bytes"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'\"ABCD\"'"],
  ["'5'"],
]
query = "SELECT AS_BINARY(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_variant_expr"
description = "A SQL NULL and a JSON null; the page returns NULL for a NULL argument and for a type that does not match. Catches: the JSON null passed through as a value, or an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'null'"],
]
query = "SELECT AS_BINARY(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
