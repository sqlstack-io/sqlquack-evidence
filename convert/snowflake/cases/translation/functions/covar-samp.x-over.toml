category = "translation"
construct = "sf.functions.covar-samp.x-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Per-partition pairs with NULLs on either side. Catches: the population covariance, or pairs with one NULL kept, or the whole input"
columns = [{ name = "g", type = "VARCHAR" }, { name = "y", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1", "1"],
  ["'q'", "4", "1"],
  ["'p'", "3", "2"],
  ["'p'", "2", "4"],
  ["'q'", "6", "3"],
  ["'p'", "8", "5"],
  ["'p'", "NULL", "9"],
  ["'p'", "40", "NULL"],
  ["'r'", "5", "2"],
]
query = "SELECT COVAR_SAMP(y, x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_empty_over"
description = "An empty OVER clause. Catches: a running value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "y", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1", "1"],
  ["'q'", "4", "1"],
  ["'p'", "3", "2"],
  ["'p'", "2", "4"],
  ["'q'", "6", "3"],
  ["'p'", "8", "5"],
  ["'p'", "NULL", "9"],
  ["'p'", "40", "NULL"],
  ["'r'", "5", "2"],
]
query = "SELECT COVAR_SAMP(y, x) OVER () AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_y"
description = "A partition whose y values are all NULL. Catches: a value from x alone"
columns = [{ name = "g", type = "VARCHAR" }, { name = "y", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL", "1"],
  ["'p'", "NULL", "2"],
  ["'q'", "1", "1"],
  ["'q'", "3", "2"],
]
query = "SELECT COVAR_SAMP(y, x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_partition_key"
description = "NULL partition keys. Catches: NULL-keyed rows split or dropped"
