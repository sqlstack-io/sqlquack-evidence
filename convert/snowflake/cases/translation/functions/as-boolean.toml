category = "translation"
construct = "sf.functions.as-boolean"
session_profile = "utc-v1"

[[case]]
id = "t001_match"
description = "JSON true and false. Catches: false read as NULL, or the values swapped"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'true'"],
  ["'false'"],
]
query = "SELECT AS_BOOLEAN(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_mismatch"
description = "The string \"true\", the number 1 and the number 0. Catches: text or numbers converted to BOOLEAN (TO_BOOLEAN)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'\"true\"'"],
  ["'1'"],
  ["'0'"],
]
query = "SELECT AS_BOOLEAN(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_variant_expr"
description = "A SQL NULL and a JSON null; the page returns NULL for a NULL argument and for a type that does not match. Catches: the JSON null passed through as a value, or an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'null'"],
]
query = "SELECT AS_BOOLEAN(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
