category = "translation"
construct = "sf.functions.regexp-substr"
session_profile = "utc-v1"

[[case]]
id = "t001_empty_match_at_and_past_the_end"
description = "REGEXP_SUBSTR(a, 'x*', n) on 'abc' with n at the last character, one past it and two past it, where 'x*' matches the empty string. Catches: '' where Snowflake gives NULL, or an error past the end where Snowflake answers"
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'abc'", "3"],
  ["'abc'", "4"],
  ["'abc'", "5"],
]
query = "SELECT n, REGEXP_SUBSTR(a, 'x*', n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]
