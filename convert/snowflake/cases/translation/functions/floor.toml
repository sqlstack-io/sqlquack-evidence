category = "translation"
construct = "sf.functions.floor"
session_profile = "utc-v1"

[[case]]
id = "t001_int"
description = "FLOOR of integers with a negative scale. Catches: CEIL or truncation used (FLOOR(-2.1) is -3); or a negative scale ignored"
columns = [{ name = "x", type = "NUMBER(38,0)" }, { name = "s", type = "NUMBER(38,0)" }]
rows = [
  ["1567", "-2"],
  ["-1567", "-2"],
  ["5", "0"],
]
query = "SELECT FLOOR(x, s) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_dec"
description = "FLOOR of NUMBER(12,4) with and without a scale. Catches: CEIL or truncation used (FLOOR(-2.1) is -3)"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["2.1000"],
  ["-2.1000"],
  ["-2.5000"],
  ["2.7000"],
]
query = "SELECT FLOOR(x) AS r, FLOOR(x, 2) AS s FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_float"
description = "FLOOR of FLOAT returns FLOAT. Catches: CEIL or truncation used (FLOOR(-2.1) is -3); or a NUMBER returned"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["3.14159"],
  ["-3.14159"],
  ["-0.4"],
]
query = "SELECT FLOOR(x) AS r, FLOOR(x, 1) AS s FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_decfloat"
description = "FLOOR of DECFLOAT returns DECFLOAT. The result is cast to VARCHAR because the recorder cannot decode a DECFLOAT column. Catches: computed in FLOAT: the fraction of a 20-digit value lost, or 0.29 at scale 2 off by one ulp"
columns = [{ name = "x", type = "DECFLOAT" }]
rows = [
  ["2.25"],
  ["-2.25"],
  ["0.29"],
  ["12345678901234567890.25"],
]
query = "SELECT CAST(FLOOR(x, 1) AS VARCHAR) AS r, CAST(FLOOR(x, 2) AS VARCHAR) AS s FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_x"
description = "FLOOR of NULL. Catches: NULL turned into 0"
columns = [{ name = "x", type = "NUMBER(12,4)" }, { name = "s", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1"],
]
query = "SELECT FLOOR(x, s) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_null_scale"
description = "FLOOR with a NULL scale. Catches: the NULL scale read as 0"
columns = [{ name = "x", type = "NUMBER(12,4)" }, { name = "s", type = "NUMBER(38,0)" }]
rows = [
  ["2.5555", "NULL"],
]
query = "SELECT FLOOR(x, s) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_scale_past"
description = "Scales past the input scale and far negative. Catches: scale capped or wrapping"
columns = [{ name = "x", type = "NUMBER(12,4)" }, { name = "s", type = "NUMBER(38,0)" }]
rows = [
  ["12.3456", "6"],
  ["12.3456", "-5"],
  ["-987.6543", "3"],
]
query = "SELECT FLOOR(x, s) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t008_negatives"
description = "Negative values at the rounding step. Catches: CEIL or truncation used (FLOOR(-2.1) is -3)"
columns = [{ name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["-2.15"],
  ["-0.01"],
]
query = "SELECT FLOOR(x, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
