category = "translation"
construct = "sf.functions.array-insert"
session_profile = "utc-v1"

[[case]]
id = "t001_positions"
description = "Positions 0, 1 and the end. Catches: 1-based positions, or the element replacing the one at the position"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["'[1,2,3]'", "0"],
  ["'[1,2,3]'", "1"],
  ["'[1,2,3]'", "3"],
]
query = "SELECT ARRAY_INSERT(PARSE_JSON(a), p, 'x'::VARIANT) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_negative_position"
description = "Positions -1 and -3 counted from the end. Catches: the element appended after the last for -1, or the negative position read as 0"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["'[1,2,3]'", "-1"],
  ["'[1,2,3]'", "-3"],
]
query = "SELECT ARRAY_INSERT(PARSE_JSON(a), p, 'x'::VARIANT) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t003_past_end"
description = "A position two past the end, which pads with undefined elements. Catches: the element appended without padding (size 4 instead of 6), or an error"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["'[1,2,3]'", "5"],
]
query = "SELECT ARRAY_INSERT(PARSE_JSON(a), p, 'x'::VARIANT) AS r, ARRAY_SIZE(ARRAY_INSERT(PARSE_JSON(a), p, 'x'::VARIANT)) AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t004_null_pos"
description = "A NULL position and a NULL array; the page does not say; the recording decides. Catches: a NULL position read as 0 (the element inserted first)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["'[1,2]'", "NULL"],
  ["NULL", "0"],
]
query = "SELECT ARRAY_INSERT(PARSE_JSON(a), p, 'x'::VARIANT) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
