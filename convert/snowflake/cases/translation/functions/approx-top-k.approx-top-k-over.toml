category = "translation"
construct = "sf.functions.approx-top-k.approx-top-k-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Per-partition top 2. Catches: the whole input"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'p'", "'a'"],
  ["'q'", "'z'"],
  ["'p'", "'b'"],
  ["'p'", "'a'"],
  ["'p'", "'c'"],
  ["'p'", "'b'"],
  ["'p'", "'a'"],
]
query = "SELECT APPROX_TOP_K(x, 2) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_empty_over"
description = "An empty OVER clause. Catches: a running value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'p'", "'a'"],
  ["'q'", "'z'"],
  ["'p'", "'b'"],
  ["'p'", "'a'"],
  ["'p'", "'c'"],
  ["'p'", "'b'"],
  ["'p'", "'a'"],
]
query = "SELECT APPROX_TOP_K(x, 1) OVER () AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr4"
description = "NULL partition keys. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["NULL", "'a'"],
  ["'p'", "'b'"],
  ["NULL", "'a'"],
]
query = "SELECT APPROX_TOP_K(x, 2) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_expr"
description = "A partition of only NULL. Catches: NULL treated the opposite way to Snowflake"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "'a'"],
]
query = "SELECT APPROX_TOP_K(x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
