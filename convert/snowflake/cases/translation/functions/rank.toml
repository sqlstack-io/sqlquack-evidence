category = "translation"
construct = "sf.functions.rank"
session_profile = "utc-v1"

[[case]]
id = "t001_ties"
description = "A tie at 20 and a NULL order key, which sorts last under the session default. Catches: no gap after the tie (DENSE_RANK: 1,2,2,3), or the NULL ranked first"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, RANK() OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_desc_nulls_first"
description = "Descending order with NULLS FIRST. Catches: NULLS FIRST ignored, or ascending order used"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, RANK() OVER (PARTITION BY p ORDER BY o DESC NULLS FIRST) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_no_partition"
description = "The whole input as one partition. Catches: ranks restarted per value of p"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, RANK() OVER (ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_order_expr"
description = "NULL order keys sorted first with ASC NULLS FIRST; tied NULLs share a rank. Catches: NULLs sorted last, or each NULL given its own rank"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "NULL"],
  ["'a'", "2"],
  ["'a'", "NULL"],
  ["'a'", "1"],
]
query = "SELECT ordinal, RANK() OVER (PARTITION BY p ORDER BY o ASC NULLS FIRST) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
