category = "translation"
construct = "sf.functions.h3-is-valid-cell"
session_profile = "utc-v1"

[[case]]
id = "t001_integer"
description = "A valid cell, 0 and 123. Catches: any non-zero integer accepted, or an error for an invalid ID"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["617700169957507071"],
  ["0"],
  ["123"],
]
query = "SELECT ordinal, H3_IS_VALID_CELL(c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "A valid hexadecimal ID, a non-hexadecimal string and the empty string. Catches: an error for text that is not hexadecimal"
columns = [{ name = "c", type = "VARCHAR" }]
rows = [
  ["'89283082803ffff'"],
  ["'zz'"],
  ["''"],
]
query = "SELECT ordinal, H3_IS_VALID_CELL(c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_cell_id"
description = "A NULL ID, which the page says gives NULL without an error. Catches: FALSE returned"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT H3_IS_VALID_CELL(c) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
