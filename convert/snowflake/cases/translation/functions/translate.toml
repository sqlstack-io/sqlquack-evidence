category = "translation"
construct = "sf.functions.translate"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "A shorter target that removes a character, and multi-byte characters. Catches: unmatched source characters kept (Oracle-style keep instead of remove), or byte positions (\u00e9)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "f", type = "VARCHAR" }, { name = "t", type = "VARCHAR" }]
rows = [
  ["'abcabc'", "'abc'", "'xy'"],
  ["'\u00e9te'", "'\u00e9'", "'e'"],
  ["'ba'", "'ab'", "'ba'"],
]
query = "SELECT TRANSLATE(a, f, t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_subject"
description = "NULL subject. Catches: NULL read as empty"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'a'"],
]
query = "SELECT TRANSLATE(a, 'a', 'b') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_null_sourcealphabet"
description = "NULL source alphabet. Catches: NULL read as empty (subject unchanged)"
columns = [{ name = "f", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'a'"],
]
query = "SELECT TRANSLATE('ab', f, 'x') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_targetalphabet"
description = "NULL target alphabet. Catches: NULL read as empty (characters removed)"
columns = [{ name = "t", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["''"],
]
query = "SELECT TRANSLATE('ab', 'a', t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_empty_target"
description = "An empty target, which removes every source character. Catches: the source characters kept"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'banana'"],
]
query = "SELECT TRANSLATE(a, 'an', '') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]

[[case]]
id = "t006_target_longer"
description = "A target longer than the source, which the page says is an error. Catches: the extra target characters ignored"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'abc'"],
]
query = "SELECT TRANSLATE(a, 'a', 'xy') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
