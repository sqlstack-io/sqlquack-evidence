category = "translation"
construct = "sf.functions.period-contains"
session_profile = "utc-v1"

[[case]]
id = "t001_periods"
description = "The six period pairs. Catches: containment tested the wrong way round, or overlap tested"
columns = [{ name = "b1", type = "DATE" }, { name = "e1", type = "DATE" }, { name = "b2", type = "DATE" }, { name = "e2", type = "DATE" }]
rows = [
  ["'2024-01-01'", "'2024-03-01'", "'2024-02-01'", "'2024-04-01'"],
  ["'2024-01-01'", "'2024-02-01'", "'2024-02-01'", "'2024-03-01'"],
  ["'2024-01-01'", "'2024-12-31'", "'2024-03-01'", "'2024-04-01'"],
  ["'2024-01-01'", "'2024-02-01'", "'2024-06-01'", "'2024-07-01'"],
  ["'2024-01-01'", "'2024-02-01'", "'2024-01-01'", "'2024-02-01'"],
  ["'2024-02-01'", "'2024-03-01'", "'2024-01-01'", "'2024-02-01'"],
]
query = "SELECT ordinal, PERIOD_CONTAINS(PERIOD_CONSTRUCT(b1, e1), PERIOD_CONSTRUCT(b2, e2)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_instant"
description = "Instants at the begin, inside, at the end and after a period built from columns; the page says the end is not contained. A constant period here made Snowflake abort with internal error 300010 twice. Catches: the end bound treated as inclusive"
columns = [{ name = "b1", type = "DATE" }, { name = "e1", type = "DATE" }, { name = "d", type = "DATE" }]
rows = [
  ["'2024-01-01'", "'2024-04-01'", "'2024-01-01'"],
  ["'2024-01-01'", "'2024-04-01'", "'2024-03-31'"],
  ["'2024-01-01'", "'2024-04-01'", "'2024-04-01'"],
  ["'2024-01-01'", "'2024-04-01'", "'2024-05-01'"],
]
query = "SELECT ordinal, PERIOD_CONTAINS(PERIOD_CONSTRUCT(b1, e1), d) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t003_null_period1"
description = "A NULL period; the page does not say; the recording decides. Catches: FALSE returned"
columns = [{ name = "b1", type = "DATE" }, { name = "e1", type = "DATE" }]
rows = [
  ["NULL", "'2024-02-01'"],
  ["'2024-01-01'", "'2024-02-01'"],
]
query = "SELECT ordinal, PERIOD_CONTAINS(PERIOD_CONSTRUCT(b1, e1), DATE '2024-01-15') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
