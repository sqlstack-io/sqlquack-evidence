category = "translation"
construct = "sf.functions.hll-estimate.hll-estimate-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
compile_error = true
description = "The documented window form over partitions. Snowflake refuses it at compile (HLL_ESTIMATE is not a window function there). Catches: estimates returned instead of the compilation error"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
  ["'r'", "5"],
]
query = "SELECT g, HLL_ESTIMATE(st) OVER (PARTITION BY k) AS r FROM (SELECT g, IFF(g = 'r', 2, 1) AS k, st FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g)) ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_state"
compile_error = true
description = "The documented window form with a NULL state, which Snowflake also refuses at compile. Catches: a result returned instead of the compilation error"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT HLL_ESTIMATE(st) OVER () AS r FROM (SELECT st FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g) UNION ALL SELECT NULL) ORDER BY r"
order = "ordered"
tags = ["null"]
