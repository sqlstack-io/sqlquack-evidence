category = "translation"
construct = "sf.functions.st-asewkb"
session_profile = "utc-v1"

[[case]]
id = "t001_srid"
description = "The SRID carried in the EWKB, read back with TO_GEOMETRY: 4326 for a GEOGRAPHY, 3857 for a GEOMETRY with that SRID. Catches: plain WKB returned (SRID 0), or the GEOMETRY SRID replaced by 4326"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POINT(10 20)'"],
]
query = "SELECT ST_SRID(TO_GEOMETRY(ST_ASEWKB(TO_GEOGRAPHY(v)))) AS g, ST_SRID(TO_GEOMETRY(ST_ASEWKB(TO_GEOMETRY(v, 3857)))) AS m, ST_X(TO_GEOMETRY(ST_ASEWKB(TO_GEOGRAPHY(v)))) AS x FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_geography_or_geometry_expression"
description = "A NULL shape; the page does not say; the recording decides. Catches: an error, or a value returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_ASEWKB(TO_GEOGRAPHY(v)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
