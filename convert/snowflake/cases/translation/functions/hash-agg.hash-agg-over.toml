category = "translation"
construct = "sf.functions.hash-agg.hash-agg-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "HASH_AGG per partition with partitions of equal multisets. Catches: the whole input hashed instead of the partition, or partitions with the same rows hashed differently"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "1"],
  ["'r'", "1"],
]
query = "SELECT g, HASH_AGG(a) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_no_partition"
description = "An empty OVER clause. Catches: a running (ordered) hash instead of the whole-input value"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["5"],
  ["6"],
]
query = "SELECT HASH_AGG(a) OVER () AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr"
description = "NULL values inside a partition. Catches: NULLs skipped within the window"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'p'", "1"],
  ["'q'", "1"],
]
query = "SELECT g, HASH_AGG(a) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
