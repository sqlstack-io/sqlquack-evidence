category = "translation"
construct = "sf.functions.strtok"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "Tokens with a delimiter set and consecutive delimiters. Catches: the delimiter read as one string (SPLIT_PART), or empty tokens returned"
columns = [{ name = "a", type = "VARCHAR" }, { name = "d", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'a.b@c'", "'@.'", "3"],
  ["'a..b'", "'.'", "2"],
  ["'\u00e9 b'", "' '", "2"],
]
query = "SELECT STRTOK(a, d, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_defaults"
description = "The default blank delimiter and part 1. Catches: another default delimiter or part"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'  hello world'"],
]
query = "SELECT STRTOK(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_string"
description = "NULL string. Catches: NULL read as empty"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'a'"],
]
query = "SELECT STRTOK(a, ',', 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_delimiter"
description = "NULL delimiter. Catches: NULL read as the default"
columns = [{ name = "d", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["' '"],
]
query = "SELECT STRTOK('a b', d, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_partnumber"
description = "NULL part. Catches: NULL read as 1"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT STRTOK('a b', ' ', n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_empty"
description = "Empty delimiter with empty and non-empty strings. Catches: '' instead of NULL for empty input, or a split on every character"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["''"],
  ["'ab'"],
]
query = "SELECT STRTOK(a, '', 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]

[[case]]
id = "t007_out_of_range"
description = "A token number past the last token. Catches: '' instead of NULL"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["3"],
  ["2"],
]
query = "SELECT STRTOK('a b', ' ', n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
