category = "translation"
construct = "sf.functions.st-area"
session_profile = "utc-v1"

[[case]]
id = "t001_geometry"
description = "A 10 by 10 square, a line string, and a collection of a triangle (area 6) and a point. Catches: a line string given its length, or the collection area ignoring the triangle"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,10 0,10 10,0 10,0 0))'"],
  ["'LINESTRING(0 0,1 2,3 4)'"],
  ["'GEOMETRYCOLLECTION(POLYGON((0 0,4 0,1 3,0 0)),POINT(5 5))'"],
]
query = "SELECT ordinal, ST_AREA(TO_GEOMETRY(v)) AS a FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_geography"
description = "A 1-degree square at the equator in units of 1e9 square metres, rounded (12 on any earth model). Catches: square degrees returned (1)"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,1 0,1 1,0 1,0 0))'"],
]
query = "SELECT ROUND(ST_AREA(TO_GEOGRAPHY(v)) / 1e9) AS a FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_geography_or_geometry_expression"
description = "A NULL shape; the page does not say; the recording decides. Catches: an error, or a value returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_AREA(TO_GEOGRAPHY(v)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
