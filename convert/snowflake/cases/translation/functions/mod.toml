category = "translation"
construct = "sf.functions.mod"
session_profile = "utc-v1"

[[case]]
id = "t001_int"
description = "MOD of integers with negatives. Catches: floor-based modulo (MOD(-7, 3) is -1, not 2)"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["-7", "3"],
  ["7", "-3"],
  ["17", "5"],
]
query = "SELECT MOD(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_dec"
description = "MOD of NUMBER(10,2) values. Catches: fractional remainder dropped"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["7.50", "2.00"],
  ["-7.50", "2.25"],
]
query = "SELECT MOD(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_dec_int"
description = "MOD of a scaled and an integer operand. Catches: result scale from one side"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["10.25", "3"],
  ["-0.75", "2"],
]
query = "SELECT MOD(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_float"
description = "MOD of FLOAT values. Catches: floor-based float modulo"
columns = [{ name = "a", type = "FLOAT" }, { name = "b", type = "FLOAT" }]
rows = [
  ["5.5", "2"],
  ["-5.5", "2"],
]
query = "SELECT MOD(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_a"
description = "NULL dividend. Catches: NULL treated as 0"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "3"],
]
query = "SELECT MOD(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_null_b"
description = "NULL divisor. Catches: NULL treated as 0"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["3", "NULL"],
]
query = "SELECT MOD(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_order"
description = "Argument order with negatives. Catches: arguments swapped"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["3", "-7"],
  ["-3", "-7"],
]
query = "SELECT MOD(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t008_max"
description = "Remainders of 38-digit integers. Catches: 64-bit modulo"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["99999999999999999999999999999999999999", "7"],
  ["-99999999999999999999999999999999999999", "1000000007"],
]
query = "SELECT MOD(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t009_zero_divisor"
description = "A zero divisor: records what Snowflake returns there; re-kinded to boundary after capture if Snowflake returns a value instead of an error. Catches: a bare % giving NULL for MOD(x, 0); with it, mod.t006 catches NULL read as 0"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["5", "0"],
]
query = "SELECT MOD(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
