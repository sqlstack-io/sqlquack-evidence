category = "translation"
construct = "sf.functions.array-unique-agg.array-unique-agg-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Per-partition distinct values. Catches: the whole input, or duplicates kept"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "2", "20"],
  ["'q'", "5", "3"],
  ["'p'", "1", "10"],
  ["'p'", "3", "1"],
  ["'q'", "1", "7"],
  ["'p'", "2", "5"],
  ["'p'", "4", "20"],
]
query = "SELECT ARRAY_SORT(ARRAY_UNIQUE_AGG(x) OVER (PARTITION BY g)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_empty_over"
description = "An empty OVER clause. Catches: a running value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "2", "20"],
  ["'q'", "5", "3"],
  ["'p'", "1", "10"],
  ["'p'", "3", "1"],
  ["'q'", "1", "7"],
  ["'p'", "2", "5"],
]
query = "SELECT ARRAY_SORT(ARRAY_UNIQUE_AGG(x) OVER ()) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_column"
description = "A partition of only NULL. Catches: NULL instead of []"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1", "NULL"],
  ["'q'", "1", "3"],
]
query = "SELECT ARRAY_UNIQUE_AGG(x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_expr"
description = "NULL partition keys. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1", "4"],
  ["'p'", "1", "9"],
  ["NULL", "2", "2"],
]
query = "SELECT ARRAY_SORT(ARRAY_UNIQUE_AGG(x) OVER (PARTITION BY g)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
