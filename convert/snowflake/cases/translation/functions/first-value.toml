category = "translation"
construct = "sf.functions.first-value"
session_profile = "utc-v1"

[[case]]
id = "t001_respect"
description = "A partition whose first value is NULL. Catches: NULLs skipped by default"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1", "NULL"],
  ["'a'", "2", "10"],
  ["'a'", "4", "NULL"],
  ["'a'", "5", "40"],
  ["'a'", "7", "NULL"],
  ["'b'", "1", "7"],
  ["'b'", "3", "9"],
]
query = "SELECT ordinal, FIRST_VALUE(x) OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_ignore_nulls"
description = "IGNORE NULLS on the same partition. Catches: IGNORE NULLS ignored (NULL)"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1", "NULL"],
  ["'a'", "2", "10"],
  ["'a'", "4", "NULL"],
  ["'a'", "5", "40"],
  ["'a'", "7", "NULL"],
  ["'b'", "1", "7"],
  ["'b'", "3", "9"],
]
query = "SELECT ordinal, FIRST_VALUE(x) IGNORE NULLS OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_frame"
description = "A sliding frame of the current and one preceding row. Catches: the frame ignored"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1", "NULL"],
  ["'a'", "2", "10"],
  ["'a'", "4", "NULL"],
  ["'a'", "5", "40"],
  ["'a'", "7", "NULL"],
  ["'b'", "1", "7"],
  ["'b'", "3", "9"],
]
query = "SELECT ordinal, FIRST_VALUE(x) IGNORE NULLS OVER (PARTITION BY p ORDER BY o ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr"
description = "A partition whose values are all NULL, with IGNORE NULLS. Catches: an error, or a value from another partition"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'c'", "1", "NULL"],
  ["'c'", "2", "NULL"],
  ["'a'", "1", "4"],
]
query = "SELECT ordinal, FIRST_VALUE(x) IGNORE NULLS OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
