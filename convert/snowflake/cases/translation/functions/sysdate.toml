category = "translation"
construct = "sf.functions.sysdate"
session_profile = "utc-v1"

[[case]]
id = "t001_type"
description = "The type, which the page says is TIMESTAMP_NTZ despite the name, and agreement with CURRENT_TIMESTAMP in the UTC session. Catches: a DATE returned, or TIMESTAMP_LTZ"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT TYPEOF(SYSDATE()::VARIANT) AS t, ABS(DATEDIFF(second, SYSDATE(), CURRENT_TIMESTAMP()::TIMESTAMP_NTZ)) < 60 AS close FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_precision_arg"
compile_error = true
description = "A precision argument, which the page says SYSDATE does not support. Catches: the argument accepted"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT SYSDATE(3) IS NULL AS n FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t003_null_none"
description = "The function takes no argument; a NULL value compared with its result gives NULL. Catches: the comparison with NULL returning FALSE, or the NULL replaced by the current value"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["NULL"],
  ["'2026-01-01'"],
]
query = "SELECT ordinal, d::TIMESTAMP_NTZ < SYSDATE() AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
