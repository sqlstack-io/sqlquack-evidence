category = "translation"
construct = "sf.functions.parse-json"
session_profile = "utc-v1"

[[case]]
id = "t001_numbers"
description = "A decimal and the same value with an exponent, with their types. Catches: the decimal parsed as DOUBLE, or trailing zeros changed"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'123.450'"],
  ["'1.2345e+02'"],
]
query = "SELECT PARSE_JSON(a) AS r, TYPEOF(PARSE_JSON(a)) AS t FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["type-combination"]

[[case]]
id = "t002_blank"
description = "An empty string and a string of spaces, which the page says give NULL rather than an error. Catches: an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["''"],
  ["'   '"],
]
query = "SELECT PARSE_JSON(a) AS r, PARSE_JSON(a) IS NULL AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]

[[case]]
id = "t003_json_null"
description = "The text null, which the page says is a JSON null rather than a SQL NULL. Catches: a SQL NULL returned (IS NULL true)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'null'"],
]
query = "SELECT PARSE_JSON(a) AS r, PARSE_JSON(a) IS NULL AS n FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_duplicates_d"
description = "Duplicate keys with the parameter 'd', which keeps the last value. Catches: the first value kept"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1,\"a\":2}'"],
]
query = "SELECT PARSE_JSON(a, 'd') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_duplicates"
description = "Duplicate keys under the default strict parameter, which the page says is an error. Catches: the last or first value kept"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1,\"a\":2}'"],
]
query = "SELECT PARSE_JSON(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t006_invalid"
description = "Malformed JSON. Catches: NULL returned (as TRY_PARSE_JSON does)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":}'"],
]
query = "SELECT PARSE_JSON(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t007_null_expr"
description = "A SQL NULL, which the page says gives NULL. Catches: a JSON null returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT PARSE_JSON(a) AS r, PARSE_JSON(a) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
