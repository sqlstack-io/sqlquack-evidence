category = "translation"
construct = "sf.functions.period-succeeds"
session_profile = "utc-v1"

[[case]]
id = "t001_relations"
description = "Overlapping, meeting, contained, disjoint and equal periods, and periods meeting the other way. Catches: a strict comparison, or the arguments swapped"
columns = [{ name = "b1", type = "DATE" }, { name = "e1", type = "DATE" }, { name = "b2", type = "DATE" }, { name = "e2", type = "DATE" }]
rows = [
  ["'2024-01-01'", "'2024-03-01'", "'2024-02-01'", "'2024-04-01'"],
  ["'2024-01-01'", "'2024-02-01'", "'2024-02-01'", "'2024-03-01'"],
  ["'2024-01-01'", "'2024-12-31'", "'2024-03-01'", "'2024-04-01'"],
  ["'2024-01-01'", "'2024-02-01'", "'2024-06-01'", "'2024-07-01'"],
  ["'2024-01-01'", "'2024-02-01'", "'2024-01-01'", "'2024-02-01'"],
  ["'2024-02-01'", "'2024-03-01'", "'2024-01-01'", "'2024-02-01'"],
]
query = "SELECT ordinal, PERIOD_SUCCEEDS(PERIOD_CONSTRUCT(b1, e1), PERIOD_CONSTRUCT(b2, e2)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_period1"
description = "A NULL period; the page does not say; the recording decides. Catches: FALSE returned"
columns = [{ name = "b1", type = "DATE" }, { name = "e1", type = "DATE" }]
rows = [
  ["NULL", "'2024-02-01'"],
  ["'2024-01-01'", "'2024-02-01'"],
]
query = "SELECT ordinal, PERIOD_SUCCEEDS(PERIOD_CONSTRUCT(b1, e1), PERIOD_CONSTRUCT(DATE '2024-02-01', DATE '2024-03-01')) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
