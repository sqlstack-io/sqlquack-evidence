category = "translation"
construct = "sf.functions.try-to-date"
session_profile = "utc-v1"

[[case]]
id = "t001_strings"
description = "An ISO date, and a date in a given format. Catches: the format ignored, or day and month swapped"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'2024-02-29'"],
]
query = "SELECT TRY_TO_DATE(v) AS iso, TRY_TO_DATE('29/02/2024', 'DD/MM/YYYY') AS fmt FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_epoch_units"
description = "Integer strings just below and at the milliseconds boundary, which the page reads as seconds and milliseconds. Catches: every integer read as seconds, or as days"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'86400'"],
  ["'31535999999'"],
  ["'31536000000'"],
]
query = "SELECT TRY_TO_DATE(v) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t003_invalid"
description = "30 February and text that is not a date. Catches: an error raised, or the date rolled over to March"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'2023-02-30'"],
  ["'abc'"],
]
query = "SELECT TRY_TO_DATE(v) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_string_expr"
description = "A NULL string. Catches: an error, or the epoch date"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT TRY_TO_DATE(v) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
