category = "translation"
construct = "sf.functions.replace"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "Overlapping candidates and a replacement that recreates the pattern. Catches: overlapping replacement ('bb' for aaa), a re-scan of the result, or only the first occurrence, or the pattern read as a regular expression ('---' for '.')"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "VARCHAR" }, { name = "r", type = "VARCHAR" }]
rows = [
  ["'aaa'", "'aa'", "'b'"],
  ["'abab'", "'ab'", "'aab'"],
  ["'\u00e9.\u00e9'", "'.'", "'-'"],
]
query = "SELECT REPLACE(a, p, r) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_no_replacement"
description = "No replacement argument. Catches: an error, or NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'a-b-c'"],
]
query = "SELECT REPLACE(a, '-') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_case"
description = "A pattern in another case. Catches: case-insensitive replacement"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'aAa'"],
]
query = "SELECT REPLACE(a, 'A', '_') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_subject"
description = "NULL subject. Catches: NULL read as empty"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'ab'"],
]
query = "SELECT REPLACE(a, 'a', 'x') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_pattern"
description = "NULL pattern. Catches: NULL read as an empty pattern (subject unchanged)"
columns = [{ name = "p", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'a'"],
]
query = "SELECT REPLACE('ab', p, 'x') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_null_replacement"
description = "NULL replacement. Catches: NULL read as '' (a delete)"
columns = [{ name = "r", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["''"],
]
query = "SELECT REPLACE('ab', 'a', r) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_empty_pattern"
description = "An empty pattern: records what Snowflake returns. Catches: the replacement inserted between every character"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'abc'"],
]
query = "SELECT REPLACE(a, '', '-') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]
