category = "translation"
construct = "sf.functions.h3-cell-to-parent"
session_profile = "utc-v1"

[[case]]
id = "t001_integer"
description = "The parent of a resolution-9 cell at resolutions 7 and 9. Catches: the resolution read as a number of levels up, or the hexadecimal form returned"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["617700169957507071"],
]
query = "SELECT H3_CELL_TO_PARENT(c, 7) AS p7, H3_CELL_TO_PARENT(c, 9) AS p9 FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "The parent of the hexadecimal ID at resolution 7. Catches: the INTEGER form returned for a VARCHAR ID"
columns = [{ name = "c", type = "VARCHAR" }]
rows = [
  ["'89283082803ffff'"],
]
query = "SELECT H3_CELL_TO_PARENT(c, 7) AS p7 FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_resolution_range"
description = "Resolution 16, outside the 0 to 15 that the page allows; it says any other value is an error. Catches: the resolution clamped to 15, or NULL returned"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["617700169957507071"],
]
query = "SELECT H3_CELL_TO_PARENT(c, 16) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null_cell_id"
description = "A NULL ID; the page does not say; the recording decides. Catches: an error"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT H3_CELL_TO_PARENT(c, 7) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
