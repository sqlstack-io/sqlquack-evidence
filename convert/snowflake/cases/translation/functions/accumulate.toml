category = "translation"
construct = "sf.functions.accumulate"
session_profile = "utc-v1"

[[case]]
id = "t001_sum"
description = "The page's sum example over 3, 4 and 10, with a NULL row the page says is skipped (17). Catches: the NULL row breaking the sum, or only the last row kept"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["3"],
  ["NULL"],
  ["4"],
  ["10"],
]
query = "SELECT ACCUMULATE(x, (v INT) -> v, (state INT, v INT) -> state + v, (state1 INT, state2 INT) -> state1 + state2, (state INT) -> state) AS total FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_mean"
description = "The page's mean example over 3, 4 and 10, tracking the sum and the count in an ARRAY: 17/3, rounded to 2 places (5.67). Catches: the count taken from all rows including NULL (4.25), or integer division (5)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["3"],
  ["4"],
  ["NULL"],
  ["10"],
]
query = "SELECT ROUND(ACCUMULATE(x, (v INT) -> [v, 1], (state ARRAY, v INT) -> [state[0] + v, state[1] + 1], (state1 ARRAY, state2 ARRAY) -> [state1[0] + state2[0], state1[1] + state2[1]], (state ARRAY) -> state[0] / state[1]), 2) AS mean FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_input_expr"
description = "Only NULL rows, which the page says give NULL. Catches: 0 returned"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["NULL"],
]
query = "SELECT ACCUMULATE(x, (v INT) -> v, (state INT, v INT) -> state + v, (state1 INT, state2 INT) -> state1 + state2, (state INT) -> state) AS total FROM input"
order = "ordered"
tags = ["null"]
