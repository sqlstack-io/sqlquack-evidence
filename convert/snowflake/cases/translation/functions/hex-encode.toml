category = "translation"
construct = "sf.functions.hex-encode"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "HEX_ENCODE of multi-byte text. Catches: Latin-1 bytes (E9 for \u00e9) or lower-case digits by default"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'H\u00e9\u20ac'"],
  ["'z'"],
]
query = "SELECT HEX_ENCODE(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_binary"
description = "HEX_ENCODE of bytes including 00 and FF. Catches: the leading zero byte dropped or sign-extended"
columns = [{ name = "a", type = "BINARY" }]
rows = [
  ["'00FF10'"],
]
query = "SELECT HEX_ENCODE(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_case"
description = "The case argument 0 and 1. Catches: the case argument ignored or inverted"
columns = [{ name = "a", type = "VARCHAR" }, { name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["'\u00ff'", "0"],
  ["'\u00ff'", "1"],
]
query = "SELECT HEX_ENCODE(a, c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_input"
description = "NULL input next to a set one. Catches: NULL encoded as an empty string"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'a'"],
]
query = "SELECT HEX_ENCODE(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_case"
description = "NULL case next to a set one. Catches: NULL read as the default (upper case) instead of NULL"
columns = [{ name = "a", type = "VARCHAR" }, { name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["'\u00ff'", "NULL"],
  ["'\u00ff'", "0"],
]
query = "SELECT HEX_ENCODE(a, c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_empty"
description = "The empty string. Catches: NULL for empty input"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["''"],
]
query = "SELECT HEX_ENCODE(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]

[[case]]
id = "t007_bad_case"
description = "A case value other than 0 or 1. Catches: any non-zero value read as upper case instead of an error"
columns = [{ name = "a", type = "VARCHAR" }, { name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "2"],
]
query = "SELECT HEX_ENCODE(a, c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
