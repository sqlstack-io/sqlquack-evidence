category = "translation"
construct = "sf.functions.xmlget"
session_profile = "utc-v1"

[[case]]
id = "t001_instances"
description = "The first and second <a> elements, and their content and attribute through GET. Catches: a 1-based instance, or the element content returned instead of the element"
columns = [{ name = "a", type = "VARCHAR" }, { name = "i", type = "NUMBER(38,0)" }]
rows = [
  ["'<r><a id=\"1\">1.50</a><a>x</a><b/></r>'", "0"],
  ["'<r><a id=\"1\">1.50</a><a>x</a><b/></r>'", "1"],
]
query = "SELECT XMLGET(PARSE_XML(a), 'a', i) AS el, GET(XMLGET(PARSE_XML(a), 'a', i), '$') AS content, GET(XMLGET(PARSE_XML(a), 'a', i), '@id') AS id FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_missing"
description = "A tag that is absent and an instance past the last. Catches: an error, or the last instance returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'<r><a id=\"1\">1.50</a><a>x</a><b/></r>'"],
]
query = "SELECT XMLGET(PARSE_XML(a), 'z') AS absent, XMLGET(PARSE_XML(a), 'a', 2) AS past FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_instance_number"
description = "A NULL instance number and a NULL tag name, which the page says give NULL. Catches: instance 0 used, or an error"
columns = [{ name = "a", type = "VARCHAR" }, { name = "k", type = "VARCHAR" }]
rows = [
  ["'<r><a id=\"1\">1.50</a><a>x</a><b/></r>'", "NULL"],
]
query = "SELECT XMLGET(PARSE_XML(a), 'a', NULL) AS i, XMLGET(PARSE_XML(a), k) AS t FROM input"
order = "ordered"
tags = ["null"]
