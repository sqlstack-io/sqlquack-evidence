category = "translation"
construct = "sf.functions.try-decrypt"
session_profile = "utc-v1"

[[case]]
id = "t001_round_trip"
description = "Text encrypted and decrypted, converted back from BINARY with utf-8. Catches: the bytes returned as hex text"
columns = [{ name = "v", type = "VARCHAR" }, { name = "p", type = "VARCHAR" }]
rows = [
  ["'secret text'", "'pass phrase 1'"],
  ["''", "''"],
]
query = "SELECT ordinal, TO_VARCHAR(TRY_DECRYPT(ENCRYPT(v, p), p), 'utf-8') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_mismatch"
description = "A wrong passphrase and a wrong AAD, which give NULL. Catches: an error raised, or garbage bytes"
columns = [{ name = "v", type = "VARCHAR" }, { name = "p", type = "VARCHAR" }]
rows = [
  ["'secret text'", "'pass phrase 1'"],
]
query = "SELECT TRY_DECRYPT(ENCRYPT(v, p), 'other') IS NULL AS pass, TRY_DECRYPT(ENCRYPT(v, p, 'a1'), p, 'a2') IS NULL AS aad FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_value_to_decrypt"
description = "A NULL value; the page does not say; the recording decides. Catches: an error where Snowflake returns NULL, or the reverse"
columns = [{ name = "v", type = "VARCHAR" }, { name = "p", type = "VARCHAR" }]
rows = [
  ["NULL", "'p'"],
]
query = "SELECT TRY_DECRYPT(v::BINARY, p) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
