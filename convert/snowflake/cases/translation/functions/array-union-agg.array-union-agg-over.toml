category = "translation"
construct = "sf.functions.array-union-agg.array-union-agg-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Per-partition multiset unions. Catches: a set union or the whole input"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "VARCHAR" }]
rows = [
  ["'p'", "'[1,1,2]'"],
  ["'q'", "'[5]'"],
  ["'p'", "'[1,3]'"],
  ["'p'", "'[2,2]'"],
]
query = "SELECT ARRAY_SORT(ARRAY_UNION_AGG(PARSE_JSON(a)::ARRAY) OVER (PARTITION BY g)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_empty_over"
description = "An empty OVER clause. Catches: a running value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "VARCHAR" }]
rows = [
  ["'p'", "'[1,1,2]'"],
  ["'q'", "'[5]'"],
  ["'p'", "'[1,3]'"],
  ["'p'", "'[2,2]'"],
]
query = "SELECT ARRAY_SORT(ARRAY_UNION_AGG(PARSE_JSON(a)::ARRAY) OVER ()) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_column"
description = "A partition whose only array is NULL. Catches: NULL instead of []"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "VARCHAR" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "'[1]'"],
]
query = "SELECT ARRAY_UNION_AGG(PARSE_JSON(a)::ARRAY) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_expr"
description = "NULL partition keys. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "VARCHAR" }]
rows = [
  ["NULL", "'[1]'"],
  ["'p'", "'[2]'"],
  ["NULL", "'[1,1]'"],
]
query = "SELECT ARRAY_SORT(ARRAY_UNION_AGG(PARSE_JSON(a)::ARRAY) OVER (PARTITION BY g)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
