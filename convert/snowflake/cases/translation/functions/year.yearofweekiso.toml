category = "translation"
construct = "sf.functions.year.yearofweekiso"
session_profile = "utc-v1"

[[case]]
id = "t001_date"
description = "YEAROFWEEKISO of dates at year, ISO-week and leap boundaries. Catches: the calendar year instead of the ISO week-year"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["'2024-12-30'"],
  ["'2021-01-01'"],
  ["'2023-01-01'"],
  ["'2024-02-29'"],
  ["'2026-12-31'"],
]
query = "SELECT YEAROFWEEKISO(d) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_timestamp_ntz"
description = "YEAROFWEEKISO of a timestamp just before midnight on Sunday 31 December 2023, the last day of ISO 2023. Catches: the timestamp rounded to the next day"
columns = [{ name = "t", type = "TIMESTAMP_NTZ" }]
rows = [
  ["'2023-12-31 23:59:59.999'"],
  ["'2024-03-01 00:00:00'"],
]
query = "SELECT YEAROFWEEKISO(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_timestamp_tz"
description = "YEAROFWEEKISO of a TIMESTAMP_TZ whose UTC instant is in the next ISO week-year. Catches: the part taken from the UTC instant instead of the wall clock"
columns = [{ name = "t", type = "TIMESTAMP_TZ" }]
rows = [
  ["'2023-12-31 23:30:00 -0800'"],
]
query = "SELECT YEAROFWEEKISO(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_date_or_timestamp_expr"
description = "NULL next to a set date. Catches: NULL read as a default date (1970-01-01)"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["NULL"],
  ["'2024-06-15'"],
]
query = "SELECT YEAROFWEEKISO(d) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_leap"
description = "Days around 29 February in a leap and a common year. Catches: a 365-day year or a Julian 1900, which moves the ISO week-year edge at a year end"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["'2024-02-29'"],
  ["'2000-12-31'"],
  ["'1900-12-30'"],
  ["'1900-12-31'"],
  ["'2024-12-29'"],
]
query = "SELECT YEAROFWEEKISO(d) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
