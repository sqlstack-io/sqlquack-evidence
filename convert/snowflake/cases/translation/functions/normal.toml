category = "translation"
construct = "sf.functions.normal"
session_profile = "utc-v1"

[[case]]
id = "t001_distribution"
description = "Mean 5 and standard deviation 2 over 1000 rows: the sample mean within 0.4 and about 68% within one deviation. Catches: a uniform distribution, or the arguments swapped"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT ABS(AVG(n) - 5) < 0.4 AS mean_ok, COUNT_IF(ABS(n - 5) < 2) BETWEEN 600 AND 760 AS spread_ok FROM (SELECT NORMAL(5, 2, RANDOM()) AS n FROM TABLE(GENERATOR(ROWCOUNT => 1000)))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_gen"
description = "A NULL generator; the page does not say; the recording decides. Catches: a value where Snowflake returns NULL, or the reverse"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT NORMAL(0, 1, NULL) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
