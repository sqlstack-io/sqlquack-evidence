category = "translation"
construct = "sf.functions.hll-import.hll-import-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
compile_error = true
description = "The documented window form over partitions. Snowflake refuses it at compile (HLL_IMPORT is not a window function there). Catches: a result returned instead of the compilation error"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
  ["'q'", "9"],
  ["'p'", "4"],
]
query = "SELECT g, HLL_ESTIMATE(HLL_IMPORT(HLL_EXPORT(st)) OVER (PARTITION BY g)) AS r FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g) ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_expr"
compile_error = true
description = "The documented window form with a NULL partition key, which Snowflake also refuses at compile. Catches: a result returned instead of the compilation error"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
  ["'q'", "9"],
  ["'p'", "4"],
]
query = "SELECT g, HLL_ESTIMATE(HLL_IMPORT(HLL_EXPORT(st)) OVER (PARTITION BY k)) AS r FROM (SELECT g, NULL AS k, st FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g)) ORDER BY g"
order = "ordered"
tags = ["null"]
