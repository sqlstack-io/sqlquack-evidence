category = "translation"
construct = "sf.functions.h3-grid-disk"
session_profile = "utc-v1"

[[case]]
id = "t001_integer"
description = "k of 0, 1 and 2 around a hexagon: 1, 7 and 19 cells, including the cell itself. Catches: only the ring at distance k returned, or the cell left out"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["617700169957507071"],
]
query = "SELECT ARRAY_SIZE(H3_GRID_DISK(c, 0)) AS k0, ARRAY_SIZE(H3_GRID_DISK(c, 1)) AS k1, ARRAY_SIZE(H3_GRID_DISK(c, 2)) AS k2, ARRAY_CONTAINS(c::VARIANT, H3_GRID_DISK(c, 2)) AS self FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "A hexadecimal ID, whose disk holds hexadecimal IDs including a cell two steps away. Catches: INTEGER IDs returned for a VARCHAR ID"
columns = [{ name = "c", type = "VARCHAR" }]
rows = [
  ["'89283082803ffff'"],
]
query = "SELECT ARRAY_SIZE(H3_GRID_DISK(c, 2)) AS k2, ARRAY_CONTAINS('89283082833ffff'::VARIANT, H3_GRID_DISK(c, 2)) AS far FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_negative_k"
description = "k = -1, which the page says must be non-negative. Catches: an empty array returned, or the sign ignored"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["617700169957507071"],
]
query = "SELECT H3_GRID_DISK(c, -1) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null_cell_id"
description = "A NULL ID; the page does not say; the recording decides. Catches: an error, or an empty array returned"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT H3_GRID_DISK(c, 1) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
