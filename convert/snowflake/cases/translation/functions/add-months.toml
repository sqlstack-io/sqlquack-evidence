category = "translation"
construct = "sf.functions.add-months"
session_profile = "utc-v1"

[[case]]
id = "t001_date"
description = "Positive and negative month counts. Catches: months added as 30 days, or arguments swapped"
columns = [{ name = "d", type = "DATE" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'2024-01-15'", "13"],
  ["'2024-05-15'", "-17"],
]
query = "SELECT ADD_MONTHS(d, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_timestamp"
description = "A timestamp keeps its time and type. Catches: a DATE returned, or the time dropped"
columns = [{ name = "t", type = "TIMESTAMP_NTZ" }]
rows = [
  ["'2024-01-31 13:45:00.5'"],
]
query = "SELECT ADD_MONTHS(t, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_timestamp_tz"
description = "A TIMESTAMP_TZ keeps its offset. Catches: the month end of the UTC instant (2024-02-29 04:00Z instead of 2024-03-01 04:00Z), or the offset dropped (the wall column shows the offset, which the instant comparison ignores)"
columns = [{ name = "t", type = "TIMESTAMP_TZ" }]
rows = [
  ["'2024-01-30 20:00:00 -0800'"],
]
query = "SELECT ADD_MONTHS(t, 1) AS r, CAST(ADD_MONTHS(t, 1) AS TIMESTAMP_NTZ) AS wall FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_date_or_timestamp_expr"
description = "NULL date. Catches: NULL read as a default date"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["NULL"],
  ["'2024-01-01'"],
]
query = "SELECT ADD_MONTHS(d, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_num_months_expr"
description = "NULL count. Catches: NULL read as 0"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["0"],
]
query = "SELECT ADD_MONTHS('2024-01-01'::DATE, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_month_end"
description = "Last-day-of-month inputs, which stay at the month end. Catches: DATEADD semantics (2023-03-28 from 2023-02-28 instead of 2023-03-31)"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["'2023-02-28'"],
  ["'2024-02-29'"],
  ["'2024-04-30'"],
  ["'2024-01-30'"],
]
query = "SELECT ADD_MONTHS(d, 1) AS p1, ADD_MONTHS(d, 12) AS p12 FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t007_fractional"
description = "Fractional counts, which the page says round to the nearest integer. Catches: truncation (1 month for 1.6) or half-to-even (2 for 2.5 instead of 3)"
columns = [{ name = "n", type = "NUMBER(10,2)" }]
rows = [
  ["1.60"],
  ["2.50"],
  ["-1.50"],
]
query = "SELECT ADD_MONTHS('2024-01-15'::DATE, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t008_negative_and_day_31"
description = "Negative counts from month ends and day 31 into shorter months, across a year. Catches: the month end lost going backwards, or day 31 overflowing into the next month"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["'2024-03-31'"],
  ["'2024-01-31'"],
  ["'2024-05-31'"],
  ["'2023-01-29'"],
  ["'2024-12-15'"],
]
query = "SELECT ADD_MONTHS(d, -1) AS m1, ADD_MONTHS(d, 1) AS p1, ADD_MONTHS(d, -13) AS m13 FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]
