category = "translation"
construct = "sf.functions.minhash-combine.minhash-combine"
session_profile = "utc-v1"

[[case]]
id = "t001_merge"
description = "The states of {1, 2} and {7} merged, against the state of {1, 2, 7}. Catches: only the first state kept (below 1.0)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS r FROM (SELECT MINHASH_COMBINE(m) AS m FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g IN ('p', 'r') UNION ALL SELECT MINHASH(100, a) FROM input WHERE g IN ('p', 'r'))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_distinct"
description = "DISTINCT, which has no effect, over states that include a duplicate (p and q hold equal sets). Catches: DISTINCT rejected"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS r FROM (SELECT MINHASH_COMBINE(DISTINCT m) AS m FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g IN ('p', 'q', 'r') UNION ALL SELECT MINHASH(100, a) FROM input WHERE g IN ('p', 'q', 'r'))"
order = "ordered"
tags = ["duplicates"]

[[case]]
id = "t003_null_state"
description = "A NULL state beside states. Catches: the result NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS r FROM (SELECT MINHASH_COMBINE(m) AS m FROM (SELECT m FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g IN ('p', 'r') UNION ALL SELECT NULL) UNION ALL SELECT MINHASH(100, a) FROM input WHERE g IN ('p', 'r'))"
order = "ordered"
tags = ["null"]
