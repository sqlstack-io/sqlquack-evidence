category = "translation"
construct = "sf.functions.to-double"
session_profile = "utc-v1"

[[case]]
id = "t001_strings"
description = "Scientific notation and the special values the page accepts. Catches: the special values rejected"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'1.5e2'"],
  ["'-inf'"],
  ["'Infinity'"],
  ["'nan'"],
]
query = "SELECT TO_DOUBLE(v) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_variant"
description = "A VARIANT holding true, a string and a JSON null. Catches: an error for the boolean, or the JSON null as 0"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'true'"],
  ["'\"2.5\"'"],
  ["'null'"],
]
query = "SELECT TO_DOUBLE(PARSE_JSON(v)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_invalid"
description = "Text that is not a number. Catches: NULL or 0 returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'abc'"],
]
query = "SELECT TO_DOUBLE(v) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null_expr"
description = "A NULL, which the page says gives NULL. Catches: zero returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT TO_DOUBLE(v) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
