category = "translation"
construct = "sf.functions.approx-percentile-accumulate"
session_profile = "utc-v1"

[[case]]
id = "t001_state"
description = "A state per group, read at the median. Catches: the whole input's state"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "4"],
  ["'p'", "9"],
  ["'p'", "3"],
  ["'p'", "5"],
  ["'p'", "7"],
]
query = "SELECT g, APPROX_PERCENTILE_ESTIMATE(APPROX_PERCENTILE_ACCUMULATE(x), 0.5) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_expr"
description = "NULL values, which are ignored. Catches: NULL counted"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
  ["5"],
  ["NULL"],
]
query = "SELECT APPROX_PERCENTILE_ESTIMATE(APPROX_PERCENTILE_ACCUMULATE(x), 0.5) AS r FROM input"
order = "ordered"
tags = ["null"]
