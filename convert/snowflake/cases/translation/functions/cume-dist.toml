category = "translation"
construct = "sf.functions.cume-dist"
session_profile = "utc-v1"

[[case]]
id = "t001_ties"
description = "A tie and a one-row partition. Catches: ties counted one at a time (0.4 instead of 0.6), or PERCENT_RANK computed"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, CUME_DIST() OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_frame"
compile_error = true
description = "An explicit window frame, which the page says CUME_DIST does not support. Catches: the frame accepted and ignored"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, CUME_DIST() OVER (PARTITION BY p ORDER BY o ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t003_null_order_expr"
description = "NULL order keys sorted first; tied NULLs share one cumulative share. Catches: NULLs sorted last, or counted one at a time"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "NULL"],
  ["'a'", "2"],
  ["'a'", "NULL"],
  ["'a'", "1"],
]
query = "SELECT ordinal, CUME_DIST() OVER (PARTITION BY p ORDER BY o NULLS FIRST) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
