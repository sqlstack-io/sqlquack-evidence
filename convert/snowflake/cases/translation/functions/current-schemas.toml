category = "translation"
construct = "sf.functions.current-schemas"
session_profile = "utc-v1"

[[case]]
id = "t001_array"
description = "The type, and whether the text parses as a JSON array. Catches: an ARRAY returned, or a single schema name"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT TYPEOF(CURRENT_SCHEMAS()::VARIANT) AS t, IS_ARRAY(PARSE_JSON(CURRENT_SCHEMAS())) AS arr FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_none"
description = "The function takes no argument; a NULL value compared with its result gives NULL. Catches: FALSE returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'x'"],
]
query = "SELECT ordinal, v = CURRENT_SCHEMAS() AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
