[[case]]
id = "t010_anchor_after_start_position"
description = "A ^ anchor with a start position of 2: shows whether ^ anchors at the start position or at the start of the text."
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [["'a1b2'", "2"]]
query = "SELECT REGEXP_SUBSTR(a, '^[0-9]', n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination", "boundary"]
