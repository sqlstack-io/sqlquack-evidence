category = "translation"
construct = "sf.functions.regexp-substr"
session_profile = "utc-v1"

[[case]]
id = "t001_position_zero"
description = "REGEXP_SUBSTR with position 0 and occurrence 1 taken from columns, outside the recorded range. One row per case, since it may raise."
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [["'a1b2c3d4'", "0", "1"]]
query = "SELECT REGEXP_SUBSTR(a, '[0-9]', n, o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination", "boundary"]

