category = "translation"
construct = "sf.functions.current-schema"
session_profile = "utc-v1"

[[case]]
id = "t001_type"
description = "The type of the name, and whether it is set, in a session with no schema in use: the recording returned NULL (type NULL, not set). Catches: a schema name returned when none is in use"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT TYPEOF(CURRENT_SCHEMA()::VARIANT) AS t, CURRENT_SCHEMA() IS NOT NULL AS is_set FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_none"
description = "The function takes no argument; a NULL value compared with its result gives NULL. Catches: FALSE returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'x'"],
]
query = "SELECT ordinal, v = CURRENT_SCHEMA() AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
