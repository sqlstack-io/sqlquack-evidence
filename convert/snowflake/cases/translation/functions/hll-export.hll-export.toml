category = "translation"
construct = "sf.functions.hll-export.hll-export"
session_profile = "utc-v1"

[[case]]
id = "t001_round_trip"
description = "A state exported to an OBJECT and imported back, as on the page. Catches: a different cardinality after the round trip"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT g, HLL_ESTIMATE(HLL_IMPORT(HLL_EXPORT(st))) AS r FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g) ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_object"
description = "The exported OBJECT's keys. Catches: another export layout"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT g, ARRAY_SORT(OBJECT_KEYS(HLL_EXPORT(st))) AS r FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g) ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_binary_expr"
description = "NULL input. Catches: an empty state instead of NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT HLL_EXPORT(NULL) AS r"
order = "ordered"
tags = ["null"]
