category = "translation"
construct = "sf.functions.localtimestamp.localtimestamp.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_type"
description = "The type, which the page says is TIMESTAMP_LTZ whatever TIMESTAMP_TYPE_MAPPING says (NTZ here), and agreement with SYSDATE in the UTC session to within a minute. Catches: TIMESTAMP_NTZ returned under the type mapping, or the time taken in another zone"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT TYPEOF(LOCALTIMESTAMP::VARIANT) AS t, ABS(DATEDIFF(second, LOCALTIMESTAMP::TIMESTAMP_NTZ, SYSDATE())) < 60 AS close FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_none"
description = "The function takes no argument; a NULL value compared with its result gives NULL. Catches: the comparison with NULL returning FALSE, or the NULL replaced by the current value"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["NULL"],
  ["'2026-01-01'"],
]
query = "SELECT ordinal, d::TIMESTAMP_NTZ < LOCALTIMESTAMP AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
