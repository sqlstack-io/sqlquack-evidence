category = "translation"
construct = "sf.functions.bitmap-to-array"
session_profile = "utc-v1"

[[case]]
id = "t001_positions"
description = "Set positions of bitmaps built from rows in descending order within a bucket. Catches: relative zero-based positions instead of bucket-1 absolute positions, or the reverse, or positions in input order"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "5"],
  ["'q'", "5"],
  ["'p'", "1"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT g, bk, BITMAP_TO_ARRAY(bm) AS r FROM (SELECT g, BITMAP_BUCKET_NUMBER(x) AS bk, BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x)) AS bm FROM input GROUP BY g, bk) ORDER BY g, bk"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_bucket"
description = "The same bitmaps with their bucket number: absolute positions. Catches: the bucket argument ignored"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "5"],
  ["'p'", "5"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT g, bk, BITMAP_TO_ARRAY(bm, bk) AS r FROM (SELECT g, BITMAP_BUCKET_NUMBER(x) AS bk, BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x)) AS bm FROM input GROUP BY g, bk) ORDER BY g, bk"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_bitmap"
description = "NULL bitmap. Catches: an empty array instead of NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "5"],
  ["'p'", "5"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT BITMAP_TO_ARRAY(NULL::BINARY) AS r"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_bucket_number"
description = "NULL bucket. Catches: the default bucket used instead of NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "5"],
  ["'p'", "5"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT BITMAP_TO_ARRAY(bm, NULL) AS r FROM (SELECT g, BITMAP_BUCKET_NUMBER(x) AS bk, BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x)) AS bm FROM input GROUP BY g, bk) WHERE g = 'q'"
order = "ordered"
tags = ["null"]
