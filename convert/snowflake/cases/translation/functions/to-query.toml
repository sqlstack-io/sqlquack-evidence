category = "translation"
construct = "sf.functions.to-query"
session_profile = "utc-v1"

[[case]]
id = "t001_query"
description = "A query text with two columns, read back from the FROM clause. Catches: the text returned as a string"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT a, b FROM TABLE(TO_QUERY('SELECT 1 AS a, ''x'' AS b'))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_bind"
description = "A bind variable converted with TO_NUMBER, as in the page example. Catches: the bind variable left unsubstituted"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT a FROM TABLE(TO_QUERY('SELECT TO_NUMBER(:n) + 1 AS a', n => '41'))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_arg"
compile_error = true
description = "A NULL bind argument typed as VARCHAR. The page says \"If any argument is NULL, the function returns NULL without reporting any error\", but Snowflake refuses the NULL bind when compiling (1015, the argument needs to be constant), as it refused a bare NULL (1045). Catches: the NULL bind accepted, or an empty result set returned"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT COUNT(*) AS n FROM TABLE(TO_QUERY('SELECT TO_NUMBER(:n) AS a', n => NULL::VARCHAR))"
order = "ordered"
tags = ["null", "error"]
