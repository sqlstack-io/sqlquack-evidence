category = "translation"
construct = "sf.functions.st-interpolate"
session_profile = "utc-v1"

[[case]]
id = "t001_tolerance"
description = "A line string along latitude 60, whose great-circle edge is far from its Mercator line: points are added, more with the default 10 m than with 10 km, and the ends are kept. Catches: no points added, or the tolerance ignored"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'LINESTRING(0 60,90 60)'"],
]
query = "SELECT ST_NPOINTS(ST_INTERPOLATE(TO_GEOGRAPHY(v))) > 2 AS added, ST_NPOINTS(ST_INTERPOLATE(TO_GEOGRAPHY(v))) > ST_NPOINTS(ST_INTERPOLATE(TO_GEOGRAPHY(v), 10000)) AS finer, ST_X(ST_ENDPOINT(ST_INTERPOLATE(TO_GEOGRAPHY(v)))) AS x1 FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_geography_expression"
description = "A NULL shape; the page does not say; the recording decides. Catches: an error, or a value returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_INTERPOLATE(TO_GEOGRAPHY(v)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
