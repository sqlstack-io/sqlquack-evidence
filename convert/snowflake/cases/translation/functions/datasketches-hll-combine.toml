category = "translation"
construct = "sf.functions.datasketches-hll-combine"
session_profile = "utc-v1"

[[case]]
id = "t001_text_vs_number"
description = "Sketches of the same numbers as NUMBER and as text: the page says they hash differently, so the union counts 4. Catches: values hashed by their text (2)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["2"],
]
query = "SELECT DATASKETCHES_HLL_ESTIMATE(DATASKETCHES_HLL_COMBINE(st)) AS r FROM (SELECT DATASKETCHES_HLL_ACCUMULATE(x) AS st FROM input UNION ALL SELECT DATASKETCHES_HLL_ACCUMULATE(x::VARCHAR) FROM input)"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_union"
description = "Sketches for overlapping groups: the union. Catches: the estimates summed"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
  ["'q'", "9"],
  ["'p'", "4"],
]
query = "SELECT DATASKETCHES_HLL_ESTIMATE(DATASKETCHES_HLL_COMBINE(st)) AS r FROM (SELECT g, DATASKETCHES_HLL_ACCUMULATE(x) AS st FROM input GROUP BY g)"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_max_log_k"
description = "An explicit max_log_k. Catches: the argument rejected"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
  ["'q'", "9"],
  ["'p'", "4"],
]
query = "SELECT DATASKETCHES_HLL_ESTIMATE(DATASKETCHES_HLL_COMBINE(st, 8)) AS r FROM (SELECT g, DATASKETCHES_HLL_ACCUMULATE(x) AS st FROM input GROUP BY g)"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_state"
description = "A NULL sketch beside sketches. Catches: the result NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
  ["'q'", "9"],
  ["'p'", "4"],
]
query = "SELECT DATASKETCHES_HLL_ESTIMATE(DATASKETCHES_HLL_COMBINE(st)) AS r FROM (SELECT st FROM (SELECT g, DATASKETCHES_HLL_ACCUMULATE(x) AS st FROM input GROUP BY g) UNION ALL SELECT NULL)"
order = "ordered"
tags = ["null"]
