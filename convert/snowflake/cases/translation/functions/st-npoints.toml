category = "translation"
construct = "sf.functions.st-npoints"
session_profile = "utc-v1"

[[case]]
id = "t001_types"
description = "A point, a 3-point line string and a triangle. Catches: the closing point of the loop left out (3)"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POINT(10 20)'"],
  ["'LINESTRING(0 0,1 2,3 4)'"],
  ["'POLYGON((0 0,4 0,1 3,0 0))'"],
]
query = "SELECT ordinal, ST_NPOINTS(TO_GEOGRAPHY(v)) AS g, ST_NPOINTS(TO_GEOMETRY(v)) AS m FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_geography_or_geometry_expression"
description = "A NULL shape; the page does not say; the recording decides. Catches: an error, or a value returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_NPOINTS(TO_GEOGRAPHY(v)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
