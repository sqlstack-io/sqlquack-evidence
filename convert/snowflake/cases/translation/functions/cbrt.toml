category = "translation"
construct = "sf.functions.cbrt"
session_profile = "utc-v1"

[[case]]
id = "t001_float"
description = "CBRT of FLOAT values. Catches: SQRT computed, or POW(x, 1/3) giving NaN for negatives"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["27"],
  ["2"],
  ["0.125"],
  ["-27"],
]
query = "SELECT CBRT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_fixed"
description = "CBRT of NUMBER(12,4), converted to FLOAT. Catches: SQRT computed, or POW(x, 1/3) giving NaN for negatives; or the result left fixed-point"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["8.0000"],
  ["-27.0000"],
]
query = "SELECT CBRT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_decfloat"
description = "CBRT of DECFLOAT, which returns DECFLOAT. The result is cast to VARCHAR because the recorder cannot decode a DECFLOAT column. Catches: a DECFLOAT argument computed and returned as FLOAT"
columns = [{ name = "x", type = "DECFLOAT" }]
rows = [
  ["27"],
  ["-8"],
  ["2"],
]
query = "SELECT CAST(CBRT(x) AS VARCHAR) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null"
description = "CBRT of NULL. Catches: NULL turned into 0 or NaN"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["NULL"],
]
query = "SELECT CBRT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_neg"
description = "Cube roots of negatives are negative. Catches: NaN from a fractional power of a negative"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["-8"],
  ["-0.001"],
]
query = "SELECT CBRT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
