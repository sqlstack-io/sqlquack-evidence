category = "translation"
construct = "sf.functions.uniform"
session_profile = "utc-v1"

[[case]]
id = "t001_integers"
description = "Integer bounds over 1000 rows: the range, every value reached, and integral results. Catches: the upper bound excluded, or a fraction returned"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MIN(u) AS lo, MAX(u) AS hi, COUNT(DISTINCT u) AS n, COUNT_IF(u <> ROUND(u)) AS fractions FROM (SELECT UNIFORM(1, 6, RANDOM()) AS u FROM TABLE(GENERATOR(ROWCOUNT => 1000)))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_float"
description = "A floating-point bound over 1000 rows. Catches: integers returned"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MIN(u) >= 0 AND MAX(u) <= 1 AS in_range, COUNT_IF(u <> ROUND(u)) > 900 AS fractional FROM (SELECT UNIFORM(0::FLOAT, 1::FLOAT, RANDOM()) AS u FROM TABLE(GENERATOR(ROWCOUNT => 1000)))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_constant_gen"
description = "A constant generator, which gives the same value on every row. Catches: a fresh value per row"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT COUNT(DISTINCT UNIFORM(1, 1000, 7)) AS n FROM TABLE(GENERATOR(ROWCOUNT => 1000))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_gen"
description = "A NULL generator; the page does not say; the recording decides. Catches: a value in range where Snowflake returns NULL, or the reverse"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT UNIFORM(1, 6, NULL) AS r FROM input"
order = "ordered"
tags = ["null"]
