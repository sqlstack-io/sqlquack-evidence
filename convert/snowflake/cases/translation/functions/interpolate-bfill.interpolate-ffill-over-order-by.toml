category = "translation"
construct = "sf.functions.interpolate-bfill.interpolate-ffill-over-order-by"
session_profile = "utc-v1"

[[case]]
id = "t001_gaps"
description = "NULLs inside and at both ends of a partition. Catches: the next value used (BFILL), or values carried across partitions"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1", "NULL"],
  ["'a'", "2", "10"],
  ["'a'", "4", "NULL"],
  ["'a'", "5", "40"],
  ["'a'", "7", "NULL"],
  ["'b'", "1", "7"],
  ["'b'", "3", "9"],
]
query = "SELECT ordinal, INTERPOLATE_FFILL(x) OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_text"
description = "A text column, which these functions accept. Catches: an error for a non-numeric column"
columns = [{ name = "o", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["1", "'a'"],
  ["2", "NULL"],
  ["3", "'c'"],
]
query = "SELECT ordinal, INTERPOLATE_FFILL(v) OVER (ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_frame"
compile_error = true
description = "An explicit window frame, which the page says is not allowed. Catches: the frame accepted"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1", "NULL"],
  ["'a'", "2", "10"],
  ["'a'", "4", "NULL"],
  ["'a'", "5", "40"],
  ["'a'", "7", "NULL"],
  ["'b'", "1", "7"],
  ["'b'", "3", "9"],
]
query = "SELECT ordinal, INTERPOLATE_FFILL(x) OVER (PARTITION BY p ORDER BY o ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null_expr"
description = "A partition whose values are all NULL, which stay NULL. Catches: values taken from another partition"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'c'", "1", "NULL"],
  ["'c'", "2", "NULL"],
  ["'a'", "1", "4"],
]
query = "SELECT ordinal, INTERPOLATE_FFILL(x) OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
