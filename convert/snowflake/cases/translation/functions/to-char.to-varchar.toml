category = "translation"
construct = "sf.functions.to-char.to-varchar"
session_profile = "utc-v1"

[[case]]
id = "t001_number_format"
description = "Numbers with a group separator and two fixed decimals, including a negative and a value that rounds. Catches: the format ignored, or the third decimal truncated"
columns = [{ name = "x", type = "NUMBER(10,3)" }]
rows = [
  ["1234.567"],
  ["-5.005"],
]
query = "SELECT TO_VARCHAR(x, '9,999.99') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_date_format"
description = "A date with a month-name format, and without a format (the session DATE_OUTPUT_FORMAT). Catches: the format ignored, or a numeric month"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["'2024-02-29'"],
]
query = "SELECT TO_VARCHAR(d, 'DD-MON-YYYY') AS fmt, TO_VARCHAR(d) AS dflt FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_binary_format"
description = "Bytes written as BASE64 and as HEX. Catches: the format ignored (HEX for both)"
columns = [{ name = "b", type = "BINARY" }]
rows = [
  ["'4A4B'"],
]
query = "SELECT TO_VARCHAR(b, 'BASE64') AS b64, TO_VARCHAR(b, 'HEX') AS hex FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_variant"
description = "A VARIANT string, which the page keeps as is, and a JSON null, which becomes the text null. Catches: the string written with JSON quotes, or the JSON null returned as SQL NULL"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'\"a b\"'"],
  ["'null'"],
]
query = "SELECT TO_VARCHAR(PARSE_JSON(v)) AS r, TO_VARCHAR(PARSE_JSON(v)) IS NULL AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_expr"
description = "A NULL value. Catches: the text null returned"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT TO_VARCHAR(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
