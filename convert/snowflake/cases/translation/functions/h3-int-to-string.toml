category = "translation"
construct = "sf.functions.h3-int-to-string"
session_profile = "utc-v1"

[[case]]
id = "t001_integer"
description = "Cells at resolutions 9 and 0. Catches: the decimal digits returned, or leading digits dropped"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["617700169957507071"],
  ["576636674163867647"],
]
query = "SELECT ordinal, H3_INT_TO_STRING(c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_cell_id"
description = "A NULL ID; the page does not say; the recording decides. Catches: an error, or an empty string returned"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT H3_INT_TO_STRING(c) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
