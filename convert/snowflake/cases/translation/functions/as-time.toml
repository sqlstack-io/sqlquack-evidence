category = "translation"
construct = "sf.functions.as-time"
session_profile = "utc-v1"

[[case]]
id = "t001_match"
description = "A TIME with milliseconds cast to VARIANT. Catches: the fraction dropped, or a 12-hour clock"
columns = [{ name = "t", type = "TIME" }]
rows = [
  ["'13:14:15.123'"],
  ["'00:00:00'"],
]
query = "SELECT TO_VARCHAR(AS_TIME(t::VARIANT), 'HH24:MI:SS.FF9') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_mismatch"
description = "A string holding a time and a number of seconds. Catches: time text parsed, or a number read as seconds since midnight"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'\"13:14:15\"'"],
  ["'47655'"],
]
query = "SELECT TO_VARCHAR(AS_TIME(PARSE_JSON(a)), 'HH24:MI:SS.FF9') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_variant_expr"
description = "A SQL NULL and a JSON null; the page returns NULL for a NULL argument and for a type that does not match. Catches: the JSON null passed through as a value, or an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'null'"],
]
query = "SELECT TO_VARCHAR(AS_TIME(PARSE_JSON(a)), 'HH24:MI:SS.FF9') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
