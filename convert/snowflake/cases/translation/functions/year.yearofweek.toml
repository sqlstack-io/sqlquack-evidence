category = "translation"
construct = "sf.functions.year.yearofweek"
session_profile = "utc-v1"

[[case]]
id = "t001_date"
description = "YEAROFWEEK of dates at year, ISO-week and leap boundaries. Catches: the calendar year (2024) for 2024-12-30, which belongs to week 1 of 2025"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["'2024-12-30'"],
  ["'2021-01-01'"],
  ["'2023-01-01'"],
  ["'2024-02-29'"],
  ["'2026-12-31'"],
]
query = "SELECT YEAROFWEEK(d) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_timestamp_ntz"
description = "YEAROFWEEK of a timestamp just before midnight on Sunday 29 December 2024, the last day of ISO week 52. Catches: the timestamp rounded to the next day"
columns = [{ name = "t", type = "TIMESTAMP_NTZ" }]
rows = [
  ["'2024-12-29 23:59:59.999'"],
  ["'2024-03-01 00:00:00'"],
]
query = "SELECT YEAROFWEEK(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_timestamp_tz"
description = "YEAROFWEEK of a TIMESTAMP_TZ whose UTC instant is in the next ISO week-year. Catches: the part taken from the UTC instant instead of the wall clock"
columns = [{ name = "t", type = "TIMESTAMP_TZ" }]
rows = [
  ["'2024-12-29 23:30:00.250 -0800'"],
]
query = "SELECT YEAROFWEEK(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_date_or_timestamp_expr"
description = "NULL next to a set date. Catches: NULL read as a default date (1970-01-01)"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["NULL"],
  ["'2024-06-15'"],
]
query = "SELECT YEAROFWEEK(d) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_leap"
description = "Days around 29 February in a leap and a common year. Catches: leap dates rejected; YEAROFWEEK itself is unchanged by them (t001 covers the ISO year edges)"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["'2024-02-29'"],
  ["'2024-03-01'"],
  ["'2023-03-01'"],
  ["'2000-12-31'"],
  ["'1900-03-01'"],
]
query = "SELECT YEAROFWEEK(d) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
