category = "translation"
construct = "sf.functions.generator.generator"
session_profile = "utc-v1"

[[case]]
id = "t001_no_arguments"
description = "GENERATOR() with no arguments, which the page says gives 0 rows. Catches: an error, or one row"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT COUNT(*) AS n FROM TABLE(GENERATOR())"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_timelimit"
description = "TIMELIMIT 1, which generates some rows; only their existence is measured. Catches: TIMELIMIT ignored (0 rows)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT COUNT(*) > 0 AS has_rows FROM TABLE(GENERATOR(TIMELIMIT => 1))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_sec"
description = "A NULL TIMELIMIT, which the page says is ignored, leaving no argument and 0 rows. Catches: an error"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT COUNT(*) AS n FROM TABLE(GENERATOR(TIMELIMIT => NULL))"
order = "ordered"
tags = ["null"]
