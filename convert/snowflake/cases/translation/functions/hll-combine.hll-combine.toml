category = "translation"
construct = "sf.functions.hll-combine.hll-combine"
session_profile = "utc-v1"

[[case]]
id = "t001_union"
description = "States for {1, 2} and {2, 3}: their union has 3 values. Catches: the estimates summed (4)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT HLL_ESTIMATE(HLL_COMBINE(st)) AS r FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g)"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_distinct"
description = "DISTINCT, which has no effect. Catches: DISTINCT rejected"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT HLL_ESTIMATE(HLL_COMBINE(DISTINCT st)) AS r FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g)"
order = "ordered"
tags = ["duplicates"]

[[case]]
id = "t003_null_state"
description = "A NULL state beside a state. Catches: the result NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT HLL_ESTIMATE(HLL_COMBINE(st)) AS r FROM (SELECT st FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g) UNION ALL SELECT NULL)"
order = "ordered"
tags = ["null"]
