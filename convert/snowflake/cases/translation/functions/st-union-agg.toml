category = "translation"
construct = "sf.functions.st-union-agg"
session_profile = "utc-v1"

[[case]]
id = "t001_rows"
description = "Bands over longitudes 0-2, 1-3 and 3-4, whose union is 4 times a 1-degree band (adding the areas would give 5). Catches: only the first or last row kept, or the overlap counted twice"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,2 0,2 2,0 2,0 0))'"],
  ["'POLYGON((1 0,3 0,3 2,1 2,1 0))'"],
  ["'POLYGON((3 0,4 0,4 2,3 2,3 0))'"],
]
query = "SELECT ROUND(ST_AREA(ST_UNION_AGG(TO_GEOGRAPHY(v))) / ST_AREA(TO_GEOGRAPHY('POLYGON((0 0,1 0,1 2,0 2,0 0))')), 2) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_geography_column"
description = "A NULL row next to a band; the page does not say; the recording decides. Catches: NULL returned for the whole column, or an error"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'POLYGON((0 0,1 0,1 2,0 2,0 0))'"],
]
query = "SELECT ROUND(ST_AREA(ST_UNION_AGG(TO_GEOGRAPHY(v))) / ST_AREA(TO_GEOGRAPHY('POLYGON((0 0,1 0,1 2,0 2,0 0))')), 2) AS r FROM input"
order = "ordered"
tags = ["null"]
