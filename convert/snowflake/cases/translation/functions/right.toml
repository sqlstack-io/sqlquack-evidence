category = "translation"
construct = "sf.functions.right"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "RIGHT of multi-byte text. Catches: a byte count (cutting \u00e9 in half) or the other end of the string"
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'h\u00e9llo'", "4"],
  ["'abcdef'", "3"],
  ["'ab'", "9"],
]
query = "SELECT RIGHT(a, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_binary"
description = "RIGHT of binary. Catches: hex characters counted instead of bytes"
columns = [{ name = "a", type = "BINARY" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'00FF10'", "2"],
]
query = "SELECT RIGHT(a, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_string_expr"
description = "NULL string. Catches: NULL read as empty"
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "2"],
  ["'ab'", "1"],
]
query = "SELECT RIGHT(a, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_length_expr"
description = "NULL length. Catches: NULL read as 0 (an empty string instead of NULL)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'ab'", "NULL"],
  ["'ab'", "0"],
]
query = "SELECT RIGHT(a, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_negative"
description = "A negative length, which the page says gives an empty string. Catches: an error, or Postgres semantics (all but the last characters)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'abcdef'", "-2"],
  ["'abcdef'", "0"],
]
query = "SELECT RIGHT(a, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
