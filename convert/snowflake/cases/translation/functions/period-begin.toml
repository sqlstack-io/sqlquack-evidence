category = "translation"
construct = "sf.functions.period-begin"
session_profile = "utc-v1"

[[case]]
id = "t001_date"
description = "Periods built from dates, and a typed PERIOD literal. Catches: the other bound returned, or the end adjusted to be inclusive"
columns = [{ name = "b1", type = "DATE" }, { name = "e1", type = "DATE" }]
rows = [
  ["'2024-02-29'", "'2024-03-01'"],
]
query = "SELECT PERIOD_BEGIN(PERIOD_CONSTRUCT(b1, e1)) AS c, PERIOD_BEGIN(PERIOD(DATE) '[2024-01-01, 2024-12-31)') AS l FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_period"
description = "A NULL period, which the page says gives NULL. Catches: an error"
columns = [{ name = "b1", type = "DATE" }, { name = "e1", type = "DATE" }]
rows = [
  ["NULL", "'2024-02-01'"],
  ["'2024-01-01'", "'2024-02-01'"],
]
query = "SELECT ordinal, PERIOD_BEGIN(PERIOD_CONSTRUCT(b1, e1)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
