category = "translation"
construct = "sf.functions.parse-url"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "A URL with every part, and one with none of the optional parts. Catches: parameters not split into an object, a port as a number, or missing keys set to empty strings instead of NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'https://user@ex.com:8080/a/b.html?x=1&y=2#frag'"],
  ["'HTTP://Ex.com'"],
  ["'ftp://h/p?q'"],
]
query = "SELECT PARSE_URL(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_permissive"
description = "An unparseable URL with permissive 1. Catches: an error instead of an error object"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'://bad'"],
]
query = "SELECT PARSE_URL(a, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["type-combination"]

[[case]]
id = "t003_null_string"
description = "NULL URL. Catches: an error object instead of NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'http://h'"],
]
query = "SELECT PARSE_URL(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_permissive"
description = "NULL permissive flag. Catches: NULL read as 0"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'http://h'"],
]
query = "SELECT PARSE_URL(a, NULL) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_strict"
description = "An unparseable URL with permissive 0. Catches: an error object or NULL instead of an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'://bad'"],
]
query = "SELECT PARSE_URL(a, 0) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
