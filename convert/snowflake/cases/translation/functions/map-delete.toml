category = "translation"
construct = "sf.functions.map-delete"
session_profile = "utc-v1"

[[case]]
id = "t001_keys"
description = "One key present and one absent. Catches: an error for the absent key, or nothing removed"
columns = [{ name = "k", type = "VARCHAR" }]
rows = [
  ["'z'"],
]
query = "SELECT MAP_DELETE(MAP_CONSTRUCT('a', 1, 'b', 2), 'a', k)::VARIANT AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_all"
description = "Every key removed. Catches: NULL instead of an empty map"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MAP_SIZE(MAP_DELETE(MAP_CONSTRUCT('a', 1, 'b', 2), 'a', 'b')) AS n FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_map"
description = "A NULL map with a valid key, and a valid map with a NULL key; the page does not say; the recording decides. Catches: an error, or the NULL map read as an empty map"
columns = [{ name = "x", type = "NUMBER(38,0)" }, { name = "k", type = "VARCHAR" }]
rows = [
  ["NULL", "'a'"],
  ["1", "NULL"],
]
query = "SELECT MAP_DELETE(IFF(x IS NULL, NULL, MAP_CONSTRUCT('a', 1, 'b', 2)), k)::VARIANT AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
