category = "translation"
construct = "sf.functions.array-slice"
session_profile = "utc-v1"

[[case]]
id = "t001_half_open"
description = "A slice inside the array. Catches: the to position included, or 1-based positions"
columns = [{ name = "a", type = "VARCHAR" }, { name = "f", type = "NUMBER(38,0)" }, { name = "t", type = "NUMBER(38,0)" }]
rows = [
  ["'[0,1,2,3,4]'", "1", "3"],
]
query = "SELECT ARRAY_SLICE(PARSE_JSON(a), f, t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_negative_positions"
description = "Negative positions counted from the end. Catches: negative positions read as 0"
columns = [{ name = "a", type = "VARCHAR" }, { name = "f", type = "NUMBER(38,0)" }, { name = "t", type = "NUMBER(38,0)" }]
rows = [
  ["'[0,1,2,3,4]'", "-2", "5"],
  ["'[0,1,2,3,4]'", "0", "-1"],
]
query = "SELECT ARRAY_SLICE(PARSE_JSON(a), f, t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t003_beyond_ends"
description = "Both positions beyond the upper end, both beyond the lower end, and from after to. Catches: an error, or the positions clamped to give the last or first element"
columns = [{ name = "a", type = "VARCHAR" }, { name = "f", type = "NUMBER(38,0)" }, { name = "t", type = "NUMBER(38,0)" }]
rows = [
  ["'[0,1,2]'", "5", "8"],
  ["'[0,1,2]'", "-9", "-8"],
  ["'[0,1,2]'", "2", "1"],
]
query = "SELECT ARRAY_SLICE(PARSE_JSON(a), f, t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t004_null_from"
description = "NULL in each argument. Catches: a NULL position read as 0 or as the end"
columns = [{ name = "a", type = "VARCHAR" }, { name = "f", type = "NUMBER(38,0)" }, { name = "t", type = "NUMBER(38,0)" }]
rows = [
  ["'[0,1]'", "NULL", "1"],
  ["'[0,1]'", "0", "NULL"],
  ["NULL", "0", "1"],
]
query = "SELECT ARRAY_SLICE(PARSE_JSON(a), f, t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
