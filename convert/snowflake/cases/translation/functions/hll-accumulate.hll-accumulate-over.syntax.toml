category = "translation"
construct = "sf.functions.hll-accumulate.hll-accumulate-over.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_star"
description = "Distinct whole rows per partition. Catches: rows counted instead of distinct rows (p 4 instead of 3)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'p'", "1", "'y'"],
  ["'p'", "2", "'x'"],
  ["'p'", "1", "'x'"],
  ["'q'", "1", "'x'"],
]
query = "SELECT g, a, b, HLL_ESTIMATE(HLL_ACCUMULATE(*) OVER (PARTITION BY g)) AS r FROM (SELECT g, a, b FROM input) ORDER BY g, a, b"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_expr1"
description = "A partition key outside the * columns, NULL for the two x rows, so the NULL-keyed rows form one partition of two distinct rows. Catches: NULL-keyed rows each in their own partition (1 instead of 2) or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'p'", "2", "'x'"],
  ["'p'", "1", "'y'"],
]
query = "SELECT a, b, HLL_ESTIMATE(HLL_ACCUMULATE(*) OVER (PARTITION BY NULLIF(b, 'x'))) AS r FROM (SELECT a, b FROM input) ORDER BY a, b"
order = "ordered"
tags = ["null"]
