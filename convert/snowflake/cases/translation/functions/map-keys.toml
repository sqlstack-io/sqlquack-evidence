category = "translation"
construct = "sf.functions.map-keys"
session_profile = "utc-v1"

[[case]]
id = "t001_keys"
description = "Keys of a three-entry map, sorted for comparison. Catches: values returned instead of keys, or a key missing"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["3"],
]
query = "SELECT ARRAY_SORT(MAP_KEYS(MAP_CONSTRUCT('b', 1, 'a', 2, 'c', x))::ARRAY) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_numeric"
description = "Numeric keys. Catches: keys returned as text"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["10"],
]
query = "SELECT ARRAY_SORT(MAP_KEYS(MAP_CONSTRUCT(x, 'a', 2, 'b'))::ARRAY) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_map"
description = "A NULL map; the page does not say; the recording decides. Catches: an empty array"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT MAP_KEYS(IFF(x IS NULL, NULL, MAP_CONSTRUCT('a', 1, 'b', 2))) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
