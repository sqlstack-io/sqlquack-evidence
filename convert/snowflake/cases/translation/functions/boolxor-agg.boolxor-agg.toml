category = "translation"
construct = "sf.functions.boolxor-agg.boolxor-agg"
session_profile = "utc-v1"

[[case]]
id = "t001_boolean"
description = "Groups with no, one, two and three TRUE values. Catches: parity (three TRUE values give TRUE) instead of exactly one"
columns = [{ name = "g", type = "VARCHAR" }, { name = "b", type = "BOOLEAN" }]
rows = [
  ["'a'", "FALSE"],
  ["'b'", "TRUE"],
  ["'c'", "TRUE"],
  ["'d'", "TRUE"],
  ["'b'", "FALSE"],
  ["'c'", "TRUE"],
  ["'d'", "TRUE"],
  ["'d'", "TRUE"],
  ["'a'", "FALSE"],
]
query = "SELECT g, BOOLXOR_AGG(b) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_number"
description = "Non-zero values, including a negative one, are TRUE. Catches: negative values read as FALSE, or numbers rejected"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "-2"],
  ["'p'", "0"],
  ["'q'", "-2"],
  ["'q'", "5"],
]
query = "SELECT g, BOOLXOR_AGG(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_decimal"
description = "A small non-zero decimal. Catches: the value rounded to 0 first (as the scalar BOOL functions do)"
columns = [{ name = "x", type = "NUMBER(10,1)" }]
rows = [
  ["0.2"],
  ["0"],
]
query = "SELECT BOOLXOR_AGG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr"
description = "NULL beside a single value of each kind, and a group of only NULL. Catches: NULL read as TRUE (two TRUE values give FALSE)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "b", type = "BOOLEAN" }]
rows = [
  ["'p'", "NULL"],
  ["'p'", "TRUE"],
  ["'q'", "NULL"],
  ["'r'", "NULL"],
  ["'r'", "FALSE"],
]
query = "SELECT g, BOOLXOR_AGG(b) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_empty_input"
description = "No rows. Catches: TRUE or FALSE instead of NULL"
columns = [{ name = "b", type = "BOOLEAN" }]
rows = [
  ["TRUE"],
]
query = "SELECT BOOLXOR_AGG(b) AS r FROM input WHERE b IS NULL"
order = "ordered"
tags = ["empty-input"]

[[case]]
id = "t006_float"
compile_error = true
description = "A FLOAT, which Snowflake refuses at compile although the page says numeric values convert. Catches: the FLOAT converted instead of the error"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0.2"],
  ["0"],
]
query = "SELECT BOOLXOR_AGG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]
