category = "translation"
construct = "sf.functions.bitmap-bucket-number"
session_profile = "utc-v1"

[[case]]
id = "t001_edges"
description = "Values at both sides of the 32,768 bucket edges, 0 and a negative value. Catches: zero-based buckets (32768 put in the second bucket) or another bucket size"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["32768"],
  ["32769"],
  ["65536"],
  ["0"],
  ["-1"],
  ["100000"],
]
query = "SELECT BITMAP_BUCKET_NUMBER(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_decimal"
description = "A value with a fraction, cast to NUMBER. Catches: truncation where the cast rounds"
columns = [{ name = "x", type = "NUMBER(10,1)" }]
rows = [
  ["32768.6"],
  ["1.4"],
]
query = "SELECT BITMAP_BUCKET_NUMBER(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_numeric_expr"
description = "NULL value. Catches: 0 or bucket 1 instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["5"],
]
query = "SELECT BITMAP_BUCKET_NUMBER(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
