category = "translation"
construct = "sf.functions.array-remove"
session_profile = "utc-v1"

[[case]]
id = "t001_every_copy"
description = "A value present twice, and a value removing every element. Catches: only the first copy removed, or NULL for the emptied array"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[1,2,1,3]'", "'1'"],
  ["'[4,4]'", "'4'"],
]
query = "SELECT ARRAY_REMOVE(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_number_vs_text"
description = "The number 1 removed from an array holding 1 and \"1\". Catches: the text \"1\" removed as well"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[\"1\",1]'", "'1'"],
]
query = "SELECT ARRAY_REMOVE(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_value_of_elements_to_remove"
description = "A NULL value to remove. Catches: the array returned unchanged instead of NULL"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[1,2]'", "NULL"],
]
query = "SELECT ARRAY_REMOVE(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
