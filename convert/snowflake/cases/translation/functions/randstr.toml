category = "translation"
construct = "sf.functions.randstr"
session_profile = "utc-v1"

[[case]]
id = "t001_pool"
description = "Strings of length 8 over 1000 rows: their lengths and characters. Catches: another length, or characters outside the pool"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT COUNT_IF(LENGTH(r) = 8 AND REGEXP_LIKE(r, '[0-9a-zA-Z]{8}')) AS ok, COUNT(DISTINCT r) > 990 AS varies FROM (SELECT RANDSTR(8, RANDOM()) AS r FROM TABLE(GENERATOR(ROWCOUNT => 1000)))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_constant_gen"
description = "A constant generator, which gives the same string on every row. Catches: a fresh string per row"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT COUNT(DISTINCT RANDSTR(5, 42)) AS n FROM TABLE(GENERATOR(ROWCOUNT => 1000))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_gen"
description = "A NULL generator; the page does not say; the recording decides. Catches: a string where Snowflake returns NULL, or the reverse"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT RANDSTR(5, NULL) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
