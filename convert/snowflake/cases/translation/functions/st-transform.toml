category = "translation"
construct = "sf.functions.st-transform"
session_profile = "utc-v1"

[[case]]
id = "t001_to_srid"
description = "Points 1 degree east and 1 degree north of (0 0) in SRID 4326 transformed to 3857, rounded to whole metres (111319 and 111325). Catches: the coordinates kept (only the SRID changed), or x and y swapped"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POINT(1 0)'"],
  ["'POINT(0 1)'"],
]
query = "SELECT ordinal, ROUND(ST_X(ST_TRANSFORM(TO_GEOMETRY(v, 4326), 3857))) AS x, ROUND(ST_Y(ST_TRANSFORM(TO_GEOMETRY(v, 4326), 3857))) AS y, ST_SRID(ST_TRANSFORM(TO_GEOMETRY(v, 4326), 3857)) AS srid FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_from_srid"
description = "A GEOMETRY without an SRID, with from_srid 4326 given. Catches: from_srid ignored"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POINT(1 0)'"],
]
query = "SELECT ROUND(ST_X(ST_TRANSFORM(TO_GEOMETRY(v), 4326, 3857))) AS x FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_invalid_srid"
description = "An SRID that cannot be resolved (999999), which the page says is an error. Catches: the coordinates returned unchanged"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POINT(1 0)'"],
]
query = "SELECT ST_ASWKT(ST_TRANSFORM(TO_GEOMETRY(v, 4326), 999999)) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null_to_srid"
description = "A NULL to_srid, which the page says gives NULL. Catches: an error"
columns = [{ name = "v", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }]
rows = [
  ["'POINT(1 0)'", "NULL"],
]
query = "SELECT ST_TRANSFORM(TO_GEOMETRY(v, 4326), k) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
