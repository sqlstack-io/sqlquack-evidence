category = "translation"
construct = "sf.functions.object-insert"
session_profile = "utc-v1"

[[case]]
id = "t001_insert"
description = "A new key, an update with updateFlag TRUE, and updateFlag TRUE on a new key. Catches: the update ignored, or the new key rejected under the flag"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1}'"],
]
query = "SELECT OBJECT_INSERT(PARSE_JSON(a), 'b', 2) AS ins, OBJECT_INSERT(PARSE_JSON(a), 'a', 9, TRUE) AS upd, OBJECT_INSERT(PARSE_JSON(a), 'c', 3, TRUE) AS added FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_json_null"
description = "A JSON null value, which the page inserts. Catches: the pair omitted like a SQL NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1}'"],
]
query = "SELECT OBJECT_INSERT(PARSE_JSON(a), 'b', PARSE_JSON('null')) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_value"
description = "A SQL NULL value and a SQL NULL key, whose pairs the page omits. Catches: the pair inserted with a null value (as MAP_INSERT does)"
columns = [{ name = "k", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "NULL"],
]
query = "SELECT OBJECT_INSERT(OBJECT_CONSTRUCT('a', 1), 'b', x) AS null_value, OBJECT_INSERT(OBJECT_CONSTRUCT('a', 1), k, 2) AS null_key FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_existing_key"
description = "An existing key without updateFlag, which the page says is an error. Catches: the value silently updated or kept"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1}'"],
]
query = "SELECT OBJECT_INSERT(PARSE_JSON(a), 'a', 2) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
