category = "translation"
construct = "sf.functions.object-pick"
session_profile = "utc-v1"

[[case]]
id = "t001_keys"
description = "Keys as arguments, one absent and one differing only in case. Catches: an error for the absent key, or a case-insensitive pick"
columns = [{ name = "a", type = "VARCHAR" }, { name = "k", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1,\"b\":2,\"c\":3}'", "'z'"],
  ["'{\"a\":1,\"b\":2,\"c\":3}'", "'A'"],
]
query = "SELECT OBJECT_PICK(PARSE_JSON(a), 'b', k) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_array"
description = "Keys as an ARRAY. Catches: the array read as one key"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[\"a\",\"c\"]'"],
]
query = "SELECT OBJECT_PICK(OBJECT_CONSTRUCT('a', 1, 'b', 2, 'c', 3), PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_object"
description = "A NULL object and a NULL key; the page does not say; the recording decides. Catches: an error"
columns = [{ name = "a", type = "VARCHAR" }, { name = "k", type = "VARCHAR" }]
rows = [
  ["NULL", "'a'"],
  ["'{\"a\":1}'", "NULL"],
]
query = "SELECT OBJECT_PICK(PARSE_JSON(a), k) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
