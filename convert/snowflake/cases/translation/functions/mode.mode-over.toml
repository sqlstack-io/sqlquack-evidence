category = "translation"
construct = "sf.functions.mode.mode-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Partitions of different sizes in mixed input order. Each partition has a single most frequent value (p 5, q 1), and so has the whole input (1). Catches: the whole input aggregated instead of the partition, or a running value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "2", "5"],
  ["'q'", "5", "3"],
  ["'p'", "1", "10"],
  ["'p'", "3", "5"],
  ["'q'", "1", "1"],
  ["'p'", "2", "1"],
  ["'q'", "3", "1"],
]
query = "SELECT MODE(x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_empty_over"
description = "An empty OVER clause. Each partition has a single most frequent value (p 5, q 1), and so has the whole input (1). Catches: a running (ordered) value instead of the whole input"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "2", "5"],
  ["'q'", "5", "3"],
  ["'p'", "1", "10"],
  ["'p'", "3", "5"],
  ["'q'", "1", "1"],
  ["'p'", "2", "1"],
  ["'q'", "3", "1"],
]
query = "SELECT MODE(x) OVER () AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr1"
description = "Partition p has NULL three times, 6 twice and 2 once; q has only NULL. Catches: NULL returned as the mode where it is most frequent"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1", "NULL"],
  ["'p'", "2", "6"],
  ["'q'", "1", "NULL"],
  ["'p'", "3", "2"],
  ["'p'", "4", "NULL"],
  ["'p'", "5", "NULL"],
  ["'p'", "6", "6"],
]
query = "SELECT MODE(x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_partition_key"
description = "NULL partition keys, which form one partition. Catches: NULL-keyed rows each in their own partition (2 for its row) or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1", "4"],
  ["'p'", "1", "9"],
  ["NULL", "2", "2"],
  ["NULL", "3", "4"],
]
query = "SELECT MODE(x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_expr1_majority"
description = "A partition where NULL is the most frequent value. Catches: NULL returned"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'p'", "NULL"],
  ["'p'", "4"],
]
query = "SELECT MODE(x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
