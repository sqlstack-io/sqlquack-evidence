category = "translation"
construct = "sf.functions.bitmap-count"
session_profile = "utc-v1"

[[case]]
id = "t001_count"
description = "Bitmaps per group and bucket. Catches: bytes counted instead of set bits"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "5"],
  ["'p'", "5"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT g, bk, BITMAP_COUNT(bm) AS r FROM (SELECT g, BITMAP_BUCKET_NUMBER(x) AS bk, BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x)) AS bm FROM input GROUP BY g, bk) ORDER BY g, bk"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_bitmap"
description = "NULL bitmap. Catches: 0 instead of NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "5"],
  ["'p'", "5"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT BITMAP_COUNT(NULL::BINARY) AS r"
order = "ordered"
tags = ["null"]
