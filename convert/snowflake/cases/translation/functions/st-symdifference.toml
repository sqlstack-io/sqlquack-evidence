category = "translation"
construct = "sf.functions.st-symdifference"
session_profile = "utc-v1"

[[case]]
id = "t001_overlap"
description = "Bands over longitudes 0-2 and 1-3: the symmetric difference has the area of the first (1.0). Catches: the one-sided difference returned (0.5), or the union (1.5)"
columns = [{ name = "v", type = "VARCHAR" }, { name = "w", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,2 0,2 2,0 2,0 0))'", "'POLYGON((1 0,3 0,3 2,1 2,1 0))'"],
]
query = "SELECT ROUND(ST_AREA(ST_SYMDIFFERENCE(TO_GEOGRAPHY(v), TO_GEOGRAPHY(w))) / ST_AREA(TO_GEOGRAPHY(v)), 2) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_equal"
description = "Equal bands, whose empty symmetric difference the page says is NULL. Catches: an empty collection returned instead of NULL"
columns = [{ name = "v", type = "VARCHAR" }, { name = "w", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,2 0,2 2,0 2,0 0))'", "'POLYGON((0 0,2 0,2 2,0 2,0 0))'"],
]
query = "SELECT ST_SYMDIFFERENCE(TO_GEOGRAPHY(v), TO_GEOGRAPHY(w)) IS NULL AS n FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_geography_expression_1"
description = "A NULL first shape; the page does not say; the recording decides. Catches: an error, or a value returned"
columns = [{ name = "v", type = "VARCHAR" }, { name = "w", type = "VARCHAR" }]
rows = [
  ["NULL", "'POINT(10 20)'"],
]
query = "SELECT ST_SYMDIFFERENCE(TO_GEOGRAPHY(v), TO_GEOGRAPHY(w)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
