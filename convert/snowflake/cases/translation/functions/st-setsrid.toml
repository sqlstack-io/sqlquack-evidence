category = "translation"
construct = "sf.functions.st-setsrid"
session_profile = "utc-v1"

[[case]]
id = "t001_example"
description = "The page example: SRID 4326 set and the coordinates unchanged. Catches: the coordinates transformed"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POINT(13 51)'"],
]
query = "SELECT ST_SRID(ST_SETSRID(TO_GEOMETRY(v), 4326)) AS srid, ST_X(ST_SETSRID(TO_GEOMETRY(v), 4326)) AS x, ST_Y(ST_SETSRID(TO_GEOMETRY(v), 4326)) AS y FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_geometry_expression"
description = "A NULL shape; the page does not say; the recording decides. Catches: an error"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_SETSRID(TO_GEOMETRY(v), 4326) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
