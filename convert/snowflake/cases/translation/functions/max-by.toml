category = "translation"
construct = "sf.functions.max-by"
session_profile = "utc-v1"

[[case]]
id = "t001_scalar"
description = "The returned value comes from another column. Catches: the maximum of col_to_return itself, or the arguments swapped"
columns = [{ name = "name", type = "VARCHAR" }, { name = "v", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "5"],
  ["'b'", "9"],
  ["'c'", "1"],
  ["'d'", "NULL"],
  ["'e'", "7"],
]
query = "SELECT MAX_BY(name, v) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_top_n"
description = "Three values, returned as an ARRAY in descending order of v. Catches: the array in input order or in the other direction, or n ignored"
columns = [{ name = "name", type = "VARCHAR" }, { name = "v", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "5"],
  ["'b'", "9"],
  ["'c'", "1"],
  ["'d'", "NULL"],
  ["'e'", "7"],
]
query = "SELECT MAX_BY(name, v, 3) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_n_above_count"
description = "n larger than the number of non-NULL rows. Catches: padding with NULL or an error"
columns = [{ name = "name", type = "VARCHAR" }, { name = "v", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "5"],
  ["'b'", "9"],
  ["'c'", "1"],
]
query = "SELECT MAX_BY(name, v, 10) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_col_containing"
description = "NULL in the compared column, which the page says is ignored; a group with only NULL. Catches: NULL treated as the largest or smallest value (a returned)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "name", type = "VARCHAR" }, { name = "v", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "'a'", "NULL"],
  ["'p'", "'b'", "2"],
  ["'q'", "'c'", "NULL"],
]
query = "SELECT g, MAX_BY(name, v) AS r, MAX_BY(name, v, 2) AS a FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_col_to_return"
description = "A NULL value to return at the extreme row. Catches: the next row's value returned instead of NULL"
columns = [{ name = "name", type = "VARCHAR" }, { name = "v", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "9"],
  ["'b'", "5"],
]
query = "SELECT MAX_BY(name, v) AS r FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_empty_input"
description = "No rows. Catches: an empty array for the three-argument form, or an error"
columns = [{ name = "name", type = "VARCHAR" }, { name = "v", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
]
query = "SELECT MAX_BY(name, v) AS r, MAX_BY(name, v, 2) AS a FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
