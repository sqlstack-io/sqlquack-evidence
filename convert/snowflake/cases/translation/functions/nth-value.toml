category = "translation"
construct = "sf.functions.nth-value"
session_profile = "utc-v1"

[[case]]
id = "t001_from_first"
description = "The second value, 10 in partition a ordered by o; the row o = 1 sees it only because the default frame is the whole partition. Catches: NULLs skipped by default, or n counted from 0"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1", "NULL"],
  ["'a'", "2", "10"],
  ["'a'", "4", "NULL"],
  ["'a'", "5", "40"],
  ["'a'", "7", "NULL"],
  ["'b'", "1", "7"],
  ["'b'", "3", "9"],
]
query = "SELECT ordinal, NTH_VALUE(x, 2) OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_from_last_ignore"
description = "The second non-NULL value counted from the end. Catches: FROM LAST ignored, or NULLs counted"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1", "NULL"],
  ["'a'", "2", "10"],
  ["'a'", "4", "NULL"],
  ["'a'", "5", "40"],
  ["'a'", "7", "NULL"],
  ["'b'", "1", "7"],
  ["'b'", "3", "9"],
]
query = "SELECT ordinal, NTH_VALUE(x, 2) FROM LAST IGNORE NULLS OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_past_end"
description = "n larger than the partition. Catches: an error, or the last value returned"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1", "NULL"],
  ["'a'", "2", "10"],
  ["'a'", "4", "NULL"],
  ["'a'", "5", "40"],
  ["'a'", "7", "NULL"],
  ["'b'", "1", "7"],
  ["'b'", "3", "9"],
]
query = "SELECT ordinal, NTH_VALUE(x, 6) OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_above_limit"
compile_error = true
description = "n = 1001, above the limit of 1000 the page states; Snowflake refuses it when compiling. Catches: the call accepted"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1", "NULL"],
  ["'a'", "2", "10"],
  ["'a'", "4", "NULL"],
  ["'a'", "5", "40"],
  ["'a'", "7", "NULL"],
  ["'b'", "1", "7"],
  ["'b'", "3", "9"],
]
query = "SELECT ordinal, NTH_VALUE(x, 1001) OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t005_null_expr"
description = "A partition whose values are all NULL, with IGNORE NULLS. Catches: an error, or a value from another partition"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'c'", "1", "NULL"],
  ["'c'", "2", "NULL"],
  ["'a'", "1", "4"],
]
query = "SELECT ordinal, NTH_VALUE(x, 1) IGNORE NULLS OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
