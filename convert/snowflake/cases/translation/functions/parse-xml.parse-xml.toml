category = "translation"
construct = "sf.functions.parse-xml.parse-xml"
session_profile = "utc-v1"

[[case]]
id = "t001_document"
description = "A document with repeated elements, an attribute and an empty element. Catches: an element or attribute lost"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'<r><a id=\"1\">1.50</a><a>x</a><b/></r>'"],
]
query = "SELECT PARSE_XML(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_auto_convert"
description = "Numeric content with and without disable_auto_convert, with its type. Catches: the number left as text by default, or converted under TRUE"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'<a>1.50</a>'"],
]
query = "SELECT GET(PARSE_XML(a), '$') AS conv, TYPEOF(GET(PARSE_XML(a), '$')) AS t, GET(PARSE_XML(a, TRUE), '$') AS raw, TYPEOF(GET(PARSE_XML(a, TRUE), '$')) AS t_raw FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_invalid"
description = "Malformed XML. Catches: NULL returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'<a><b></a>'"],
]
query = "SELECT PARSE_XML(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null_string_containing_xml"
description = "A SQL NULL, which the page says gives NULL. Catches: an error, or an empty object"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT PARSE_XML(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
