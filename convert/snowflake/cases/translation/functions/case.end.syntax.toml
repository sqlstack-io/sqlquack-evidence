category = "translation"
construct = "sf.functions.case.end.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_match"
description = "The first matching value wins. Catches: the last match winning, or no match falling through to NULL with ELSE"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["2"],
  ["9"],
]
query = "SELECT CASE x WHEN 1 THEN 'a' WHEN 1 THEN 'b' WHEN 2 THEN 'c' ELSE 'z' END AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_cast"
description = "Values cast to expr's type, as the page says. Catches: string comparison ('1.0' not matching 1)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["2"],
]
query = "SELECT CASE x WHEN '1.0' THEN 'one' WHEN '02' THEN 'two' ELSE 'none' END AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr"
description = "NULL expr against a WHEN NULL branch. Catches: NULL matching WHEN NULL (DECODE semantics) instead of falling to ELSE"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT CASE x WHEN NULL THEN 'null' WHEN 1 THEN 'one' ELSE 'else' END AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
