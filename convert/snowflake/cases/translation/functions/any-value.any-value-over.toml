category = "translation"
construct = "sf.functions.any-value.any-value-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Partitions holding one value each. Catches: a value from another partition"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'p'", "'a'"],
  ["'q'", "'b'"],
  ["'p'", "'a'"],
]
query = "SELECT ANY_VALUE(x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_empty_over"
description = "An empty OVER clause over one repeated value. Catches: NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["8"],
  ["8"],
]
query = "SELECT ANY_VALUE(x) OVER () AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr1"
description = "A partition of only NULL. Catches: a value from another partition"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "2"],
  ["'p'", "NULL"],
]
query = "SELECT ANY_VALUE(x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_expr2"
description = "NULL partition keys. Catches: NULL-keyed rows dropped or given another partition's value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1"],
  ["'p'", "2"],
  ["NULL", "1"],
]
query = "SELECT ANY_VALUE(x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
