category = "translation"
construct = "sf.functions.hash"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "HASH of integers against an equal and an unequal partner; no hash value is returned. Catches: equal integers hashing differently, unequal ones alike, or a result outside the signed 64-bit range"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["10", "10"],
  ["-1", "1"],
  ["123456789012345", "123456789012345"],
]
query = "SELECT HASH(a) = HASH(b) AS same, HASH(a) BETWEEN -9223372036854775808 AND 9223372036854775807 AS in_range FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "HASH of strings, including multi-byte and trailing blanks, against equal and unequal partners; no hash value is returned. Catches: multi-byte or blank-padded text hashed alike, equal text hashed differently, or a result outside the signed 64-bit range"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'Snowflake'", "'Snowflake'"],
  ["'\u00e9'", "'e'"],
  ["'10'", "'10 '"],
]
query = "SELECT HASH(a) = HASH(b) AS same, HASH(a) BETWEEN -9223372036854775808 AND 9223372036854775807 AS in_range FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_scale_stable"
description = "HASH of 10 as NUMBER(38,0), NUMBER(10,2) and FLOAT, which the page says agree; no hash value is returned. Catches: the scale or the FLOAT bits hashed (FALSE)"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(10,2)" }, { name = "c", type = "FLOAT" }]
rows = [
  ["10", "10.00", "10e0"],
]
query = "SELECT HASH(a) = HASH(b) AS r1, HASH(a) = HASH(c) AS r2 FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_multi"
description = "HASH of two arguments in both orders, and of the same arguments again; no hash value is returned. The page does not say whether order matters, so the recording decides. Catches: two calls with the same arguments hashing differently, or a swapped-order result other than the recorded one"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["'x'", "1"],
]
query = "SELECT HASH(a, b) = HASH(b, a) AS swapped, HASH(a, b) = HASH(a, b) AS stable FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_expr"
description = "NULL input, which the page says still hashes; no hash value is returned. Catches: NULL propagated instead of a hash value"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["0"],
]
query = "SELECT HASH(a) IS NULL AS null_hash, HASH(a) BETWEEN -9223372036854775808 AND 9223372036854775807 AS in_range FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
