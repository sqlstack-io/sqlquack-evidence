category = "translation"
construct = "sf.functions.zeroifnull"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "NULL and set values with a scale. Catches: the result scale dropped (0 instead of 0.00), or values changed"
columns = [{ name = "a", type = "NUMBER(10,2)" }]
rows = [
  ["NULL"],
  ["-1.25"],
  ["0.00"],
]
query = "SELECT ZEROIFNULL(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_float"
description = "FLOAT values. Catches: a NUMBER result"
columns = [{ name = "a", type = "FLOAT" }]
rows = [
  ["NULL"],
  ["2.5e-3"],
]
query = "SELECT ZEROIFNULL(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr"
description = "NULL input. Catches: NULL returned"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["7"],
]
query = "SELECT ZEROIFNULL(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
