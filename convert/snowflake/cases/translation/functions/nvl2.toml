category = "translation"
construct = "sf.functions.nvl2"
session_profile = "utc-v1"

[[case]]
id = "t001_mixed"
description = "NVL2 of NULL and non-NULL first arguments. Catches: expr2 and expr3 swapped, or expr1 returned (NVL)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'x'"],
  ["NULL"],
  ["''"],
]
query = "SELECT NVL2(a, 10, 20) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_expr1"
description = "NULL first argument. Catches: expr2 returned"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["0"],
]
query = "SELECT NVL2(a, 'set', 'unset') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_null_expr2"
description = "NULL second argument selected. Catches: expr3 returned instead of NULL"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["NULL"],
]
query = "SELECT NVL2(a, NULL, 'unset') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_expr3"
description = "NULL third argument selected. Catches: expr2 returned instead of NULL"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT NVL2(a, 'set', NULL) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
