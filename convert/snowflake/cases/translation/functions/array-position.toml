category = "translation"
construct = "sf.functions.array-position"
session_profile = "utc-v1"

[[case]]
id = "t001_first_match"
description = "A value present twice, and one at position 0. Catches: 1-based positions, or the last match returned"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'2'", "'[1,2,2]'"],
  ["'1'", "'[1,2,2]'"],
]
query = "SELECT ARRAY_POSITION(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_absent"
description = "An absent value, and the text \"2\" against the number 2. Catches: -1 or 0 for an absent value, or values compared as text"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'5'", "'[1,2]'"],
  ["'\"2\"'", "'[2]'"],
]
query = "SELECT ARRAY_POSITION(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_json_null"
description = "A JSON null searched in an array holding one. Catches: JSON null never found"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'null'", "'[1,null]'"],
]
query = "SELECT ARRAY_POSITION(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_value_expr"
description = "A NULL value, which the page says finds the first SQL NULL element. Catches: NULL returned instead of the position of the undefined element"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["3"],
]
query = "SELECT ARRAY_POSITION(NULL::VARIANT, ARRAY_CONSTRUCT(1, x, x)) AS r FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["null"]
