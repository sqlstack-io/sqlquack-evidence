category = "translation"
construct = "sf.functions.timestamp-from-parts.timestamp-from-parts"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "TIMESTAMP_FROM_PARTS of a normal timestamp. Catches: parts in the wrong order, or a DATE/other timestamp type returned"
columns = [{ name = "y", type = "NUMBER(38,0)" }, { name = "mo", type = "NUMBER(38,0)" }, { name = "d", type = "NUMBER(38,0)" }, { name = "h", type = "NUMBER(38,0)" }, { name = "mi", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["2024", "2", "29", "13", "5", "9"],
]
query = "SELECT TIMESTAMP_FROM_PARTS(y, mo, d, h, mi, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_nanosecond"
description = "A nanosecond part. Catches: nanoseconds read as milliseconds"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["123456789"],
  ["1000"],
]
query = "SELECT TIMESTAMP_FROM_PARTS(2024, 1, 1, 0, 0, 0, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_carry"
description = "Parts beyond their ranges, which carry. Catches: an error instead of carrying across a year end, or a negative part clamped instead of carrying backwards"
columns = [{ name = "h", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["24", "0"],
  ["23", "3600"],
  ["0", "-1"],
]
query = "SELECT TIMESTAMP_FROM_PARTS(2024, 12, 31, h, 0, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_year"
description = "NULL year. Catches: NULL read as 0 or 1"
columns = [{ name = "v", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT TIMESTAMP_FROM_PARTS(v, 1, 1, 0, 0, 0) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

