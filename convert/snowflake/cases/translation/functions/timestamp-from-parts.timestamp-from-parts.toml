[[case]]
id = "t011_leap"
description = "29 February in a common year, which carries. Catches: an error instead of 1 March"
columns = [{ name = "y", type = "NUMBER(38,0)" }]
rows = [
  ["2023"],
  ["2024"],
]
query = "SELECT TIMESTAMP_FROM_PARTS(y, 2, 29, 12, 0, 0) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t012_time_zone"
compile_error = true
description = "An explicit time zone. Under the utc-v1 TIMESTAMP_TYPE_MAPPING (TIMESTAMP_NTZ) TIMESTAMP_FROM_PARTS resolves to the NTZ variant, which takes no time zone: Snowflake refuses the call (1044). Catches: the zone honoured (a TIMESTAMP_TZ value returned) where Snowflake refuses the call under the session mapping"
columns = [{ name = "z", type = "VARCHAR" }]
rows = [
  ["'America/Los_Angeles'"],
  ["'Asia/Kolkata'"],
]
query = "SELECT TIMESTAMP_FROM_PARTS(2024, 7, 1, 9, 30, 0, 0, z) AS r, CAST(TIMESTAMP_FROM_PARTS(2024, 7, 1, 9, 30, 0, 0, z) AS TIMESTAMP_NTZ) AS wall FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t013_null_time_zone"
compile_error = true
description = "A NULL time zone. Under the utc-v1 TIMESTAMP_TYPE_MAPPING (TIMESTAMP_NTZ) TIMESTAMP_FROM_PARTS resolves to the NTZ variant, which takes no time zone: Snowflake refuses the call (1044). Catches: the zone honoured (a TIMESTAMP_TZ value returned) where Snowflake refuses the call under the session mapping"
columns = [{ name = "z", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'UTC'"],
]
query = "SELECT TIMESTAMP_FROM_PARTS(2024, 1, 1, 0, 0, 0, 0, z) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t014_dst"
compile_error = true
description = "A DST zone. Under the utc-v1 TIMESTAMP_TYPE_MAPPING (TIMESTAMP_NTZ) TIMESTAMP_FROM_PARTS resolves to the NTZ variant, which takes no time zone: Snowflake refuses the call (1044). Catches: the zone honoured (a TIMESTAMP_TZ value returned) where Snowflake refuses the call under the session mapping"
columns = [{ name = "d", type = "NUMBER(38,0)" }, { name = "h", type = "NUMBER(38,0)" }, { name = "mo", type = "NUMBER(38,0)" }]
rows = [
  ["10", "2", "3"],
  ["3", "1", "11"],
]
query = "SELECT TIMESTAMP_FROM_PARTS(2024, mo, d, h, 30, 0, 0, 'America/New_York') AS r, CAST(TIMESTAMP_FROM_PARTS(2024, mo, d, h, 30, 0, 0, 'America/New_York') AS TIMESTAMP_NTZ) AS wall FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t015_date_time"
description = "The date_expr, time_expr form, which the page allows under the NTZ mapping. Catches: an error, or the time's fraction dropped"
columns = [{ name = "d", type = "DATE" }, { name = "t", type = "TIME" }]
rows = [
  ["'2024-02-29'", "'23:59:59.123'"],
]
query = "SELECT TIMESTAMP_FROM_PARTS(d, t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]
