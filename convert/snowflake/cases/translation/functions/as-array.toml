category = "translation"
construct = "sf.functions.as-array"
session_profile = "utc-v1"

[[case]]
id = "t001_match"
description = "Arrays, nested and empty. Catches: an empty array returned as NULL, or a nested array flattened"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[1,[2,\"x\"]]'"],
  ["'[]'"],
]
query = "SELECT AS_ARRAY(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_mismatch"
description = "An object, a string holding array text, and a number. Catches: the string parsed as JSON, or a scalar wrapped as a one-element array (TO_ARRAY)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1}'"],
  ["'\"[1]\"'"],
  ["'5'"],
]
query = "SELECT AS_ARRAY(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_variant_expr"
description = "A SQL NULL and a JSON null; the page returns NULL for a NULL argument and for a type that does not match. Catches: the JSON null passed through as a value, or an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'null'"],
]
query = "SELECT AS_ARRAY(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
