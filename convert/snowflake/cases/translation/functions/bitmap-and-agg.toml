category = "translation"
construct = "sf.functions.bitmap-and-agg"
session_profile = "utc-v1"

[[case]]
id = "t001_group"
description = "The bucket-1 bitmaps of p and q combined. Catches: OR across the group"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "5"],
  ["'p'", "5"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT BITMAP_TO_ARRAY(BITMAP_AND_AGG(bm)) AS r FROM (SELECT g, BITMAP_BUCKET_NUMBER(x) AS bk, BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x)) AS bm FROM input GROUP BY g, bk) WHERE bk = 1"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_bitmap"
description = "A NULL bitmap beside bitmaps. Catches: the result NULL, or NULL read as an empty bitmap (AND empty)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "5"],
  ["'p'", "5"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT BITMAP_TO_ARRAY(BITMAP_AND_AGG(bm)) AS r FROM (SELECT bm FROM (SELECT g, BITMAP_BUCKET_NUMBER(x) AS bk, BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x)) AS bm FROM input GROUP BY g, bk) WHERE bk = 1 UNION ALL SELECT NULL)"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_empty_input"
description = "No rows. Catches: an empty bitmap instead of NULL, or the reverse"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "5"],
  ["'p'", "5"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT BITMAP_COUNT(BITMAP_AND_AGG(bm)) AS r FROM (SELECT g, BITMAP_BUCKET_NUMBER(x) AS bk, BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x)) AS bm FROM input GROUP BY g, bk) WHERE bk = 99"
order = "ordered"
tags = ["empty-input"]
