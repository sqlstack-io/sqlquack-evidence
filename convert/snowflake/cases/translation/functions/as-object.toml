category = "translation"
construct = "sf.functions.as-object"
session_profile = "utc-v1"

[[case]]
id = "t001_match"
description = "Objects, nested and empty. Catches: an empty object returned as NULL, or nested keys flattened"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":{\"b\":1}}'"],
  ["'{}'"],
]
query = "SELECT AS_OBJECT(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_mismatch"
description = "An array of pairs, a string holding object text and a number. Catches: the string parsed as JSON, or the array read as key-value pairs"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[[\"a\",1]]'"],
  ["'\"{}\"'"],
  ["'5'"],
]
query = "SELECT AS_OBJECT(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_variant_expr"
description = "A SQL NULL and a JSON null; the page returns NULL for a NULL argument and for a type that does not match. Catches: the JSON null passed through as a value, or an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'null'"],
]
query = "SELECT AS_OBJECT(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
