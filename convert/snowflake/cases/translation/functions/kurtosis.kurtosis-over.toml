  ["'p'", "1", "9"],
  ["NULL", "2", "2"],
  ["NULL", "3", "1"],
  ["NULL", "4", "9"],
]
query = "SELECT KURTOSIS(x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_four"
description = "A partition of exactly four rows next to one of three. Catches: the three-row partition given a value"
