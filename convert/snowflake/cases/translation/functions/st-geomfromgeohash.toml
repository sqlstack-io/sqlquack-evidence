category = "translation"
construct = "sf.functions.st-geomfromgeohash"
session_profile = "utc-v1"

[[case]]
id = "t001_cell"
description = "The box of ezs42: longitude -5.625 to -5.5810546875 and latitude 42.5830078125 to 42.626953125, exact binary fractions. Catches: longitude and latitude swapped, or a point returned"
columns = [{ name = "g", type = "VARCHAR" }]
rows = [
  ["'ezs42'"],
]
query = "SELECT ST_XMIN(ST_GEOMFROMGEOHASH(g)) AS xmin, ST_XMAX(ST_GEOMFROMGEOHASH(g)) AS xmax, ST_YMIN(ST_GEOMFROMGEOHASH(g)) AS ymin, ST_YMAX(ST_GEOMFROMGEOHASH(g)) AS ymax FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_precision"
description = "A longer geohash cut to 5 and to 1 characters. Catches: the precision ignored"
columns = [{ name = "g", type = "VARCHAR" }]
rows = [
  ["'ezs42e44'"],
]
query = "SELECT ST_XMAX(ST_GEOMFROMGEOHASH(g, 5)) AS x5, ST_XMAX(ST_GEOMFROMGEOHASH(g, 1)) AS x1 FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_precision_zero"
description = "Precision 0, below the range of 1 to 20 that the page allows. Catches: an empty or whole-world shape returned"
columns = [{ name = "g", type = "VARCHAR" }]
rows = [
  ["'ezs42'"],
]
query = "SELECT ST_ASWKT(ST_GEOMFROMGEOHASH(g, 0)) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null_geohash"
description = "A NULL geohash; the page does not say; the recording decides. Catches: an error, or an empty shape returned"
columns = [{ name = "g", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_GEOMFROMGEOHASH(g) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
