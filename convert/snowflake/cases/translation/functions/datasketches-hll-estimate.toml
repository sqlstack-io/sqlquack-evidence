category = "translation"
construct = "sf.functions.datasketches-hll-estimate"
session_profile = "utc-v1"

[[case]]
id = "t001_sketch"
description = "The estimate per group, returned as DOUBLE (HLL_ESTIMATE returns INTEGER). Catches: an INTEGER result"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
  ["'q'", "9"],
  ["'p'", "4"],
]
query = "SELECT g, DATASKETCHES_HLL_ESTIMATE(st) AS r FROM (SELECT g, DATASKETCHES_HLL_ACCUMULATE(x) AS st FROM input GROUP BY g) ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_binary_sketch"
description = "A NULL sketch. Catches: 0.0 instead of NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
  ["'q'", "9"],
  ["'p'", "4"],
]
query = "SELECT DATASKETCHES_HLL_ESTIMATE(NULL::BINARY) AS r"
order = "ordered"
tags = ["null"]
