category = "translation"
construct = "sf.functions.date-from-parts"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "Normal dates in year-month-day order. Catches: month and day swapped"
columns = [{ name = "y", type = "NUMBER(38,0)" }, { name = "m", type = "NUMBER(38,0)" }, { name = "d", type = "NUMBER(38,0)" }]
rows = [
  ["2024", "3", "12"],
  ["1999", "12", "31"],
]
query = "SELECT DATE_FROM_PARTS(y, m, d) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_carry"
description = "Day and month values outside their ranges, which carry. Catches: an error or NULL instead of carrying (2024-02-30 is 2024-03-01)"
columns = [{ name = "y", type = "NUMBER(38,0)" }, { name = "m", type = "NUMBER(38,0)" }, { name = "d", type = "NUMBER(38,0)" }]
rows = [
  ["2024", "2", "30"],
  ["2024", "14", "1"],
  ["2024", "1", "0"],
  ["2024", "1", "366"],
]
query = "SELECT DATE_FROM_PARTS(y, m, d) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_year"
description = "NULL year. Catches: NULL read as 0"
columns = [{ name = "y", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2024"],
]
query = "SELECT DATE_FROM_PARTS(y, 1, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_month"
description = "NULL month. Catches: NULL read as 1"
columns = [{ name = "m", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT DATE_FROM_PARTS(2024, m, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_day"
description = "NULL day. Catches: NULL read as 1"
columns = [{ name = "d", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT DATE_FROM_PARTS(2024, 1, d) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_negative"
description = "Negative and zero months and days, which the page calls not intuitive. Catches: month 0 read as January, or a negative day counted from the month start"
columns = [{ name = "m", type = "NUMBER(38,0)" }, { name = "d", type = "NUMBER(38,0)" }]
rows = [
  ["0", "1"],
  ["-1", "1"],
  ["3", "-1"],
]
query = "SELECT DATE_FROM_PARTS(2024, m, d) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t007_leap"
description = "29 February in leap and common years. Catches: an error for 2023-02-29 instead of carrying to 03-01"
columns = [{ name = "y", type = "NUMBER(38,0)" }]
rows = [
  ["2024"],
  ["2023"],
  ["1900"],
  ["2000"],
]
query = "SELECT DATE_FROM_PARTS(y, 2, 29) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
