category = "translation"
construct = "sf.functions.to-time.time"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "TIME of strings with fractional seconds. The result is formatted with TO_VARCHAR(..., 'HH24:MI:SS.FF9') because the connector returns TIME in microseconds and the session TIME_OUTPUT_FORMAT has no fraction. Catches: fractional seconds dropped or rounded"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'13:14:15.123'"],
  ["'00:00:00'"],
  ["'23:59:59.999999999'"],
]
query = "SELECT TO_VARCHAR(TIME(a), 'HH24:MI:SS.FF9') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_timestamp"
description = "A timestamp's time part. Catches: the date leaking in, or an error"
columns = [{ name = "t", type = "TIMESTAMP_NTZ" }]
rows = [
  ["'2024-02-29 17:01:02.5'"],
]
query = "SELECT TIME(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_timestamp_tz"
description = "A TIMESTAMP_TZ's wall-clock time. Catches: the UTC time (07:30) instead of the wall clock (23:30)"
columns = [{ name = "t", type = "TIMESTAMP_TZ" }]
rows = [
  ["'2024-12-31 23:30:00.250 -0800'"],
]
query = "SELECT TIME(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_integer_string"
description = "Integer strings of seconds and milliseconds. Catches: the integer not taken modulo a day, or always read as seconds"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'86461'"],
  ["'31536002789'"],
]
query = "SELECT TIME(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_string_expr"
description = "NULL string. Catches: NULL read as midnight"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'01:00:00'"],
]
query = "SELECT TIME(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_out_of_range"
description = "An hour of 25. Catches: a wrap to 01:00 or NULL instead of an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'25:00:00'"],
]
query = "SELECT TIME(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
