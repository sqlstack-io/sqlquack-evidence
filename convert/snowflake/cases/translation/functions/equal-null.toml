category = "translation"
construct = "sf.functions.equal-null"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "Equal and unequal values, including different scales. Catches: scale compared (1 vs 1.00 unequal)"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["1", "1.00"],
  ["1", "2.00"],
]
query = "SELECT EQUAL_NULL(a, b) AS r, NOT EQUAL_NULL(a, b) AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "Strings differing only in case or trailing blanks. Catches: case-insensitive or blank-padded comparison"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'a'", "'A'"],
  ["'a'", "'a '"],
]
query = "SELECT EQUAL_NULL(a, b) AS r, NOT EQUAL_NULL(a, b) AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr1"
description = "NULL first argument against NULL and a value. Catches: ordinary = (NULL instead of TRUE/FALSE)"
columns = [{ name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT EQUAL_NULL(NULL, b) AS r, NOT EQUAL_NULL(NULL, b) AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_expr2"
description = "NULL second argument against a value. Catches: NULL instead of a definite result"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["NULL"],
]
query = "SELECT EQUAL_NULL(a, NULL) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
