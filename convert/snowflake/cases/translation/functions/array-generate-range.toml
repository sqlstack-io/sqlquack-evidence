category = "translation"
construct = "sf.functions.array-generate-range"
session_profile = "utc-v1"

[[case]]
id = "t001_default_step"
description = "The default step, and a step that does not reach stop exactly. Catches: stop included, or the step ignored"
columns = [{ name = "lo", type = "NUMBER(38,0)" }, { name = "hi", type = "NUMBER(38,0)" }]
rows = [
  ["2", "6"],
  ["-1", "1"],
]
query = "SELECT ARRAY_GENERATE_RANGE(lo, hi) AS r, ARRAY_GENERATE_RANGE(lo, hi + 9, 4) AS s FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_negative_step"
description = "A negative step. Catches: an empty array, or the sign of the step dropped"
columns = [{ name = "lo", type = "NUMBER(38,0)" }, { name = "hi", type = "NUMBER(38,0)" }, { name = "st", type = "NUMBER(38,0)" }]
rows = [
  ["0", "-16", "-5"],
  ["-10", "-50", "-10"],
]
query = "SELECT ARRAY_GENERATE_RANGE(lo, hi, st) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t003_empty"
description = "start = stop, and steps that point away from stop. Catches: a one-element array, or the range walked the other way"
columns = [{ name = "lo", type = "NUMBER(38,0)" }, { name = "hi", type = "NUMBER(38,0)" }, { name = "st", type = "NUMBER(38,0)" }]
rows = [
  ["2", "2", "4"],
  ["8", "2", "2"],
  ["2", "8", "-2"],
]
query = "SELECT ARRAY_GENERATE_RANGE(lo, hi, st) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["empty-input"]

[[case]]
id = "t004_null_start"
description = "NULL in each argument. Catches: NULL read as 0, or the default step used for a NULL step"
columns = [{ name = "lo", type = "NUMBER(38,0)" }, { name = "hi", type = "NUMBER(38,0)" }, { name = "st", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "3", "1"],
  ["0", "NULL", "1"],
  ["0", "3", "NULL"],
]
query = "SELECT ARRAY_GENERATE_RANGE(lo, hi, st) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_zero_step"
description = "A step of 0, which the page says cannot be given. Catches: an empty array or an endless loop"
columns = [{ name = "lo", type = "NUMBER(38,0)" }, { name = "hi", type = "NUMBER(38,0)" }, { name = "st", type = "NUMBER(38,0)" }]
rows = [
  ["0", "3", "0"],
]
query = "SELECT ARRAY_GENERATE_RANGE(lo, hi, st) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
