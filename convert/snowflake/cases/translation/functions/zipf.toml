category = "translation"
construct = "sf.functions.zipf"
session_profile = "utc-v1"

[[case]]
id = "t001_distribution"
description = "s = 1 and N = 10 over 1000 rows: the range, and 1 drawn more often than 10. Catches: values from 0, or a uniform distribution"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MIN(z) AS lo, MAX(z) <= 10 AS hi_ok, COUNT_IF(z = 1) > COUNT_IF(z = 10) AS skewed FROM (SELECT ZIPF(1, 10, RANDOM()) AS z FROM TABLE(GENERATOR(ROWCOUNT => 1000)))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_n_zero"
description = "N = 0, below the range the page states. Catches: the call accepted"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT ZIPF(1, 0, RANDOM()) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t003_null_gen"
description = "A NULL generator; the page does not say; the recording decides. Catches: a value where Snowflake returns NULL, or the reverse"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT ZIPF(1, 10, NULL) AS r FROM input"
order = "ordered"
tags = ["null"]
