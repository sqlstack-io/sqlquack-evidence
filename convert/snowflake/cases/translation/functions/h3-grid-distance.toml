category = "translation"
construct = "sf.functions.h3-grid-distance"
session_profile = "utc-v1"

[[case]]
id = "t001_integer"
description = "A cell and a cell two steps away, both ways, and a cell with itself. Catches: a count of cells on the path (3) returned instead of steps, or direction-dependent results"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["617700169957507071", "617700169960652799"],
  ["617700169960652799", "617700169957507071"],
  ["617700169957507071", "617700169957507071"],
]
query = "SELECT ordinal, H3_GRID_DISTANCE(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "The same pair as hexadecimal IDs. Catches: the text read as decimal numbers"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'89283082803ffff'", "'89283082833ffff'"],
]
query = "SELECT H3_GRID_DISTANCE(a, b) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_mixed_resolution"
description = "Cells of resolutions 9 and 10, which the page says must use the same resolution. Catches: a distance computed after converting one cell"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["617700169957507071", "622203769584648191"],
]
query = "SELECT H3_GRID_DISTANCE(a, b) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null_cell_id_1"
description = "A NULL first ID; the page does not say; the recording decides. Catches: an error, or 0 returned"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "617700169957507071"],
]
query = "SELECT H3_GRID_DISTANCE(a, b) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
