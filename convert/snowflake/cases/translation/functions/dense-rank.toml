category = "translation"
construct = "sf.functions.dense-rank"
session_profile = "utc-v1"

[[case]]
id = "t001_ties"
description = "A tie at 20 and a NULL order key. Catches: a gap after the tie (RANK: 1,2,2,4)"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, DENSE_RANK() OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_desc_nulls_first"
description = "Descending order with NULLS FIRST. Catches: NULLS FIRST ignored"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, DENSE_RANK() OVER (PARTITION BY p ORDER BY o DESC NULLS FIRST) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_order_expr"
description = "NULL order keys sorted first with ASC NULLS FIRST; tied NULLs share a rank. Catches: NULLs sorted last, or each NULL given its own rank"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "NULL"],
  ["'a'", "2"],
  ["'a'", "NULL"],
  ["'a'", "1"],
]
query = "SELECT ordinal, DENSE_RANK() OVER (PARTITION BY p ORDER BY o ASC NULLS FIRST) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
