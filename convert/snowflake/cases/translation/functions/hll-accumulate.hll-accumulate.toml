category = "translation"
construct = "sf.functions.hll-accumulate.hll-accumulate"
session_profile = "utc-v1"

[[case]]
id = "t001_estimate"
description = "The state of a group with a repeated value, read through HLL_ESTIMATE. Catches: duplicates counted, or the state of the whole input"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT g, HLL_ESTIMATE(HLL_ACCUMULATE(x)) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "Text differing only in case. Catches: case-insensitive hashing"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'a'"],
  ["'A'"],
  ["'a'"],
]
query = "SELECT HLL_ESTIMATE(HLL_ACCUMULATE(x)) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_distinct"
description = "DISTINCT, which has no effect. Catches: DISTINCT rejected"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT g, HLL_ESTIMATE(HLL_ACCUMULATE(DISTINCT x)) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["duplicates"]

[[case]]
id = "t004_null_expr"
description = "NULL values, which are not counted. Catches: NULL counted as a value"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
  ["NULL"],
]
query = "SELECT HLL_ESTIMATE(HLL_ACCUMULATE(x)) AS r FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_empty_input"
description = "No rows. Catches: a NULL state (a NULL estimate) instead of an empty one, or the reverse"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT HLL_ESTIMATE(HLL_ACCUMULATE(x)) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
