category = "translation"
construct = "sf.functions.text-plain"
session_profile = "utc-v1"

[[case]]
id = "t001_message"
description = "The page's example message, measured by its key and value once parsed. Catches: another key used, or the message returned bare"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT GET(PARSE_JSON(SNOWFLAKE.NOTIFICATION.TEXT_PLAIN('A message')), 'text/plain')::VARCHAR AS m, ARRAY_SIZE(OBJECT_KEYS(PARSE_JSON(SNOWFLAKE.NOTIFICATION.TEXT_PLAIN('A message')))) AS keys FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_quotes"
description = "A message with a double quote, which the JSON must escape so that it parses back. Catches: the quote left unescaped"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT GET(PARSE_JSON(SNOWFLAKE.NOTIFICATION.TEXT_PLAIN('say \"hi\"')), 'text/plain')::VARCHAR AS m FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_message"
description = "A NULL message; the page does not say; the recording decides. Catches: an error, or the text null"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT SNOWFLAKE.NOTIFICATION.TEXT_PLAIN(NULL::VARCHAR) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
