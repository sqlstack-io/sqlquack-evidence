category = "translation"
construct = "sf.functions.st-xmax"
session_profile = "utc-v1"

[[case]]
id = "t001_geometry"
description = "A triangle with vertices (0 0), (4 0) and (1 3). Catches: another bound returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,4 0,1 3,0 0))'"],
]
query = "SELECT ST_XMAX(TO_GEOMETRY(v)) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_geography"
description = "A line string crossing the antimeridian, which the page says gives 180. Catches: planar bounds of the vertices"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'LINESTRING(170 0,-170 0)'"],
]
query = "SELECT ST_XMAX(TO_GEOGRAPHY(v)) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_geography_or_geometry_expression"
description = "A NULL shape; the page does not say; the recording decides. Catches: an error, or a value returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_XMAX(TO_GEOGRAPHY(v)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
