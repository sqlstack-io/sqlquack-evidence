category = "translation"
construct = "sf.functions.h3-compact-cells-strings"
session_profile = "utc-v1"

[[case]]
id = "t001_compact"
description = "The 7 children of a cell and one child of a neighbouring cell, which compact to the parent and that child. Catches: the array returned unchanged, or the lone child merged into its parent"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[\"8a2830828007fff\",\"8a283082800ffff\",\"8a2830828017fff\",\"8a283082801ffff\",\"8a2830828027fff\",\"8a283082802ffff\",\"8a2830828037fff\",\"8a2830828187fff\"]'"],
]
query = "SELECT ARRAY_SIZE(H3_COMPACT_CELLS_STRINGS(PARSE_JSON(a)::ARRAY)) AS n, ARRAY_CONTAINS('89283082803ffff'::VARIANT, H3_COMPACT_CELLS_STRINGS(PARSE_JSON(a)::ARRAY)) AS parent FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_mixed_resolution"
description = "Cells of two resolutions, which the page says the input must not contain; Snowflake returns rows rather than an error, so the recording decides. Catches: an error raised where Snowflake returns rows, or a different array"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[\"8a2830828007fff\",\"89283082803ffff\"]'"],
]
query = "SELECT H3_COMPACT_CELLS_STRINGS(PARSE_JSON(a)::ARRAY) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_duplicate"
description = "A repeated cell, which the page says is not allowed; Snowflake returns rows rather than an error, so the recording decides. Catches: an error raised where Snowflake returns rows, or a different array"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[\"8a2830828007fff\",\"8a2830828007fff\"]'"],
]
query = "SELECT H3_COMPACT_CELLS_STRINGS(PARSE_JSON(a)::ARRAY) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_array_of_cell_ids"
description = "A NULL array, which the page says gives NULL without an error. Catches: an empty array returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT H3_COMPACT_CELLS_STRINGS(PARSE_JSON(a)::ARRAY) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
