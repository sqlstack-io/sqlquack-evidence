category = "translation"
construct = "sf.functions.array-construct-structured"
session_profile = "utc-v1"

[[case]]
id = "t001_common_type"
description = "An integer and a decimal, cast to one element type. Catches: the integer kept as an integer type beside the decimal, or the decimal truncated"
columns = [{ name = "i", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(10,1)" }]
rows = [
  ["1", "2.5"],
]
query = "SELECT ARRAY_CONSTRUCT_STRUCTURED(i, x)::VARIANT AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_expr1"
description = "A typed NULL argument beside a value, which the page says stays an element. Catches: the NULL dropped (one element)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["3"],
]
query = "SELECT ARRAY_SIZE(ARRAY_CONSTRUCT_STRUCTURED(x, 4)) AS n, ARRAY_CONSTRUCT_STRUCTURED(x, 4)::VARIANT AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_untyped_nulls"
compile_error = true
description = "Every argument an untyped NULL, which the page says is an error. Catches: an array of NULLs returned instead of the error"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT ARRAY_CONSTRUCT_STRUCTURED(NULL, NULL)::VARIANT AS r FROM input"
order = "ordered"
tags = ["error"]
