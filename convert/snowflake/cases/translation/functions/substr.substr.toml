category = "translation"
construct = "sf.functions.substr.substr"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "SUBSTR of multi-byte text. Catches: a 0-based start or byte offsets"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'h\u00e9llo'", "2", "3"],
  ["'abcdef'", "3", "2"],
]
query = "SELECT SUBSTR(a, p, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_no_length"
description = "SUBSTR with no length. Catches: only one character returned"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["'abcdef'", "3"],
  ["'\u00e9ab'", "2"],
]
query = "SELECT SUBSTR(a, p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_binary"
description = "SUBSTR of binary. Catches: hex characters counted instead of bytes"
columns = [{ name = "a", type = "BINARY" }, { name = "p", type = "NUMBER(38,0)" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'00FF1020'", "2", "2"],
]
query = "SELECT SUBSTR(a, p, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_start_zero"
description = "Start 0, which the page says is treated as 1. Catches: standard SQL semantics (one character fewer: 'a' instead of 'ab')"
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'abc'", "2"],
]
query = "SELECT SUBSTR(a, 0, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_base_expr"
description = "NULL string. Catches: NULL read as empty"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'ab'"],
]
query = "SELECT SUBSTR(a, 1, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_null_start_expr"
description = "NULL start. Catches: NULL read as 1"
columns = [{ name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT SUBSTR('abc', p, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_null_length_expr"
description = "NULL length. Catches: NULL read as no length"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT SUBSTR('abc', 2, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t008_negative_start"
description = "A negative start counted from the end, and a negative length. Catches: a negative start clamped to 1, or a negative length raising an error"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'abcdef'", "-3", "2"],
  ["'abcdef'", "2", "-1"],
  ["'abc'", "-9", "2"],
]
query = "SELECT SUBSTR(a, p, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t009_past_end"
description = "A start past the end. Catches: an error or NULL instead of an empty string"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["'abc'", "5"],
  ["'abc'", "4"],
]
query = "SELECT SUBSTR(a, p, 2) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
