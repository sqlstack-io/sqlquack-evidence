category = "translation"
construct = "sf.functions.mode.mode"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "A clear most frequent value per group. Catches: the first or the largest value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "7"],
  ["'q'", "9"],
  ["'p'", "7"],
  ["'q'", "9"],
  ["'p'", "30"],
]
query = "SELECT g, MODE(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "b three times against a and A twice each. Catches: case-insensitive grouping (a or A, four times)"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'b'"],
  ["'b'"],
  ["'b'"],
  ["'a'"],
  ["'a'"],
  ["'A'"],
  ["'A'"],
]
query = "SELECT MODE(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_date"
description = "Dates. Catches: a different type returned"
columns = [{ name = "x", type = "DATE" }]
rows = [
  ["'2024-02-29'"],
  ["'2024-02-29'"],
  ["'2025-01-01'"],
]
query = "SELECT MODE(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr1"
description = "NULL as the most frequent value, which the page says is not returned; and a group of only NULL. Catches: NULL returned as the mode (three NULLs against one 5)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "NULL"],
  ["'p'", "NULL"],
  ["'p'", "NULL"],
  ["'p'", "5"],
]
query = "SELECT g, MODE(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_empty_input"
description = "No rows. Catches: an error instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MODE(x) AS r FROM input WHERE ordinal < 0"
order = "ordered"
expected_divergence = "mode_of_no_rows"
tags = ["empty-input"]

[[case]]
id = "t006_distinct"
compile_error = true
description = "DISTINCT, which the page says is not supported. Catches: DISTINCT accepted (DuckDB accepts mode(DISTINCT x))"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["1"],
  ["5"],
]
query = "SELECT MODE(DISTINCT x) AS r FROM input"
order = "ordered"
tags = ["error"]
