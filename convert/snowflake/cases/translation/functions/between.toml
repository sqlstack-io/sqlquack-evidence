category = "translation"
construct = "sf.functions.between"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "Values on, inside and outside the bounds, and reversed bounds. Catches: exclusive bounds, or symmetric BETWEEN (TRUE for 5 BETWEEN 10 AND 1)"
columns = [{ name = "x", type = "NUMBER(38,0)" }, { name = "lo", type = "NUMBER(38,0)" }, { name = "hi", type = "NUMBER(38,0)" }]
rows = [
  ["1", "1", "3"],
  ["3", "1", "3"],
  ["4", "1", "3"],
  ["5", "10", "1"],
]
query = "SELECT x BETWEEN lo AND hi AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "Strings compared in binary order. Catches: case-insensitive or locale order (b BETWEEN A AND Z is FALSE)"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'b'"],
  ["'B'"],
  ["'Zz'"],
]
query = "SELECT x BETWEEN 'A' AND 'Z' AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_timestamp_date"
description = "The page's case: DATE bounds cast to midnight. Catches: the upper DATE read as end of day (TRUE for noon)"
columns = [{ name = "t", type = "TIMESTAMP_NTZ" }]
rows = [
  ["'2025-04-30 12:00:00'"],
  ["'2025-04-30 00:00:00'"],
]
query = "SELECT t BETWEEN '2025-04-29'::DATE AND '2025-04-30'::DATE AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_not"
description = "NOT BETWEEN on and off the bounds. Catches: NOT applied to one comparison only"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["0"],
  ["1"],
  ["5"],
]
query = "SELECT x NOT BETWEEN 1 AND 3 AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_expr"
description = "NULL value. Catches: FALSE instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT x BETWEEN 1 AND 3 AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_null_lower_bound"
description = "NULL lower bound where the upper bound already decides. Catches: NULL for 9 BETWEEN NULL AND 3 (which is FALSE: NULL AND FALSE), or TRUE"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["9"],
  ["2"],
]
query = "SELECT x BETWEEN NULL AND 3 AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_null_upper_bound"
description = "NULL upper bound where the lower bound already decides. Catches: NULL instead of FALSE for 0 BETWEEN 1 AND NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["0"],
  ["2"],
]
query = "SELECT x BETWEEN 1 AND NULL AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t008_varchar_number"
description = "A string compared with numeric bounds, which converts to a number. Catches: a text comparison ('9' and '10' both FALSE against 2 and 10)"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'9'"],
  ["'10'"],
]
query = "SELECT x BETWEEN 2 AND 10 AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]
