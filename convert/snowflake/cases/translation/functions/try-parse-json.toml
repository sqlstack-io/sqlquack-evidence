category = "translation"
construct = "sf.functions.try-parse-json"
session_profile = "utc-v1"

[[case]]
id = "t001_valid"
description = "Valid documents, including the text null. Catches: a JSON null turned into a SQL NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":[1,2]}'"],
  ["'null'"],
]
query = "SELECT TRY_PARSE_JSON(a) AS r, TRY_PARSE_JSON(a) IS NULL AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_invalid"
description = "Malformed JSON and duplicate keys under the default strict parameter. Catches: an error raised, or the duplicate accepted"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":}'"],
  ["'{\"a\":1,\"a\":2}'"],
]
query = "SELECT TRY_PARSE_JSON(a) IS NULL AS n FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["type-combination"]

[[case]]
id = "t003_duplicates_d"
description = "Duplicate keys with the parameter 'd'. Catches: NULL returned, or the first value kept"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1,\"a\":2}'"],
]
query = "SELECT TRY_PARSE_JSON(a, 'd') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr"
description = "A SQL NULL. Catches: a JSON null returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT TRY_PARSE_JSON(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
