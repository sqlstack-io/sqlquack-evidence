category = "translation"
construct = "sf.functions.cot"
session_profile = "utc-v1"

[[case]]
id = "t001_float"
description = "COT of FLOAT values. Catches: TAN computed instead of its reciprocal"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0.5"],
  ["-1"],
  ["2"],
]
query = "SELECT COT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_fixed"
description = "COT of NUMBER(12,4), converted to FLOAT. Catches: TAN computed instead of its reciprocal; or the result left fixed-point"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["0.7854"],
  ["-0.2500"],
]
query = "SELECT COT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null"
description = "COT of NULL. Catches: NULL turned into 0 or NaN"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["NULL"],
]
query = "SELECT COT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_small"
description = "Very small arguments give large cotangents. Catches: reciprocal computed in fixed-point"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["1e-8"],
  ["-1e-8"],
]
query = "SELECT COT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t005_pole"
description = "COT at or outside its domain: records what Snowflake returns there (NaN, Infinity, NULL or an error); re-kinded to error_parity after capture if Snowflake raises an error. Catches: NaN, Infinity, NULL or an error differing from Snowflake"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0"],
]
query = "SELECT COT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
