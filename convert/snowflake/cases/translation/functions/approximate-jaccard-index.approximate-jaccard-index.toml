category = "translation"
construct = "sf.functions.approximate-jaccard-index.approximate-jaccard-index"
session_profile = "utc-v1"

[[case]]
id = "t001_equal"
description = "Two states of equal sets. Catches: an order-sensitive or exact-match comparison"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_JACCARD_INDEX(m) AS r FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g IN ('p', 'q')"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_disjoint"
description = "Two states of disjoint sets. Catches: a similarity above 0.0 or a distance (1.0)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_JACCARD_INDEX(m) AS r FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g IN ('q', 'r')"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_distinct"
description = "DISTINCT, which has no effect, over a repeated state. Catches: DISTINCT rejected"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_JACCARD_INDEX(DISTINCT m) AS r FROM (SELECT m FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g IN ('p', 'q') UNION ALL SELECT m FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g = 'p')"
order = "ordered"
tags = ["duplicates"]

[[case]]
id = "t004_null_expr"
description = "A NULL state beside two equal states. Catches: the result NULL or below 1.0"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_JACCARD_INDEX(m) AS r FROM (SELECT m FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g IN ('p', 'q') UNION ALL SELECT NULL)"
order = "ordered"
tags = ["null"]
