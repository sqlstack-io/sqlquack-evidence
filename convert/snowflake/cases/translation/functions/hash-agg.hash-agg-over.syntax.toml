category = "translation"
construct = "sf.functions.hash-agg.hash-agg-over.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_star"
description = "HASH_AGG(*) per partition. Catches: the star expanded to a different column set or order (the ordinal column included or dropped)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "1"],
  ["'p'", "2"],
]
query = "SELECT g, HASH_AGG(*) OVER (PARTITION BY g) AS r FROM (SELECT g, a FROM input) ORDER BY g, r"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_expr3"
description = "NULL partition key. Catches: NULL-keyed rows dropped or merged with another partition"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1"],
  ["'p'", "1"],
  ["NULL", "2"],
]
query = "SELECT g, HASH_AGG(*) OVER (PARTITION BY g) AS r FROM (SELECT g, a FROM input) ORDER BY g NULLS LAST, r"
order = "ordered"
tags = ["null"]
