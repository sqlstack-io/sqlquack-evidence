category = "translation"
construct = "sf.functions.bitand-agg.bitand-agg"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "12, 10 and 14 per group (1100, 1010, 1110). Catches: another bitwise operator"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "12"],
  ["'q'", "6"],
  ["'p'", "10"],
  ["'q'", "3"],
  ["'p'", "14"],
]
query = "SELECT g, BITAND_AGG(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_negative"
description = "A negative value in two's complement. Catches: the sign dropped (abs value) or a NUMBER(38) treated as unsigned"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["-6"],
  ["-3"],
]
query = "SELECT BITAND_AGG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_decimal"
description = "Halves, rounded to the nearest integer (half away from zero) before the operation. Catches: truncation (2.5 to 2) or half-to-even rounding"
columns = [{ name = "x", type = "NUMBER(10,1)" }]
rows = [
  ["2.5"],
  ["6.5"],
]
query = "SELECT BITAND_AGG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_float"
description = "FLOAT values just below and above a half. Catches: truncation instead of rounding"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["6.7"],
  ["1.2"],
]
query = "SELECT BITAND_AGG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_varchar"
description = "Numeric text and text that cannot be cast. The page says such text is treated as NULL, but Snowflake raises an error for the uncastable text (100038). Catches: the uncastable text treated as NULL or read as 0 instead of the error"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'6.6'"],
  ["'x'"],
  ["'3'"],
]
query = "SELECT BITAND_AGG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_null_expr1"
description = "NULL rows beside values, and a group of only NULL. Catches: NULL read as 0 (changing AND), or the NULL group 0"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "NULL"],
  ["'p'", "7"],
  ["'p'", "5"],
]
query = "SELECT g, BITAND_AGG(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_empty_input"
description = "No rows. Catches: 0 or -1 instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT BITAND_AGG(x) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
