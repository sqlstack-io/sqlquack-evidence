category = "translation"
construct = "sf.functions.datasketches-hll.datasketches-hll"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "Repeated values per group. Catches: duplicates counted, or an INTEGER result"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "3"],
  ["'q'", "7"],
  ["'p'", "1"],
  ["'q'", "7"],
  ["'p'", "3"],
  ["'p'", "3"],
  ["'p'", "2"],
]
query = "SELECT g, DATASKETCHES_HLL(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_max_log_k"
description = "An explicit max_log_k of 5. Catches: the argument rejected"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "3"],
  ["'q'", "7"],
  ["'p'", "1"],
  ["'q'", "7"],
  ["'p'", "3"],
  ["'p'", "3"],
  ["'p'", "2"],
]
query = "SELECT g, DATASKETCHES_HLL(x, 5) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_varchar"
description = "Text hashed as bytes: values differing in case or a leading zero are distinct. Catches: case-insensitive or numeric reading of text (01 and 1 as one value)"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'1'"],
  ["'01'"],
  ["'a'"],
  ["'A'"],
  ["'1'"],
]
query = "SELECT DATASKETCHES_HLL(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_scale"
description = "A NUMBER with a non-zero scale, which the page says is not supported. Catches: the value cast silently"
columns = [{ name = "x", type = "NUMBER(10,1)" }]
rows = [
  ["1.5"],
]
query = "SELECT DATASKETCHES_HLL(x) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t005_distinct"
description = "DISTINCT, which has no effect. Catches: DISTINCT rejected"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "3"],
  ["'q'", "7"],
  ["'p'", "1"],
  ["'q'", "7"],
  ["'p'", "3"],
  ["'p'", "3"],
  ["'p'", "2"],
]
query = "SELECT g, DATASKETCHES_HLL(DISTINCT x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["duplicates"]

[[case]]
id = "t006_null_expr1"
description = "NULL values, which are not counted. Catches: NULL counted"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "NULL"],
  ["'p'", "1"],
]
query = "SELECT g, DATASKETCHES_HLL(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_empty_input"
description = "No rows; the page gives 0.0. Catches: NULL instead of 0.0"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT DATASKETCHES_HLL(x) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
