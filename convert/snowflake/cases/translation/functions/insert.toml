category = "translation"
construct = "sf.functions.insert"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "Replace characters after a multi-byte character. Catches: a 0-based position, len ignored (pure insert), or byte offsets"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }, { name = "n", type = "NUMBER(38,0)" }, { name = "i", type = "VARCHAR" }]
rows = [
  ["'abcdef'", "2", "3", "'XY'"],
  ["'\u00e9abc'", "2", "1", "'Z'"],
]
query = "SELECT INSERT(a, p, n, i) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_append"
description = "An append at length+1 with len 0. Catches: an error, or insertion before the last character"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'abc'"],
]
query = "SELECT INSERT(a, 4, 0, 'Z') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_binary"
description = "INSERT on binary. Catches: hex text positions instead of bytes"
columns = [{ name = "a", type = "BINARY" }, { name = "i", type = "BINARY" }]
rows = [
  ["'000102'", "'FF'"],
]
query = "SELECT INSERT(a, 2, 1, i) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_base_expr"
description = "NULL base. Catches: NULL read as empty"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'ab'"],
]
query = "SELECT INSERT(a, 1, 0, 'x') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_pos"
description = "NULL position. Catches: NULL read as 1"
columns = [{ name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT INSERT('ab', p, 0, 'x') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_null_len"
description = "NULL length. Catches: NULL read as 0"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT INSERT('ab', 1, n, 'x') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_null_insert_expr"
description = "NULL insert string. Catches: NULL read as '' (a delete)"
columns = [{ name = "i", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["''"],
]
query = "SELECT INSERT('ab', 1, 1, i) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t008_delete"
description = "An empty insert string, which deletes. Catches: nothing deleted"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'abcdef'"],
]
query = "SELECT INSERT(a, 2, 3, '') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]
