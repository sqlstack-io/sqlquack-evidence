category = "translation"
construct = "sf.functions.regexp-substr-all"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "Matches after multi-byte characters, and no match. Catches: an anchored match, a byte-offset slice, or NULL instead of an empty array for no match"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "VARCHAR" }]
rows = [
  ["'\u00e912 ab345'", "'[0-9]+'"],
  ["'xyz'", "'[0-9]+'"],
]
query = "SELECT REGEXP_SUBSTR_ALL(a, p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_position_occurrence"
description = "Position and occurrence. Catches: occurrence counted from the string start, or ignored"
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a1b2c3d4'", "1", "2"],
  ["'a1b2c3d4'", "4", "2"],
  ["'a1b2c3d4'", "1", "9"],
]
query = "SELECT REGEXP_SUBSTR_ALL(a, '[0-9]', n, o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_group"
description = "The e parameter with the default and an explicit group. Catches: e ignored (the whole match returned) or the group number off by one"
columns = [{ name = "a", type = "VARCHAR" }, { name = "g", type = "NUMBER(38,0)" }]
rows = [
  ["'k1=v22 k2=v3'", "1"],
  ["'k1=v22 k2=v3'", "2"],
]
query = "SELECT REGEXP_SUBSTR_ALL(a, 'k([0-9])=v([0-9]+)', 1, 1, 'e') AS d, REGEXP_SUBSTR_ALL(a, 'k([0-9])=v([0-9]+)', 1, 1, 'e', g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_parameters"
description = "The i parameter. Catches: parameters ignored"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'xABCx'"],
]
query = "SELECT REGEXP_SUBSTR_ALL(a, 'abc', 1, 1, 'i') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_subject"
description = "NULL subject. Catches: NULL read as empty"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'a1'"],
]
query = "SELECT REGEXP_SUBSTR_ALL(a, '[0-9]') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_null_pattern"
description = "NULL pattern. Catches: NULL read as an empty pattern"
columns = [{ name = "p", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'b'"],
]
query = "SELECT REGEXP_SUBSTR_ALL('ab', p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_null_position"
description = "NULL position. Catches: NULL read as 1"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT REGEXP_SUBSTR_ALL('a1a2', 'a.', n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t008_null_occurrence"
description = "NULL occurrence. Catches: NULL read as 1"
columns = [{ name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT REGEXP_SUBSTR_ALL('a1a2', 'a.', 1, o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t009_null_regex_parameters"
description = "NULL parameters. Catches: NULL read as c"
columns = [{ name = "m", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'i'"],
]
query = "SELECT REGEXP_SUBSTR_ALL('xa', 'a', 1, 1, m) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t010_null_group_num"
description = "NULL group. Catches: NULL read as group 1"
columns = [{ name = "g", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT REGEXP_SUBSTR_ALL('k1=v1', 'k([0-9])', 1, 1, 'e', g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t011_empty"
description = "An empty subject. Catches: NULL instead of an empty array for an empty subject"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["''"],
]
query = "SELECT REGEXP_SUBSTR_ALL(a, '[0-9]+') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]
