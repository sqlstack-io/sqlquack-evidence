category = "translation"
construct = "sf.functions.hll-combine.hll-combine-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Two partitions: overlapping states {1, 2} and {2, 3} in one, and {5} alone in the other. Catches: PARTITION BY ignored (4 for every row) or the partition's estimates summed"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
  ["'r'", "5"],
]
query = "SELECT g, HLL_ESTIMATE(HLL_COMBINE(st) OVER (PARTITION BY k)) AS r FROM (SELECT g, IFF(g = 'r', 2, 1) AS k, st FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g)) ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_state"
description = "A NULL state inside a partition. Catches: the result NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT HLL_ESTIMATE(HLL_COMBINE(st) OVER ()) AS r FROM (SELECT st FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g) UNION ALL SELECT NULL) ORDER BY r"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_null_expr1"
description = "A NULL partition key. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT g, HLL_ESTIMATE(HLL_COMBINE(st) OVER (PARTITION BY k)) AS r FROM (SELECT g, NULL AS k, st FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g)) ORDER BY g"
order = "ordered"
tags = ["null"]
