category = "translation"
construct = "sf.functions.round.round"
session_profile = "utc-v1"

[[case]]
id = "t001_int"
description = "ROUND of integers with a negative scale. Catches: half-to-even (1400) instead of half away from zero (1500), or a negative scale ignored"
columns = [{ name = "x", type = "NUMBER(38,0)" }, { name = "s", type = "NUMBER(38,0)" }]
rows = [
  ["1450", "-2"],
  ["-1450", "-2"],
  ["1549", "-2"],
]
query = "SELECT ROUND(x, s) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_dec"
description = "ROUND of NUMBER(12,4) halves. Catches: banker's rounding (2.5 to 2) instead of half away from zero (3), or truncation"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["2.5000"],
  ["-2.5000"],
  ["3.5000"],
  ["1.4500"],
]
query = "SELECT ROUND(x, 0) AS r, ROUND(x, 1) AS s FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_float"
description = "ROUND of FLOAT halves exact in binary. Catches: half-to-even for FLOAT, or a NUMBER returned"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["2.5"],
  ["-2.5"],
  ["0.125"],
]
query = "SELECT ROUND(x, 0) AS r, ROUND(x, 2) AS s FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_decfloat"
description = "ROUND of DECFLOAT returns DECFLOAT. The result is cast to VARCHAR because the recorder cannot decode a DECFLOAT column. Catches: computed in FLOAT (1.005 rounds to 1.01 in DECFLOAT)"
columns = [{ name = "x", type = "DECFLOAT" }]
rows = [
  ["1.005"],
  ["-2.5"],
]
query = "SELECT CAST(ROUND(x, 2) AS VARCHAR) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_mode_even"
description = "rounding_mode 'HALF_TO_EVEN' on fixed-point. Catches: the mode ignored (2.5 to 3 instead of 2)"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["2.5000"],
  ["3.5000"],
  ["-2.5000"],
  ["0.0250"],
]
query = "SELECT ROUND(x, 0, 'HALF_TO_EVEN') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_mode_away"
description = "rounding_mode 'HALF_AWAY_FROM_ZERO' spelled out. Catches: the mode read as half-even (-0.0250 to -0.02 instead of -0.03)"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["0.2500"],
  ["-0.0250"],
]
query = "SELECT ROUND(x, 2, 'HALF_AWAY_FROM_ZERO') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t007_null_x"
description = "ROUND of NULL. Catches: NULL turned into 0"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["NULL"],
]
query = "SELECT ROUND(x, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t008_null_scale"
description = "ROUND with a NULL scale. Catches: the NULL scale read as 0"
columns = [{ name = "x", type = "NUMBER(12,4)" }, { name = "s", type = "NUMBER(38,0)" }]
rows = [
  ["2.5555", "NULL"],
]
query = "SELECT ROUND(x, s) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t009_scale"
description = "Scales past the input scale and a carry across digits. Catches: carry lost (9.995 to 9.99) or scale capped"
columns = [{ name = "x", type = "NUMBER(12,4)" }, { name = "s", type = "NUMBER(38,0)" }]
rows = [
  ["9.9950", "2"],
  ["12.3456", "8"],
  ["-0.0005", "3"],
]
query = "SELECT ROUND(x, s) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t010_max"
description = "Rounding 38-digit integers at scale -1, near the 38-digit limit. Catches: overflow to FLOAT"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["99999999999999999999999999999999999949"],
  ["-1234567890123456789012345678901234567"],
]
query = "SELECT ROUND(x, -1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t011_mode_float"
description = "A rounding_mode with a FLOAT input is an error. Catches: the mode applied to FLOAT instead of the documented error"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["2.5"],
]
query = "SELECT ROUND(x, 0, 'HALF_TO_EVEN') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t012_mode_bad"
description = "An unknown rounding_mode is an error. Catches: the mode ignored"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["2.5000"],
]
query = "SELECT ROUND(x, 0, 'HALF_UP') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
