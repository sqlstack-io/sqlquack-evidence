category = "translation"
construct = "sf.functions.st-envelope"
session_profile = "utc-v1"

[[case]]
id = "t001_geometry"
description = "The box of a triangle: x from 0 to 4, y from 0 to 3, area 12, with the SRID kept. Catches: the convex hull returned (area 6), or the SRID dropped"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,4 0,1 3,0 0))'"],
]
query = "SELECT ST_AREA(ST_ENVELOPE(TO_GEOMETRY(v, 3857))) AS a, ST_XMAX(ST_ENVELOPE(TO_GEOMETRY(v, 3857))) AS xmax, ST_YMAX(ST_ENVELOPE(TO_GEOMETRY(v, 3857))) AS ymax, ST_SRID(ST_ENVELOPE(TO_GEOMETRY(v, 3857))) AS srid FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_geography_point"
description = "A single GEOGRAPHY point, which the page says gives that point. Catches: a degenerate polygon returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POINT(10 20)'"],
]
query = "SELECT ST_DIMENSION(ST_ENVELOPE(TO_GEOGRAPHY(v))) AS dim, ST_X(ST_ENVELOPE(TO_GEOGRAPHY(v))) AS x FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_geography_or_geometry_expression"
description = "A NULL shape; the page does not say; the recording decides. Catches: an error, or a value returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_ENVELOPE(TO_GEOGRAPHY(v)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
