category = "translation"
construct = "sf.functions.bitmap-construct-agg"
session_profile = "utc-v1"

[[case]]
id = "t001_positions"
description = "Per bucket, positions with a duplicate. Catches: duplicates counted, or values not reduced to positions"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "5"],
  ["'p'", "5"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT g, BITMAP_BUCKET_NUMBER(x) AS bk, BITMAP_COUNT(BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x))) AS n, BITMAP_TO_ARRAY(BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x))) AS a FROM input GROUP BY g, bk ORDER BY g, bk"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_relative_position"
description = "NULL positions, which set no bit. Catches: NULL read as position 0"
columns = [{ name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["3"],
]
query = "SELECT BITMAP_TO_ARRAY(BITMAP_CONSTRUCT_AGG(p)) AS r FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_empty_input"
description = "No rows. Catches: an empty bitmap instead of NULL, or the reverse"
columns = [{ name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["3"],
]
query = "SELECT BITMAP_COUNT(BITMAP_CONSTRUCT_AGG(p)) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
