category = "translation"
construct = "sf.functions.object-construct"
session_profile = "utc-v1"

[[case]]
id = "t001_pairs"
description = "Three pairs of different value types. Catches: a pair dropped, or a value converted to text"
columns = [{ name = "k", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'c'", "3"],
]
query = "SELECT OBJECT_CONSTRUCT('a', 1.50, 'b', 'x', k, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_json_null"
description = "A JSON null value, which the page keeps. Catches: the JSON null pair omitted like a SQL NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'null'"],
]
query = "SELECT OBJECT_CONSTRUCT('a', PARSE_JSON(a), 'b', 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_value"
description = "A SQL NULL value and a SQL NULL key, whose pairs the page omits. Catches: the pairs kept with null values"
columns = [{ name = "k", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "NULL"],
]
query = "SELECT OBJECT_CONSTRUCT('a', x, 'b', 1) AS null_value, OBJECT_CONSTRUCT(k, 1, 'b', 1) AS null_key FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_star"
description = "OBJECT_CONSTRUCT(*) over the input row; the column names become keys. Catches: lower-case keys, or the NULL column kept"
columns = [{ name = "p", type = "NUMBER(38,0)" }, { name = "q", type = "VARCHAR" }]
rows = [
  ["1", "NULL"],
]
query = "SELECT OBJECT_CONSTRUCT(*) AS r FROM input"
order = "ordered"
tags = ["type-combination"]
