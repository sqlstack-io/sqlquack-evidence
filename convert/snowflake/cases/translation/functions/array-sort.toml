category = "translation"
construct = "sf.functions.array-sort"
session_profile = "utc-v1"

[[case]]
id = "t001_defaults"
description = "Ascending with the default NULL placement (last). Catches: SQL NULL elements first, or the input order kept"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT ARRAY_SORT(ARRAY_CONSTRUCT(3, x, 1, 2)) AS r FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["type-combination"]

[[case]]
id = "t002_descending"
description = "Descending, where the default puts SQL NULL elements first. Catches: SQL NULL elements left last when descending"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT ARRAY_SORT(ARRAY_CONSTRUCT(3, x, 1, 2), FALSE) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_nulls_first"
description = "Ascending with nulls_first TRUE, and descending with FALSE. Catches: nulls_first ignored"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT ARRAY_SORT(ARRAY_CONSTRUCT(3, x, 1, 2), TRUE, TRUE) AS a, ARRAY_SORT(ARRAY_CONSTRUCT(3, x, 1, 2), FALSE, FALSE) AS d FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_json_null"
description = "A JSON null sorted with nulls_first TRUE and FALSE; the page says the flag only moves SQL NULL elements. Catches: the JSON null moved by nulls_first (the two results differ)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[2,null,1]'"],
]
query = "SELECT ARRAY_SORT(PARSE_JSON(a), TRUE, TRUE) AS f, ARRAY_SORT(PARSE_JSON(a), TRUE, FALSE) AS l FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_array"
description = "A NULL array and a NULL sort_ascending. Catches: the default order used for a NULL flag"
columns = [{ name = "a", type = "VARCHAR" }, { name = "o", type = "BOOLEAN" }]
rows = [
  ["NULL", "TRUE"],
  ["'[2,1]'", "NULL"],
]
query = "SELECT ARRAY_SORT(PARSE_JSON(a), o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
