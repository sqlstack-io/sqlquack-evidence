category = "translation"
construct = "sf.functions.array-construct"
session_profile = "utc-v1"

[[case]]
id = "t001_mixed_types"
description = "Arguments of four types in one array. Catches: every element converted to text, or the order changed"
columns = [{ name = "n", type = "NUMBER(10,2)" }, { name = "t", type = "VARCHAR" }, { name = "b", type = "BOOLEAN" }, { name = "d", type = "DATE" }]
rows = [
  ["1.25", "'x'", "TRUE", "'2024-02-29'"],
]
query = "SELECT ARRAY_CONSTRUCT(n, t, b, d) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_no_arguments"
description = "No arguments. Catches: NULL returned instead of an empty array"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT ARRAY_CONSTRUCT() AS r, ARRAY_SIZE(ARRAY_CONSTRUCT()) AS n FROM input"
order = "ordered"
tags = ["empty-input"]

[[case]]
id = "t003_null_expr1"
description = "A SQL NULL argument, which stays an undefined element, beside a JSON null. Catches: the SQL NULL dropped (size 2) or the two nulls made the same element"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT ARRAY_CONSTRUCT(x, PARSE_JSON('null'), 7) AS r, ARRAY_SIZE(ARRAY_CONSTRUCT(x, PARSE_JSON('null'), 7)) AS n FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["null"]
