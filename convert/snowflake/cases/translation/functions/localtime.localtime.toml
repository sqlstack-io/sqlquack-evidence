category = "translation"
construct = "sf.functions.localtime.localtime"
session_profile = "utc-v1"

[[case]]
id = "t001_type"
description = "The type, and agreement with the time of CURRENT_TIMESTAMP in the UTC session to within a minute. Catches: a timestamp returned, or the time taken in another zone"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT TYPEOF(LOCALTIME()::VARIANT) AS t, ABS(DATEDIFF(second, LOCALTIME(), CURRENT_TIMESTAMP()::TIME)) < 60 AS close FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_none"
description = "The function takes no argument; a NULL value compared with its result gives NULL. Catches: the comparison with NULL returning FALSE, or the NULL replaced by the current value"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["NULL"],
  ["'2026-01-01'"],
]
query = "SELECT ordinal, d::TIMESTAMP_NTZ::TIME < LOCALTIME() AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
