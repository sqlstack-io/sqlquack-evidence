category = "translation"
construct = "sf.functions.st-intersection-agg"
session_profile = "utc-v1"

[[case]]
id = "t001_rows"
description = "Bands over longitudes 0-2, 1-3 and 1.5-4, whose intersection is a quarter of the first (0.25). Catches: the union returned, or only two rows intersected (0.5)"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,2 0,2 2,0 2,0 0))'"],
  ["'POLYGON((1 0,3 0,3 2,1 2,1 0))'"],
  ["'POLYGON((1.5 0,4 0,4 2,1.5 2,1.5 0))'"],
]
query = "SELECT ROUND(ST_AREA(ST_INTERSECTION_AGG(TO_GEOGRAPHY(v))) / ST_AREA(TO_GEOGRAPHY('POLYGON((0 0,2 0,2 2,0 2,0 0))')), 2) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_geography_column"
description = "A NULL row next to two bands; the page does not say; the recording decides. Catches: an error"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'POLYGON((0 0,2 0,2 2,0 2,0 0))'"],
  ["'POLYGON((1 0,3 0,3 2,1 2,1 0))'"],
]
query = "SELECT ST_INTERSECTION_AGG(TO_GEOGRAPHY(v)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
