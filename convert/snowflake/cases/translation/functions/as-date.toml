category = "translation"
construct = "sf.functions.as-date"
session_profile = "utc-v1"

[[case]]
id = "t001_match"
description = "A DATE cast to VARIANT, on a leap day. Catches: the date shifted a day, or returned as text"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["'2024-02-29'"],
  ["'1970-01-01'"],
]
query = "SELECT AS_DATE(d::VARIANT) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_mismatch"
description = "A string holding a date and a number. Catches: date text parsed (TO_DATE), or a number read as days since the epoch"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'\"2024-02-29\"'"],
  ["'19782'"],
]
query = "SELECT AS_DATE(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_timestamp"
description = "A TIMESTAMP_NTZ cast to VARIANT; the page returns NULL when the type is not DATE. Catches: the timestamp truncated to its date"
columns = [{ name = "n", type = "TIMESTAMP_NTZ" }]
rows = [
  ["'2024-02-29 13:14:15'"],
]
query = "SELECT AS_DATE(n::VARIANT) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_variant_expr"
description = "A SQL NULL and a JSON null; the page returns NULL for a NULL argument and for a type that does not match. Catches: the JSON null passed through as a value, or an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'null'"],
]
query = "SELECT AS_DATE(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
