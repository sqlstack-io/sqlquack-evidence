category = "translation"
construct = "sf.functions.is-double-real.is-double"
session_profile = "utc-v1"

[[case]]
id = "t001_json"
description = "IS_DOUBLE over JSON arrays, objects, strings (one holding a date), integers, decimals, exponent numbers, booleans and a JSON null. Catches: FALSE for the integer or the decimal (only floating-point values accepted)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[1]'"],
  ["'{\"a\":1}'"],
  ["'\"x\"'"],
  ["'\"2024-02-29\"'"],
  ["'5'"],
  ["'1.50'"],
  ["'1.5e0'"],
  ["'true'"],
  ["'null'"],
]
query = "SELECT IS_DOUBLE(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_typed"
description = "IS_DOUBLE over a DATE, TIME, three timestamps, BINARY, DOUBLE and NUMBER(10,2), each cast to VARIANT. Catches: FALSE for NUMBER(10,2)"
columns = [{ name = "d", type = "DATE" }, { name = "t", type = "TIME" }, { name = "n", type = "TIMESTAMP_NTZ" }, { name = "z", type = "TIMESTAMP_TZ" }, { name = "l", type = "TIMESTAMP_LTZ" }, { name = "b", type = "BINARY" }, { name = "f", type = "DOUBLE" }, { name = "k", type = "NUMBER(10,2)" }]
rows = [
  ["'2024-02-29'", "'13:14:15.123'", "'2024-02-29 13:14:15.123'", "'2024-02-29 13:14:15.123 -08:00'", "'2024-02-29 13:14:15.123'", "'ABCD'", "1.5", "2.50"],
]
query = "SELECT IS_DOUBLE(d::VARIANT) AS d, IS_DOUBLE(t::VARIANT) AS t, IS_DOUBLE(n::VARIANT) AS n, IS_DOUBLE(z::VARIANT) AS z, IS_DOUBLE(l::VARIANT) AS l, IS_DOUBLE(b::VARIANT) AS b, IS_DOUBLE(f::VARIANT) AS f, IS_DOUBLE(k::VARIANT) AS k FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_variant_expr"
description = "A SQL NULL, which the page says returns NULL without an error. Catches: FALSE returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT IS_DOUBLE(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
