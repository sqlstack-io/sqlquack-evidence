category = "translation"
construct = "sf.functions.st-x"
session_profile = "utc-v1"

[[case]]
id = "t001_point"
description = "A point with distinct coordinates, as GEOGRAPHY and GEOMETRY. Catches: the other coordinate returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POINT(10 20)'"],
]
query = "SELECT ST_X(TO_GEOGRAPHY(v)) AS g, ST_X(TO_GEOMETRY(v)) AS m FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_not_point"
description = "A line string, which the page says is an error. Catches: the first vertex used"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'LINESTRING(0 0,1 2,3 4)'"],
]
query = "SELECT ST_X(TO_GEOGRAPHY(v)) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t003_null_geography_or_geometry_expression"
description = "A NULL shape; the page does not say; the recording decides. Catches: an error, or a value returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_X(TO_GEOGRAPHY(v)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
