category = "translation"
construct = "sf.functions.get"
session_profile = "utc-v1"

[[case]]
id = "t001_array_index"
description = "Indexes 0 and 2 of a three-element array. Catches: a 1-based index (20 for 0, NULL for 2)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "i", type = "NUMBER(38,0)" }]
rows = [
  ["'[10,20,30]'", "0"],
  ["'[10,20,30]'", "2"],
]
query = "SELECT GET(PARSE_JSON(a), i) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_out_of_range"
description = "An index equal to the length and a negative index; the page returns NULL outside the array. Catches: an error, or a negative index counted from the end"
columns = [{ name = "a", type = "VARCHAR" }, { name = "i", type = "NUMBER(38,0)" }]
rows = [
  ["'[10,20,30]'", "3"],
  ["'[10,20,30]'", "-1"],
]
query = "SELECT GET(PARSE_JSON(a), i) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_field_case"
description = "Keys differing only in case; the page says matching is case-sensitive. Catches: a case-insensitive match (1 for \"A\" on the second row)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "k", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1,\"A\":2}'", "'A'"],
  ["'{\"a\":1}'", "'A'"],
]
query = "SELECT GET(PARSE_JSON(a), k) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_kind_mismatch"
description = "An index into an object and a field name on an array; the page returns NULL for both. Catches: the object's first value returned for index 0, or an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1}'"],
]
query = "SELECT GET(PARSE_JSON(a), 0) AS by_index, GET(PARSE_JSON('[1]'), 'a') AS by_name FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_map"
description = "A MAP with the key present and absent. Catches: an error for the absent key"
columns = [{ name = "k", type = "VARCHAR" }]
rows = [
  ["'b'"],
  ["'z'"],
]
query = "SELECT GET(MAP_CONSTRUCT('a', 1, 'b', 2), k) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_null_object"
description = "A NULL container and a NULL field name; the page does not say; the recording decides. Catches: an error, or the NULL name read as an empty key"
columns = [{ name = "a", type = "VARCHAR" }, { name = "k", type = "VARCHAR" }]
rows = [
  ["NULL", "'a'"],
  ["'{\"a\":1}'", "NULL"],
]
query = "SELECT GET(PARSE_JSON(a), k) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
