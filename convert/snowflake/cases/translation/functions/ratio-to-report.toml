category = "translation"
construct = "sf.functions.ratio-to-report"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Values over two partitions, with NULL values. Catches: the sum taken over all rows, or NULL values counted as 0 in the result row"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1", "NULL"],
  ["'a'", "2", "10"],
  ["'a'", "4", "NULL"],
  ["'a'", "5", "40"],
  ["'a'", "7", "NULL"],
  ["'b'", "1", "7"],
  ["'b'", "3", "9"],
]
query = "SELECT ordinal, RATIO_TO_REPORT(x) OVER (PARTITION BY p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_order_by"
description = "The same with ORDER BY, which the page says does not change the result. Catches: a running sum used"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1", "NULL"],
  ["'a'", "2", "10"],
  ["'a'", "4", "NULL"],
  ["'a'", "5", "40"],
  ["'a'", "7", "NULL"],
  ["'b'", "1", "7"],
  ["'b'", "3", "9"],
]
query = "SELECT ordinal, RATIO_TO_REPORT(x) OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_zero_sum"
description = "A partition whose values sum to zero, for which the page gives NULL. Catches: a division-by-zero error, or 0 or infinity returned"
columns = [{ name = "p", type = "VARCHAR" }, { name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["'a'", "1.5"],
  ["'a'", "-1.5"],
]
query = "SELECT ordinal, RATIO_TO_REPORT(x) OVER (PARTITION BY p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr1"
description = "A partition whose values are all NULL; the page does not say; the recording decides. Catches: an error, or 0 returned"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'c'", "1", "NULL"],
  ["'c'", "2", "NULL"],
  ["'a'", "1", "4"],
]
query = "SELECT ordinal, RATIO_TO_REPORT(x) OVER (PARTITION BY p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
