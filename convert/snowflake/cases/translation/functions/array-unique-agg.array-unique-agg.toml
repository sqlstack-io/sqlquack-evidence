category = "translation"
construct = "sf.functions.array-unique-agg.array-unique-agg"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "Repeated values per group. Catches: duplicates kept (ARRAY_AGG semantics)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "3"],
  ["'q'", "2"],
  ["'p'", "1"],
  ["'p'", "3"],
]
query = "SELECT g, ARRAY_SORT(ARRAY_UNIQUE_AGG(x)) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "Values that differ only in case. Catches: case-insensitive uniqueness"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'a'"],
  ["'A'"],
  ["'a'"],
]
query = "SELECT ARRAY_SORT(ARRAY_UNIQUE_AGG(x)) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_column"
description = "NULL values, which are ignored, and a group of only NULL. Catches: NULL kept as an element, or the all-NULL group giving NULL instead of []"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "NULL"],
  ["'p'", "2"],
]
query = "SELECT g, ARRAY_SORT(ARRAY_UNIQUE_AGG(x)) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_empty_input"
description = "No rows; the page gives an empty array. Catches: NULL instead of []"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT ARRAY_UNIQUE_AGG(x) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
