category = "translation"
construct = "sf.functions.h3-cell-to-point"
session_profile = "utc-v1"

[[case]]
id = "t001_integer"
description = "The centroid of C, rounded to 6 places. Catches: a boundary vertex returned instead of the centroid, or longitude and latitude swapped"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["617700169957507071"],
]
query = "SELECT ROUND(ST_X(H3_CELL_TO_POINT(c)), 6) AS x, ROUND(ST_Y(H3_CELL_TO_POINT(c)), 6) AS y FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "The hexadecimal ID of the same cell, whose WKT equals that of the INTEGER result. Catches: the text read as a decimal number"
columns = [{ name = "c", type = "VARCHAR" }]
rows = [
  ["'89283082803ffff'"],
]
query = "SELECT (ST_ASWKT(H3_CELL_TO_POINT(c)) = ST_ASWKT(H3_CELL_TO_POINT(617700169957507071))) AS same FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_cell_id"
description = "A NULL ID; the page does not say; the recording decides. Catches: an error"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT H3_CELL_TO_POINT(c) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
