category = "translation"
construct = "sf.functions.split-part"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "Parts by positive and negative numbers with a multi-character delimiter. Catches: the delimiter read as a character set (STRTOK), a 0-based part, or negative parts rejected"
columns = [{ name = "a", type = "VARCHAR" }, { name = "d", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'a.@b.c'", "'.@'", "2"],
  ["'a,b,c'", "','", "-1"],
  ["'\u00e9,\u00fc'", "','", "2"],
]
query = "SELECT SPLIT_PART(a, d, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_part_zero"
description = "Part 0, which the page says is treated as 1. Catches: NULL or an empty string for 0"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'x,y'"],
]
query = "SELECT SPLIT_PART(a, ',', 0) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_string"
description = "NULL string. Catches: NULL read as empty"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'a'"],
]
query = "SELECT SPLIT_PART(a, ',', 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_delimiter"
description = "NULL delimiter. Catches: NULL read as empty"
columns = [{ name = "d", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["','"],
]
query = "SELECT SPLIT_PART('a,b', d, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_partnumber"
description = "NULL part. Catches: NULL read as 1"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT SPLIT_PART('a,b', ',', n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_empty_parts"
description = "Leading and trailing delimiters and an empty delimiter. Catches: empty parts skipped (STRTOK semantics) or the empty delimiter splitting characters"
columns = [{ name = "a", type = "VARCHAR" }, { name = "d", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["',a,'", "','", "1"],
  ["',a,'", "','", "3"],
  ["'a,b'", "''", "1"],
]
query = "SELECT SPLIT_PART(a, d, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]

[[case]]
id = "t007_out_of_range"
description = "Part numbers past either end. Catches: NULL instead of '' or a clamped part"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["4"],
  ["-4"],
]
query = "SELECT SPLIT_PART('a,b,c', ',', n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
