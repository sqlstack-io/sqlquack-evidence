category = "translation"
construct = "sf.functions.h3-cell-to-boundary"
session_profile = "utc-v1"

[[case]]
id = "t001_integer"
description = "A hexagon and a pentagon, measured by their point counts and by containing their own centre. Catches: the centroid returned instead of the boundary, or every cell drawn as a hexagon"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["617700169957507071"],
  ["576636674163867647"],
]
query = "SELECT ordinal, ST_NPOINTS(H3_CELL_TO_BOUNDARY(c)) AS points, ST_CONTAINS(H3_CELL_TO_BOUNDARY(c), H3_CELL_TO_POINT(c)) AS inside FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "The hexadecimal ID of the same hexagon, whose WKT equals that of the INTEGER result. Catches: the text read as a decimal number"
columns = [{ name = "c", type = "VARCHAR" }]
rows = [
  ["'89283082803ffff'"],
]
query = "SELECT (ST_ASWKT(H3_CELL_TO_BOUNDARY(c)) = ST_ASWKT(H3_CELL_TO_BOUNDARY(617700169957507071))) AS same FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_cell_id"
description = "A NULL ID; the page does not say; the recording decides. Catches: an error, or an empty shape returned"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT H3_CELL_TO_BOUNDARY(c) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
