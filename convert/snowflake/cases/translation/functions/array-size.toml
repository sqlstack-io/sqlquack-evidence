category = "translation"
construct = "sf.functions.array-size"
session_profile = "utc-v1"

[[case]]
id = "t001_nested"
description = "A nested array counts as one element; an empty array. Catches: nested elements counted, or NULL for []"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[1,[2,3]]'"],
  ["'[]'"],
  ["'[null,null]'"],
]
query = "SELECT ARRAY_SIZE(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_sparse"
description = "An array padded with undefined elements by ARRAY_INSERT past its end. Catches: only the defined elements counted (2 instead of 4)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT ARRAY_SIZE(ARRAY_INSERT(ARRAY_CONSTRUCT(x), 3, 'y'::VARIANT)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_object"
description = "A VARIANT holding an object and one holding a number; the page says a VARIANT that does not hold an array returns NULL. Catches: the object's key count returned, or 1 for the number"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1,\"b\":2}'"],
  ["'5'"],
]
query = "SELECT ARRAY_SIZE(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_array"
description = "A NULL argument. Catches: 0 returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ARRAY_SIZE(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
