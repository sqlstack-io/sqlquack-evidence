category = "translation"
construct = "sf.functions.datasketches-hll-accumulate"
session_profile = "utc-v1"

[[case]]
id = "t001_estimate"
description = "Sketches per group, read with DATASKETCHES_HLL_ESTIMATE. Catches: duplicates counted"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "3"],
  ["'q'", "7"],
  ["'p'", "1"],
  ["'q'", "7"],
  ["'p'", "3"],
  ["'p'", "3"],
  ["'p'", "2"],
]
query = "SELECT g, DATASKETCHES_HLL_ESTIMATE(DATASKETCHES_HLL_ACCUMULATE(x)) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_float"
description = "FLOAT values, hashed as DOUBLE: 1.0 and 1.5 are two values. Catches: values truncated to integers"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["1.0"],
  ["1.5"],
  ["1.0"],
]
query = "SELECT DATASKETCHES_HLL_ESTIMATE(DATASKETCHES_HLL_ACCUMULATE(x)) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_max_log_k"
description = "An explicit max_log_k of 10. Catches: the argument rejected"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "3"],
  ["'q'", "7"],
  ["'p'", "1"],
  ["'q'", "7"],
  ["'p'", "3"],
  ["'p'", "3"],
  ["'p'", "2"],
]
query = "SELECT g, DATASKETCHES_HLL_ESTIMATE(DATASKETCHES_HLL_ACCUMULATE(x, 10)) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr"
description = "NULL values, which are not counted. Catches: NULL counted"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT DATASKETCHES_HLL_ESTIMATE(DATASKETCHES_HLL_ACCUMULATE(x)) AS r FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_empty_input"
description = "No rows. Catches: a NULL sketch (a NULL estimate) instead of an empty one, or the reverse"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT DATASKETCHES_HLL_ESTIMATE(DATASKETCHES_HLL_ACCUMULATE(x)) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
