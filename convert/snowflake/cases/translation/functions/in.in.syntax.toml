category = "translation"
construct = "sf.functions.in.in.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_rows"
description = "Rows matching on both columns and on one only. Catches: a match on one column counted"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["1", "'x'"],
  ["1", "'y'"],
  ["2", "'y'"],
]
query = "SELECT (a, b) IN ((1, 'x'), (2, 'y')) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_not"
description = "Row NOT IN. Catches: NOT dropped"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["1", "'x'"],
  ["3", "'x'"],
]
query = "SELECT (a, b) NOT IN ((1, 'x')) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_value_a"
description = "A NULL component. Catches: TRUE or FALSE instead of NULL when the other component matches"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["NULL", "'x'"],
  ["NULL", "'q'"],
]
query = "SELECT (a, b) IN ((1, 'x')) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
