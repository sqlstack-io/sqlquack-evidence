category = "translation"
construct = "sf.functions.bitnot"
session_profile = "utc-v1"

[[case]]
id = "t001_integers"
description = "Zero, a positive and a negative integer. Catches: a logical NOT, or an unsigned result"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["0"],
  ["5"],
  ["-1"],
]
query = "SELECT BITNOT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_binary"
description = "Bytes negated. Catches: the bytes read as an integer"
columns = [{ name = "b", type = "BINARY" }]
rows = [
  ["'F00F'"],
]
query = "SELECT BITNOT(b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr"
description = "A NULL. Catches: the NULL read as 0 (-1 returned)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT BITNOT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
