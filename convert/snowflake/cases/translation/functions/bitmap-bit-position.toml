category = "translation"
construct = "sf.functions.bitmap-bit-position"
session_profile = "utc-v1"

[[case]]
id = "t001_edges"
description = "Values at both sides of the bucket edges, 0 and a negative value. Catches: x mod 32768 (32768 at position 0) or a one-based position"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["32768"],
  ["32769"],
  ["65536"],
  ["0"],
  ["-1"],
  ["100000"],
]
query = "SELECT BITMAP_BIT_POSITION(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_numeric_expr"
description = "NULL value. Catches: 0 instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["5"],
]
query = "SELECT BITMAP_BIT_POSITION(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
