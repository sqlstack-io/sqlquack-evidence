category = "translation"
construct = "sf.functions.decode"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "Matches, a repeated search and the default. Catches: the last match winning, or the default missed"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["2"],
  ["9"],
]
query = "SELECT DECODE(x, 1, 'one', 2, 'two', 1, 'uno', 'other') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_no_default"
description = "No default argument, with an even number of trailing arguments. Catches: the last result read as the default"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["3"],
  ["2"],
]
query = "SELECT DECODE(x, 1, 'one', 2, 'two') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr"
description = "NULL expr against a NULL search, which the page says matches. Catches: CASE semantics (NULL never matches: the default)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT DECODE(x, 1, 'one', NULL, 'null', 'other') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_result"
description = "A NULL result selected. Catches: the default instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["2"],
]
query = "SELECT DECODE(x, 1, NULL, 'other') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
