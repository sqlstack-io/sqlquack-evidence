category = "translation"
construct = "sf.functions.log"
session_profile = "utc-v1"

[[case]]
id = "t001_int"
description = "LOG of integers. Catches: arguments swapped (LOG(2, 8) is 3, LOG(8, 2) is 1/3) or LN used"
columns = [{ name = "b", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["2", "8"],
  ["10", "1000"],
  ["3", "2"],
]
query = "SELECT LOG(b, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_dec"
description = "LOG of fixed-point values. Catches: base rounded to an integer"
columns = [{ name = "b", type = "NUMBER(10,2)" }, { name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["2.50", "6.25"],
  ["0.50", "8.00"],
]
query = "SELECT LOG(b, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_float"
description = "LOG of FLOAT values. Catches: arguments swapped (LOG(10, 0.001) is -3, LOG(0.001, 10) is -1/3) or a non-FLOAT result type"
columns = [{ name = "b", type = "FLOAT" }, { name = "x", type = "FLOAT" }]
rows = [
  ["2.718281828459045", "10"],
  ["10", "0.001"],
]
query = "SELECT LOG(b, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_mixed"
description = "LOG with an integer base and a FLOAT value. Catches: type promotion differing"
columns = [{ name = "b", type = "NUMBER(38,0)" }, { name = "x", type = "FLOAT" }]
rows = [
  ["2", "0.25"],
  ["10", "12345.678"],
]
query = "SELECT LOG(b, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_base"
description = "NULL base. Catches: NULL turned into e or 10"
columns = [{ name = "b", type = "FLOAT" }, { name = "x", type = "FLOAT" }]
rows = [
  ["NULL", "8"],
]
query = "SELECT LOG(b, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_null_expr"
description = "NULL value. Catches: NULL turned into 1"
columns = [{ name = "b", type = "FLOAT" }, { name = "x", type = "FLOAT" }]
rows = [
  ["2", "NULL"],
]
query = "SELECT LOG(b, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_base_below_one"
description = "A base between 0 and 1 gives negative logs of values above 1. Catches: the sign lost"
columns = [{ name = "b", type = "FLOAT" }, { name = "x", type = "FLOAT" }]
rows = [
  ["0.5", "8"],
  ["0.1", "0.001"],
]
query = "SELECT LOG(b, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t008_base_one"
description = "A base of 1 is an error. Catches: infinity or NULL instead of the error"
columns = [{ name = "b", type = "FLOAT" }, { name = "x", type = "FLOAT" }]
rows = [
  ["1", "8"],
]
query = "SELECT LOG(b, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t009_base_neg"
description = "A negative base is an error. Catches: NaN instead of the error"
columns = [{ name = "b", type = "FLOAT" }, { name = "x", type = "FLOAT" }]
rows = [
  ["-2", "8"],
]
query = "SELECT LOG(b, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t010_expr_zero"
description = "A value of 0 is an error. Catches: -infinity instead of the error"
columns = [{ name = "b", type = "FLOAT" }, { name = "x", type = "FLOAT" }]
rows = [
  ["2", "0"],
]
query = "SELECT LOG(b, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
