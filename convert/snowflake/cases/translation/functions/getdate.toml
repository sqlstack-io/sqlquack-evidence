category = "translation"
construct = "sf.functions.getdate"
session_profile = "utc-v1"

[[case]]
id = "t001_type"
description = "The type, which the page says is TIMESTAMP_LTZ whatever TIMESTAMP_TYPE_MAPPING says (NTZ here), and agreement with SYSDATE in the UTC session to within a minute. Catches: TIMESTAMP_NTZ returned under the type mapping, or the time taken in another zone"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT TYPEOF(GETDATE()::VARIANT) AS t, ABS(DATEDIFF(second, GETDATE()::TIMESTAMP_NTZ, SYSDATE())) < 60 AS close FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_precision_arg"
compile_error = true
description = "A precision argument, which the page says this alias does not support. Catches: the argument accepted as for CURRENT_TIMESTAMP"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT GETDATE(3) IS NULL AS n FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t003_null_none"
description = "The function takes no argument; a NULL value compared with its result gives NULL. Catches: the comparison with NULL returning FALSE, or the NULL replaced by the current value"
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["NULL"],
  ["'2026-01-01'"],
]
query = "SELECT ordinal, d::TIMESTAMP_NTZ < GETDATE() AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
