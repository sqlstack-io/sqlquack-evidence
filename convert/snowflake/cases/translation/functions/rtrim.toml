category = "translation"
construct = "sf.functions.rtrim"
session_profile = "utc-v1"

[[case]]
id = "t001_characters"
description = "RTRIM with a character set given out of order. Catches: the set read as a substring, or characters removed from the left as well"
columns = [{ name = "a", type = "VARCHAR" }, { name = "c", type = "VARCHAR" }]
rows = [
  ["'xyyxabcxy'", "'yx'"],
  ["'$.$a.b$.'", "'.$'"],
  ["'\u00e9a\u00e9'", "'\u00e9'"],
]
query = "SELECT RTRIM(a, c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_default"
description = "RTRIM with the default blank, beside tabs and newlines. Catches: all whitespace removed (the tab and newline kept by Snowflake)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'  ab  '"],
  ["CHR(9) || ' ab ' || CHR(10)"],
]
query = "SELECT RTRIM(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr"
description = "NULL string. Catches: NULL read as empty"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["' a '"],
]
query = "SELECT RTRIM(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_characters"
description = "NULL character set. Catches: NULL read as the default blank"
columns = [{ name = "c", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'x'"],
]
query = "SELECT RTRIM(' xax ', c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_empty"
description = "An empty character set, and a string made only of trimmed characters. Catches: an empty set read as the default blank, or NULL for a fully trimmed string"
columns = [{ name = "a", type = "VARCHAR" }, { name = "c", type = "VARCHAR" }]
rows = [
  ["' a '", "''"],
  ["'xxx'", "'x'"],
]
query = "SELECT RTRIM(a, c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]
