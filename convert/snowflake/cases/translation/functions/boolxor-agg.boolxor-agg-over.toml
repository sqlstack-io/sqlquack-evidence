category = "translation"
construct = "sf.functions.boolxor-agg.boolxor-agg-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Partitions with one and with three TRUE values. Catches: parity, or the whole input"
columns = [{ name = "g", type = "VARCHAR" }, { name = "b", type = "BOOLEAN" }]
rows = [
  ["'p'", "TRUE"],
  ["'q'", "TRUE"],
  ["'p'", "FALSE"],
  ["'q'", "TRUE"],
  ["'q'", "TRUE"],
]
query = "SELECT BOOLXOR_AGG(b) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_empty_over"
description = "An empty OVER clause. Catches: a running value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "b", type = "BOOLEAN" }]
rows = [
  ["'p'", "TRUE"],
  ["'p'", "TRUE"],
]
query = "SELECT BOOLXOR_AGG(b) OVER () AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr"
description = "NULL inside partitions, and a partition of only NULL. Catches: NULL read as TRUE (two TRUE values give FALSE)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "b", type = "BOOLEAN" }]
rows = [
  ["'p'", "NULL"],
  ["'p'", "TRUE"],
  ["'q'", "NULL"],
]
query = "SELECT BOOLXOR_AGG(b) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_partition_expr"
description = "NULL partition keys. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "b", type = "BOOLEAN" }]
rows = [
  ["NULL", "TRUE"],
  ["'p'", "FALSE"],
  ["NULL", "TRUE"],
]
query = "SELECT BOOLXOR_AGG(b) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
