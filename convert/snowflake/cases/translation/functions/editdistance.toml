category = "translation"
construct = "sf.functions.editdistance"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "Levenshtein distances that differ from Hamming and LCS distances. Catches: Hamming or LCS distance, a byte-based distance (2 for caf\u00e9/cafe), or transpositions counted as 1"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'kitten'", "'sitting'"],
  ["'flaw'", "'lawn'"],
  ["'caf\u00e9'", "'cafe'"],
  ["'ab'", "'ba'"],
]
query = "SELECT EDITDISTANCE(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_max_distance"
description = "A maximum below and above the distance. Catches: the maximum ignored (3 instead of 2) or applied when above the distance"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }, { name = "m", type = "NUMBER(38,0)" }]
rows = [
  ["'kitten'", "'sitting'", "2"],
  ["'kitten'", "'sitting'", "9"],
]
query = "SELECT EDITDISTANCE(a, b, m) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_string_expr1"
description = "NULL first string. Catches: NULL read as an empty string (the other length)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["NULL", "'abc'"],
  ["'ab'", "'abc'"],
]
query = "SELECT EDITDISTANCE(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_string_expr2"
description = "NULL second string. Catches: NULL read as an empty string"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'abc'", "NULL"],
  ["'abc'", "'abd'"],
]
query = "SELECT EDITDISTANCE(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_max_distance"
description = "NULL maximum. Catches: NULL read as no maximum (the full distance instead of NULL)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }, { name = "m", type = "NUMBER(38,0)" }]
rows = [
  ["'abc'", "'xyz'", "NULL"],
  ["'abc'", "'xyz'", "1"],
]
query = "SELECT EDITDISTANCE(a, b, m) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_negative_max"
description = "A negative maximum, which the page says gives 0. Catches: the negative maximum returned or ignored"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }, { name = "m", type = "NUMBER(38,0)" }]
rows = [
  ["'abc'", "'xyz'", "-2"],
]
query = "SELECT EDITDISTANCE(a, b, m) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t007_empty"
description = "An empty string against a set one. Catches: NULL or 0 instead of the other length"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["''", "'abcd'"],
  ["''", "''"],
]
query = "SELECT EDITDISTANCE(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]
