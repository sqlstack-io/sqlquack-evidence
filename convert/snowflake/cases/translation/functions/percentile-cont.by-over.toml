category = "translation"
construct = "sf.functions.percentile-cont.by-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Per-partition percentile. Catches: the closest value instead of the interpolation (1 and 3 instead of 4 and 5), or the whole input (3.5)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "2", "20"],
  ["'q'", "5", "3"],
  ["'p'", "1", "10"],
  ["'p'", "3", "1"],
  ["'q'", "1", "11"],
  ["'p'", "2", "5"],
]
query = "SELECT PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_empty_over"
description = "An empty OVER clause. Catches: a running value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "2", "20"],
  ["'q'", "5", "3"],
  ["'p'", "1", "10"],
  ["'p'", "3", "1"],
  ["'q'", "1", "7"],
  ["'p'", "2", "5"],
]
query = "SELECT PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY x DESC) OVER () AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_order_by_expr"
description = "NULL values inside a partition. Catches: NULL counted"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1", "NULL"],
  ["'p'", "2", "6"],
  ["'p'", "3", "2"],
  ["'q'", "1", "NULL"],
]
query = "SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_partition_key"
description = "NULL partition keys. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1", "4"],
  ["'p'", "1", "9"],
  ["NULL", "2", "2"],
]
query = "SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY x) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
