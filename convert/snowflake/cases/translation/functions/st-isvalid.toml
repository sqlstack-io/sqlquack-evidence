category = "translation"
construct = "sf.functions.st-isvalid"
session_profile = "utc-v1"

[[case]]
id = "t001_shapes"
description = "A self-intersecting polygon loaded with allow_invalid, and a valid square. Catches: every loaded shape reported valid"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,10 10,10 0,0 10,0 0))'"],
  ["'POLYGON((0 0,10 0,10 10,0 10,0 0))'"],
]
query = "SELECT ordinal, ST_ISVALID(TO_GEOGRAPHY(v, TRUE)) AS g, ST_ISVALID(TO_GEOMETRY(v, TRUE)) AS m FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_geography_or_geometry_expression"
description = "A NULL shape; the page does not say; the recording decides. Catches: an error, or a value returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_ISVALID(TO_GEOGRAPHY(v)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
