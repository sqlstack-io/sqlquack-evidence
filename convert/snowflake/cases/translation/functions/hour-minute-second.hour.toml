category = "translation"
construct = "sf.functions.hour-minute-second.hour"
session_profile = "utc-v1"

[[case]]
id = "t001_time"
description = "HOUR of times with fractional seconds. Catches: fractional seconds rounded up, or a 12-hour clock"
columns = [{ name = "t", type = "TIME" }]
rows = [
  ["'22:59:59.999'"],
  ["'00:00:01'"],
  ["'13:07:30.5'"],
]
query = "SELECT HOUR(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_timestamp_ntz"
description = "HOUR of a timestamp. Catches: the date part leaking into the result"
columns = [{ name = "t", type = "TIMESTAMP_NTZ" }]
rows = [
  ["'2024-02-29 17:45:59.999'"],
]
query = "SELECT HOUR(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_timestamp_tz"
description = "HOUR of TIMESTAMP_TZ values with whole and half-hour offsets. Catches: the hour of the UTC instant (7) instead of the wall clock (23)"
columns = [{ name = "t", type = "TIMESTAMP_TZ" }]
rows = [
  ["'2024-01-01 23:30:56.750 -0800'"],
  ["'2024-01-01 23:45:10 +0530'"],
]
query = "SELECT HOUR(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_interval"
description = "HOUR of a day-time interval. Catches: an error, or the days folded into hours"
columns = [{ name = "k", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT HOUR(INTERVAL '1 02:03:04.5' DAY TO SECOND) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_time_interval_or_timestamp_expr"
description = "NULL next to a set time. Catches: NULL read as midnight (0)"
columns = [{ name = "t", type = "TIME" }]
rows = [
  ["NULL"],
  ["'01:02:03'"],
]
query = "SELECT HOUR(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
