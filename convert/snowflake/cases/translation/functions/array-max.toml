category = "translation"
construct = "sf.functions.array-max"
session_profile = "utc-v1"

[[case]]
id = "t001_numbers"
description = "Integers beside a decimal and a negative number. Catches: elements compared as text (2.5 against 10), or the first element returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[2.5,10,-3]'"],
  ["'[1]'"],
]
query = "SELECT ARRAY_MAX(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_text"
description = "Text elements. Catches: the first or last element returned instead of the ordered one"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[\"b\",\"c\",\"a\"]'"],
]
query = "SELECT ARRAY_MAX(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_json_null"
description = "A JSON null beside numbers. The page example shows an array holding a JSON null returning the JSON null; how it orders against numbers the page does not say, so the recording decides. Catches: the JSON null treated as a SQL NULL where Snowflake orders it, or the reverse"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[1,null,2]'"],
]
query = "SELECT ARRAY_MAX(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_empty"
description = "An empty array. Catches: an error or a JSON null instead of NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[]'"],
]
query = "SELECT ARRAY_MAX(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["empty-input"]

[[case]]
id = "t005_null_array"
description = "A NULL array, and SQL NULL elements beside a value and alone. Catches: a SQL NULL element returned as the result, or the NULL array read as empty"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["4"],
]
query = "SELECT ARRAY_MAX(ARRAY_CONSTRUCT(x, 2, x)) AS r, ARRAY_MAX(ARRAY_CONSTRUCT(x)) AS o, ARRAY_MAX(IFF(x IS NULL, NULL, ARRAY_CONSTRUCT(x))) AS z FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["null"]
