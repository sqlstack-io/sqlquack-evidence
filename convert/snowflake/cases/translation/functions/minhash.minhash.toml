category = "translation"
construct = "sf.functions.minhash.minhash"
session_profile = "utc-v1"

[[case]]
id = "t001_equal_sets"
description = "Groups p and q hold the same values in another order; r is disjoint. Catches: an order-sensitive state (p and q not 1.0) or every pair similar"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS pq, (SELECT APPROXIMATE_SIMILARITY(m) FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g IN ('p', 'r')) AS pr FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g IN ('p', 'q')"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_tuples"
description = "Rows hashed as (a, b) pairs: p and q share every a and b value but no pair. Catches: each column hashed on its own (1.0 instead of 0.0)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'y'"],
  ["'q'", "2", "'x'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS r FROM (SELECT g, MINHASH(100, a, b) AS m FROM input GROUP BY g)"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr"
description = "A NULL value in one of two otherwise equal groups. Catches: NULL hashed as a value (below 1.0) or the state NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
  ["'p'", "NULL", "'n'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS r FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g IN ('p', 'q')"
order = "ordered"
tags = ["null"]
