category = "translation"
construct = "sf.functions.factorial"
session_profile = "utc-v1"

[[case]]
id = "t001_int"
description = "FACTORIAL of integers. Catches: gamma(x) computed (fractional), or x! off by one (n-1)!"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["0"],
  ["1"],
  ["5"],
  ["10"],
]
query = "SELECT FACTORIAL(n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_dec_int"
description = "FACTORIAL of an integral NUMBER(10,2). Catches: scale carried into the result"
columns = [{ name = "n", type = "NUMBER(10,2)" }]
rows = [
  ["6.00"],
  ["3.00"],
]
query = "SELECT FACTORIAL(n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null"
description = "FACTORIAL of NULL. Catches: NULL turned into 1"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT FACTORIAL(n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_large"
description = "Large factorials that still fit 38 digits. Catches: 64-bit overflow (21! does not fit a BIGINT)"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["20"],
  ["21"],
  ["33"],
]
query = "SELECT FACTORIAL(n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t005_negative"
description = "A negative argument. Catches: a gamma value or 1 instead of the error"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["-1"],
]
query = "SELECT FACTORIAL(n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t006_too_big"
description = "A result past 38 digits. Catches: FLOAT or wrapping instead of the error"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["34"],
]
query = "SELECT FACTORIAL(n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
