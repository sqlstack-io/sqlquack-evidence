category = "translation"
construct = "sf.functions.to-object"
session_profile = "utc-v1"

[[case]]
id = "t001_object"
description = "Objects, nested and empty. Catches: an empty object returned as NULL, or nested objects flattened"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":{\"b\":[1]}}'"],
  ["'{}'"],
]
query = "SELECT TO_OBJECT(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_array"
description = "An array, for which the page says any input other than an OBJECT reports an error. Catches: the array converted to an object, instead of the error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[1]'"],
]
query = "SELECT TO_OBJECT(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t003_null_expr"
description = "A SQL NULL. Catches: an empty object returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT TO_OBJECT(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_string"
description = "A VARIANT holding the text {}. The page says any input other than an OBJECT reports an error, but the recording shows Snowflake parsing the string into the empty object. Catches: the error the page describes raised, or the string returned unchanged"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'\"{}\"'"],
]
query = "SELECT TO_OBJECT(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]
