category = "translation"
construct = "sf.functions.map-construct"
session_profile = "utc-v1"

[[case]]
id = "t001_pairs"
description = "Pairs given out of key order. Catches: a pair dropped, or keys and values swapped"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["2"],
]
query = "SELECT MAP_CONSTRUCT('b', x, 'a', 1)::VARIANT AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_key_type"
description = "The page example MAP_CONSTRUCT(1, 'a', '2', 'b'), whose keys the page says unify to a numeric type; a value comes from the input. Catches: the key '2' kept as text"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'a'"],
]
query = "SELECT ARRAY_SORT(MAP_KEYS(MAP_CONSTRUCT(1, x, '2', 'b'))::ARRAY) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_key"
description = "A NULL key, whose pair the page drops, and a NULL value, whose pair it keeps. Catches: the NULL-keyed pair kept, or the NULL-valued pair dropped"
columns = [{ name = "x", type = "VARCHAR" }, { name = "y", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "NULL"],
]
query = "SELECT MAP_SIZE(MAP_CONSTRUCT('a', 1, x, 2)) AS null_key, MAP_SIZE(MAP_CONSTRUCT('a', y, 'b', 2)) AS null_value FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_duplicate_key"
description = "Two equal keys, which the page says is an error. Catches: the last or first value kept"
columns = [{ name = "k1", type = "VARCHAR" }, { name = "k2", type = "VARCHAR" }]
rows = [
  ["'a'", "'a'"],
]
query = "SELECT MAP_CONSTRUCT(k1, 1, k2, 2)::VARIANT AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
