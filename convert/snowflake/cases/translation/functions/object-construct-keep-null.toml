category = "translation"
construct = "sf.functions.object-construct-keep-null"
session_profile = "utc-v1"

[[case]]
id = "t001_pairs"
description = "Pairs of different value types. Catches: a pair dropped"
columns = [{ name = "k", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'c'", "3"],
]
query = "SELECT OBJECT_CONSTRUCT_KEEP_NULL('a', 1.50, k, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_value"
description = "A SQL NULL value, whose pair the page keeps, and a SQL NULL key, whose pair it omits. Catches: the NULL-valued pair omitted (as OBJECT_CONSTRUCT does), or the NULL-keyed pair kept"
columns = [{ name = "k", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "NULL"],
]
query = "SELECT OBJECT_CONSTRUCT_KEEP_NULL('a', x, 'b', 1) AS null_value, OBJECT_CONSTRUCT_KEEP_NULL(k, 1, 'b', 1) AS null_key, ARRAY_SIZE(OBJECT_KEYS(OBJECT_CONSTRUCT_KEEP_NULL('a', x))) AS n FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_star"
description = "OBJECT_CONSTRUCT_KEEP_NULL(*) over a row with a NULL column, which the page keeps. Catches: the NULL column dropped"
columns = [{ name = "p", type = "NUMBER(38,0)" }, { name = "q", type = "VARCHAR" }]
rows = [
  ["1", "NULL"],
]
query = "SELECT OBJECT_CONSTRUCT_KEEP_NULL(*) AS r FROM input"
order = "ordered"
tags = ["type-combination"]
