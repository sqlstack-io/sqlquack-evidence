category = "translation"
construct = "sf.functions.h3-uncompact-cells-strings"
session_profile = "utc-v1"

[[case]]
id = "t001_uncompact"
description = "A resolution-9 cell and a resolution-10 cell expanded to resolution 10: 7 cells and the one already there. Catches: the finer cell expanded again, or dropped"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[\"89283082803ffff\",\"8a2830828187fff\"]'"],
]
query = "SELECT ARRAY_SIZE(H3_UNCOMPACT_CELLS_STRINGS(PARSE_JSON(a)::ARRAY, 10)) AS n10, ARRAY_SIZE(H3_UNCOMPACT_CELLS_STRINGS(PARSE_JSON(a)::ARRAY, 11)) AS n11 FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_coarser_target"
description = "A target resolution 8, coarser than the resolution-9 input, which the page says is not allowed. Catches: the parent returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[\"89283082803ffff\"]'"],
]
query = "SELECT H3_UNCOMPACT_CELLS_STRINGS(PARSE_JSON(a)::ARRAY, 8) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t003_resolution_range"
description = "Resolution 16, outside the 0 to 15 that the page allows; it says any other value is an error. Catches: the resolution clamped to 15, or NULL returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[\"89283082803ffff\"]'"],
]
query = "SELECT H3_UNCOMPACT_CELLS_STRINGS(PARSE_JSON(a)::ARRAY, 16) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null_array_of_cell_ids"
description = "A NULL array, which the page says gives NULL without an error. Catches: an empty array returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT H3_UNCOMPACT_CELLS_STRINGS(PARSE_JSON(a)::ARRAY, 10) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
