category = "translation"
construct = "sf.functions.array-except"
session_profile = "utc-v1"

[[case]]
id = "t001_bag"
description = "Three copies of 1 less two, and one copy less two. Catches: set semantics (every 1 removed), or the excess exclusion going negative"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[1,1,1,2,3]'", "'[1,3,1]'"],
  ["'[1,4]'", "'[1,1]'"],
]
query = "SELECT ARRAY_SORT(ARRAY_EXCEPT(PARSE_JSON(a), PARSE_JSON(b))) AS r FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["type-combination"]

[[case]]
id = "t002_objects"
description = "Objects excluded only when identical. Catches: an object excluded on a shared key"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[{\"a\":1},{\"a\":1,\"b\":2}]'", "'[{\"a\":1}]'"],
]
query = "SELECT ARRAY_SIZE(ARRAY_EXCEPT(PARSE_JSON(a), PARSE_JSON(b))) AS n FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["type-combination"]

[[case]]
id = "t003_all_excluded"
description = "Every element excluded. Catches: NULL returned instead of an empty array"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[2,2]'", "'[2,2,2]'"],
]
query = "SELECT ARRAY_EXCEPT(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["empty-input"]

[[case]]
id = "t004_null_source_array"
description = "A NULL array on either side. Catches: NULL read as an empty array"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["NULL", "'[1]'"],
  ["'[1]'", "NULL"],
]
query = "SELECT ARRAY_EXCEPT(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
