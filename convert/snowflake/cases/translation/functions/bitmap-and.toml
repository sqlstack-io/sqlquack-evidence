category = "translation"
construct = "sf.functions.bitmap-and"
session_profile = "utc-v1"

[[case]]
id = "t001_two"
description = "Bucket-1 bitmaps of groups p {1, 5} and q {5, 9}. Catches: OR (the union 1, 5, 9 positions)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "5"],
  ["'p'", "5"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT BITMAP_TO_ARRAY(BITMAP_AND(a.bm, b.bm)) AS r FROM (SELECT g, BITMAP_BUCKET_NUMBER(x) AS bk, BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x)) AS bm FROM input GROUP BY g, bk) a, (SELECT g, BITMAP_BUCKET_NUMBER(x) AS bk, BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x)) AS bm FROM input GROUP BY g, bk) b WHERE a.g = 'p' AND b.g = 'q' AND a.bk = 1 AND b.bk = 1"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_bitmap1"
description = "NULL first bitmap. Catches: the other bitmap returned"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "5"],
  ["'p'", "5"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT BITMAP_TO_ARRAY(BITMAP_AND(NULL, bm)) AS r FROM (SELECT g, BITMAP_BUCKET_NUMBER(x) AS bk, BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x)) AS bm FROM input GROUP BY g, bk) WHERE g = 'q'"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_null_bitmap2"
description = "NULL second bitmap. Catches: the other bitmap returned"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "5"],
  ["'p'", "5"],
  ["'q'", "9"],
  ["'p'", "5"],
  ["'p'", "32769"],
]
query = "SELECT BITMAP_TO_ARRAY(BITMAP_AND(bm, NULL)) AS r FROM (SELECT g, BITMAP_BUCKET_NUMBER(x) AS bk, BITMAP_CONSTRUCT_AGG(BITMAP_BIT_POSITION(x)) AS bm FROM input GROUP BY g, bk) WHERE g = 'q'"
order = "ordered"
tags = ["null"]
