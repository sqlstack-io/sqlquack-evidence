category = "translation"
construct = "sf.functions.coalesce"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "The first non-NULL among several. Catches: the last non-NULL, or stopping after two arguments"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }, { name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "2", "3"],
  ["NULL", "NULL", "3"],
  ["1", "NULL", "3"],
]
query = "SELECT COALESCE(a, b, c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_mixed"
description = "A numeric string with a number, which converts to NUMBER. Catches: a VARCHAR result ('17.50' kept as text) instead of Snowflake's numeric conversion"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["'17.50'", "1"],
  ["NULL", "4"],
]
query = "SELECT COALESCE(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_scale"
description = "Scales widened. Catches: the first argument's scale lost (1.25 returned as 1)"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "3"],
  ["1.25", "3"],
]
query = "SELECT COALESCE(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr"
description = "Every argument NULL. Catches: a default value (0 or '') instead of NULL"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "NULL"],
  ["1", "NULL"],
]
query = "SELECT COALESCE(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_unconvertible"
description = "A non-numeric string with a number, which the page says fails. Catches: the string returned as text"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'foo'"],
]
query = "SELECT COALESCE(a, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
