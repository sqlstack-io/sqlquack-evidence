category = "translation"
construct = "sf.functions.atan"
session_profile = "utc-v1"

[[case]]
id = "t001_float"
description = "ATAN of FLOAT values. Catches: ATAN2 with a swapped argument, or degrees returned"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["1"],
  ["-0.5"],
  ["1e10"],
]
query = "SELECT ATAN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_fixed"
description = "ATAN of NUMBER(12,4), converted to FLOAT. Catches: ATAN2 with a swapped argument, or degrees returned; or the result left fixed-point"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["2.0000"],
  ["-0.2500"],
]
query = "SELECT ATAN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null"
description = "ATAN of NULL. Catches: NULL turned into 0 or NaN"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["NULL"],
]
query = "SELECT ATAN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_huge"
description = "Very large arguments approach pi/2. Catches: overflow handling"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["1e300"],
  ["-1e300"],
]
query = "SELECT ATAN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
