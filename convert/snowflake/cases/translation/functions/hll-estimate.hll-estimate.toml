category = "translation"
construct = "sf.functions.hll-estimate.hll-estimate"
session_profile = "utc-v1"

[[case]]
id = "t001_state"
description = "The estimate of one state per group. Catches: the size of the state, or a FLOAT"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT g, HLL_ESTIMATE(st) AS r FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g) ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_state"
description = "A NULL state. Catches: 0 instead of NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT HLL_ESTIMATE(NULL::BINARY) AS r"
order = "ordered"
tags = ["null"]
