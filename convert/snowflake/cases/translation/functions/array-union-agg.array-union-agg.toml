category = "translation"
construct = "sf.functions.array-union-agg.array-union-agg"
session_profile = "utc-v1"

[[case]]
id = "t001_multiset"
description = "[1,1,2], [1,3] and [2,2]: 1 twice and 2 twice by the largest counts. Catches: a set union (each value once) or a concatenation (1 three times)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "VARCHAR" }]
rows = [
  ["'p'", "'[1,1,2]'"],
  ["'q'", "'[5]'"],
  ["'p'", "'[1,3]'"],
  ["'p'", "'[2,2]'"],
]
query = "SELECT g, ARRAY_SORT(ARRAY_UNION_AGG(PARSE_JSON(a)::ARRAY)) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "Text elements differing in case. Catches: case-insensitive merging"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "VARCHAR" }]
rows = [
  ["'p'", "'[\"a\",\"B\"]'"],
  ["'p'", "'[\"A\",\"a\"]'"],
]
query = "SELECT ARRAY_SORT(ARRAY_UNION_AGG(PARSE_JSON(a)::ARRAY)) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_column"
description = "A NULL array and a JSON null element ([1,null]). Catches: the NULL array making the result NULL, or the JSON null element treated the opposite way to Snowflake"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "VARCHAR" }]
rows = [
  ["'p'", "NULL"],
  ["'p'", "'[1,null]'"],
  ["'p'", "'[2]'"],
]
query = "SELECT ARRAY_SORT(ARRAY_UNION_AGG(PARSE_JSON(a)::ARRAY)) AS r FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_empty_input"
description = "No rows. Catches: NULL instead of []"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "VARCHAR" }]
rows = [
  ["'p'", "'[1]'"],
]
query = "SELECT ARRAY_UNION_AGG(PARSE_JSON(a)::ARRAY) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
