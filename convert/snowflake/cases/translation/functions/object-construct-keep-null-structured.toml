category = "translation"
construct = "sf.functions.object-construct-keep-null-structured"
session_profile = "utc-v1"

[[case]]
id = "t001_pairs"
description = "Fields of NUMBER and VARCHAR values. Catches: a field dropped or retyped"
columns = [{ name = "k", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'x'", "3"],
]
query = "SELECT OBJECT_CONSTRUCT_KEEP_NULL_STRUCTURED('a', x, 'b', k)::VARIANT AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_value"
description = "A typed NULL value, which the page keeps. Catches: the NULL field dropped"
columns = [{ name = "k", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "NULL"],
]
query = "SELECT OBJECT_CONSTRUCT_KEEP_NULL_STRUCTURED('a', x, 'b', 1)::VARIANT AS r, ARRAY_SIZE(OBJECT_KEYS(OBJECT_CONSTRUCT_KEEP_NULL_STRUCTURED('a', x)::VARIANT)) AS n FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_untyped_null"
compile_error = true
description = "An untyped NULL literal value, which the page says is an error because the field type cannot be determined. Catches: the field kept as a VARIANT null"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT OBJECT_CONSTRUCT_KEEP_NULL_STRUCTURED('a', x, 'b', NULL)::VARIANT AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
