category = "translation"
construct = "sf.functions.listagg.listagg"
session_profile = "utc-v1"

[[case]]
id = "t001_delimiter"
description = "A multi-character delimiter and a DESC order. Catches: ASC order, or a delimiter after the last value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'p'", "'b'"],
  ["'q'", "'z'"],
  ["'p'", "'a'"],
  ["'p'", "'c'"],
  ["'p'", "'a'"],
]
query = "SELECT g, LISTAGG(x, '; ') WITHIN GROUP (ORDER BY x DESC) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_default_delimiter"
description = "No delimiter argument: the page gives the empty string. Catches: a comma (Postgres STRING_AGG and DuckDB default ',')"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'p'", "'b'"],
  ["'q'", "'z'"],
  ["'p'", "'a'"],
  ["'p'", "'c'"],
  ["'p'", "'a'"],
]
query = "SELECT g, LISTAGG(x) WITHIN GROUP (ORDER BY x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_order_other"
description = "Order by a second column, not the listed one. Catches: the values sorted by themselves"
columns = [{ name = "x", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "3"],
  ["'b'", "1"],
  ["'c'", "2"],
]
query = "SELECT LISTAGG(x, ',') WITHIN GROUP (ORDER BY k) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_number"
description = "Numbers listed as text, with a decimal. Catches: an error for non-text input, or scale lost"
columns = [{ name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["1.50"],
  ["-2.00"],
]
query = "SELECT LISTAGG(x, '|') WITHIN GROUP (ORDER BY x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_distinct"
description = "DISTINCT with WITHIN GROUP on the same column. Catches: DISTINCT ignored (a listed twice)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'p'", "'b'"],
  ["'q'", "'z'"],
  ["'p'", "'a'"],
  ["'p'", "'c'"],
  ["'p'", "'a'"],
]
query = "SELECT g, LISTAGG(DISTINCT x, ',') WITHIN GROUP (ORDER BY x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["duplicates"]

[[case]]
id = "t006_null_expr1"
description = "NULL values beside text, and a group of only NULL. Catches: NULL listed as '' (a doubled delimiter) or the all-NULL group giving NULL instead of an empty string"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'p'", "'a'"],
  ["'q'", "NULL"],
  ["'p'", "NULL"],
  ["'p'", "'b'"],
]
query = "SELECT g, LISTAGG(x, ',') WITHIN GROUP (ORDER BY x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_null_delimiter"
description = "A NULL delimiter. Catches: NULL read as an empty delimiter"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'a'"],
  ["'b'"],
]
query = "SELECT LISTAGG(x, NULL) WITHIN GROUP (ORDER BY x) AS r FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t008_empty_input"
description = "No rows; the page gives an empty string. Catches: NULL instead of an empty string"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'a'"],
]
query = "SELECT LISTAGG(x, ',') AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
