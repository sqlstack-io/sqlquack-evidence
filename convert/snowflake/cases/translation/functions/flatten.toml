category = "translation"
construct = "sf.functions.flatten"
session_profile = "utc-v1"

[[case]]
id = "t001_default"
description = "An array and an object, flattened one level. Catches: nested elements expanded, or the array index 1-based"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[10,[20,30]]'"],
  ["'{\"b\":1,\"a\":{\"c\":2}}'"],
]
query = "SELECT i.ordinal, f.key, f.index, f.value, f.path FROM input i, LATERAL FLATTEN(INPUT => PARSE_JSON(i.a)) f ORDER BY i.ordinal, f.path"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_path"
description = "A PATH into a nested array. Catches: the PATH ignored"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"x\":{\"y\":[1,2]}}'"],
]
query = "SELECT i.ordinal, f.key, f.index, f.value, f.path FROM input i, LATERAL FLATTEN(INPUT => PARSE_JSON(i.a), PATH => 'x.y') f ORDER BY i.ordinal, f.path"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_outer"
description = "An empty array and a scalar with OUTER TRUE, which the page says give one row each. Catches: the inputs dropped as with OUTER FALSE"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[]'"],
  ["'5'"],
]
query = "SELECT i.ordinal, f.key, f.index, f.value, f.path, f.this FROM input i, LATERAL FLATTEN(INPUT => PARSE_JSON(i.a), OUTER => TRUE) f ORDER BY i.ordinal, f.path"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_recursive"
description = "Nested containers with RECURSIVE TRUE. Catches: only the top level expanded"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":[1,{\"b\":2}]}'"],
]
query = "SELECT i.ordinal, f.key, f.index, f.value, f.path FROM input i, LATERAL FLATTEN(INPUT => PARSE_JSON(i.a), RECURSIVE => TRUE) f ORDER BY i.ordinal, f.path"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_mode"
description = "MODE 'ARRAY' with RECURSIVE TRUE on an object holding an array. Catches: objects expanded as well"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":[1,{\"b\":2}]}'"],
]
query = "SELECT i.ordinal, f.key, f.index, f.value, f.path FROM input i, LATERAL FLATTEN(INPUT => PARSE_JSON(i.a), RECURSIVE => TRUE, MODE => 'ARRAY') f ORDER BY i.ordinal, f.path"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_null_input"
description = "A NULL input, which without OUTER gives no rows. Catches: a row of NULLs"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'[1]'"],
]
query = "SELECT i.ordinal, f.key, f.index, f.value, f.path FROM input i, LATERAL FLATTEN(INPUT => PARSE_JSON(i.a)) f ORDER BY i.ordinal, f.path"
order = "ordered"
tags = ["null"]
