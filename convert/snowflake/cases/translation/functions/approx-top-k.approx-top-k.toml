category = "translation"
construct = "sf.functions.approx-top-k.approx-top-k"
session_profile = "utc-v1"

[[case]]
id = "t001_k"
description = "k = 2 over values seen 3, 2 and 1 times. Catches: least frequent first, or k ignored"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'p'", "'a'"],
  ["'q'", "'z'"],
  ["'p'", "'b'"],
  ["'p'", "'a'"],
  ["'p'", "'c'"],
  ["'p'", "'b'"],
  ["'p'", "'a'"],
]
query = "SELECT g, APPROX_TOP_K(x, 2) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_default_k"
description = "k omitted: the page gives 1. Catches: every value returned"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'p'", "'a'"],
  ["'q'", "'z'"],
  ["'p'", "'b'"],
  ["'p'", "'a'"],
  ["'p'", "'c'"],
  ["'p'", "'b'"],
  ["'p'", "'a'"],
]
query = "SELECT g, APPROX_TOP_K(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_counters"
description = "k = 2 with 10 counters. Catches: counters read as k"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'p'", "'a'"],
  ["'q'", "'z'"],
  ["'p'", "'b'"],
  ["'p'", "'a'"],
  ["'p'", "'c'"],
  ["'p'", "'b'"],
  ["'p'", "'a'"],
]
query = "SELECT g, APPROX_TOP_K(x, 2, 10) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_number"
description = "NUMBER values. Catches: values returned as text"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["7"],
  ["7"],
  ["-1"],
]
query = "SELECT APPROX_TOP_K(x, 2) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_expr"
description = "NULL as the most frequent input value. Catches: NULL treated the opposite way to Snowflake (counted as a value or skipped)"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["NULL"],
  ["NULL"],
  ["'a'"],
  ["'a'"],
  ["'b'"],
]
query = "SELECT APPROX_TOP_K(x, 2) AS r FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_empty_input"
description = "No rows. Catches: NULL instead of the empty-input result, or the reverse"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'a'"],
]
query = "SELECT APPROX_TOP_K(x, 2) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
