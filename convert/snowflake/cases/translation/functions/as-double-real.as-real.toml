category = "translation"
construct = "sf.functions.as-double-real.as-real"
session_profile = "utc-v1"

[[case]]
id = "t001_match"
description = "Numbers written with an exponent, one negative and one large. Catches: the exponent misread, or the sign lost"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'1.5e0'"],
  ["'-2.5E-1'"],
  ["'1e300'"],
]
query = "SELECT AS_REAL(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_mismatch"
description = "A string holding a number and a boolean. Catches: text parsed as a number, or true read as 1"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'\"1.5\"'"],
  ["'true'"],
]
query = "SELECT AS_REAL(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_fixed_point"
description = "Fixed-point and integer numbers; the page names only floating-point values and does not say whether these convert; the recording decides. Catches: an implementation that converts every number, or none, where Snowflake does the other"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'1.50'"],
  ["'7'"],
]
query = "SELECT AS_REAL(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_variant_expr"
description = "A SQL NULL and a JSON null; the page returns NULL for a NULL argument and for a type that does not match. Catches: the JSON null passed through as a value, or an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'null'"],
]
query = "SELECT AS_REAL(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
