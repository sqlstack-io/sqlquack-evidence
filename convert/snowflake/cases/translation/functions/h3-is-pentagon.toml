category = "translation"
construct = "sf.functions.h3-is-pentagon"
session_profile = "utc-v1"

[[case]]
id = "t001_integer"
description = "A resolution-0 pentagon and a hexagon. Catches: every cell reported as a hexagon"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["576636674163867647"],
  ["617700169957507071"],
]
query = "SELECT ordinal, H3_IS_PENTAGON(c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "The same cells as hexadecimal IDs. Catches: the text read as a decimal number"
columns = [{ name = "c", type = "VARCHAR" }]
rows = [
  ["'8009fffffffffff'"],
  ["'89283082803ffff'"],
]
query = "SELECT ordinal, H3_IS_PENTAGON(c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_cell_id"
description = "A NULL ID, which the page says gives NULL without an error. Catches: FALSE returned"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT H3_IS_PENTAGON(c) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
