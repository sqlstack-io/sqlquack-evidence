category = "translation"
construct = "sf.functions.arrays-overlap"
session_profile = "utc-v1"

[[case]]
id = "t001_overlap"
description = "Arrays sharing one element, and disjoint arrays. Catches: TRUE for the disjoint pair"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[1,2]'", "'[3,2]'"],
  ["'[1]'", "'[3]'"],
]
query = "SELECT ARRAYS_OVERLAP(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_objects"
description = "An object against an identical one and against a superset. Catches: objects matched on a shared key"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[{\"a\":1}]'", "'[{\"a\":1}]'"],
  ["'[{\"a\":1}]'", "'[{\"a\":1,\"b\":2}]'"],
]
query = "SELECT ARRAYS_OVERLAP(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_number_vs_text"
description = "The number 1 against the text \"1\". Catches: values compared as text"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[1]'", "'[\"1\"]'"],
]
query = "SELECT ARRAYS_OVERLAP(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_array1"
description = "A NULL array, and SQL NULL elements on both sides. The page calls the function NULL-safe, and its example with SQL NULL elements on both sides gives TRUE; it does not cover a NULL array, so the recording decides that row. Catches: a NULL array read as empty (FALSE), or SQL NULL elements not matched"
columns = [{ name = "a", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1"],
  ["'[1]'", "NULL"],
]
query = "SELECT ARRAYS_OVERLAP(PARSE_JSON(a), ARRAY_CONSTRUCT(2)) AS r, ARRAYS_OVERLAP(ARRAY_CONSTRUCT(x, 1), ARRAY_CONSTRUCT(x, 2)) AS n FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["null"]
