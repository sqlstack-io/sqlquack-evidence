category = "translation"
construct = "sf.functions.parse-ip"
session_profile = "utc-v1"

[[case]]
id = "t001_inet"
description = "IPv4, IPv4 with a prefix, and IPv6. Catches: missing ipv4_range_start/end for a prefix, a signed ip_fields value, or IPv6 fields out of order"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'192.0.2.1'"],
  ["'192.168.1.200/24'"],
  ["'2001:db8::ff00:42:8329'"],
]
query = "SELECT PARSE_IP(a, 'INET') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_cidr"
description = "CIDR in lower case. Catches: the type name compared case-sensitively"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'10.0.0.0/8'"],
]
query = "SELECT PARSE_IP(a, 'cidr') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_permissive"
description = "An unparseable address with permissive 1. Catches: an error or NULL instead of an object with an error field"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'300.1.2.3'"],
  ["'not an ip'"],
]
query = "SELECT PARSE_IP(a, 'INET', 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr"
description = "NULL address. Catches: an error object instead of NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'1.2.3.4'"],
]
query = "SELECT PARSE_IP(a, 'INET') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_permissive"
description = "NULL permissive flag. Catches: NULL read as 0"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'1.2.3.4'"],
]
query = "SELECT PARSE_IP(a, 'INET', NULL) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_strict"
description = "An unparseable address with the default permissive 0. Catches: an error object or NULL instead of an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'300.1.2.3'"],
]
query = "SELECT PARSE_IP(a, 'INET') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
