category = "translation"
construct = "sf.functions.seq1.seq8"
session_profile = "utc-v1"

[[case]]
id = "t001_sequence"
description = "SEQ8 over GENERATOR rows: starting value and count of distinct values. Catches: a sequence starting at 1, or repeated values"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MIN(SEQ8()) AS lo, COUNT(DISTINCT SEQ8()) AS n FROM TABLE(GENERATOR(ROWCOUNT => 5))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_sign"
description = "SEQ8(1) before any wrap-around; the page describes sign 1 only after a wrap-around, so the recording decides where it starts. Catches: a start that differs from Snowflake's"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MIN(SEQ8(1)) AS lo, MAX(SEQ8(1)) AS hi FROM TABLE(GENERATOR(ROWCOUNT => 5))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_sign"
description = "A NULL sign argument; the page does not say; the recording decides. Catches: the default sign used where Snowflake raises an error, or the reverse"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MIN(SEQ8(NULL)) AS lo FROM TABLE(GENERATOR(ROWCOUNT => 3))"
order = "ordered"
tags = ["null"]
