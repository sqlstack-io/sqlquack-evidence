category = "translation"
construct = "sf.functions.atan2"
session_profile = "utc-v1"

[[case]]
id = "t001_float"
description = "ATAN2 in all four quadrants. Catches: arguments swapped (ATAN2(y, x) vs ATAN2(x, y)) or ATAN(y/x) losing the quadrant"
columns = [{ name = "y", type = "FLOAT" }, { name = "x", type = "FLOAT" }]
rows = [
  ["1", "2"],
  ["-1", "-1"],
  ["1", "-1"],
  ["0", "-1"],
  ["-1", "2"],
]
query = "SELECT ATAN2(y, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_fixed"
description = "ATAN2 of NUMBER(12,4), converted to DOUBLE. Catches: the result left fixed-point"
columns = [{ name = "y", type = "NUMBER(12,4)" }, { name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["1.0000", "3.0000"],
  ["-2.5000", "0.5000"],
]
query = "SELECT ATAN2(y, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_text"
description = "ATAN2 of numeric strings, converted to DOUBLE. Catches: the strings rejected"
columns = [{ name = "y", type = "VARCHAR" }, { name = "x", type = "VARCHAR" }]
rows = [
  ["'1.5'", "'-2'"],
  ["'-0.5'", "'3'"],
]
query = "SELECT ATAN2(y, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_y"
description = "NULL y. Catches: NULL turned into 0 (giving 0 or pi)"
columns = [{ name = "y", type = "FLOAT" }, { name = "x", type = "FLOAT" }]
rows = [
  ["NULL", "1"],
]
query = "SELECT ATAN2(y, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_x"
description = "NULL x. Catches: NULL turned into 0 (giving pi/2)"
columns = [{ name = "y", type = "FLOAT" }, { name = "x", type = "FLOAT" }]
rows = [
  ["1", "NULL"],
]
query = "SELECT ATAN2(y, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_zeros"
description = "Zeros on the negative x axis; Snowflake gives +pi for both signs of zero y (captured at e8691b63). Catches: IEEE signed-zero atan2 (-pi for the -0 row) where Snowflake returns +pi"
columns = [{ name = "y", type = "FLOAT" }, { name = "x", type = "FLOAT" }]
rows = [
  ["0", "0"],
  ["-0e0", "-1"],
  ["0e0", "-1"],
]
query = "SELECT ATAN2(y, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t007_bad_text"
description = "A string that is not a number is an error. Catches: the string read as 0"
columns = [{ name = "y", type = "VARCHAR" }, { name = "x", type = "FLOAT" }]
rows = [
  ["'abc'", "1"],
]
query = "SELECT ATAN2(y, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t008_boolean"
compile_error = true
description = "A BOOLEAN argument is an error (\"any other data type\"). Snowflake rejects it at compile time. Catches: TRUE read as 1"
columns = [{ name = "y", type = "BOOLEAN" }, { name = "x", type = "FLOAT" }]
rows = [
  ["TRUE", "1"],
]
query = "SELECT ATAN2(y, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
