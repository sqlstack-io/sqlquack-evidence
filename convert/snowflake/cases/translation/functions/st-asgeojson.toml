category = "translation"
construct = "sf.functions.st-asgeojson"
session_profile = "utc-v1"

[[case]]
id = "t001_point"
description = "The type and coordinates of a point, longitude first, and no crs key for a GEOMETRY with SRID 3857. Catches: latitude first, or a crs member added"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POINT(10 20)'"],
]
query = "SELECT GET(ST_ASGEOJSON(TO_GEOGRAPHY(v)), 'type')::VARCHAR AS t, GET(GET(ST_ASGEOJSON(TO_GEOGRAPHY(v)), 'coordinates'), 0)::FLOAT AS x, GET(GET(ST_ASGEOJSON(TO_GEOGRAPHY(v)), 'coordinates'), 1)::FLOAT AS y, GET(ST_ASGEOJSON(TO_GEOMETRY(v, 3857)), 'crs') IS NULL AS no_crs FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_types"
description = "The GeoJSON type names of a line string and a polygon. Catches: WKT type names (LINESTRING) returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'LINESTRING(0 0,1 2,3 4)'"],
  ["'POLYGON((0 0,10 0,10 10,0 10,0 0))'"],
]
query = "SELECT ordinal, GET(ST_ASGEOJSON(TO_GEOGRAPHY(v)), 'type')::VARCHAR AS t FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_geography_or_geometry_expression"
description = "A NULL shape; the page does not say; the recording decides. Catches: an error, or a value returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_ASGEOJSON(TO_GEOGRAPHY(v)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
