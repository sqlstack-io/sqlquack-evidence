category = "translation"
construct = "sf.functions.map-size"
session_profile = "utc-v1"

[[case]]
id = "t001_size"
description = "Maps of one and three entries, and an empty map made by deleting its key. Catches: NULL for the empty map"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MAP_SIZE(MAP_CONSTRUCT('a', x)) AS one, MAP_SIZE(MAP_CONSTRUCT('a', 1, 'b', 2, 'c', x)) AS three, MAP_SIZE(MAP_DELETE(MAP_CONSTRUCT('a', x), 'a')) AS zero FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_map"
description = "A NULL map; the page does not say; the recording decides. Catches: 0 returned"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT MAP_SIZE(IFF(x IS NULL, NULL, MAP_CONSTRUCT('a', 1, 'b', 2))) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
