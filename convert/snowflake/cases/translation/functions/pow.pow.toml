category = "translation"
construct = "sf.functions.pow.pow"
session_profile = "utc-v1"

[[case]]
id = "t001_int"
description = "POW of integers returns FLOAT. Catches: arguments swapped (2^3 is 8, 3^2 is 9) or an integer result"
columns = [{ name = "x", type = "NUMBER(38,0)" }, { name = "y", type = "NUMBER(38,0)" }]
rows = [
  ["2", "3"],
  ["-2", "3"],
  ["10", "-2"],
]
query = "SELECT POW(x, y) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_dec"
description = "POW with fractional exponents. Catches: the exponent rounded"
columns = [{ name = "x", type = "NUMBER(10,2)" }, { name = "y", type = "NUMBER(10,2)" }]
rows = [
  ["4.00", "0.50"],
  ["2.25", "1.50"],
]
query = "SELECT POW(x, y) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_float"
description = "POW of FLOAT values. Catches: arguments swapped (2.5^1.5 is 3.95, 1.5^2.5 is 2.76) or a non-FLOAT result type"
columns = [{ name = "x", type = "FLOAT" }, { name = "y", type = "FLOAT" }]
rows = [
  ["1.5", "2.5"],
  ["0.5", "-3"],
]
query = "SELECT POW(x, y) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_decfloat"
description = "POW of DECFLOAT returns DECFLOAT. The result is cast to VARCHAR because the recorder cannot decode a DECFLOAT column. Catches: computed in FLOAT"
columns = [{ name = "x", type = "DECFLOAT" }, { name = "y", type = "DECFLOAT" }]
rows = [
  ["1.1", "3"],
  ["2", "-1"],
]
query = "SELECT CAST(POW(x, y) AS VARCHAR) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_x"
description = "NULL base. Catches: NULL^0 returning 1"
columns = [{ name = "x", type = "FLOAT" }, { name = "y", type = "FLOAT" }]
rows = [
  ["NULL", "0"],
  ["NULL", "2"],
]
query = "SELECT POW(x, y) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_null_y"
description = "NULL exponent. Catches: 1^NULL returning 1"
columns = [{ name = "x", type = "FLOAT" }, { name = "y", type = "FLOAT" }]
rows = [
  ["1", "NULL"],
  ["2", "NULL"],
]
query = "SELECT POW(x, y) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_overflow_inf"
description = "Powers past the double range, and 0^0. Catches: infinity versus error; 0^0 as 0"
columns = [{ name = "x", type = "FLOAT" }, { name = "y", type = "FLOAT" }]
rows = [
  ["10", "400"],
  ["0", "0"],
  ["10", "-400"],
]
query = "SELECT POW(x, y) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t008_neg_base"
description = "Negative bases with integer exponents. Catches: the sign lost for odd exponents"
columns = [{ name = "x", type = "FLOAT" }, { name = "y", type = "FLOAT" }]
rows = [
  ["-3", "3"],
  ["-3", "2"],
  ["-0.5", "-1"],
]
query = "SELECT POW(x, y) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t009_neg_frac"
description = "A negative base with a fractional exponent: records what Snowflake returns there (NaN, Infinity, NULL or an error); re-kinded to error_parity after capture if Snowflake raises an error. Catches: NaN, NULL or an error differing from Snowflake"
columns = [{ name = "x", type = "FLOAT" }, { name = "y", type = "FLOAT" }]
rows = [
  ["-8", "0.5"],
]
query = "SELECT POW(x, y) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
