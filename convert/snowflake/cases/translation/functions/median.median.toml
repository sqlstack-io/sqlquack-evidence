category = "translation"
construct = "sf.functions.median.median"
session_profile = "utc-v1"

[[case]]
id = "t001_even"
description = "An even group (1, 3, 5, 20) and an odd one. Catches: the lower or upper centre value instead of their average (3 or 5 instead of 4), or the mean (7.25)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "20"],
  ["'q'", "8"],
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "5"],
  ["'q'", "4"],
  ["'p'", "3"],
]
query = "SELECT g, MEDIAN(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_decimal"
description = "Two values whose average is a half. Catches: integer division (2 instead of 2.5)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["2"],
  ["3"],
]
query = "SELECT MEDIAN(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_float"
description = "FLOAT values. Catches: a fixed-point result"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0.5"],
  ["1.25"],
  ["4"],
]
query = "SELECT MEDIAN(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr"
description = "NULL rows, which do not count towards the centre, and a group of only NULL. Catches: NULL counted as a value (shifting the centre)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "NULL"],
  ["'p'", "1"],
  ["'p'", "NULL"],
  ["'p'", "9"],
  ["'p'", "4"],
]
query = "SELECT g, MEDIAN(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_empty_input"
description = "No rows. Catches: an error or 0 instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MEDIAN(x) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]

[[case]]
id = "t006_distinct"
compile_error = true
description = "DISTINCT, which the page says is not supported. Catches: DISTINCT accepted (DuckDB accepts median(DISTINCT x))"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["1"],
  ["5"],
]
query = "SELECT MEDIAN(DISTINCT x) AS r FROM input"
order = "ordered"
tags = ["error"]
