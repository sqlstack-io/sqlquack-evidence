category = "translation"
construct = "sf.functions.regr-valy"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "REGR_VALY of asymmetric pairs. Catches: x returned instead of y"
columns = [{ name = "y", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["3", "5.50"],
  ["-1", "0.00"],
]
query = "SELECT REGR_VALY(y, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_float"
description = "REGR_VALY of FLOAT pairs. Catches: x returned instead of y, or a NUMBER result"
columns = [{ name = "y", type = "FLOAT" }, { name = "x", type = "FLOAT" }]
rows = [
  ["1.5", "-2.25"],
]
query = "SELECT REGR_VALY(y, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_y"
description = "NULL y. Catches: x returned (only the returned argument checked)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["4"],
  ["NULL"],
]
query = "SELECT REGR_VALY(NULL, x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_x"
description = "NULL x. Catches: y returned (only the returned argument checked)"
columns = [{ name = "y", type = "NUMBER(38,0)" }]
rows = [
  ["4"],
  ["NULL"],
]
query = "SELECT REGR_VALY(y, NULL) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
