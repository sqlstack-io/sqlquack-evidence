category = "translation"
construct = "sf.functions.array-to-string"
session_profile = "utc-v1"

[[case]]
id = "t001_mixed"
description = "Numbers, text, a boolean and a nested array joined with \", \". Catches: text written with JSON quotes, or the nested array dropped"
columns = [{ name = "a", type = "VARCHAR" }, { name = "sep", type = "VARCHAR" }]
rows = [
  ["'[1,\"a\",true,[2,\"b\"],{\"k\":\"v\"}]'", "', '"],
]
query = "SELECT ARRAY_TO_STRING(PARSE_JSON(a), sep) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_sql_null_element"
description = "A SQL NULL element between two values. Catches: the NULL element skipped (one separator) or written as \"null\""
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ARRAY_TO_STRING(ARRAY_CONSTRUCT('a', x, 'b'), '-') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_json_null_element"
description = "A JSON null element. The page covers only SQL NULL elements; the recording shows Snowflake raising 100071 (failed to cast variant value to string) for this input. Catches: the JSON null converted to \"null\" or to an empty string, instead of the error"
columns = [{ name = "a", type = "VARCHAR" }, { name = "sep", type = "VARCHAR" }]
rows = [
  ["'[\"a\",null]'", "'-'"],
]
query = "SELECT ARRAY_TO_STRING(PARSE_JSON(a), sep) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_empty"
description = "An empty array. Catches: NULL instead of an empty string"
columns = [{ name = "a", type = "VARCHAR" }, { name = "sep", type = "VARCHAR" }]
rows = [
  ["'[]'", "'-'"],
]
query = "SELECT ARRAY_TO_STRING(PARSE_JSON(a), sep) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["empty-input"]

[[case]]
id = "t005_null_array"
description = "A NULL array and a NULL separator. Catches: the NULL separator read as an empty string"
columns = [{ name = "a", type = "VARCHAR" }, { name = "sep", type = "VARCHAR" }]
rows = [
  ["NULL", "'-'"],
  ["'[1,2]'", "NULL"],
]
query = "SELECT ARRAY_TO_STRING(PARSE_JSON(a), sep) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
