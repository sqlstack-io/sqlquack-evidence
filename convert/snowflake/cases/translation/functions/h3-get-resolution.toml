category = "translation"
construct = "sf.functions.h3-get-resolution"
session_profile = "utc-v1"

[[case]]
id = "t001_integer"
description = "Cells at resolutions 9, 10 and 0. Catches: a fixed resolution returned"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["617700169957507071"],
  ["622203769584648191"],
  ["576636674163867647"],
]
query = "SELECT ordinal, H3_GET_RESOLUTION(c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "The hexadecimal IDs of cells at resolutions 9 and 0. Catches: the text read as a decimal number"
columns = [{ name = "c", type = "VARCHAR" }]
rows = [
  ["'89283082803ffff'"],
  ["'8029fffffffffff'"],
]
query = "SELECT ordinal, H3_GET_RESOLUTION(c) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_cell_id"
description = "A NULL ID; the page does not say; the recording decides. Catches: an error, or 0 returned"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT H3_GET_RESOLUTION(c) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
