category = "translation"
construct = "sf.functions.st-makeline"
session_profile = "utc-v1"

[[case]]
id = "t001_points"
description = "Two points, and a MultiPoint followed by a point, in order. Catches: the points sorted, or the MultiPoint reduced to one point"
columns = [{ name = "v", type = "VARCHAR" }, { name = "w", type = "VARCHAR" }]
rows = [
  ["'POINT(3 4)'", "'POINT(1 2)'"],
  ["'MULTIPOINT((0 0),(1 1))'", "'POINT(2 0)'"],
]
query = "SELECT ordinal, ST_NPOINTS(ST_MAKELINE(TO_GEOGRAPHY(v), TO_GEOGRAPHY(w))) AS n, ST_X(ST_STARTPOINT(ST_MAKELINE(TO_GEOGRAPHY(v), TO_GEOGRAPHY(w)))) AS x0, ST_X(ST_ENDPOINT(ST_MAKELINE(TO_GEOGRAPHY(v), TO_GEOGRAPHY(w)))) AS x1 FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_geometry"
description = "A point and a line string as GEOMETRY with SRID 3857, which the result keeps. Catches: the SRID dropped"
columns = [{ name = "v", type = "VARCHAR" }, { name = "w", type = "VARCHAR" }]
rows = [
  ["'POINT(0 0)'", "'LINESTRING(1 1,2 2)'"],
]
query = "SELECT ST_NPOINTS(ST_MAKELINE(TO_GEOMETRY(v, 3857), TO_GEOMETRY(w, 3857))) AS n, ST_SRID(ST_MAKELINE(TO_GEOMETRY(v, 3857), TO_GEOMETRY(w, 3857))) AS srid FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_srid_mismatch"
description = "GEOMETRY points with SRIDs 0 and 3857, which the page says is an error. Catches: a line string built anyway"
columns = [{ name = "v", type = "VARCHAR" }, { name = "w", type = "VARCHAR" }]
rows = [
  ["'POINT(0 0)'", "'POINT(1 1)'"],
]
query = "SELECT ST_MAKELINE(TO_GEOMETRY(v), TO_GEOMETRY(w, 3857)) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null_geography_expression_1"
description = "A NULL first shape; the page does not say; the recording decides. Catches: an error, or a value returned"
columns = [{ name = "v", type = "VARCHAR" }, { name = "w", type = "VARCHAR" }]
rows = [
  ["NULL", "'POINT(10 20)'"],
]
query = "SELECT ST_MAKELINE(TO_GEOGRAPHY(v), TO_GEOGRAPHY(w)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
