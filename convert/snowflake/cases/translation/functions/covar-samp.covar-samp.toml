category = "translation"
construct = "sf.functions.covar-samp.covar-samp"
session_profile = "utc-v1"

[[case]]
id = "t001_pairs"
description = "Asymmetric pairs per group, with a NULL in x in one pair and in y in another. Catches: the population covariance, or pairs with one NULL kept"
columns = [{ name = "g", type = "VARCHAR" }, { name = "y", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1", "1"],
  ["'q'", "4", "1"],
  ["'p'", "3", "2"],
  ["'p'", "2", "4"],
  ["'q'", "6", "3"],
  ["'p'", "8", "5"],
  ["'p'", "NULL", "9"],
  ["'p'", "40", "NULL"],
  ["'r'", "5", "2"],
]
query = "SELECT g, COVAR_SAMP(y, x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_float"
description = "FLOAT y beside NUMBER x. Catches: an integer result type"
columns = [{ name = "y", type = "FLOAT" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["0.5", "1"],
  ["2.25", "2"],
  ["2", "4"],
]
query = "SELECT COVAR_SAMP(y, x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_y"
description = "NULL y in every pair. Catches: a value from the x column alone"
columns = [{ name = "y", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1"],
  ["NULL", "2"],
]
query = "SELECT COVAR_SAMP(y, x) AS r FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_x"
description = "NULL x in one pair of four. Catches: the pair kept with x read as 0"
columns = [{ name = "y", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["2", "NULL"],
  ["3", "1"],
  ["7", "2"],
  ["1", "6"],
]
query = "SELECT COVAR_SAMP(y, x) AS r FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_empty_input"
description = "No rows. Catches: an error or 0 instead of the empty-input result"
columns = [{ name = "y", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1", "1"],
]
query = "SELECT COVAR_SAMP(y, x) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]

[[case]]
id = "t006_large_mean"
description = "Pairs near 1e9 with small spreads. Catches: a sum-of-products formula losing the digits of the spread"
columns = [{ name = "y", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1000000002", "1000000001"],
  ["1000000004", "1000000002"],
  ["1000000005", "1000000003"],
  ["1000000009", "1000000004"],
]
query = "SELECT COVAR_SAMP(y, x) AS r FROM input"
order = "ordered"
expected_divergence = "float_sum_order"
tags = ["type-combination"]

[[case]]
id = "t007_decimal"
description = "NUMBER(10,2) columns. Catches: the result type or scale of decimal inputs"
columns = [{ name = "y", type = "NUMBER(10,2)" }, { name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["1.25", "2.50"],
  ["2.50", "2.75"],
  ["4.10", "3.00"],
]
query = "SELECT COVAR_SAMP(y, x) AS r, SYSTEM$TYPEOF(COVAR_SAMP(y, x)) AS t FROM input"
order = "ordered"
tags = ["type-combination"]
