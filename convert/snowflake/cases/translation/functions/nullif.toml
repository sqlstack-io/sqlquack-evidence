category = "translation"
construct = "sf.functions.nullif"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "Equal and unequal values, across scales. Catches: expr2 returned, or scale compared"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["1.00", "1"],
  ["2.50", "1"],
]
query = "SELECT NULLIF(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "Strings differing only in case. Catches: case-insensitive equality"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'A'"],
  ["'a'"],
]
query = "SELECT NULLIF(a, 'a') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr2"
description = "NULL second argument. Catches: NULL returned (NULL treated as equal)"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["3"],
  ["NULL"],
]
query = "SELECT NULLIF(a, NULL) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
