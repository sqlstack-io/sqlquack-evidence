category = "translation"
construct = "sf.functions.row-number"
session_profile = "utc-v1"

[[case]]
id = "t001_partitions"
description = "Two partition keys, with the tie broken by a second order key. Catches: numbering not restarted per partition, or starting at 0"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, ROW_NUMBER() OVER (PARTITION BY p, o IS NULL ORDER BY o DESC, ordinal) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_ties_broken"
description = "A tie in the only order key broken by ordinal so the result is deterministic. Catches: tied rows given the same number"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, ROW_NUMBER() OVER (PARTITION BY p ORDER BY o, ordinal) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_order_expr"
description = "NULL order keys, sorted last under the session default; ties broken by ordinal. Catches: NULLs numbered first"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "NULL"],
  ["'a'", "2"],
  ["'a'", "NULL"],
  ["'a'", "1"],
]
query = "SELECT ordinal, ROW_NUMBER() OVER (PARTITION BY p ORDER BY o, ordinal) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
