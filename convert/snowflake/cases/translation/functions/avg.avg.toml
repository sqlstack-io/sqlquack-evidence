category = "translation"
construct = "sf.functions.avg.avg"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "Integer groups whose average is not whole. Catches: integer division (1 instead of 1.666667)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "7"],
  ["'p'", "2"],
  ["'p'", "2"],
]
query = "SELECT g, AVG(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_decimal"
description = "Fixed-point values with two decimals. Catches: a FLOAT average or the input scale kept (2 digits instead of the widened scale)"
columns = [{ name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["1.25"],
  ["2.50"],
  ["0.01"],
]
query = "SELECT AVG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_float"
description = "Binary fractions that do not add exactly. Catches: a summation that differs from Snowflake's on these values (naive left-to-right gives 0.20000000000000004, exact or compensated 0.19999999999999998)"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0.1"],
  ["0.2"],
  ["0.3"],
]
query = "SELECT AVG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_varchar"
description = "Numeric text, which the page says is cast to FLOAT. Catches: text rejected, or read as NUMBER (a fixed-point result type)"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'1.5'"],
  ["'2'"],
  ["'-0.25'"],
]
query = "SELECT AVG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_null_expr1"
description = "NULL rows beside values, and a group of only NULL. Catches: NULL read as 0 (a different average) or the all-NULL group giving 0"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "NULL"],
  ["'p'", "4"],
  ["'p'", "NULL"],
  ["'p'", "1"],
]
query = "SELECT g, AVG(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_empty_input"
description = "No rows. Catches: an empty input giving 0 instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["5"],
]
query = "SELECT AVG(x) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
