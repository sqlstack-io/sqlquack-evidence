category = "translation"
construct = "sf.functions.hour-minute-second.minute"
session_profile = "utc-v1"

[[case]]
id = "t001_time"
description = "MINUTE of times with fractional seconds. Catches: fractional seconds rounded up (59 instead of 58)"
columns = [{ name = "t", type = "TIME" }]
rows = [
  ["'23:58:59.999'"],
  ["'00:00:01'"],
  ["'13:07:30.5'"],
]
query = "SELECT MINUTE(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_timestamp_ntz"
description = "MINUTE of a timestamp. Catches: the date part leaking into the result"
columns = [{ name = "t", type = "TIMESTAMP_NTZ" }]
rows = [
  ["'2024-02-29 17:45:59.999'"],
]
query = "SELECT MINUTE(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_timestamp_tz"
description = "MINUTE of TIMESTAMP_TZ values with whole and half-hour offsets. Catches: the minute of the UTC instant for a half-hour offset zone"
columns = [{ name = "t", type = "TIMESTAMP_TZ" }]
rows = [
  ["'2024-01-01 23:30:56.750 -0800'"],
  ["'2024-01-01 23:45:10 +0530'"],
]
query = "SELECT MINUTE(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_interval"
description = "MINUTE of a day-time interval. Catches: an error, or total minutes (1563) instead of the minute field (3)"
columns = [{ name = "k", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MINUTE(INTERVAL '1 02:03:04.5' DAY TO SECOND) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_time_interval_or_timestamp_expr"
description = "NULL next to a set time. Catches: NULL read as midnight (0)"
columns = [{ name = "t", type = "TIME" }]
rows = [
  ["NULL"],
  ["'01:02:03'"],
]
query = "SELECT MINUTE(t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
