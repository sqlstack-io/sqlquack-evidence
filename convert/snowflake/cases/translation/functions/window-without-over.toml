[[case]]
id = "t001_cume_dist_without_over"
compile_error = true
description = "CUME_DIST() written without OVER, which Snowflake refuses when compiling (2064, missing window specification). Catches: a value returned instead of the error"
columns = [{ name = "k", type = "NUMBER(38,0)" }]
rows = [["1"]]
query = "SELECT CUME_DIST() AS r FROM (SELECT 1 AS x) t"
order = "ordered"
tags = ["type-combination", "error"]

