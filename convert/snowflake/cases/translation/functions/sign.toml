category = "translation"
construct = "sf.functions.sign"
session_profile = "utc-v1"

[[case]]
id = "t001_int"
description = "SIGN of integers. Catches: ABS computed (-7 gives 7 instead of -1)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["-7"],
  ["0"],
  ["12"],
]
query = "SELECT SIGN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_dec"
description = "SIGN of NUMBER(10,2), keeping its type. Catches: the scale lost or FLOAT returned"
columns = [{ name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["-2.50"],
  ["-0.01"],
  ["3.25"],
]
query = "SELECT SIGN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_float"
description = "SIGN of FLOAT. Catches: negative zero and tiny negatives"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["-0.0"],
  ["-1e-300"],
  ["2.5"],
]
query = "SELECT SIGN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null"
description = "SIGN of NULL. Catches: NULL turned into 0"
columns = [{ name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["NULL"],
]
query = "SELECT SIGN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_extremes"
description = "The 38-digit and double extremes. Catches: 64-bit arithmetic overflowing"
columns = [{ name = "x", type = "NUMBER(38,0)" }, { name = "y", type = "FLOAT" }]
rows = [
  ["-99999999999999999999999999999999999999", "-1e308"],
  ["99999999999999999999999999999999999999", "1e-320"],
]
query = "SELECT SIGN(x) AS r, SIGN(y) AS s FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
