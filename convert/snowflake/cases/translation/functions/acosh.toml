category = "translation"
construct = "sf.functions.acosh"
session_profile = "utc-v1"

[[case]]
id = "t001_float"
description = "ACOSH of FLOAT values. Catches: ASINH computed"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["1"],
  ["2.5"],
  ["10"],
]
query = "SELECT ACOSH(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_fixed"
description = "ACOSH of NUMBER(12,4), converted to FLOAT. Catches: ASINH computed; or the result left fixed-point"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["1.5000"],
  ["3.0000"],
]
query = "SELECT ACOSH(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null"
description = "ACOSH of NULL. Catches: NULL turned into 0 or NaN"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["NULL"],
]
query = "SELECT ACOSH(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_edge"
description = "At 1, the domain edge, and large values. Catches: edge returned as NaN"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["1"],
  ["1e300"],
]
query = "SELECT ACOSH(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t005_below_one"
description = "ACOSH at or outside its domain: Snowflake raises error 100044 on every row (captured at e8691b63). Catches: NaN, NULL or a value where Snowflake raises an error"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0.5"],
]
query = "SELECT ACOSH(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
