category = "translation"
construct = "sf.functions.max.max"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "Upper- and lower-case text, compared in binary order. Catches: case-insensitive or locale order (a and B swap)"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'B'"],
  ["'a'"],
  ["'Z'"],
]
query = "SELECT MAX(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_number_text"
description = "Digits as text compare as text. Catches: text cast to NUMBER (9 vs 10 swap)"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'9'"],
  ["'10'"],
]
query = "SELECT MAX(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_date"
description = "Dates across a year boundary. Catches: dates compared as text in another format"
columns = [{ name = "x", type = "DATE" }]
rows = [
  ["'2024-12-31'"],
  ["'2025-01-02'"],
  ["'2024-02-29'"],
]
query = "SELECT MAX(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_distinct"
description = "DISTINCT, which has no effect, beside the plain call. Catches: DISTINCT rejected"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["-3"],
  ["8"],
  ["-3"],
]
query = "SELECT MAX(DISTINCT x) AS r, MAX(x) AS p FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null_expr"
description = "NULL rows beside values, and a group of only NULL. Catches: NULL taken as the largest value, or read as 0"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "NULL"],
  ["'p'", "-5"],
  ["'p'", "-2"],
]
query = "SELECT g, MAX(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_empty_input"
description = "No rows. Catches: an empty input giving 0 or no row"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MAX(x) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
