category = "translation"
construct = "sf.functions.array-intersection"
session_profile = "utc-v1"

[[case]]
id = "t001_bag"
description = "Three copies of 1 against two. Catches: set semantics (one 1), or every copy of the first array kept"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[1,1,1,2]'", "'[3,1,1]'"],
]
query = "SELECT ARRAY_SORT(ARRAY_INTERSECTION(PARSE_JSON(a), PARSE_JSON(b))) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_number_vs_text"
description = "The number 1 against the text \"1\". Catches: values compared as text"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[1]'", "'[\"1\"]'"],
]
query = "SELECT ARRAY_INTERSECTION(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_disjoint"
description = "No common element. Catches: NULL returned instead of an empty array"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[1,2]'", "'[3]'"],
]
query = "SELECT ARRAY_INTERSECTION(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["empty-input"]

[[case]]
id = "t004_null_array1"
description = "A NULL array on either side. Catches: NULL read as an empty array (an empty array returned)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["NULL", "'[1]'"],
  ["'[1]'", "NULL"],
]
query = "SELECT ARRAY_INTERSECTION(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
