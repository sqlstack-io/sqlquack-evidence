category = "translation"
construct = "sf.functions.sinh"
session_profile = "utc-v1"

[[case]]
id = "t001_float"
description = "SINH of FLOAT values. Catches: COSH computed"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0"],
  ["1"],
  ["-2"],
]
query = "SELECT SINH(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_fixed"
description = "SINH of NUMBER(12,4), converted to FLOAT. Catches: COSH computed; or the result left fixed-point"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["0.5000"],
  ["-1.2500"],
]
query = "SELECT SINH(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null"
description = "SINH of NULL. Catches: NULL turned into 0 or NaN"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["NULL"],
]
query = "SELECT SINH(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_overflow_inf"
description = "Arguments just past the double range (710.48). Catches: infinity versus error"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["711"],
  ["-711"],
]
query = "SELECT SINH(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
