category = "translation"
construct = "sf.functions.bitxor"
session_profile = "utc-v1"

[[case]]
id = "t001_integers"
description = "Integers whose bits overlap in part, and a negative. Catches: OR computed instead of XOR (14 instead of 6), or the sign bit lost"
columns = [{ name = "x", type = "NUMBER(38,0)" }, { name = "y", type = "NUMBER(38,0)" }]
rows = [
  ["12", "10"],
  ["-1", "255"],
]
query = "SELECT BITXOR(x, y) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_casts"
description = "A decimal and the string 12.3, which the page says cast to integers. Catches: the decimal truncated where Snowflake rounds, or the string rejected"
columns = [{ name = "x", type = "NUMBER(10,3)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["13.500", "'12.3'"],
]
query = "SELECT BITXOR(x, 10) AS dec, BITXOR(v, 10) AS str FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_binary_pad"
description = "BINARY values of different lengths padded on the left and on the right. Catches: both paddings giving the same result, or padside ignored"
columns = [{ name = "a", type = "BINARY" }, { name = "b", type = "BINARY" }]
rows = [
  ["'FF00'", "'0F'"],
]
query = "SELECT BITXOR(a, b, 'LEFT') AS l, BITXOR(a, b, 'RIGHT') AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_binary_unequal"
description = "BINARY values of different lengths without padside, which the page says requires it. Catches: a default padding applied"
columns = [{ name = "a", type = "BINARY" }, { name = "b", type = "BINARY" }]
rows = [
  ["'FF00'", "'0F'"],
]
query = "SELECT BITXOR(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t005_null_expr1"
description = "A NULL on either side next to a string that cannot be cast; Snowflake raised 100038 for the string, so it is not treated as NULL. Catches: the string read as NULL or 0"
columns = [{ name = "x", type = "NUMBER(38,0)" }, { name = "v", type = "VARCHAR" }]
rows = [
  ["NULL", "'x'"],
]
query = "SELECT BITXOR(x, 1) AS l, BITXOR(1, x) AS r, BITXOR(v, 1) AS s FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t006_null_expr1"
description = "A NULL on either side alone; the BITAND page, which also covers BITOR and BITXOR, says either NULL input gives NULL. Catches: the NULL read as 0"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT BITXOR(x, 1) AS l, BITXOR(1, x) AS r FROM input"
order = "ordered"
tags = ["null"]
