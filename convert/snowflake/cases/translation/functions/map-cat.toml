category = "translation"
construct = "sf.functions.map-cat"
session_profile = "utc-v1"

[[case]]
id = "t001_overlap"
description = "Maps sharing the key b. Catches: map1's value kept for b"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["3"],
]
query = "SELECT MAP_CAT(MAP_CONSTRUCT('a', 1, 'b', 2), MAP_CONSTRUCT('b', x, 'c', 4))::VARIANT AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_map1"
description = "A NULL map on either side, which the page says gives NULL. Catches: the other map returned"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
]
query = "SELECT MAP_CAT(IFF(x IS NULL, NULL, MAP_CONSTRUCT('a', 1, 'b', 2)), MAP_CONSTRUCT('a', 1, 'b', 2)) IS NULL AS l, MAP_CAT(MAP_CONSTRUCT('a', 1, 'b', 2), IFF(x IS NULL, NULL, MAP_CONSTRUCT('a', 1, 'b', 2))) IS NULL AS r FROM input"
order = "ordered"
tags = ["null"]
