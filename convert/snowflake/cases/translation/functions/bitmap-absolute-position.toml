category = "translation"
construct = "sf.functions.bitmap-absolute-position"
session_profile = "utc-v1"

[[case]]
id = "t001_round_trip"
description = "Bucket and position of the edge values, mapped back. Catches: an off-by-one at the bucket edge (32768 and 32769 swapped buckets)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["32768"],
  ["32769"],
  ["65536"],
  ["0"],
  ["-1"],
  ["100000"],
]
query = "SELECT BITMAP_ABSOLUTE_POSITION(BITMAP_BUCKET_NUMBER(x), BITMAP_BIT_POSITION(x)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_literal"
description = "Bucket 2 position 0 and bucket 1 position 32767. Catches: zero-based buckets"
columns = [{ name = "b", type = "NUMBER(38,0)" }, { name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["2", "0"],
  ["1", "32767"],
  ["1", "0"],
]
query = "SELECT BITMAP_ABSOLUTE_POSITION(b, p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_bucket_number"
description = "NULL bucket. Catches: bucket read as 0"
columns = [{ name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["3"],
]
query = "SELECT BITMAP_ABSOLUTE_POSITION(NULL, p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_relative_position"
description = "NULL position. Catches: position read as 0"
columns = [{ name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["2"],
]
query = "SELECT BITMAP_ABSOLUTE_POSITION(b, NULL) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
