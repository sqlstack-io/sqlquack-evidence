category = "translation"
construct = "sf.functions.boolxor"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "BOOLXOR over zero, non-zero and negative values. Catches: negative values read as FALSE, or another operator than XOR"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["0", "0"],
  ["0", "7"],
  ["-3", "7"],
  ["-3", "0"],
]
query = "SELECT BOOLXOR(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_float"
description = "FLOAT values that round to zero, as the page warns. Catches: non-zero floats read as TRUE (0.3 is FALSE after rounding)"
columns = [{ name = "a", type = "FLOAT" }, { name = "b", type = "FLOAT" }]
rows = [
  ["0.3", "1"],
  ["0.7", "1"],
  ["-0.4", "0"],
]
query = "SELECT BOOLXOR(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_decimal"
description = "Fixed-point fractions. Catches: fixed-point treated like FLOAT (rounded) or the reverse"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["0.30", "1"],
  ["0.70", "0"],
]
query = "SELECT BOOLXOR(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr1"
description = "NULL first argument, beside zero and non-zero values. Catches: NULL read as FALSE or TRUE (a value instead of NULL)"
columns = [{ name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["0"],
  ["5"],
]
query = "SELECT BOOLXOR(NULL, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_expr2"
description = "NULL second argument, beside zero and non-zero values. Catches: NULL read as FALSE or TRUE (a value instead of NULL)"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["0"],
  ["5"],
]
query = "SELECT BOOLXOR(a, NULL) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
