category = "translation"
construct = "sf.functions.percent-rank"
session_profile = "utc-v1"

[[case]]
id = "t001_ties"
description = "A tie and a one-row partition, which gives 0. Catches: CUME_DIST computed, or NULL or an error for the one-row partition"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, PERCENT_RANK() OVER (PARTITION BY p ORDER BY o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_desc"
description = "Descending order. Catches: ascending order used"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "10"],
  ["'a'", "20"],
  ["'a'", "20"],
  ["'a'", "NULL"],
  ["'a'", "30"],
  ["'b'", "5"],
]
query = "SELECT ordinal, PERCENT_RANK() OVER (PARTITION BY p ORDER BY o DESC) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_order_expr"
description = "NULL order keys sorted first; tied NULLs share a relative rank. Catches: NULLs sorted last"
columns = [{ name = "p", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "NULL"],
  ["'a'", "2"],
  ["'a'", "NULL"],
  ["'a'", "1"],
]
query = "SELECT ordinal, PERCENT_RANK() OVER (PARTITION BY p ORDER BY o NULLS FIRST) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
