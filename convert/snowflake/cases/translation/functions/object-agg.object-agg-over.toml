category = "translation"
construct = "sf.functions.object-agg.object-agg-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Per-partition objects. Catches: the whole input collected (a duplicate key error)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "VARCHAR" }, { name = "v", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "'a'", "1"],
  ["'q'", "'a'", "2"],
  ["'p'", "'b'", "3"],
]
query = "SELECT OBJECT_AGG(k, v::VARIANT) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_empty_over"
description = "An empty OVER clause. Catches: a running object"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "VARCHAR" }, { name = "v", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "'a'", "1"],
  ["'p'", "'b'", "2"],
]
query = "SELECT OBJECT_AGG(k, v::VARIANT) OVER () AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_value"
description = "A NULL value inside a partition. Catches: the key kept with a null value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "VARCHAR" }, { name = "v", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "'a'", "NULL"],
  ["'p'", "'b'", "1"],
]
query = "SELECT OBJECT_AGG(k, v::VARIANT) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_expr2"
description = "NULL partition keys. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "VARCHAR" }, { name = "v", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "'a'", "1"],
  ["'p'", "'a'", "9"],
  ["NULL", "'b'", "2"],
]
query = "SELECT OBJECT_AGG(k, v::VARIANT) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
