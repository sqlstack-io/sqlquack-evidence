category = "translation"
construct = "sf.functions.try-to-decfloat"
session_profile = "utc-v1"

[[case]]
id = "t001_valid"
description = "Decimal strings with trailing zeros and an exponent, compared as text; whether the trailing zero is kept the page does not say, so the recording decides. Catches: NULL for valid input, or trailing zeros handled differently from Snowflake"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'1.10'"],
  ["'-2.5e3'"],
]
query = "SELECT TRY_TO_DECFLOAT(v)::VARCHAR AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_invalid"
description = "Text that is not a number, and inf, which the page says is not supported. Catches: an error raised, or infinity returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'abc'"],
  ["'inf'"],
]
query = "SELECT TRY_TO_DECFLOAT(v) IS NULL AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_string_expr"
description = "A NULL string. Catches: zero returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT TRY_TO_DECFLOAT(v)::VARCHAR AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
