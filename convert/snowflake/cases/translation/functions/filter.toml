category = "translation"
construct = "sf.functions.filter"
session_profile = "utc-v1"

[[case]]
id = "t001_keeps_order"
description = "A condition true for a non-contiguous subset. Catches: the order changed, or the elements failing the condition kept"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[3,1,4,1,5]'"],
  ["'[]'"],
]
query = "SELECT FILTER(PARSE_JSON(a), x -> x > 2) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_condition"
description = "A JSON null element, for which the condition is NULL. Catches: the element kept when the condition is NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[1,null,3]'"],
]
query = "SELECT FILTER(PARSE_JSON(a), x -> x > 0) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_array"
description = "A NULL array. Catches: an empty array returned"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT FILTER(PARSE_JSON(a), x -> x > 0) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
