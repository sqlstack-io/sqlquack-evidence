category = "translation"
construct = "sf.functions.kurtosis.kurtosis"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "A skewed group of five. Catches: population or non-excess kurtosis (no -3 and no small-sample correction)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "2"],
  ["'p'", "3"],
  ["'q'", "5"],
  ["'p'", "4"],
  ["'q'", "9"],
  ["'p'", "20"],
]
query = "SELECT g, KURTOSIS(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_float"
description = "FLOAT input, which the page says returns DOUBLE. Catches: a DECIMAL result"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0.5"],
  ["1.5"],
  ["2"],
  ["8"],
]
query = "SELECT KURTOSIS(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_three_rows"
description = "Three values, below the documented minimum of four. Catches: a value instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["2"],
  ["9"],
]
query = "SELECT KURTOSIS(x) AS r FROM input"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t004_null_expr"
description = "Four rows of which one is NULL. Catches: NULL counted as a row (a value instead of NULL)"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["NULL"],
  ["3"],
  ["10"],
]
query = "SELECT KURTOSIS(x) AS r FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_empty_input"
description = "No rows. Catches: an error instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT KURTOSIS(x) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
