category = "translation"
construct = "sf.functions.regexp-instr"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "The first match after multi-byte characters. Catches: a 0-based or byte offset, or 0 for a match"
columns = [{ name = "a", type = "VARCHAR" }, { name = "p", type = "VARCHAR" }]
rows = [
  ["'xyzabcabc'", "'abc'"],
  ["'\u00e9\u00e9abc'", "'b'"],
  ["'xyz'", "'q'"],
]
query = "SELECT REGEXP_INSTR(a, p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_position_occurrence"
description = "Position and occurrence together. Catches: occurrence counted from the string start instead of the position, or ignored"
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'abcabcabc'", "1", "2"],
  ["'abcabcabc'", "2", "2"],
  ["'abcabcabc'", "1", "4"],
]
query = "SELECT REGEXP_INSTR(a, 'abc', n, o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_option"
description = "Option 0 and option 1. Catches: option 1 giving the last character of the match instead of the one after"
columns = [{ name = "a", type = "VARCHAR" }, { name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["'xxabcxx'", "0"],
  ["'xxabcxx'", "1"],
]
query = "SELECT REGEXP_INSTR(a, 'abc', 1, 1, o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_group"
description = "A capture group in the second match. Catches: the group number ignored (the match start) or the first match used"
columns = [{ name = "a", type = "VARCHAR" }, { name = "g", type = "NUMBER(38,0)" }]
rows = [
  ["'k1=v1 k2=v22'", "2"],
  ["'k1=v1 k2=v22'", "1"],
]
query = "SELECT REGEXP_INSTR(a, 'k([0-9])=v([0-9]+)', 1, 2, 0, 'e', g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_parameters"
description = "The i parameter. Catches: parameters ignored"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'xxABC'"],
]
query = "SELECT REGEXP_INSTR(a, 'abc', 1, 1, 0, 'i') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_null_subject"
description = "NULL subject. Catches: NULL read as empty (0)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'ab'"],
]
query = "SELECT REGEXP_INSTR(a, 'b') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_null_pattern"
description = "NULL pattern. Catches: NULL read as an empty pattern"
columns = [{ name = "p", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'b'"],
]
query = "SELECT REGEXP_INSTR('ab', p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t008_null_position"
description = "NULL position. Catches: NULL read as 1"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT REGEXP_INSTR('abab', 'a', n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t009_null_occurrence"
description = "NULL occurrence. Catches: NULL read as 1"
columns = [{ name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT REGEXP_INSTR('abab', 'a', 1, o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t010_null_option"
description = "NULL option. Catches: NULL read as 0"
columns = [{ name = "o", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT REGEXP_INSTR('abab', 'a', 1, 1, o) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t011_null_regexp_parameters"
description = "NULL parameters. Catches: NULL read as c"
columns = [{ name = "m", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'i'"],
]
query = "SELECT REGEXP_INSTR('xA', 'a', 1, 1, 0, m) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t012_null_group_num"
description = "NULL group. Catches: NULL read as the whole match"
columns = [{ name = "g", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["1"],
]
query = "SELECT REGEXP_INSTR('k1=v1', 'k([0-9])', 1, 1, 0, 'e', g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t013_occurrence_past_end"
description = "An occurrence past the last match. Catches: the last match returned instead of 0"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'abab'"],
]
query = "SELECT REGEXP_INSTR(a, 'b', 1, 3) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
