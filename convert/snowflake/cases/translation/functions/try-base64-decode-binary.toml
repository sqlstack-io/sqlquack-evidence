category = "translation"
construct = "sf.functions.try-base64-decode-binary"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "TRY_BASE64_DECODE_BINARY of valid Base64. Catches: wrong bytes, the URL-safe alphabet, or padding mishandled"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'+/8='"],
  ["'YWJj'"],
]
query = "SELECT TRY_BASE64_DECODE_BINARY(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_invalid"
description = "Invalid Base64 next to valid Base64. Catches: an error for the invalid row (the non-TRY behaviour) or NULL for the valid row too"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'ab$c'"],
  ["'YQ'"],
  ["'YQ=='"],
]
query = "SELECT TRY_BASE64_DECODE_BINARY(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_alphabet"
description = "A custom alphabet. The constant argument is a literal per call, as Snowflake requires. Catches: the alphabet ignored (NULL for -_ input)"
columns = [{ name = "a1", type = "VARCHAR" }]
rows = [
  ["'-_8~'"],
]
query = "SELECT TRY_BASE64_DECODE_BINARY(a1, '-_~') AS r1 FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_input"
description = "NULL input next to a set one. Catches: NULL decoded as empty"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'YQ=='"],
]
query = "SELECT TRY_BASE64_DECODE_BINARY(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_alphabet"
description = "NULL alphabet next to a set one. The constant argument is a literal per call, as Snowflake requires. Catches: NULL read as the default alphabet"
columns = [{ name = "a1", type = "VARCHAR" }, { name = "a2", type = "VARCHAR" }]
rows = [
  ["'YQ=='", "'YQ=='"],
]
query = "SELECT TRY_BASE64_DECODE_BINARY(a1, NULL) AS r1, TRY_BASE64_DECODE_BINARY(a2, '+/=') AS r2 FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_empty"
description = "The empty string. Catches: NULL for empty input instead of an empty value"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["''"],
]
query = "SELECT TRY_BASE64_DECODE_BINARY(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]
