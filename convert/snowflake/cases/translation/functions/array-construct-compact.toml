category = "translation"
construct = "sf.functions.array-construct-compact"
session_profile = "utc-v1"

[[case]]
id = "t001_mixed_types"
description = "A number and text in one array. Catches: the number converted to text"
columns = [{ name = "n", type = "NUMBER(38,0)" }, { name = "t", type = "VARCHAR" }]
rows = [
  ["1", "'1'"],
]
query = "SELECT ARRAY_CONSTRUCT_COMPACT(n, t) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_expr1"
description = "SQL NULL arguments around values, and only SQL NULL arguments. Catches: the NULL kept as an undefined element (size 3), or NULL returned for the all-NULL call"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["5"],
]
query = "SELECT ARRAY_CONSTRUCT_COMPACT(x, 1, x) AS r, ARRAY_CONSTRUCT_COMPACT(x, x) AS e FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_json_null"
description = "A JSON null argument. The page says SQL NULL values are skipped, so a JSON null is not. Catches: the JSON null skipped like a SQL NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT ARRAY_CONSTRUCT_COMPACT(PARSE_JSON('null'), x) AS r FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["type-combination"]

[[case]]
id = "t004_no_arguments"
description = "No arguments. Catches: NULL returned instead of an empty array"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT ARRAY_CONSTRUCT_COMPACT() AS r FROM input"
order = "ordered"
tags = ["empty-input"]
