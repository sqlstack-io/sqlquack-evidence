category = "translation"
construct = "sf.functions.approx-percentile.approx-percentile-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Per-partition medians. Catches: the whole input"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "2", "20"],
  ["'q'", "5", "3"],
  ["'p'", "1", "10"],
  ["'p'", "3", "1"],
  ["'q'", "1", "7"],
  ["'p'", "2", "5"],
]
query = "SELECT APPROX_PERCENTILE(x, 0.5) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_empty_over"
description = "An empty OVER clause. Catches: a running value"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "2", "20"],
  ["'q'", "5", "3"],
  ["'p'", "1", "10"],
  ["'p'", "3", "1"],
  ["'q'", "1", "7"],
  ["'p'", "2", "5"],
]
query = "SELECT APPROX_PERCENTILE(x, 0.5) OVER () AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr"
description = "NULL values inside a partition. Catches: NULL counted"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1", "NULL"],
  ["'p'", "2", "6"],
  ["'p'", "3", "2"],
]
query = "SELECT APPROX_PERCENTILE(x, 0.5) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_expr3"
description = "NULL partition keys. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1", "4"],
  ["'p'", "1", "9"],
  ["NULL", "2", "2"],
]
query = "SELECT APPROX_PERCENTILE(x, 0.5) OVER (PARTITION BY g) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
