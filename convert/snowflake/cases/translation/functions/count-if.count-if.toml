category = "translation"
construct = "sf.functions.count-if.count-if"
session_profile = "utc-v1"

[[case]]
id = "t001_condition"
description = "A comparison per group, true for some rows. Catches: rows counted regardless of the condition, or FALSE counted"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "5"],
  ["'p'", "9"],
]
query = "SELECT g, COUNT_IF(x > 3) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_boolean_column"
description = "A BOOLEAN column directly. Catches: the column read as a count of non-NULL values"
columns = [{ name = "b", type = "BOOLEAN" }]
rows = [
  ["TRUE"],
  ["FALSE"],
  ["TRUE"],
]
query = "SELECT COUNT_IF(b) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_condition"
description = "A condition that is NULL for a NULL value. Catches: a NULL condition counted as TRUE"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["5"],
  ["1"],
]
query = "SELECT COUNT_IF(x > 3) AS r FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_empty_input"
description = "No rows. Catches: NULL instead of 0"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["5"],
]
query = "SELECT COUNT_IF(x > 3) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]
