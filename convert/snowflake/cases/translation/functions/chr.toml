category = "translation"
construct = "sf.functions.chr"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "CHR of ASCII and non-ASCII code points. Catches: a byte or Latin-1 conversion (233 and 8364 not giving \u00e9 and \u20ac), or an error past 255"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["65"],
  ["233"],
  ["8364"],
  ["10052"],
]
query = "SELECT CHR(n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_input"
description = "NULL code point next to a set one. Catches: NULL read as 0 (a NUL character instead of NULL)"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["97"],
]
query = "SELECT CHR(n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_negative"
description = "A negative code point: records what Snowflake returns there; it moves to boundary if Snowflake returns a value instead of an error. Catches: an empty string or a wrapped code point where Snowflake raises an error"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["-1"],
]
query = "SELECT CHR(n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
