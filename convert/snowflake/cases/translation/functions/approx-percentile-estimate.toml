category = "translation"
construct = "sf.functions.approx-percentile-estimate"
session_profile = "utc-v1"

[[case]]
id = "t001_percentiles"
description = "Two percentiles from one state. Catches: the percentile read as 0-100 or from the top"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "4"],
  ["'p'", "9"],
  ["'p'", "3"],
  ["'p'", "5"],
  ["'p'", "7"],
]
query = "SELECT g, APPROX_PERCENTILE_ESTIMATE(st, 0.2) AS lo, APPROX_PERCENTILE_ESTIMATE(st, 0.8) AS hi FROM (SELECT g, APPROX_PERCENTILE_ACCUMULATE(x) AS st FROM input GROUP BY g) ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_zero"
description = "The documented lower end 0.0. Catches: 0.0 rejected"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "4"],
  ["'p'", "9"],
  ["'p'", "3"],
  ["'p'", "5"],
  ["'p'", "7"],
]
query = "SELECT g, APPROX_PERCENTILE_ESTIMATE(st, 0) AS r FROM (SELECT g, APPROX_PERCENTILE_ACCUMULATE(x) AS st FROM input GROUP BY g) ORDER BY g"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t003_null_state"
description = "A NULL state. Catches: an error instead of NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "4"],
  ["'p'", "9"],
  ["'p'", "3"],
  ["'p'", "5"],
  ["'p'", "7"],
]
query = "SELECT APPROX_PERCENTILE_ESTIMATE(NULL, 0.5) AS r"
order = "ordered"
tags = ["null"]
