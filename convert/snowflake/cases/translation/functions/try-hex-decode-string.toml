category = "translation"
construct = "sf.functions.try-hex-decode-string"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "TRY_HEX_DECODE_STRING of upper- and lower-case hex digits. Catches: lower-case digits rejected, nibble order swapped, or UTF-8 read as Latin-1"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'48C3A96C6C6F'"],
  ["'e282ac'"],
]
query = "SELECT TRY_HEX_DECODE_STRING(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_invalid"
description = "Invalid hex next to valid hex. Catches: an error (the non-TRY behaviour) instead of NULL, or a partial decode of the odd-length row, or bytes that are not UTF-8 (FF) decoded instead of NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'4G'"],
  ["'414'"],
  ["'4142'"],
  ["'FF'"],
]
query = "SELECT TRY_HEX_DECODE_STRING(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_input"
description = "NULL input next to a set one. Catches: NULL decoded as empty"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'41'"],
]
query = "SELECT TRY_HEX_DECODE_STRING(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_empty"
description = "The empty string. Catches: NULL or an error for empty input"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["''"],
  ["'42'"],
]
query = "SELECT TRY_HEX_DECODE_STRING(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]
