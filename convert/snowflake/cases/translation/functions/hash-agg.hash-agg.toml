category = "translation"
construct = "sf.functions.hash-agg.hash-agg"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "HASH_AGG over varied rows with a duplicate. Catches: another per-row hash or combining function"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["3"],
  ["-7"],
  ["3"],
  ["100"],
]
query = "SELECT HASH_AGG(a) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_distinct"
description = "HASH_AGG(DISTINCT) against the plain aggregate on rows with duplicates. Catches: DISTINCT ignored (the two values equal)"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["3"],
  ["3"],
  ["5"],
]
query = "SELECT HASH_AGG(DISTINCT a) AS d, HASH_AGG(a) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_row_order"
description = "Two columns holding the same values in different row orders, and both column orders. Catches: a row-order-sensitive fold (r1 FALSE) or a column-order-insensitive one (r2 TRUE)"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }, { name = "c", type = "VARCHAR" }]
rows = [
  ["1", "3", "'x'"],
  ["2", "1", "'y'"],
  ["3", "2", "'z'"],
]
query = "SELECT HASH_AGG(a) = HASH_AGG(b) AS r1, HASH_AGG(a, c) = HASH_AGG(c, a) AS r2, HASH_AGG(a, c) AS h FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr"
description = "NULL rows, which the page says are not ignored. Catches: NULL rows skipped (equal to the aggregate without them) or a NULL result"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "k", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1"],
  ["4", "1"],
]
query = "SELECT HASH_AGG(a) AS r, HASH_AGG(a) = (SELECT HASH_AGG(a) FROM input WHERE a IS NOT NULL) AS same FROM input"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_no_rows"
description = "HASH_AGG over no rows. Catches: NULL for an empty input (the page: never NULL)"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT HASH_AGG(a) AS r FROM input WHERE a > 5"
order = "ordered"
tags = ["boundary", "empty"]
