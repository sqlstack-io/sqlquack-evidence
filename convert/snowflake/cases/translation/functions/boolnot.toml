category = "translation"
construct = "sf.functions.boolnot"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "BOOLNOT of zero, positive and negative values. Catches: a negative value read as FALSE"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["0"],
  ["4"],
  ["-4"],
]
query = "SELECT BOOLNOT(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_float"
description = "FLOAT values around rounding to zero. Catches: non-zero floats read as TRUE before rounding"
columns = [{ name = "a", type = "FLOAT" }]
rows = [
  ["0.3"],
  ["0.5"],
  ["-0.6"],
]
query = "SELECT BOOLNOT(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr"
description = "NULL argument. Catches: NULL read as FALSE (TRUE instead of NULL)"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["0"],
]
query = "SELECT BOOLNOT(a) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
