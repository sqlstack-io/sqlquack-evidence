category = "translation"
construct = "sf.functions.arrays-zip"
session_profile = "utc-v1"

[[case]]
id = "t001_three_arrays"
description = "Three arrays of equal length. Catches: keys numbered from 0, or the arrays transposed"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }, { name = "c", type = "VARCHAR" }]
rows = [
  ["'[1,2]'", "'[\"x\",\"y\"]'", "'[true,false]'"],
]
query = "SELECT ARRAYS_ZIP(PARSE_JSON(a), PARSE_JSON(b), PARSE_JSON(c)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_lengths"
description = "Arrays of different lengths. Catches: the result cut to the shorter array, or padded with SQL NULL"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'[1,2,3]'", "'[\"x\"]'"],
]
query = "SELECT ARRAYS_ZIP(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_one_array"
description = "A single array. Catches: the array returned as it is"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[1,2]'"],
]
query = "SELECT ARRAYS_ZIP(PARSE_JSON(a)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_array"
description = "A NULL array, and a SQL NULL element. Catches: the NULL array read as empty, or the NULL element dropped"
columns = [{ name = "a", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1"],
  ["'[1,2]'", "NULL"],
]
query = "SELECT ARRAYS_ZIP(PARSE_JSON(a), ARRAY_CONSTRUCT(1)) AS r, ARRAYS_ZIP(ARRAY_CONSTRUCT(x, 2)) AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
