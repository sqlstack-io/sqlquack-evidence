category = "translation"
construct = "sf.functions.position.position"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "Search for a substring after multi-byte characters. Catches: arguments swapped (searching the needle in the haystack), a 0-based result, or a byte offset (5 instead of 3 for \u00e9\u00e9l)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'an'", "'banana'"],
  ["'l'", "'\u00e9\u00e9l'"],
  ["'x'", "'abc'"],
]
query = "SELECT POSITION(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_start_pos"
description = "A start position past the first match. Catches: the start position ignored (2 instead of 4) or the result counted from the start position"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["'an'", "'banana'", "3"],
  ["'an'", "'banana'", "5"],
  ["'\u00e9'", "'\u00e9a\u00e9'", "2"],
]
query = "SELECT POSITION(a, b, p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_binary"
description = "Search in binary values. Catches: a hex-text offset (3 instead of 2)"
columns = [{ name = "a", type = "BINARY" }, { name = "b", type = "BINARY" }]
rows = [
  ["'FF'", "'00FF'"],
]
query = "SELECT POSITION(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_expr1"
description = "NULL needle next to a set one. Catches: NULL read as an empty needle (1 instead of NULL)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["NULL", "'abc'"],
  ["'c'", "'abc'"],
]
query = "SELECT POSITION(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_expr2"
description = "NULL haystack next to a set one. Catches: NULL read as an empty string (0 instead of NULL)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'a'", "NULL"],
  ["'a'", "'ba'"],
]
query = "SELECT POSITION(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_empty_needle"
description = "An empty needle, which the page says gives 1. Catches: NULL or 0 for an empty needle"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["''", "'abc'"],
  ["''", "''"],
]
query = "SELECT POSITION(a, b) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]

[[case]]
id = "t007_null_start_pos"
description = "NULL start next to a set one. Catches: NULL read as the default 1"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "'ba'", "NULL"],
  ["'a'", "'ba'", "1"],
]
query = "SELECT POSITION(a, b, p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t008_start_past_end"
description = "A start position past the end of the string. Catches: an error or the last match instead of 0"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "'aba'", "4"],
  ["'a'", "'aba'", "99"],
]
query = "SELECT POSITION(a, b, p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t009_start_zero_negative"
description = "Start positions 0 and -1: records what Snowflake returns. Catches: 0 read other than as Snowflake does (as 1, as an error, or as no match), or a negative start counted from the end"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }, { name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "'aba'", "0"],
  ["'a'", "'aba'", "-1"],
]
query = "SELECT POSITION(a, b, p) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
