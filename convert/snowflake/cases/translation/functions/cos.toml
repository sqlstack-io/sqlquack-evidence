category = "translation"
construct = "sf.functions.cos"
session_profile = "utc-v1"

[[case]]
id = "t001_float"
description = "COS of FLOAT values. Catches: SIN computed, or the argument read in degrees"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0"],
  ["1"],
  ["-2.5"],
  ["3.141592653589793"],
]
query = "SELECT COS(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_fixed"
description = "COS of NUMBER(12,4), converted to FLOAT. Catches: SIN computed, or the argument read in degrees; or the result left fixed-point"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["1.5000"],
  ["-0.7500"],
]
query = "SELECT COS(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null"
description = "COS of NULL. Catches: NULL turned into 0 or NaN"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["NULL"],
]
query = "SELECT COS(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_large"
description = "Large arguments. Catches: argument reduction differing"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["1e6"],
  ["-12345.678"],
]
query = "SELECT COS(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
