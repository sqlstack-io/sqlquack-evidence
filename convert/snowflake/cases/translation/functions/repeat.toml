category = "translation"
construct = "sf.functions.repeat"
session_profile = "utc-v1"

[[case]]
id = "t001_varchar"
description = "REPEAT of a multi-character and a multi-byte string. Catches: the count off by one, or the arguments swapped"
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'ab'", "3"],
  ["'\u00e9-'", "2"],
]
query = "SELECT REPEAT(a, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_input"
description = "NULL input. Catches: NULL read as empty"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'x'"],
]
query = "SELECT REPEAT(a, 2) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_null_n"
description = "NULL count. Catches: NULL read as 0"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["0"],
]
query = "SELECT REPEAT('x', n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_zero"
description = "A count of 0 and an empty input. Catches: NULL instead of an empty string"
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'ab'", "0"],
  ["''", "5"],
]
query = "SELECT REPEAT(a, n) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary", "empty"]

[[case]]
id = "t005_negative"
description = "A negative count, below the documented minimum: records what Snowflake returns. Catches: an error where Snowflake returns a value, or the reverse"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'ab'"],
]
query = "SELECT REPEAT(a, -1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
