category = "translation"
construct = "sf.functions.st-pointn"
session_profile = "utc-v1"

[[case]]
id = "t001_index"
description = "Index 2, and -1 for the last point. Catches: a 0-based index, or -1 read as the first point"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'LINESTRING(0 0,1 2,3 4)'"],
]
query = "SELECT ST_X(ST_POINTN(TO_GEOGRAPHY(v), 2)) AS x2, ST_X(ST_POINTN(TO_GEOGRAPHY(v), -1)) AS xl, ST_Y(ST_POINTN(TO_GEOMETRY(v), -2)) AS my FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_out_of_bounds"
description = "Index 4 of a 3-point line string, which the page says is an error. Catches: NULL returned, or the index wrapped"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'LINESTRING(0 0,1 2,3 4)'"],
]
query = "SELECT ST_ASWKT(ST_POINTN(TO_GEOGRAPHY(v), 4)) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t003_not_line"
description = "A polygon, which the page says is an error. Catches: a vertex of the ring returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,10 0,10 10,0 10,0 0))'"],
]
query = "SELECT ST_ASWKT(ST_POINTN(TO_GEOGRAPHY(v), 1)) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null_geography_or_geometry_expression"
description = "A NULL shape; the page does not say; the recording decides. Catches: an error"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_POINTN(TO_GEOGRAPHY(v), 1) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
