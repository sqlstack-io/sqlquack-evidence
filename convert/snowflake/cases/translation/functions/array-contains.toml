category = "translation"
construct = "sf.functions.array-contains"
session_profile = "utc-v1"

[[case]]
id = "t001_found"
description = "A present and an absent value. Catches: TRUE for the absent value, or a position returned"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'2'", "'[1,2,3]'"],
  ["'5'", "'[1,2,3]'"],
]
query = "SELECT ARRAY_CONTAINS(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_number_vs_text"
description = "The text \"1\" against an array holding the number 1, and the reverse. Catches: values compared as text (TRUE)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'\"1\"'", "'[1]'"],
  ["'1'", "'[\"1\"]'"],
]
query = "SELECT ARRAY_CONTAINS(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_json_null"
description = "A JSON null searched in arrays with and without a JSON null. Catches: JSON null never matched, or matched everywhere"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'null'", "'[1,null]'"],
  ["'null'", "'[1]'"],
]
query = "SELECT ARRAY_CONTAINS(PARSE_JSON(a), PARSE_JSON(b)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_value_expr"
description = "A NULL value searched in an array with a SQL NULL element and in one without. Catches: NULL returned where the page gives TRUE for the array holding a SQL NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT ARRAY_CONTAINS(NULL::VARIANT, ARRAY_CONSTRUCT(1, x)) AS r FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["null"]
