category = "translation"
construct = "sf.functions.to-geography"
session_profile = "utc-v1"

[[case]]
id = "t001_formats"
description = "The same point as WKT, WKB hex, EWKT and EWKB with SRID 4326, and GeoJSON. Catches: a format rejected or misread, or longitude and latitude swapped in one of them"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POINT(10 20)'"],
  ["'010100000000000000000024400000000000003440'"],
  ["'SRID=4326;POINT(10 20)'"],
  ["'0101000020E610000000000000000024400000000000003440'"],
  ["'{\"type\":\"Point\",\"coordinates\":[10,20]}'"],
]
query = "SELECT ordinal, ST_ASWKT(TO_GEOGRAPHY(v)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_binary"
description = "WKB as BINARY. Catches: BINARY input rejected, or read as hex text"
columns = [{ name = "b", type = "BINARY" }]
rows = [
  ["'010100000000000000000024400000000000003440'"],
]
query = "SELECT ST_ASWKT(TO_GEOGRAPHY(b)) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_variant"
description = "A GeoJSON OBJECT in a VARIANT. Catches: the OBJECT rejected, or its text parsed as WKT"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'{\"type\":\"Point\",\"coordinates\":[10,20]}'"],
]
query = "SELECT ST_ASWKT(TO_GEOGRAPHY(PARSE_JSON(v))) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_geometry"
description = "A GEOMETRY with SRID 4326, which the page accepts. Catches: the GEOMETRY rejected, or its coordinates swapped"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POINT(10 20)'"],
]
query = "SELECT ST_ASWKT(TO_GEOGRAPHY(TO_GEOMETRY(v, 4326))) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_srid"
description = "EWKT with SRID 3857, which the page says is an error. Catches: the point accepted in another SRID"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'SRID=3857;POINT(10 20)'"],
]
query = "SELECT ST_ASWKT(TO_GEOGRAPHY(v)) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t006_unparsable"
description = "Text in none of the formats, which the page says is an error. Catches: NULL returned, or the text read as an empty shape"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'not a shape'"],
]
query = "SELECT ST_ASWKT(TO_GEOGRAPHY(v)) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t007_allow_invalid"
description = "A self-intersecting polygon with allow_invalid TRUE. Catches: the bow tie repaired or rejected despite allow_invalid"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,10 10,10 0,0 10,0 0))'"],
]
query = "SELECT ST_ISVALID(TO_GEOGRAPHY(v, TRUE)) AS valid FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t008_null_varchar_expression"
description = "A NULL text; the page does not say; the recording decides. Catches: an error, or an empty shape returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT TO_GEOGRAPHY(v) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
