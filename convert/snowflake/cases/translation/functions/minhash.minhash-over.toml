category = "translation"
construct = "sf.functions.minhash.minhash-over"
session_profile = "utc-v1"

[[case]]
id = "t001_star"
description = "MINHASH(k, *) hashes whole rows, so the partition column makes p and q disjoint although their a values are equal. Catches: the star expanded without the partition column (1.0)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS r FROM (SELECT MINHASH(100, *) OVER (PARTITION BY g) AS m FROM (SELECT g, a FROM input WHERE g IN ('p', 'q')))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_expr1"
description = "A NULL partition key on every row of p, so its rows form one partition and every row gets the same state. Catches: NULL-keyed rows each in their own partition (states of {1} and {2}, similarity 0.0)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS r FROM (SELECT MINHASH(100, *) OVER (PARTITION BY NULLIF(a, a)) AS m FROM (SELECT a FROM input WHERE g = 'p'))"
order = "ordered"
tags = ["null"]
