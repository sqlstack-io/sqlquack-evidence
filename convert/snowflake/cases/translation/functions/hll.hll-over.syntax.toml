category = "translation"
construct = "sf.functions.hll.hll-over.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_star"
description = "Distinct whole rows per partition (the partition column included), one with NULL. Catches: rows counted instead of distinct rows, or rows with a NULL counted"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'p'", "1", "'y'"],
  ["'p'", "2", "'x'"],
  ["'p'", "1", "'x'"],
  ["'p'", "3", "NULL"],
  ["'q'", "1", "'x'"],
]
query = "SELECT g, a, b, HLL(*) OVER (PARTITION BY g) AS r FROM (SELECT g, a, b FROM input) ORDER BY g, a, b"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_star_empty_over"
description = "An empty OVER clause. Catches: a running count"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'p'", "1", "'y'"],
  ["'p'", "2", "'x'"],
  ["'p'", "1", "'x'"],
  ["'p'", "3", "NULL"],
]
query = "SELECT a, b, HLL(*) OVER () AS r FROM (SELECT a, b FROM input) ORDER BY a, b"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr2"
description = "A partition key outside the * columns, NULL for the two x rows, so the NULL-keyed rows form one partition of two distinct rows. Catches: NULL-keyed rows each in their own partition (1 instead of 2) or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'p'", "2", "'x'"],
  ["'p'", "1", "'y'"],
]
query = "SELECT a, b, HLL(*) OVER (PARTITION BY NULLIF(b, 'x')) AS r FROM (SELECT a, b FROM input) ORDER BY a, b"
order = "ordered"
tags = ["null"]
