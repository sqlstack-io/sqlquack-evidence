category = "translation"
construct = "sf.functions.ln"
session_profile = "utc-v1"

[[case]]
id = "t001_float"
description = "LN of FLOAT values. Catches: LOG10 or LOG2 computed"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["2.718281828459045"],
  ["10"],
  ["0.5"],
]
query = "SELECT LN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_fixed"
description = "LN of NUMBER(12,4), converted to FLOAT. Catches: LOG10 or LOG2 computed; or the result left fixed-point"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["2.0000"],
  ["0.2500"],
]
query = "SELECT LN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_decfloat"
description = "LN of DECFLOAT, which returns DECFLOAT. The result is cast to VARCHAR because the recorder cannot decode a DECFLOAT column. Catches: a DECFLOAT argument computed and returned as FLOAT"
columns = [{ name = "x", type = "DECFLOAT" }]
rows = [
  ["10"],
  ["0.5"],
]
query = "SELECT CAST(LN(x) AS VARCHAR) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null"
description = "LN of NULL. Catches: NULL turned into 0 or NaN"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["NULL"],
]
query = "SELECT LN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_tiny"
description = "Very small positive values. Catches: underflow to -infinity"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["1e-300"],
  ["5e-324"],
]
query = "SELECT LN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t006_zero"
description = "LN of 0 or a negative value is an error. Catches: NULL, NaN or -infinity instead of the error"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0"],
]
query = "SELECT LN(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
