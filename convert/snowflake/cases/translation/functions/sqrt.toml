category = "translation"
construct = "sf.functions.sqrt"
session_profile = "utc-v1"

[[case]]
id = "t001_float"
description = "SQRT of FLOAT values. Catches: CBRT or squaring computed"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["2"],
  ["0.25"],
  ["1e10"],
]
query = "SELECT SQRT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_fixed"
description = "SQRT of NUMBER(12,4), converted to FLOAT. Catches: CBRT or squaring computed; or the result left fixed-point"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["2.0000"],
  ["0.0625"],
]
query = "SELECT SQRT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_decfloat"
description = "SQRT of DECFLOAT, which returns DECFLOAT. The result is cast to VARCHAR because the recorder cannot decode a DECFLOAT column. Catches: a DECFLOAT argument computed and returned as FLOAT"
columns = [{ name = "x", type = "DECFLOAT" }]
rows = [
  ["2"],
  ["0.25"],
]
query = "SELECT CAST(SQRT(x) AS VARCHAR) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null"
description = "SQRT of NULL. Catches: NULL turned into 0 or NaN"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["NULL"],
]
query = "SELECT SQRT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_tiny_huge"
description = "Very small and very large values. Catches: precision at the extremes"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["1e-300"],
  ["1e300"],
]
query = "SELECT SQRT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t006_negative"
description = "SQRT at or outside its domain: records what Snowflake returns there (NaN, Infinity, NULL or an error); re-kinded to error_parity after capture if Snowflake raises an error. Catches: NaN, Infinity, NULL or an error differing from Snowflake"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["-1"],
]
query = "SELECT SQRT(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
