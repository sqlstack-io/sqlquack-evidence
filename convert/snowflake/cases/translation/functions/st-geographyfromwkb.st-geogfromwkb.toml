category = "translation"
construct = "sf.functions.st-geographyfromwkb.st-geogfromwkb"
session_profile = "utc-v1"

[[case]]
id = "t001_hex"
description = "WKB of a point as hex text, and EWKB with SRID 4326. Catches: longitude and latitude swapped, or the byte order misread"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'010100000000000000000024400000000000003440'"],
  ["'0101000020E610000000000000000024400000000000003440'"],
]
query = "SELECT ordinal, ST_ASWKT(ST_GEOGFROMWKB(v)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_binary"
description = "The same WKB as BINARY. Catches: BINARY input rejected, or read as hex text"
columns = [{ name = "b", type = "BINARY" }]
rows = [
  ["'010100000000000000000024400000000000003440'"],
]
query = "SELECT ST_ASWKT(ST_GEOGFROMWKB(b)) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_ewkb_srid"
description = "EWKB with SRID 3857, which the page says is an error. Catches: the point accepted in another SRID"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'0101000020110F000000000000000024400000000000003440'"],
]
query = "SELECT ST_ASWKT(ST_GEOGFROMWKB(v)) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_unparsable"
description = "Hex text too short to be WKB, which the page says is an error. Catches: NULL returned, or the text read as an empty shape"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'0101000000'"],
]
query = "SELECT ST_ASWKT(ST_GEOGFROMWKB(v)) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t005_allow_invalid"
description = "A self-intersecting polygon in WKB with allow_invalid TRUE, which the page says still returns a shape. Catches: the bow tie repaired or rejected despite allow_invalid"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'010300000001000000050000000000000000000000000000000000000000000000000024400000000000002440000000000000244000000000000000000000000000000000000000000000244000000000000000000000000000000000'"],
]
query = "SELECT ST_ISVALID(ST_GEOGFROMWKB(v, TRUE)) AS valid FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_null_varchar_or_binary_expression"
description = "A NULL input; the page does not say; the recording decides. Catches: an error, or an empty shape returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_GEOGFROMWKB(v) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
