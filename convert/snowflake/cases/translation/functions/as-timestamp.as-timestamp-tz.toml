category = "translation"
construct = "sf.functions.as-timestamp.as-timestamp-tz"
session_profile = "utc-v1"

[[case]]
id = "t001_match"
description = "A TIMESTAMP_TZ with milliseconds cast to VARIANT. Catches: the fraction dropped, or the offset or zone changed"
columns = [{ name = "x", type = "TIMESTAMP_TZ" }]
rows = [
  ["'2024-02-29 13:14:15.123 -08:00'"],
  ["'2024-12-31 23:30:00 +05:30'"],
]
query = "SELECT TO_VARCHAR(AS_TIMESTAMP_TZ(x::VARIANT), 'YYYY-MM-DD HH24:MI:SS.FF9 TZH:TZM') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_mismatch"
description = "A string holding a timestamp and a DATE-like string. Catches: timestamp text parsed (TO_TIMESTAMP)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'\"2024-02-29 13:14:15\"'"],
  ["'\"2024-02-29\"'"],
]
query = "SELECT TO_VARCHAR(AS_TIMESTAMP_TZ(PARSE_JSON(a)), 'YYYY-MM-DD HH24:MI:SS.FF9 TZH:TZM') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_other_timestamp"
description = "The other two timestamp types cast to VARIANT. The page says a timestamp type returns the same timestamp type, without saying whether that holds when it differs from TZ; the recording decides. Catches: the other type converted to this one, or NULL where Snowflake returns the value, or the reverse"
columns = [{ name = "n", type = "TIMESTAMP_NTZ" }, { name = "z", type = "TIMESTAMP_TZ" }, { name = "l", type = "TIMESTAMP_LTZ" }]
rows = [
  ["'2024-02-29 13:14:15.123'", "'2024-02-29 13:14:15.123 -08:00'", "'2024-02-29 13:14:15.123'"],
]
query = "SELECT TO_VARCHAR(AS_TIMESTAMP_TZ(n::VARIANT), 'YYYY-MM-DD HH24:MI:SS.FF9 TZH:TZM') AS n, TO_VARCHAR(AS_TIMESTAMP_TZ(l::VARIANT), 'YYYY-MM-DD HH24:MI:SS.FF9 TZH:TZM') AS l FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_variant_expr"
description = "A SQL NULL and a JSON null; the page returns NULL for a NULL argument and for a type that does not match. Catches: the JSON null passed through as a value, or an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'null'"],
]
query = "SELECT TO_VARCHAR(AS_TIMESTAMP_TZ(PARSE_JSON(a)), 'YYYY-MM-DD HH24:MI:SS.FF9 TZH:TZM') AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
