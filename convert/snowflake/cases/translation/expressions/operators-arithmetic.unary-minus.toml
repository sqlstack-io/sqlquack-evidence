category = "translation"
construct = "sf.expressions.operators-arithmetic.unary-minus"
session_profile = "utc-v1"

[[case]]
id = "t001_int"
description = "Negating integers. Catches: the sign dropped or the value doubled"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["5"],
  ["-12"],
  ["0"],
]
query = "SELECT -a AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_dec"
description = "Negating NUMBER(10,2). Catches: the scale lost (-1 instead of -1.25)"
columns = [{ name = "a", type = "NUMBER(10,2)" }]
rows = [
  ["1.25"],
  ["-0.05"],
]
query = "SELECT -a AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_float"
description = "Negating FLOAT. Catches: negative zero or exponent handling"
columns = [{ name = "a", type = "FLOAT" }]
rows = [
  ["1.5e-10"],
  ["-2.25"],
  ["0e0"],
]
query = "SELECT -a AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null"
description = "Negating NULL. Catches: NULL turned into 0"
columns = [{ name = "a", type = "NUMBER(10,2)" }]
rows = [
  ["NULL"],
]
query = "SELECT -a AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_max"
description = "Negating the largest 38-digit integer. Catches: a 64-bit negation that overflows"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["99999999999999999999999999999999999999"],
  ["-99999999999999999999999999999999999999"],
]
query = "SELECT -a AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t006_double_neg"
description = "Negation of a negation and of a subtraction. Catches: precedence: - a - b read as -(a - b)"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["1.50", "2.00"],
]
query = "SELECT - a - b AS r, - (- a) AS s FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
