category = "translation"
construct = "sf.expressions.operators-arithmetic.subtract"
session_profile = "utc-v1"

[[case]]
id = "t001_num_num_380380"
description = "a NUMBER(38,0) - b NUMBER(38,0). Catches: operands in the wrong order (7 instead of -7)"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["3", "10"],
  ["-4", "7"],
]
query = "SELECT a - b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_num_num_102380"
description = "a NUMBER(10,2) - b NUMBER(38,0). Catches: scale of the NUMBER(10,2) side dropped"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["5.75", "8"],
  ["-1.25", "-3"],
]
query = "SELECT a - b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_num_num_102124"
description = "a NUMBER(10,2) - b NUMBER(12,4). Catches: the result scale taken from one operand only"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(12,4)" }]
rows = [
  ["1.25", "0.0625"],
  ["0.10", "3.3333"],
]
query = "SELECT a - b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_num_float_380"
description = "a NUMBER(38,0) - b FLOAT. Catches: FLOAT rounded to integer"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "FLOAT" }]
rows = [
  ["1", "0.75"],
  ["-3", "0.5"],
]
query = "SELECT a - b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_num_float_102"
description = "a NUMBER(10,2) - b FLOAT. Catches: fixed-point / FLOAT result type swapped"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "FLOAT" }]
rows = [
  ["0.30", "0.1"],
  ["10.00", "0.001"],
]
query = "SELECT a - b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_float_float"
description = "a FLOAT - b FLOAT. Catches: float subtraction done in decimal"
columns = [{ name = "a", type = "FLOAT" }, { name = "b", type = "FLOAT" }]
rows = [
  ["0.3", "0.1"],
  ["1e-5", "2e-5"],
]
query = "SELECT a - b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t007_date_date"
description = "DATE minus DATE: the page says the result is an integer number of days. Catches: an INTERVAL instead of an integer count of days, or days counted across the leap day wrongly (29, -730)"
columns = [{ name = "a", type = "DATE" }, { name = "b", type = "DATE" }]
rows = [
  ["'2024-03-01'", "'2024-02-01'"],
  ["'2023-01-01'", "'2024-12-31'"],
]
query = "SELECT a - b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t008_null_a"
description = "NULL as a, the other operand set. Catches: NULL treated as 0"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["NULL", "1.00"],
]
query = "SELECT a - b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t009_null_b"
description = "NULL as b, the other operand set. Catches: NULL treated as 0"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["1.00", "NULL"],
]
query = "SELECT a - b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t010_to_negative"
description = "A smaller minus a larger value. Catches: absolute value taken"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["1.50", "4.25"],
  ["-2.00", "-0.50"],
]
query = "SELECT a - b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t011_overflow"
description = "The difference of the most negative and the largest 38-digit integers overflows. Catches: wrapping instead of the out-of-range error"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["-99999999999999999999999999999999999999", "99999999999999999999999999999999999999"],
]
query = "SELECT a - b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
