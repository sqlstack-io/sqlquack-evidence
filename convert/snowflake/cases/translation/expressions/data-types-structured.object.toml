category = "translation"
construct = "sf.expressions.data-types-structured.object"
session_profile = "utc-v1"

[[case]]
id = "t001_fields"
description = "The page's example with a numeric field; fields read by name. Catches: fields left semi-structured (zip as text)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"city\":\"San Mateo\",\"zip\":\"94402\"}'"],
]
query = "SELECT ordinal, (PARSE_JSON(a)::OBJECT(city VARCHAR, zip NUMBER)):city AS city, (PARSE_JSON(a)::OBJECT(city VARCHAR, zip NUMBER)):zip + 1 AS zip1 FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_json_null_value"
description = "The page: a JSON null value for a VARCHAR field becomes SQL NULL. Catches: the JSON null kept"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"city\":null}'"],
]
query = "SELECT ordinal, (PARSE_JSON(a)::OBJECT(city VARCHAR)):city IS NULL AS city_null FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t003_missing_key"
compile_error = true
description = "The page: for a structured OBJECT, using a key that does not exist is a compile-time error. Catches: NULL returned as for a semi-structured OBJECT"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"city\":\"x\"}'"],
]
query = "SELECT ordinal, (PARSE_JSON(a)::OBJECT(city VARCHAR)):zip AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
