category = "translation"
construct = "sf.expressions.data-types-text.binary"
session_profile = "utc-v1"

[[case]]
id = "t001_hex"
description = "The page: BINARY holds bytes and displays them as hex (HELP is 48454C50); length counts bytes. Catches: length counted in characters, or the text kept"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'48454C50'"],
  ["'00ff'"],
]
query = "SELECT ordinal, HEX_ENCODE(CAST(TO_BINARY(a, 'HEX') AS BINARY(4))) AS r, LENGTH(CAST(TO_BINARY(a, 'HEX') AS BINARY(4))) AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_utf8"
description = "A multi-byte character as BINARY: its UTF-8 bytes. Catches: Latin-1 or one byte per character"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'\u00e9'"],
  ["'HELP'"],
]
query = "SELECT ordinal, HEX_ENCODE(CAST(TO_BINARY(a, 'UTF-8') AS BINARY)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null"
description = "NULL beside a set row, cast to the type; the page gives no special rule, so standard NULL handling applies. Catches: NULL replaced by a value, or the cast raising for NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'00'"],
]
query = "SELECT ordinal, HEX_ENCODE(CAST(TO_BINARY(a, 'HEX') AS BINARY)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
