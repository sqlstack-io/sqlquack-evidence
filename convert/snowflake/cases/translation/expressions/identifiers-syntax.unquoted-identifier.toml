category = "translation"
construct = "sf.expressions.identifiers-syntax.unquoted-identifier"
session_profile = "utc-v1"

[[case]]
id = "t001_folds_upper"
description = "The page: an unquoted identifier is stored and resolved in uppercase, so a column aliased MyCol is \"MYCOL\". Catches: the alias kept in its written case, so \"MYCOL\" does not resolve"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["2"],
]
query = "SELECT t.ordinal, t.\"MYCOL\" AS r FROM (SELECT ordinal, a AS MyCol FROM input) AS t ORDER BY t.ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_dollar_underscore"
description = "The page lists _my_identifier and My$identifier as valid unquoted identifiers: a leading underscore and a dollar sign inside. Catches: the dollar sign read as a parameter or the identifier rejected"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["2"],
]
query = "SELECT ordinal, _my$col + 1 AS r FROM (SELECT ordinal, a AS _my$col FROM input) ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_quoted_lowercase"
compile_error = true
description = "The page: unquoted names are stored in uppercase and double-quoted names resolve exactly, so \"mycol\" does not find the column MYCOL. Catches: the quoted name resolved case-insensitively and the column returned"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT t.ordinal, t.\"mycol\" AS r FROM (SELECT ordinal, a AS mycol FROM input) AS t ORDER BY t.ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null"
description = "A NULL value under a folded alias; nothing special applies. Catches: the NULL replaced or the row dropped"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT t.ordinal, t.MYCOL AS r FROM (SELECT ordinal, a AS mycol FROM input) AS t ORDER BY t.ordinal"
order = "ordered"
tags = ["null"]
