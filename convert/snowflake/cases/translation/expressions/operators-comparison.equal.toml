category = "translation"
construct = "sf.expressions.operators-comparison.equal"
session_profile = "utc-v1"

[[case]]
id = "t001_number_float"
description = "An integer against a FLOAT: below, equal (1 and 1.0) and above, and a negative pair. Catches: a different operator, or the operands swapped, or the FLOAT side truncated"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "FLOAT" }]
rows = [
  ["1", "1.5"],
  ["1", "1.0"],
  ["2", "1.5"],
  ["-3", "-2.5"],
]
query = "SELECT ordinal, a = b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_varchar"
description = "Strings: equal, a prefix, a lower-case letter against an upper-case one, and a trailing space; the page does not say how strings order, so the recording decides. Catches: a different operator, or the operands swapped, or a case-insensitive or space-trimming comparison"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'abc'", "'abc'"],
  ["'ab'", "'abc'"],
  ["'a'", "'B'"],
  ["'x '", "'x'"],
]
query = "SELECT ordinal, a = b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_date_timestamp"
description = "A date against a timestamp at its midnight and at noon the same day. Catches: a different operator, or the operands swapped, or the timestamp truncated to its date"
columns = [{ name = "a", type = "DATE" }, { name = "b", type = "TIMESTAMP_NTZ" }]
rows = [
  ["'2024-01-01'", "'2024-01-01 00:00:00'"],
  ["'2024-01-01'", "'2024-01-01 12:00:00'"],
  ["'2024-01-02'", "'2024-01-01 12:00:00'"],
]
query = "SELECT ordinal, a = b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null_a"
description = "NULL as a, beside a set row; the page does not say, so the recording decides. Catches: NULL compared as a value (FALSE or TRUE instead of NULL)"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1"],
  ["NULL", "NULL"],
  ["1", "1"],
]
query = "SELECT ordinal, a = b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_null_b"
description = "NULL as b, beside a set row; the page does not say, so the recording decides. Catches: NULL compared as a value (FALSE or TRUE instead of NULL)"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["1", "NULL"],
  ["2", "1"],
]
query = "SELECT ordinal, a = b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_float_sum"
description = "0.1 + 0.2 = 0.3 as FLOAT, where binary rounding makes them differ, and as NUMBER(10,2), where they are equal. Catches: FLOAT compared in decimal, or NUMBER compared in binary floating point"
columns = [{ name = "f", type = "FLOAT" }, { name = "g", type = "FLOAT" }, { name = "d", type = "NUMBER(10,2)" }, { name = "e", type = "NUMBER(10,2)" }]
rows = [
  ["0.1", "0.2", "0.1", "0.2"],
]
query = "SELECT ordinal, f + g = 0.3::FLOAT AS fl, d + e = 0.30 AS nm FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
