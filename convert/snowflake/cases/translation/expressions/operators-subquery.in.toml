category = "translation"
construct = "sf.expressions.operators-subquery.in"
session_profile = "utc-v1"

[[case]]
id = "t001_in"
description = "x IN the x values of group 'k' (5 and 10). Catches: a partial or range match"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'k'", "5"],
  ["'k'", "10"],
  ["'v'", "1"],
  ["'v'", "7"],
  ["'v'", "NULL"],
  ["'w'", "3"],
]
query = "SELECT ordinal FROM input WHERE x IN (SELECT x FROM input WHERE g = 'k') ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_not_in"
description = "x NOT IN the x values of group 'w' (3), with no NULL in the subquery: every set x but 3. Catches: NOT IN applied as IN, or the NULL row kept"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'k'", "5"],
  ["'k'", "10"],
  ["'v'", "1"],
  ["'v'", "7"],
  ["'v'", "NULL"],
  ["'w'", "3"],
]
query = "SELECT ordinal FROM input WHERE x NOT IN (SELECT x FROM input WHERE g = 'w') ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_in_subquery"
description = "NOT IN over group 'v', which holds a NULL: as != ALL, it is never TRUE, so no row qualifies. Catches: the NULL skipped, so rows other than 1 and 7 qualify"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'k'", "5"],
  ["'k'", "10"],
  ["'v'", "1"],
  ["'v'", "7"],
  ["'v'", "NULL"],
  ["'w'", "3"],
]
query = "SELECT ordinal FROM input WHERE x NOT IN (SELECT x FROM input WHERE g = 'v') ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_expr"
description = "A NULL left operand: x IN group 'v' leaves the NULL row out, though the subquery holds a NULL. Catches: NULL matched to NULL"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'k'", "5"],
  ["'k'", "10"],
  ["'v'", "1"],
  ["'v'", "7"],
  ["'v'", "NULL"],
  ["'w'", "3"],
]
query = "SELECT ordinal FROM input WHERE x IN (SELECT x FROM input WHERE g = 'v') ORDER BY ordinal"
order = "ordered"
tags = ["null"]
