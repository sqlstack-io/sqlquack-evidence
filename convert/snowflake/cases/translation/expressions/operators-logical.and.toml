category = "translation"
construct = "sf.expressions.operators-logical.and"
session_profile = "utc-v1"

[[case]]
id = "t001_truth_table"
description = "All nine pairs of TRUE, FALSE and NULL, as in the page's truth table. Catches: FALSE AND NULL returned as NULL, or NULL read as FALSE (TRUE AND NULL as FALSE)"
columns = [{ name = "x", type = "BOOLEAN" }, { name = "y", type = "BOOLEAN" }]
rows = [
  ["TRUE", "TRUE"],
  ["TRUE", "FALSE"],
  ["TRUE", "NULL"],
  ["FALSE", "TRUE"],
  ["FALSE", "FALSE"],
  ["FALSE", "NULL"],
  ["NULL", "TRUE"],
  ["NULL", "FALSE"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal, x AND y AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_precedence"
description = "The page example b = 'Down' OR a = 8 AND b = 'Up', which binds AND first: rows 1, 2 and 3. Catches: OR bound before AND (row 1 only)"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["8", "'Up'"],
  ["25", "'Down'"],
  ["15", "'Down'"],
  ["47", "'Up'"],
]
query = "SELECT ordinal FROM input WHERE b = 'Down' OR a = 8 AND b = 'Up' ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_a"
description = "NULL as the left operand with each right operand. Catches: NULL read as FALSE"
columns = [{ name = "x", type = "BOOLEAN" }, { name = "y", type = "BOOLEAN" }]
rows = [
  ["NULL", "TRUE"],
  ["NULL", "FALSE"],
]
query = "SELECT ordinal, x AND y AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t004_null_b"
description = "NULL as the right operand with each left operand. Catches: NULL read as FALSE"
columns = [{ name = "x", type = "BOOLEAN" }, { name = "y", type = "BOOLEAN" }]
rows = [
  ["TRUE", "NULL"],
  ["FALSE", "NULL"],
]
query = "SELECT ordinal, x AND y AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
