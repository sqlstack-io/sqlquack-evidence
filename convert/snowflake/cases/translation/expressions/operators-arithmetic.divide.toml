category = "translation"
construct = "sf.expressions.operators-arithmetic.divide"
session_profile = "utc-v1"

[[case]]
id = "t001_num_num_380380"
description = "a NUMBER(38,0) / b NUMBER(38,0). Catches: integer division (3 instead of 3.5) or a truncated rather than rounded scale-6 quotient (0.666666 vs 0.666667)"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["7", "2"],
  ["-7", "2"],
  ["2", "3"],
]
query = "SELECT a / b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_num_num_102380"
description = "a NUMBER(10,2) / b NUMBER(38,0). Catches: the quotient scale (s+6) handled wrongly"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["1.25", "4"],
  ["-10.00", "3"],
]
query = "SELECT a / b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_num_num_102124"
