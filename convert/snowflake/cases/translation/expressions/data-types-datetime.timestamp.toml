category = "translation"
construct = "sf.expressions.data-types-datetime.timestamp"
session_profile = "utc-v1"

[[case]]
id = "t001_alias_ntz"
description = "The page: TIMESTAMP is TIMESTAMP_NTZ by default, so the wall-clock time is kept and equals the NTZ cast. Catches: TIMESTAMP read as a zoned type, so an offset is applied or the session zone attached"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'2024-03-10 02:30:00'"],
  ["'1999-12-31 23:59:59.123456789'"],
]
query = "SELECT ordinal, CAST(a AS TIMESTAMP) AS r, CAST(a AS TIMESTAMP) = CAST(a AS TIMESTAMP_NTZ) AS same FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_precision"
description = "The page: the precision is 0 to 9 fractional digits, 9 by default; whether the cut rounds or truncates is not on the page, so the recording decides. Catches: the precision ignored, or the default read as 6"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'2024-01-01 10:00:00.987654321'"],
]
query = "SELECT ordinal, CAST(a AS TIMESTAMP) AS t9, CAST(a AS TIMESTAMP(3)) AS t3, CAST(a AS TIMESTAMP(0)) AS t0 FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null"
description = "NULL beside a set row, cast to the type; the page gives no special rule, so standard NULL handling applies. Catches: NULL replaced by a value, or the cast raising for NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'2024-01-01 00:00:00'"],
]
query = "SELECT ordinal, CAST(a AS TIMESTAMP) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
