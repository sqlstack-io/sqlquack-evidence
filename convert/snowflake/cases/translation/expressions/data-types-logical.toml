category = "translation"
construct = "sf.expressions.data-types-logical"
session_profile = "utc-v1"

[[case]]
id = "t001_from_text"
description = "The page's twelve strings, in mixed case: the first six convert to TRUE and the last six to FALSE. Catches: only 'true' and 'false' accepted, or the match made case-sensitive"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'true'"],
  ["'T'"],
  ["'Yes'"],
  ["'y'"],
  ["'ON'"],
  ["'1'"],
  ["'FALSE'"],
  ["'f'"],
  ["'no'"],
  ["'N'"],
  ["'Off'"],
  ["'0'"],
]
query = "SELECT ordinal, CAST(a AS BOOLEAN) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_from_number"
description = "The page: zero converts to FALSE and any non-zero value, negative or fractional, to TRUE. Catches: only 1 read as TRUE, or a fraction truncated to 0 first"
columns = [{ name = "n", type = "NUMBER(10,2)" }]
rows = [
  ["0"],
  ["-2.5"],
  ["-0.25"],
  ["1"],
]
query = "SELECT ordinal, CAST(n AS BOOLEAN) AS b FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_to_text_and_number"
description = "The page: TRUE casts to 'true' and 1, FALSE to 'false' and 0. Catches: upper-case 'TRUE', or 't', or -1 for TRUE"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'yes'"],
  ["'no'"],
]
query = "SELECT ordinal, CAST(CAST(a AS BOOLEAN) AS VARCHAR) AS s, CAST(CAST(a AS BOOLEAN) AS NUMBER) AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_other_text"
description = "The page: other text strings can't be converted to BOOLEAN, so the cast raises. Catches: the string read as FALSE or NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'maybe'"],
]
query = "SELECT ordinal, CAST(a AS BOOLEAN) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t005_implicit_from_text"
description = "The page: implicitly, only 'true' and 'false' convert, case-insensitively, so a VARCHAR column in AND converts without a cast. Catches: the implicit conversion refused, or done case-sensitively"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'true'"],
  ["'FALSE'"],
  ["'True'"],
]
query = "SELECT ordinal, a AND TRUE AS r, NOT a AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_implicit_from_number"
description = "The page: implicitly, zero converts to FALSE and any other number to TRUE. Catches: the implicit conversion refused, or only 1 read as TRUE"
columns = [{ name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["0"],
  ["1"],
  ["-3"],
]
query = "SELECT ordinal, n AND TRUE AS r, NOT n AS x FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t007_implicit_to_text"
description = "The page: a BOOLEAN column or literal concatenated with || converts to 'true' or 'false'. Catches: upper-case TRUE, 't' or 1 in the text"
columns = [{ name = "b", type = "BOOLEAN" }]
rows = [
  ["TRUE"],
  ["FALSE"],
]
query = "SELECT ordinal, 'is ' || b AS col, 'lit ' || TRUE AS lit FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t009_null"
description = "NULL is the unknown BOOLEAN value, kept through the cast. Catches: NULL replaced by a value, or the cast raising for NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'on'"],
]
query = "SELECT ordinal, CAST(a AS BOOLEAN) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t010_from_float"
compile_error = true
description = "The page's numeric conversion does not exclude FLOAT, but Snowflake refuses a FLOAT argument at compile time (recorded as 1007/22023, invalid type for parameter 'TO_BOOLEAN'); this case keeps that behaviour. Catches: the FLOAT converted as a number"
columns = [{ name = "f", type = "FLOAT" }]
rows = [
  ["0"],
  ["0.001"],
]
query = "SELECT ordinal, CAST(f AS BOOLEAN) AS b FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
