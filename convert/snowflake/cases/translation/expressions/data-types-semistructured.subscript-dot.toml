category = "translation"
construct = "sf.expressions.data-types-semistructured.subscript-dot"
session_profile = "utc-v1"

[[case]]
id = "t001_constant"
description = "The page's examples: [] is empty, and [1, 'value1'] and [c + 1, c + 2] take literals and expressions. Catches: the expressions taken as text, or [] read as NULL"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["10"],
]
query = "SELECT ordinal, [] AS e, [1, 'value1'] AS lit, [c + 1, c + 2] AS expr FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_element"
description = "The page's example [12, 'twelve', NULL], with a column that is NULL in one row: the recording shows how a SQL NULL element is stored. Catches: the NULL element dropped, or the array itself made NULL"
columns = [{ name = "c", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["12"],
]
query = "SELECT ordinal, [12, 'twelve', NULL] AS page, [c, 'twelve'] AS col FROM input ORDER BY ordinal"
order = "ordered"
expected_divergence = "json_fidelity"
tags = ["null-argument"]
