category = "translation"
construct = "sf.expressions.operators-arithmetic.unary-plus"
session_profile = "utc-v1"

[[case]]
id = "t001_text"
description = "Unary plus on numeric strings converts them. Catches: the string returned unchanged, so ordering and arithmetic stay textual"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'12.50'"],
  ["'-3'"],
  ["'9'"],
]
query = "SELECT +a + 1 AS r FROM input ORDER BY +a"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_dec"
description = "Unary plus keeps a NUMBER(10,2) as it is. Catches: a cast that changes the scale"
columns = [{ name = "a", type = "NUMBER(10,2)" }]
rows = [
  ["1.25"],
  ["-0.50"],
]
query = "SELECT +a AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_float"
description = "Unary plus on FLOAT. Catches: conversion to fixed-point"
columns = [{ name = "a", type = "FLOAT" }]
rows = [
  ["0.1"],
  ["-1e300"],
]
query = "SELECT +a AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_null"
description = "Unary plus on NULL text. Catches: NULL replaced or converted to 0"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT +a AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t005_empty"
description = "Unary plus on an empty string.: Snowflake raises error 100038 on every row (captured at e8691b63). Catches: NaN, NULL or a value where Snowflake raises an error"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["''"],
]
query = "SELECT +a AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t006_bad_text"
description = "Unary plus on a non-numeric string is an error. Catches: the string passed through unconverted"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'1a'"],
]
query = "SELECT +a AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
