category = "translation"
construct = "sf.expressions.operators-arithmetic.add"
session_profile = "utc-v1"

[[case]]
id = "t001_num_num_380380"
description = "a NUMBER(38,0) + b NUMBER(38,0). Catches: operands swapped for subtraction or truncated to 32 bits"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["7", "-12"],
  ["40000000000", "3"],
]
query = "SELECT a + b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_num_num_102380"
description = "a NUMBER(10,2) + b NUMBER(38,0). Catches: the sum losing the NUMBER(10,2) scale (4 instead of 4.25)"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["1.25", "3"],
  ["-0.75", "2"],
]
query = "SELECT a + b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_num_num_102124"
description = "a NUMBER(10,2) + b NUMBER(12,4). Catches: the result scale taken from the left operand only (1.31 instead of 1.3125)"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(12,4)" }]
rows = [
  ["1.25", "0.0625"],
  ["-3.10", "1.0001"],
]
query = "SELECT a + b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_num_float_380"
description = "a NUMBER(38,0) + b FLOAT. Catches: a FLOAT operand rounded to the integer side"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "FLOAT" }]
rows = [
  ["3", "0.5"],
  ["-2", "1e-3"],
]
query = "SELECT a + b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_num_float_102"
description = "a NUMBER(10,2) + b FLOAT. Catches: the FLOAT operand cast to NUMBER(10,2) (1.00 instead of 1.001) or a fixed-point result type"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "FLOAT" }]
rows = [
  ["0.10", "0.2"],
  ["2.50", "-0.25"],
  ["1.00", "0.001"],
]
query = "SELECT a + b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_float_float"
description = "a FLOAT + b FLOAT. Catches: float addition replaced by decimal addition (0.30000000000000004 vs 0.3)"
columns = [{ name = "a", type = "FLOAT" }, { name = "b", type = "FLOAT" }]
rows = [
  ["0.1", "0.2"],
  ["1e16", "1"],
]
query = "SELECT a + b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t007_null_a"
description = "NULL as a, the other operand set. Catches: NULL treated as 0 instead of propagating"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["NULL", "2.50"],
]
query = "SELECT a + b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t008_null_b"
description = "NULL as b, the other operand set. Catches: NULL treated as 0 instead of propagating"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["2.50", "NULL"],
]
query = "SELECT a + b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t009_max_38"
description = "38-digit integers that still fit. Catches: arithmetic done in 64 bits"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["9999999999999999999999999999999999999", "9"],
  ["-9999999999999999999999999999999999999", "-9"],
]
query = "SELECT a + b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t010_negatives"
description = "Negative fixed-point sums crossing zero. Catches: sign lost or magnitude added"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["-5.25", "2.00"],
  ["-0.01", "0.02"],
]
query = "SELECT a + b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t011_overflow"
description = "The sum of two 38-digit integers overflows NUMBER(38,0). Catches: wrapping or a silent switch to FLOAT instead of the out-of-range error"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["99999999999999999999999999999999999999", "99999999999999999999999999999999999999"],
]
query = "SELECT a + b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
