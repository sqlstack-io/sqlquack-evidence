category = "translation"
construct = "sf.expressions.data-types-numeric.decfloat"
session_profile = "utc-v1"

[[case]]
id = "t001_exact"
description = "The page's rows: '12345678901234567890123456789' stays exact and '-4.2e-5432' keeps its tiny exponent; printed as text. Catches: a FLOAT approximation (1.23456789012346e+28, -0)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'12345678901234567890123456789'"],
  ["'-4.2e-5432'"],
  ["'123e7000'"],
]
query = "SELECT ordinal, a::DECFLOAT::VARCHAR AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_round_38"
description = "The page's rows 4 and 5: the 39th digit rounds half up, so ...14 gives ...1 and ...15 gives ...2 at the 38th. Catches: truncation instead of half-up rounding, or rounding to FLOAT"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'1.00000000000000000000000000000000000014'"],
  ["'1.00000000000000000000000000000000000015'"],
]
query = "SELECT ordinal, a::DECFLOAT::VARCHAR AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t003_mixed"
description = "The page: a DECFLOAT plus a NUMBER is a DECFLOAT, with no scale limit. Catches: the sum typed as NUMBER or FLOAT (digits lost)"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["'1e-30'", "1"],
]
query = "SELECT ordinal, (a::DECFLOAT + b)::VARCHAR AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_nan"
description = "The page: DECFLOAT does not support NaN, inf or -inf. Catches: NaN accepted as in FLOAT"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'NaN'"],
]
query = "SELECT ordinal, a::DECFLOAT::VARCHAR AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t005_null"
description = "NULL beside a set row, cast to the type; the page gives no special rule, so standard NULL handling applies. Catches: NULL replaced by a value, or the cast raising for NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'1.5'"],
]
query = "SELECT ordinal, a::DECFLOAT::VARCHAR AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
