category = "translation"
construct = "sf.expressions.data-types-period"
session_profile = "utc-v1"

[[case]]
id = "t001_date_text"
description = "Canonical text cast to PERIOD(DATE) and back, as in the page example. Catches: another text form, or the bounds reordered"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[2024-01-01, 2024-12-31)'"],
  ["'[2021-03-01, 9999-12-31)'"],
]
query = "SELECT ordinal, a::PERIOD(DATE)::VARCHAR AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_order"
description = "The page's ordering example: [2024-01-01, 2024-06-01) before [2024-01-01, 2024-12-31) before [2024-02-01, 2024-03-01). Catches: ordering by text or by the end bound first"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[2024-02-01, 2024-03-01)'"],
  ["'[2024-01-01, 2024-12-31)'"],
  ["'[2024-01-01, 2024-06-01)'"],
]
query = "SELECT a::PERIOD(DATE)::VARCHAR AS p FROM input ORDER BY a::PERIOD(DATE)"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_empty"
description = "The page: \"the constructor and casts require begin < end\", so casting [2024-12-31, 2024-01-01) raises. Catches: an inverted or empty period accepted"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[2024-12-31, 2024-01-01)'"],
]
query = "SELECT ordinal, a::PERIOD(DATE)::VARCHAR AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_null"
description = "The page: casting NULL to PERIOD follows standard null handling. Catches: NULL replaced by a value, or the cast raising for NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'[2024-01-01, 2024-01-02)'"],
]
query = "SELECT ordinal, a::PERIOD(DATE)::VARCHAR AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
