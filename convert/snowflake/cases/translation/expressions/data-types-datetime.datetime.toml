category = "translation"
construct = "sf.expressions.data-types-datetime.datetime"
session_profile = "utc-v1"

[[case]]
id = "t001_from_text"
description = "Text cast to DATETIME and to TIMESTAMP_NTZ side by side, with fractional seconds; the two must be equal and keep the wall-clock time. Catches: DATETIME read as a time-zone-aware type (an offset applied) or as DATE (time dropped)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'2024-02-29 13:45:10.123'"],
  ["'1999-12-31 23:59:59'"],
]
query = "SELECT ordinal, CAST(a AS DATETIME) AS r, CAST(a AS DATETIME) = CAST(a AS TIMESTAMP_NTZ) AS same FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_from_date"
description = "A DATE cast to DATETIME is that day at midnight. Catches: the date shifted by a time zone, or a DATE result"
columns = [{ name = "a", type = "DATE" }]
rows = [
  ["'2024-03-10'"],
  ["'2024-11-03'"],
]
query = "SELECT ordinal, a::DATETIME AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null"
description = "NULL beside a set row, cast to the type; the page gives no special rule, so standard NULL handling applies. Catches: NULL replaced by a value, or the cast raising for NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'2024-01-01 00:00:00'"],
]
query = "SELECT ordinal, CAST(a AS DATETIME) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
