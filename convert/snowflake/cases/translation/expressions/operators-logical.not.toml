category = "translation"
construct = "sf.expressions.operators-logical.not"
session_profile = "utc-v1"

[[case]]
id = "t001_values"
description = "NOT of TRUE, FALSE and NULL. Catches: NOT NULL returned as TRUE or FALSE"
columns = [{ name = "x", type = "BOOLEAN" }]
rows = [
  ["TRUE"],
  ["FALSE"],
  ["NULL"],
]
query = "SELECT ordinal, NOT x AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_precedence"
description = "The page examples NOT a = 15 AND b = 'Down' (row 2) and NOT (a = 15 AND b = 'Down') (rows 1, 2 and 4), as two columns. Catches: NOT bound after AND, so the two columns agree"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["8", "'Up'"],
  ["25", "'Down'"],
  ["15", "'Down'"],
  ["47", "'Up'"],
]
query = "SELECT ordinal, NOT a = 15 AND b = 'Down' AS bare, NOT (a = 15 AND b = 'Down') AS grouped FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_a"
description = "NOT of a NULL comparison beside a set one. Catches: NULL read as FALSE, so NOT gives TRUE"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["15"],
]
query = "SELECT ordinal, NOT a = 15 AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
