category = "translation"
construct = "sf.expressions.data-types-datetime.time"
session_profile = "utc-v1"

[[case]]
id = "t001_precision"
description = "TIME keeps all nine fractional digits by default; TIME(3) keeps three and TIME(0) none, read here as the nanosecond part, since the connector carries TIME only to microseconds. Whether the cut rounds or truncates is not on the page, so the recording decides. Catches: the default read as 6 digits or 0, or the precision ignored"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'13:45:10.123456789'"],
  ["'00:00:01.9996'"],
]
query = "SELECT ordinal, DATE_PART(nanosecond, CAST(a AS TIME)) AS ns9, DATE_PART(nanosecond, CAST(a AS TIME(3))) AS ns3, DATE_PART(second, CAST(a AS TIME(0))) AS s0, DATE_PART(nanosecond, CAST(a AS TIME(0))) AS ns0 FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_range_edges"
description = "The page: TIME values lie between 00:00:00 and 23:59:59.999999999; both ends cast unchanged, read here as hour, second and nanosecond parts. Catches: the last nanosecond rounded to the next day, or cut to microseconds"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'00:00:00'"],
  ["'23:59:59.999999999'"],
]
query = "SELECT ordinal, DATE_PART(hour, CAST(a AS TIME)) AS h, DATE_PART(second, CAST(a AS TIME)) AS s, DATE_PART(nanosecond, CAST(a AS TIME)) AS ns FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t003_null"
description = "NULL beside a set row, cast to the type; the page gives no special rule, so standard NULL handling applies. Catches: NULL replaced by a value, or the cast raising for NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'12:00:00'"],
]
query = "SELECT ordinal, CAST(a AS TIME) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
