category = "translation"
construct = "sf.expressions.operators-arithmetic.multiply"
session_profile = "utc-v1"

[[case]]
id = "t001_num_num_380380"
description = "a NUMBER(38,0) * b NUMBER(38,0). Catches: 32-bit multiplication overflowing"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["6", "-7"],
  ["3000000000", "4"],
]
query = "SELECT a * b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_num_num_102380"
description = "a NUMBER(10,2) * b NUMBER(38,0). Catches: the NUMBER(10,2) scale lost"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["1.25", "3"],
  ["-0.05", "7"],
]
query = "SELECT a * b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_num_num_102124"
description = "a NUMBER(10,2) * b NUMBER(12,4). Catches: the product scale capped or taken from one side (1.5625 vs 1.56)"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(12,4)" }]
rows = [
  ["1.25", "1.2500"],
  ["0.01", "0.0001"],
]
query = "SELECT a * b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_num_float_380"
description = "a NUMBER(38,0) * b FLOAT. Catches: FLOAT operand truncated"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "FLOAT" }]
rows = [
  ["3", "0.1"],
  ["-4", "2.5"],
]
query = "SELECT a * b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_num_float_102"
description = "a NUMBER(10,2) * b FLOAT. Catches: fixed-point / FLOAT result type swapped"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "FLOAT" }]
rows = [
  ["1.10", "1.1"],
  ["2.00", "-0.5"],
  ["1.10", "0.001"],
]
query = "SELECT a * b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_float_float"
description = "a FLOAT * b FLOAT. Catches: underflow to zero handled differently"
columns = [{ name = "a", type = "FLOAT" }, { name = "b", type = "FLOAT" }]
rows = [
  ["0.1", "3"],
  ["1e-200", "1e-200"],
]
query = "SELECT a * b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t007_null_a"
description = "NULL as a, the other operand set. Catches: NULL treated as 1 or 0"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["NULL", "2.00"],
]
query = "SELECT a * b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t008_null_b"
description = "NULL as b, the other operand set. Catches: NULL treated as 1 or 0"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["2.00", "NULL"],
]
query = "SELECT a * b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t009_float_big"
description = "FLOAT products near the double range. Catches: overflow to infinity treated differently"
columns = [{ name = "a", type = "FLOAT" }, { name = "b", type = "FLOAT" }]
rows = [
  ["1e200", "1e100"],
  ["-1e300", "1e10"],
]
query = "SELECT a * b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t010_scale_sum"
description = "Scales adding past 12 digits. Catches: product scale above Snowflake's cap kept or rounded wrongly"
columns = [{ name = "a", type = "NUMBER(20,10)" }, { name = "b", type = "NUMBER(20,10)" }]
rows = [
  ["1.0000000001", "1.0000000001"],
  ["0.3333333333", "3.0000000000"],
  ["1.2345678901", "1.2345678901"],
]
query = "SELECT a * b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t011_overflow"
description = "A product beyond 38 digits. Catches: wrapping or silent FLOAT instead of the out-of-range error"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["99999999999999999999999999999999999999", "10"],
]
query = "SELECT a * b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
