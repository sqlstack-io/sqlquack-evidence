category = "translation"
construct = "sf.expressions.operators-subquery.exists"
session_profile = "utc-v1"

[[case]]
id = "t001_correlated"
description = "The page's pattern: groups with no row of x above 6, by a correlated NOT EXISTS, and groups with one by EXISTS. Catches: the correlation dropped (every group or none)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'k'", "5"],
  ["'k'", "10"],
  ["'v'", "1"],
  ["'v'", "7"],
  ["'v'", "NULL"],
  ["'w'", "3"],
]
query = "SELECT ordinal, g FROM input o WHERE NOT EXISTS (SELECT 1 FROM input i WHERE i.g = o.g AND i.x > 6) ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_uncorrelated"
description = "Uncorrelated EXISTS as a value, which the page allows anywhere a Boolean is: one subquery with rows and one without. Catches: EXISTS refused outside WHERE, or TRUE for an empty subquery"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'k'", "5"],
  ["'k'", "10"],
  ["'v'", "1"],
  ["'v'", "7"],
  ["'v'", "NULL"],
  ["'w'", "3"],
]
query = "SELECT ordinal, EXISTS (SELECT 1 FROM input WHERE g = 'w') AS some_rows, EXISTS (SELECT 1 FROM input WHERE g = 'none') AS no_rows FROM input WHERE ordinal = 1"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_row"
description = "A subquery returning only a NULL value still returns a row, so EXISTS is TRUE. Catches: a row of NULL counted as no row"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'k'", "5"],
  ["'k'", "10"],
  ["'v'", "1"],
  ["'v'", "7"],
  ["'v'", "NULL"],
  ["'w'", "3"],
]
query = "SELECT ordinal, EXISTS (SELECT x FROM input WHERE x IS NULL) AS r FROM input WHERE ordinal = 1"
order = "ordered"
tags = ["null"]
