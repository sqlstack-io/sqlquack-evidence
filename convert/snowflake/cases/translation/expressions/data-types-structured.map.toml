category = "translation"
construct = "sf.expressions.data-types-structured.map"
session_profile = "utc-v1"

[[case]]
id = "t001_number_keys"
description = "The page: {'-10': 'CA', '-20': 'OR'} cast to MAP(NUMBER, VARCHAR) is {-10->'CA', -20->'OR'}; read with a numeric key. Catches: keys kept as text (lookup by number fails)"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"-10\":\"CA\",\"-20\":\"OR\"}'"],
]
query = "SELECT ordinal, PARSE_JSON(a)::MAP(NUMBER, VARCHAR)[-10] AS k10, MAP_SIZE(PARSE_JSON(a)::MAP(NUMBER, VARCHAR)) AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_value_convert"
description = "The page: values that do not match are converted to the value type; text digits become numbers. Catches: values left as text"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"x\":\"7\",\"y\":8}'"],
]
query = "SELECT ordinal, PARSE_JSON(a)::MAP(VARCHAR, NUMBER)['x'] + 1 AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_json_null_value"
description = "The page: a JSON null value becomes SQL NULL in MAP(VARCHAR, VARCHAR). Catches: the JSON null kept"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"x\":null,\"y\":\"b\"}'"],
]
query = "SELECT ordinal, PARSE_JSON(a)::MAP(VARCHAR, VARCHAR)['x'] IS NULL AS x_null FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
