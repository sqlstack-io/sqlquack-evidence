# ARRAY_POSITION, ARRAY_CAT, ARRAY_COMPACT, GET, TRANSFORM and PARSE_JSON of VARIANTs.
category = "semi-structured-array"
construct = "fn:ARRAY_POSITION"
session_profile = "utc-v1"

[[case]]
id = "array_position_color"
description = "ARRAY_POSITION of the text Color as a VARIANT in arrays of headers."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('[\"Size\",\"Color\",\"Weight\"]')"],
  ["PARSE_JSON('[\"color\",\"Color\"]')"],
  ["PARSE_JSON('[\"Weight\",null,\"Weight\"]')"],
  ["PARSE_JSON('[]')"],
  ["PARSE_JSON('[1,\"1\",true]')"],
  ["PARSE_JSON('[\"Größe\",\"Çolor\"]')"],
  ["NULL"],
]
expression = "ARRAY_POSITION('Color'::VARIANT, v)"
tags = ["null", "duplicates", "empty", "invalid"]

