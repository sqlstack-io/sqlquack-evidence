[[case]]
id = "array_position_get"
description = "GET of the position ARRAY_POSITION finds, as models read a column by header."
columns = [{ name = "h", type = "VARIANT" }, { name = "r", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('[\"Size\",\"Color\"]')", "PARSE_JSON('[\"L\",\"red\"]')"],
  ["PARSE_JSON('[\"Color\"]')", "PARSE_JSON('[\"blue\",\"x\"]')"],
  ["PARSE_JSON('[\"Size\"]')", "PARSE_JSON('[\"M\"]')"],
]
expression = "GET(r, ARRAY_POSITION('Color'::VARIANT, h))::VARCHAR"
tags = ["null", "duplicates", "empty", "invalid"]

[[case]]
id = "array_position_null_needle"
description = "ARRAY_POSITION of SQL NULL and of a JSON null."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('[null,\"a\"]')"],
  ["PARSE_JSON('[\"a\"]')"],
]
query = "SELECT ARRAY_POSITION(NULL, v) AS a, ARRAY_POSITION(PARSE_JSON('null'), v) AS b FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "duplicates", "empty", "invalid"]

