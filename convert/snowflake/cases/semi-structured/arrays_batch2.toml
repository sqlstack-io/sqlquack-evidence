[[case]]
id = "get_computed_index"
description = "GET of an array at a computed index i - 1, past its end and of an object."
columns = [{ name = "v", type = "VARIANT" }, { name = "i", type = "NUMBER(5,0)" }]
rows = [
  ["PARSE_JSON('[\"a\",\"b\",\"c\"]')", "1"],
  ["PARSE_JSON('[\"a\",\"b\",\"c\"]')", "3"],
  ["PARSE_JSON('[\"a\",\"b\",\"c\"]')", "4"],
  ["PARSE_JSON('[\"a\"]')", "0"],
  ["PARSE_JSON('[\"a\"]')", "NULL"],
  ["PARSE_JSON('{\"k\":1}')", "1"],
  ["NULL", "1"],
]
expression = "GET(v, i - 1)"
tags = ["null", "duplicates", "empty", "invalid"]

