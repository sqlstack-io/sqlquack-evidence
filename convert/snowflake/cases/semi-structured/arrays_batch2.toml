  ["PARSE_JSON('[1,\"2\",\" 3 \"]')"],
  ["PARSE_JSON('[]')"],
  ["PARSE_JSON('[null]')"],
]
expression = "TRANSFORM(v, x -> LPAD(TRIM(x::string), 2, '0'))"
tags = ["null", "duplicates", "empty", "invalid"]
expected_divergence = "json_fidelity"

