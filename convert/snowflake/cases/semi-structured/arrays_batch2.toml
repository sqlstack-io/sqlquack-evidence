[[case]]
id = "array_compact_construct"
description = "ARRAY_COMPACT of ARRAY_CONSTRUCT with SQL NULLs and JSON nulls."
columns = [{ name = "x", type = "VARCHAR" }, { name = "v", type = "VARIANT" }]
rows = [
  ["'a'", "PARSE_JSON('null')"],
  ["NULL", "PARSE_JSON('1')"],
  ["NULL", "NULL"],
]
expression = "ARRAY_COMPACT(ARRAY_CONSTRUCT(x, v, 'z'))"
tags = ["null", "duplicates", "empty", "invalid"]
expected_divergence = "json_fidelity"

[[case]]
id = "array_compact_path"
description = "ARRAY_COMPACT of an array path holding JSON nulls."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":[1,null,2]}')"],
  ["PARSE_JSON('{\"a\":[null]}')"],
  ["PARSE_JSON('{\"a\":[]}')"],
  ["PARSE_JSON('{}')"],
  ["NULL"],
]
expression = "ARRAY_COMPACT(v:a)"
tags = ["null", "duplicates", "empty", "invalid"]

