[[case]]
id = "array_cat_pairs"
description = "ARRAY_CAT of two arrays, empty arrays and nested values."
columns = [{ name = "a", type = "VARIANT" }, { name = "b", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('[1,2]')", "PARSE_JSON('[3]')"],
  ["PARSE_JSON('[]')", "PARSE_JSON('[\"x\"]')"],
  ["PARSE_JSON('[null]')", "PARSE_JSON('[{\"k\":1}]')"],
  ["PARSE_JSON('[1]')", "NULL"],
  ["NULL", "PARSE_JSON('[1]')"],
]
expression = "ARRAY_CAT(a, b)"
tags = ["null", "duplicates", "empty", "invalid"]

[[case]]
id = "array_cat_coalesce_construct"
description = "ARRAY_CAT of COALESCE(path, ARRAY_CONSTRUCT()) as models write it."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":[1],\"b\":[2]}')"],
  ["PARSE_JSON('{\"a\":[1]}')"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('{\"a\":null,\"b\":[\"x\"]}')"],
]
expression = "ARRAY_CAT(COALESCE(v:a, ARRAY_CONSTRUCT()), COALESCE(v:b, ARRAY_CONSTRUCT()))"
tags = ["null", "duplicates", "empty", "invalid"]

[[case]]
id = "array_cat_coalesce_literal"
