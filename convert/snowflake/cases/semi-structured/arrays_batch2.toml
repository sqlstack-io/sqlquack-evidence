[[case]]
id = "try_parse_json_of_variant"
description = "TRY_PARSE_JSON of a VARIANT string path."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"raw\":\"{\\\\\"a\\\\\":1}\"}')"],
  ["PARSE_JSON('{\"raw\":\"[1,2]\"}')"],
  ["PARSE_JSON('{\"raw\":\"not json\"}')"],
  ["PARSE_JSON('{\"raw\":null}')"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('{\"raw\":{\"a\":1}}')"],
  ["PARSE_JSON('{\"raw\":\"\\\\\"s\\\\\"\"}')"],
]
expression = "TRY_PARSE_JSON(v:raw)"
tags = ["null", "duplicates", "empty", "invalid"]
expected_divergence = "json_fidelity"

[[case]]
id = "parse_json_of_variant"
