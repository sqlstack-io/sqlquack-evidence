[[case]]
id = "transform_text"
description = "TRANSFORM of array elements read as text."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('[{\"text\":\"a\"},{\"text\":\"b\"}]')"],
  ["PARSE_JSON('[{\"text\":null},{}]')"],
  ["PARSE_JSON('[]')"],
  ["NULL"],
]
expression = "TRANSFORM(v, c -> c:text::VARCHAR)"
tags = ["null", "duplicates", "empty", "invalid"]
expected_divergence = "json_fidelity"

[[case]]
id = "transform_split_left"
description = "TRANSFORM of FILTERed SPLIT words to their first letters."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'ann  lee'"],
  ["'B'"],
  ["''"],
  ["NULL"],
]
expression = "TRANSFORM(FILTER(SPLIT(TRIM(UPPER(s)), ' '), x -> x <> ''), x -> LEFT(x, 1))"
tags = ["null", "duplicates", "empty", "invalid"]

[[case]]
id = "transform_lpad"
description = "TRANSFORM with LPAD of trimmed element text."
columns = [{ name = "v", type = "VARIANT" }]
