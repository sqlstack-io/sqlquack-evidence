[[case]]
id = "parsed_path"
description = "A path into parsed text: missing keys, JSON null, arrays and key case."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'{\"data\":{\"id\":\"x1\"}}'"],
  ["'{\"data\":{\"ID\":\"x2\"}}'"],
  ["'{\"data\":null}'"],
  ["'{}'"],
  ["'[{\"data\":1}]'"],
  ["NULL"],
  ["'{\"data\":{\"id\":7}}'"],
]
expression = "TRY_PARSE_JSON(s):data.id::VARCHAR"
tags = ["missing-key", "case-sensitive-key", "json-null", "null", "nested", "array-index"]

