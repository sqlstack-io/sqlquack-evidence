category = "semi-structured"
construct = "fn:GET_PATH"
session_profile = "utc-v1"

[[case]]
id = "variant_order"
description = "ORDER BY a VARIANT path across JSON types, JSON null, missing keys and SQL NULL."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":1}')"],
  ["PARSE_JSON('{\"a\":\"1\"}')"],
  ["PARSE_JSON('{\"a\":2.5}')"],
  ["PARSE_JSON('{\"a\":true}')"],
  ["PARSE_JSON('{\"a\":false}')"],
  ["PARSE_JSON('{\"a\":null}')"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('{\"a\":[1]}')"],
  ["PARSE_JSON('{\"a\":{\"b\":1}}')"],
  ["PARSE_JSON('{\"a\":\"B\"}')"],
  ["PARSE_JSON('{\"a\":\"b\"}')"],
  ["PARSE_JSON('{\"a\":-3}')"],
  ["NULL"],
]
query = "SELECT TYPEOF(v:a) AS t, v:a::VARCHAR AS a FROM input ORDER BY v:a, ordinal"
order = "ordered"
tags = ["null", "json-null", "missing-key", "nested", "array-index", "case-sensitive-key"]
expected_divergence = "array_sort_order"

