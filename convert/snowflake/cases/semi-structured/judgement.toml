[[case]]
id = "variant_null_tests"
description = "IS NULL, IS_NULL_VALUE and COALESCE over JSON null, missing keys and SQL NULL."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":1}')"],
  ["PARSE_JSON('{\"a\":\"1\"}')"],
  ["PARSE_JSON('{\"a\":2.5}')"],
  ["PARSE_JSON('{\"a\":true}')"],
  ["PARSE_JSON('{\"a\":false}')"],
  ["PARSE_JSON('{\"a\":null}')"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('{\"a\":[1]}')"],
  ["PARSE_JSON('{\"a\":{\"b\":1}}')"],
  ["PARSE_JSON('{\"a\":\"B\"}')"],
  ["PARSE_JSON('{\"a\":\"b\"}')"],
  ["PARSE_JSON('{\"a\":-3}')"],
  ["NULL"],
]
query = "SELECT v:a IS NULL AS is_null, IS_NULL_VALUE(v:a) AS is_json_null, COALESCE(v:a::VARCHAR, 'none') AS filled FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "json-null", "missing-key"]

[[case]]
id = "object_key_order"
description = "TO_JSON and ::VARCHAR of objects whose keys are not in sorted order, nested and in arrays."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'{\"b\":1,\"a\":2}'"],
  ["'{\"z\":{\"y\":1,\"x\":2},\"a\":[{\"d\":1,\"c\":2}]}'"],
  ["'{\"aa\":1,\"a\":2,\"B\":3,\"_\":4,\"1\":5}'"],
  ["'{\"é\":1,\"e\":2,\"f\":3}'"],
  ["NULL"],
]
query = "SELECT TO_JSON(PARSE_JSON(s)) AS j, PARSE_JSON(s)::VARCHAR AS v FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "nested", "array-index", "case-sensitive-key"]

[[case]]
id = "string_escapes_out"
description = "How TO_JSON and ::VARCHAR write strings with quotes, backslashes, control characters, slashes and non-ASCII."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'\"say \\\\\"hi\\\\\"\"'"],
  ["'\"back\\\\\\\\slash\"'"],
  ["'\"line\\\\nbreak\\\\ttab\"'"],
  ["'\"\\\\u0001\"'"],
  ["'\"a/b\"'"],
  ["'\"\\\\u00e9\\\\u4e2d\"'"],
  ["NULL"],
]
query = "SELECT TO_JSON(PARSE_JSON(s)) AS j, PARSE_JSON(s)::VARCHAR AS v, LENGTH(PARSE_JSON(s)::VARCHAR) AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "get_functions"
description = "GET by key and index, GET_IGNORE_CASE, and GET_PATH spelled as a function."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":1,\"A\":2,\"Ab\":3,\"c\":[10,20]}')"],
  ["PARSE_JSON('{\"AB\":\"x\"}')"],
  ["PARSE_JSON('{\"ab\":null}')"],
  ["PARSE_JSON('[5,6]')"],
  ["PARSE_JSON('{}')"],
  ["NULL"],
]
query = "SELECT GET(v, 'a')::VARCHAR AS get_a, GET(v, 0)::VARCHAR AS get_0, GET_IGNORE_CASE(v, 'ab')::VARCHAR AS ignore_case, GET_PATH(v, 'c[1]')::VARCHAR AS path FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "json-null", "missing-key", "array-index", "case-sensitive-key"]

[[case]]
id = "get_ignore_case_ambiguous"
description = "GET_IGNORE_CASE where several keys match ignoring case."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":1,\"A\":2}')"],
  ["PARSE_JSON('{\"A\":2,\"a\":1}')"],
  ["PARSE_JSON('{\"aB\":1,\"Ab\":2,\"ab\":3}')"],
]
query = "SELECT GET_IGNORE_CASE(v, 'ab')::VARCHAR AS ab, GET_IGNORE_CASE(v, 'A')::VARCHAR AS a FROM input ORDER BY ordinal"
order = "ordered"
tags = ["case-sensitive-key"]

[[case]]
id = "path_to_temporal"
description = "Text in JSON cast to DATE and TIMESTAMP_NTZ, as staging models do."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"d\":\"2024-02-29\",\"t\":\"2024-02-29 13:45:01.123\"}')"],
  ["PARSE_JSON('{\"d\":\"2024-02-29T00:00:00Z\",\"t\":\"2024-02-29T13:45:01Z\"}')"],
  ["PARSE_JSON('{\"d\":null,\"t\":null}')"],
  ["PARSE_JSON('{}')"],
  ["NULL"],
]
query = "SELECT v:d::DATE AS d, v:t::TIMESTAMP_NTZ AS t FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "json-null", "missing-key"]

