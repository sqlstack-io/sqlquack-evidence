[[case]]
id = "nested_null_paths"
description = "Paths through JSON null, through scalars and past array ends."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":null}')"],
  ["PARSE_JSON('{\"a\":{\"b\":null}}')"],
  ["PARSE_JSON('{\"a\":1}')"],
  ["PARSE_JSON('{\"a\":[]}')"],
  ["PARSE_JSON('{\"a\":[null]}')"],
  ["PARSE_JSON('{\"a\":\"text\"}')"],
  ["NULL"],
]
query = "SELECT v:a.b::VARCHAR AS ab, TYPEOF(v:a.b) AS ab_type, v:a[0]::VARCHAR AS a0, TYPEOF(v:a[0]) AS a0_type FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "json-null", "missing-key", "nested", "array-index"]

