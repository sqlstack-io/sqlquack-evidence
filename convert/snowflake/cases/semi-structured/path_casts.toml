category = "semi-structured"
construct = "fn:GET_PATH"
session_profile = "utc-v1"

[[case]]
id = "path_to_varchar"
description = "A key's value cast to VARCHAR for each JSON type, a missing key and JSON null."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":\"x\"}')"],
  ["PARSE_JSON('{\"a\":12}')"],
  ["PARSE_JSON('{\"a\":1.50}')"],
  ["PARSE_JSON('{\"a\":true}')"],
  ["PARSE_JSON('{\"a\":null}')"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('{\"a\":{\"b\":1}}')"],
  ["PARSE_JSON('{\"a\":[1,2]}')"],
  ["PARSE_JSON('{\"A\":\"upper\"}')"],
  ["NULL"],
  ["PARSE_JSON('{\"a\":\"ü\"}')"],
  ["PARSE_JSON('{\"a\":\"\"}')"],
  ["PARSE_JSON('{\"a\":12345678901234567890}')"],
  ["PARSE_JSON('{\"a\":0.1}')"],
]
expression = "v:a::VARCHAR"
tags = ["null", "json-null", "missing-key", "nested", "case-sensitive-key", "unicode"]

[[case]]
id = "path_to_number"
description = "A key's value cast to NUMBER(10,2): numbers round, numeric strings convert."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":12}')"],
  ["PARSE_JSON('{\"a\":1.005}')"],
  ["PARSE_JSON('{\"a\":-1.005}')"],
  ["PARSE_JSON('{\"a\":\"12.345\"}')"],
  ["PARSE_JSON('{\"a\":\" 7 \"}')"],
  ["PARSE_JSON('{\"a\":null}')"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('{\"a\":-0.005}')"],
  ["NULL"],
  ["PARSE_JSON('{\"a\":\"1e1\"}')"],
]
expression = "v:a::NUMBER(10,2)"
tags = ["null", "json-null", "missing-key", "boundary"]

