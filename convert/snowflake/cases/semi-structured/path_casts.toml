[[case]]
id = "nested_array_path"
description = "A nested path through an array index, past the end and on non-arrays."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":{\"b\":[{\"c\":\"x\"},{\"c\":\"y\"}]}}')"],
  ["PARSE_JSON('{\"a\":{\"b\":[]}}')"],
  ["PARSE_JSON('{\"a\":{\"b\":{\"0\":{\"c\":\"z\"}}}}')"],
  ["PARSE_JSON('{\"a\":{\"b\":[{\"C\":\"upper\"}]}}')"],
  ["PARSE_JSON('{\"a\":null}')"],
  ["NULL"],
]
expression = "v:a.b[0].c::VARCHAR"
tags = ["array-index", "nested", "missing-key", "case-sensitive-key", "null"]

[[case]]
id = "bracket_path"
description = "Bracket access by key and by index."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":{\"b\":\"x\"}}')"],
  ["PARSE_JSON('{\"a\":[\"p\",\"q\"]}')"],
  ["PARSE_JSON('{\"A\":{\"b\":\"upper\"}}')"],
  ["PARSE_JSON('[1,2]')"],
  ["NULL"],
]
expression = "COALESCE(v['a']['b']::VARCHAR, v['a'][1]::VARCHAR, v[0]::VARCHAR)"
tags = ["array-index", "nested", "case-sensitive-key", "null"]

[[case]]
id = "quoted_and_special_keys"
description = "Quoted keys, keys with spaces and keys containing dots."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"A\":\"upper\",\"a\":\"lower\"}')"],
  ["PARSE_JSON('{\"a b\":\"space\"}')"],
  ["PARSE_JSON('{\"a.b\":\"dotted\",\"a\":{\"b\":\"nested\"}}')"],
  ["PARSE_JSON('{}')"],
]
expression = "COALESCE(v:\"A\"::VARCHAR, '-') || '|' || COALESCE(v:\"a b\"::VARCHAR, '-') || '|' || COALESCE(v:\"a.b\"::VARCHAR, '-') || '|' || COALESCE(v:a.b::VARCHAR, '-')"
tags = ["case-sensitive-key", "missing-key", "nested"]

[[case]]
id = "get_path_and_get"
description = "GET_PATH and GET with keys and indexes."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":{\"b\":[10,20]}}')"],
  ["PARSE_JSON('{\"a\":{\"b\":[]}}')"],
  ["PARSE_JSON('{\"a\":null}')"],
  ["PARSE_JSON('[5]')"],
  ["NULL"],
]
expression = "COALESCE(GET_PATH(v, 'a.b[1]')::VARCHAR, GET(v, 'a')::VARCHAR, GET(v, 0)::VARCHAR)"
tags = ["array-index", "nested", "json-null", "null"]

