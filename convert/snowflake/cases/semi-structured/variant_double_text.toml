# FLOAT held in a VARIANT cast to text, over many rows and folded from one row, by value class.
category = "semi-structured-typed"
construct = "node:cast"
session_profile = "utc-v1"

[[case]]
id = "variant_double_text_many_rows_integers"
description = "Text of a FLOAT in a VARIANT over many rows, which Snowflake cannot fold: whole doubles, up to and past 2^53."
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0"],
  ["1"],
  ["-42"],
  ["100"],
  ["123456789"],
  ["1e15"],
  ["9007199254740992"],
  ["1e16"],
  ["1e17"],
  ["123456789012345678"],
  ["NULL"],
]
query = "SELECT TO_VARIANT(x)::VARCHAR AS c, TO_VARCHAR(TO_VARIANT(x)) AS tv, OBJECT_CONSTRUCT('k', x):k::VARCHAR AS o, ARRAY_CONSTRUCT(x)[0]::VARCHAR AS a, x::VARCHAR AS fx, TO_JSON(TO_VARIANT(x)) AS j FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "boundary"]
expected_divergence = "float_text"

