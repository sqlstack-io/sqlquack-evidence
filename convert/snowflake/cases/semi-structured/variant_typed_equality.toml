# Typed values in a VARIANT compared with each other and with their text, and partitioned by.
category = "semi-structured-typed"
construct = "node:eq"
session_profile = "utc-v1"

[[case]]
id = "typed_equality_date_vs_text"
description = "A DATE in a VARIANT against a VARIANT of its text, of its own ::VARCHAR and of parsed JSON."
columns = [{ name = "x", type = "DATE" }, { name = "s", type = "VARCHAR" }]
rows = [
  ["'2024-01-01'", "'2024-01-01'"],
  ["'2024-02-29'", "'2024-02-29'"],
  ["NULL", "NULL"],
]
query = "SELECT TO_VARIANT(x) = TO_VARIANT(s) AS eq, TO_VARIANT(x) <> TO_VARIANT(s) AS ne, TO_VARIANT(x) = TO_VARIANT(x::VARCHAR) AS own_text, TO_VARIANT(x) = PARSE_JSON('\"' || s || '\"') AS parsed, TYPEOF(TO_VARIANT(x)) AS t FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "boundary"]

