# LATERAL FLATTEN after explicit JOIN ... ON clauses, as a comma-separated source.
category = "semi-structured"
construct = "node:lateral"
session_profile = "utc-v1"

[[case]]
id = "join_then_flatten"
description = "A JOIN ... ON, then LATERAL FLATTEN after a comma: array elements, empty arrays, JSON null, missing keys, scalars, objects and NULL."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(2,0)" }, { name = "v", type = "VARIANT" }]
rows = [
  ["'o'", "1", "PARSE_JSON('{\"items\":[{\"sku\":\"A-10\",\"qty\":2,\"parts\":[{\"p\":\"x\"},{\"p\":\"y\"}]},{\"sku\":\"B-20\",\"qty\":1,\"parts\":[]}],\"meta\":{\"items\":[{\"n\":1},{\"n\":2}],\"Tier\":\"gold\",\"tier\":\"x\"}}')"],
  ["'o'", "2", "PARSE_JSON('{\"items\":[],\"meta\":{\"items\":[]}}')"],
  ["'o'", "3", "PARSE_JSON('{\"items\":null,\"meta\":null}')"],
  ["'o'", "4", "PARSE_JSON('{\"meta\":{}}')"],
  ["'o'", "5", "PARSE_JSON('{\"items\":\"scalar\",\"meta\":\"scalar\"}')"],
  ["'o'", "6", "NULL"],
  ["'o'", "7", "PARSE_JSON('{\"items\":{\"b\":{\"sku\":\"C-30\"},\"a\":{\"sku\":\"D-40\"}},\"meta\":{\"items\":[{\"n\":3}]}}')"],
  ["'o'", "8", "PARSE_JSON('{\"items\":[{\"sku\":\"E-50\",\"qty\":3,\"parts\":[{\"p\":\"z\"}]}]}')"],
  ["'c'", "1", "PARSE_JSON('{\"name\":\"Ada\",\"tags\":[\"new\",\"vip\"]}')"],
  ["'c'", "2", "PARSE_JSON('{\"name\":\"Bo\",\"tags\":[]}')"],
  ["'c'", "3", "PARSE_JSON('{\"name\":\"Cy\"}')"],
  ["'c'", "4", "PARSE_JSON('{\"name\":\"Di\",\"tags\":null}')"],
  ["'c'", "5", "PARSE_JSON('{\"name\":\"Ed\",\"tags\":\"vip\"}')"],
  ["'c'", "7", "PARSE_JSON('{\"name\":\"Fa\",\"tags\":[\"a\"]}')"],
  ["'c'", "8", "PARSE_JSON('{\"name\":\"Gu\",\"tags\":[\"b\",\"c\"]}')"],
]
query = "SELECT o.k, c.v:name::VARCHAR AS name, f.index, f.key, f.path, f.value:sku::VARCHAR AS sku, f.value:qty::NUMBER(10,0) AS qty FROM input o JOIN input c ON c.k = o.k AND c.side = 'c', LATERAL FLATTEN(input => o.v:items) f WHERE o.side = 'o' ORDER BY o.k, f.index, f.key"
order = "ordered"
tags = ["null", "json-null", "missing-key", "nested", "array-index", "case-sensitive-key"]

[[case]]
id = "join_then_two_flattens"
description = "A JOIN, then FLATTEN, then FLATTEN over the first FLATTEN's value."
columns = [{ name = "side", type = "VARCHAR" }, { name = "k", type = "NUMBER(2,0)" }, { name = "v", type = "VARIANT" }]
rows = [
  ["'o'", "1", "PARSE_JSON('{\"items\":[{\"sku\":\"A-10\",\"qty\":2,\"parts\":[{\"p\":\"x\"},{\"p\":\"y\"}]},{\"sku\":\"B-20\",\"qty\":1,\"parts\":[]}],\"meta\":{\"items\":[{\"n\":1},{\"n\":2}],\"Tier\":\"gold\",\"tier\":\"x\"}}')"],
  ["'o'", "2", "PARSE_JSON('{\"items\":[],\"meta\":{\"items\":[]}}')"],
  ["'o'", "3", "PARSE_JSON('{\"items\":null,\"meta\":null}')"],
  ["'o'", "4", "PARSE_JSON('{\"meta\":{}}')"],
  ["'o'", "5", "PARSE_JSON('{\"items\":\"scalar\",\"meta\":\"scalar\"}')"],
  ["'o'", "6", "NULL"],
  ["'o'", "7", "PARSE_JSON('{\"items\":{\"b\":{\"sku\":\"C-30\"},\"a\":{\"sku\":\"D-40\"}},\"meta\":{\"items\":[{\"n\":3}]}}')"],
  ["'o'", "8", "PARSE_JSON('{\"items\":[{\"sku\":\"E-50\",\"qty\":3,\"parts\":[{\"p\":\"z\"}]}]}')"],
  ["'c'", "1", "PARSE_JSON('{\"name\":\"Ada\",\"tags\":[\"new\",\"vip\"]}')"],
  ["'c'", "2", "PARSE_JSON('{\"name\":\"Bo\",\"tags\":[]}')"],
  ["'c'", "3", "PARSE_JSON('{\"name\":\"Cy\"}')"],
  ["'c'", "4", "PARSE_JSON('{\"name\":\"Di\",\"tags\":null}')"],
  ["'c'", "5", "PARSE_JSON('{\"name\":\"Ed\",\"tags\":\"vip\"}')"],
  ["'c'", "7", "PARSE_JSON('{\"name\":\"Fa\",\"tags\":[\"a\"]}')"],
  ["'c'", "8", "PARSE_JSON('{\"name\":\"Gu\",\"tags\":[\"b\",\"c\"]}')"],
]
query = "SELECT o.k, f.index AS item_index, p.index AS part_index, p.value:p::VARCHAR AS part FROM input o JOIN input c ON c.k = o.k AND c.side = 'c', LATERAL FLATTEN(input => o.v:items) f, LATERAL FLATTEN(input => f.value:parts) p WHERE o.side = 'o' ORDER BY o.k, item_index, part_index"
order = "ordered"
tags = ["nested", "array-index", "missing-key"]

