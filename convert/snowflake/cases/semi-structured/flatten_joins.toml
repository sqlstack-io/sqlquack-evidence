]
query = "SELECT f.key, f.value::NUMBER(10,0) AS n FROM input o JOIN input c ON c.k = o.k AND c.side = 'c', LATERAL FLATTEN(input => o.v:m) f WHERE o.side = 'o'"
order = "bag"
tags = ["case-sensitive-key"]

[[case]]
id = "join_then_flatten_array_unordered"
