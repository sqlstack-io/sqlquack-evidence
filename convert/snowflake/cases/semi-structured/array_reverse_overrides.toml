"""

[[case]]
id = "override_array_reverse_object"
description = "A user override of ARRAY_REVERSE, over a VARIANT holding an object."
columns = [{ name = "k", type = "NUMBER(2,0)" }]
rows = [["1"]]
query = "SELECT TO_JSON(ARRAY_REVERSE(PARSE_JSON('{\"a\":1}'))) AS r FROM input"
order = "ordered"
tags = ["invalid"]

