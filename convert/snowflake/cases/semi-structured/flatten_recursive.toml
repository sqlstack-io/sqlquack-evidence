# FLATTEN's RECURSIVE, PATH and MODE arguments, and its SEQ column.
category = "semi-structured"
construct = "node:lateral"
session_profile = "utc-v1"

[[case]]
id = "flatten_recursive"
description = "RECURSIVE => TRUE: every element and key at every depth, with PATH, KEY, INDEX, VALUE and THIS."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"order\":{\"id\":17,\"lines\":[{\"sku\":\"A-10\",\"qty\":2},{\"sku\":\"B-20\",\"tags\":[\"x\",null]}],\"note\":\"/\"},\"empty\":[],\"none\":null,\"obj\":{}}')"],
  ["PARSE_JSON('[[1,[2]],{\"b\":{\"a\":1}}]')"],
  ["PARSE_JSON('\"scalar\"')"],
  ["PARSE_JSON('null')"],
  ["NULL"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('[]')"],
]
query = "SELECT i.ordinal, f.key, f.index, f.path, TO_JSON(f.value) AS value, TO_JSON(f.this) AS this, TYPEOF(f.value) AS kind FROM input i, LATERAL FLATTEN(input => i.v, recursive => TRUE) f ORDER BY i.ordinal, f.path"
order = "ordered"
tags = ["null", "json-null", "missing-key", "nested", "array-index", "case-sensitive-key"]

[[case]]
id = "flatten_recursive_order"
description = "RECURSIVE => TRUE over one document, rows in the order FLATTEN returns them."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"order\":{\"id\":17,\"lines\":[{\"sku\":\"A-10\",\"qty\":2},{\"sku\":\"B-20\",\"tags\":[\"x\",null]}],\"note\":\"/\"},\"empty\":[],\"none\":null,\"obj\":{}}')"],
]
query = "SELECT f.key, f.index, f.path, TO_JSON(f.value) AS value, TO_JSON(f.this) AS this, TYPEOF(f.value) AS kind FROM input i, LATERAL FLATTEN(input => i.v, recursive => TRUE) f"
order = "ordered"
tags = ["nested", "array-index", "json-null"]

