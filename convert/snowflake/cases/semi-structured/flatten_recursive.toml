[[case]]
id = "flatten_recursive_filtered"
description = "RECURSIVE => TRUE filtered on a scalar value's text, as a cleanup model does."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"order\":{\"id\":17,\"lines\":[{\"sku\":\"A-10\",\"qty\":2},{\"sku\":\"B-20\",\"tags\":[\"x\",null]}],\"note\":\"/\"},\"empty\":[],\"none\":null,\"obj\":{}}')"],
  ["PARSE_JSON('[[1,[2]],{\"b\":{\"a\":1}}]')"],
  ["PARSE_JSON('\"scalar\"')"],
  ["PARSE_JSON('null')"],
  ["NULL"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('[]')"],
]
query = "SELECT i.ordinal, f.path, f.key FROM input i, LATERAL FLATTEN(input => i.v, recursive => TRUE) f WHERE f.value::VARCHAR = '/' ORDER BY i.ordinal, f.path"
order = "ordered"
tags = ["nested", "missing-key"]

[[case]]
id = "flatten_recursive_deep"
description = "RECURSIVE => TRUE through ten levels of objects and an array: deep PATHs."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":{\"a\":{\"a\":{\"a\":{\"a\":{\"a\":{\"a\":{\"a\":{\"a\":{\"a\":[{\"k\":1}]}}}}}}}}}}')"],
]
query = "SELECT f.path, f.key, f.index FROM input i, LATERAL FLATTEN(input => i.v, recursive => TRUE) f ORDER BY f.path"
order = "ordered"
tags = ["nested", "array-index"]

[[case]]
id = "flatten_recursive_key_paths"
expected_divergence = "json_fidelity"
description = "RECURSIVE => TRUE through keys that are not plain names: PATH quoting."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a b\":{\"c.d\":[1]},\"日\":{\"x\":2},\"Q\\\\\"t\":3,\"\":4,\"_1\":{\"9z\":5}}')"],
]
query = "SELECT f.path, f.key, f.index, TO_JSON(f.value) AS value FROM input i, LATERAL FLATTEN(input => i.v, recursive => TRUE) f ORDER BY f.path"
order = "ordered"
tags = ["case-sensitive-key", "nested"]

[[case]]
id = "flatten_recursive_twice"
description = "Two RECURSIVE FLATTENs of one input, matched on PATH."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"order\":{\"id\":17,\"lines\":[{\"sku\":\"A-10\",\"qty\":2},{\"sku\":\"B-20\",\"tags\":[\"x\",null]}],\"note\":\"/\"},\"empty\":[],\"none\":null,\"obj\":{}}')"],
  ["PARSE_JSON('[[1,[2]],{\"b\":{\"a\":1}}]')"],
]
query = "SELECT i.ordinal, f.path, g.key AS child_key, g.index AS child_index FROM input i, LATERAL FLATTEN(input => i.v, recursive => TRUE) f, LATERAL FLATTEN(input => i.v, recursive => TRUE) g WHERE STARTSWITH(g.path, f.path || '.') OR STARTSWITH(g.path, f.path || '[') ORDER BY i.ordinal, f.path, g.path"
order = "ordered"
tags = ["nested", "array-index"]

