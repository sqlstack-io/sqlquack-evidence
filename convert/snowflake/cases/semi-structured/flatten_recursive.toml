[[case]]
id = "flatten_seq_per_row"
description = "SEQ is one value per input row: distinct SEQs, and the rows sharing each."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"order\":{\"id\":17,\"lines\":[{\"sku\":\"A-10\",\"qty\":2},{\"sku\":\"B-20\",\"tags\":[\"x\",null]}],\"note\":\"/\"},\"empty\":[],\"none\":null,\"obj\":{}}')"],
  ["PARSE_JSON('[[1,[2]],{\"b\":{\"a\":1}}]')"],
  ["PARSE_JSON('\"scalar\"')"],
  ["PARSE_JSON('null')"],
  ["NULL"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('[]')"],
  ["PARSE_JSON('{\"order\":{\"id\":17,\"lines\":[{\"sku\":\"A-10\",\"qty\":2},{\"sku\":\"B-20\",\"tags\":[\"x\",null]}],\"note\":\"/\"},\"empty\":[],\"none\":null,\"obj\":{}}')"],
]
query = "SELECT i.ordinal, COUNT(DISTINCT f.seq) AS seqs, COUNT(*) AS n FROM input i, LATERAL FLATTEN(input => i.v, recursive => TRUE) f GROUP BY i.ordinal ORDER BY i.ordinal"
order = "ordered"
tags = ["null", "json-null", "nested"]

[[case]]
id = "flatten_seq_two_flattens"
description = "Two FLATTENs of the same input row share SEQ; different rows differ."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"order\":{\"id\":17,\"lines\":[{\"sku\":\"A-10\",\"qty\":2},{\"sku\":\"B-20\",\"tags\":[\"x\",null]}],\"note\":\"/\"},\"empty\":[],\"none\":null,\"obj\":{}}')"],
  ["PARSE_JSON('[[1,[2]],{\"b\":{\"a\":1}}]')"],
  ["PARSE_JSON('\"scalar\"')"],
  ["PARSE_JSON('null')"],
  ["NULL"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('[]')"],
]
query = "SELECT COUNT(*) AS pairs, SUM(IFF(f.seq = g.seq, 1, 0)) AS same_seq, COUNT(DISTINCT f.seq) AS seqs FROM input i, LATERAL FLATTEN(input => i.v, recursive => TRUE) f, LATERAL FLATTEN(input => i.v) g"
order = "ordered"
tags = ["nested"]

[[case]]
id = "flatten_seq_order"
description = "SEQ ordered against the input order, as ranks."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('[1,2]')"],
  ["PARSE_JSON('[3]')"],
  ["PARSE_JSON('{\"a\":1}')"],
]
query = "SELECT i.ordinal, DENSE_RANK() OVER (ORDER BY f.seq) AS seq_rank FROM input i, LATERAL FLATTEN(input => i.v) f ORDER BY i.ordinal, f.index"
order = "ordered"
tags = ["array-index"]

[[case]]
id = "flatten_recursive_symbol_key_paths"
description = "RECURSIVE => TRUE PATH and KEY through keys holding $, -, @, [, a space, a quote, an accent and nothing, at the top and below a bracketed key."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a$b\": 1, \"a-b\": {\"@x\": 2}, \"a[b\": [3], \"\\u00e9\": 4, \"plain key\": 5}')"],
  ["PARSE_JSON('{\"it''s\": {\"x\": 1}, \"\": 2, \"q\\\\\"t\": 3, \"\\u00e9a\": {\"1st\": [4]}, \"$\": 5, \"a_1\": {\"b c\": {\"d\": 6}}}')"],
]
query = "SELECT i.ordinal, f.key, f.index, f.path, (i.ordinal || ':' || f.path)::VARCHAR AS element_id, TYPEOF(f.value) AS kind FROM input i, LATERAL FLATTEN(input => i.v, recursive => TRUE) f ORDER BY i.ordinal, f.path"
order = "ordered"
tags = ["nested", "array-index", "unicode", "case-sensitive-key", "empty"]
