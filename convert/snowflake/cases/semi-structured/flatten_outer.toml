description = "FLATTEN with OUTER => FALSE, RECURSIVE => TRUE, MODE unset: every column over an empty array, an empty object, JSON null, a missing path, NULL and non-empty containers."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"lines\":[]}')"],
  ["PARSE_JSON('{\"lines\":{}}')"],
  ["PARSE_JSON('{\"lines\":null}')"],
  ["PARSE_JSON('{}')"],
  ["NULL"],
  ["PARSE_JSON('{\"lines\":[1,{\"c\":2}]}')"],
  ["PARSE_JSON('{\"lines\":{\"b\":1,\"a\":[3]}}')"],
  ["PARSE_JSON('{\"lines\":{\"A\":1,\"a\":2}}')"],
]
query = "SELECT i.ordinal, f.key, f.path, f.index, TO_JSON(f.value) AS value, TO_JSON(f.this) AS this FROM input i, LATERAL FLATTEN(input => i.v:lines, outer => FALSE, recursive => TRUE) f ORDER BY i.ordinal, f.path NULLS FIRST"
order = "ordered"
tags = ["null", "json-null", "missing-key", "empty", "nested", "array-index", "case-sensitive-key"]

