[[case]]
id = "flatten_seq_inner_recursive"
description = "FLATTEN's SEQ with OUTER => FALSE, RECURSIVE => TRUE: whether it is NULL on each row, over the same inputs."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"lines\":[]}')"],
  ["PARSE_JSON('{\"lines\":{}}')"],
  ["PARSE_JSON('{\"lines\":null}')"],
  ["PARSE_JSON('{}')"],
  ["NULL"],
  ["PARSE_JSON('{\"lines\":[1,{\"c\":2}]}')"],
  ["PARSE_JSON('{\"lines\":{\"b\":1,\"a\":[3]}}')"],
  ["PARSE_JSON('{\"lines\":{\"A\":1,\"a\":2}}')"],
]
query = "SELECT i.ordinal, f.path, f.seq IS NULL AS seq_null FROM input i, LATERAL FLATTEN(input => i.v:lines, outer => FALSE, recursive => TRUE) f ORDER BY i.ordinal, f.path NULLS FIRST"
order = "ordered"
tags = ["null", "empty"]

