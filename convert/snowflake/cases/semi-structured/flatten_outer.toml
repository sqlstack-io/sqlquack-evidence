[[case]]
id = "lateral_subquery_without_rows"
description = "A LATERAL subquery giving no rows for some outer rows drops them."
columns = [{ name = "k", type = "NUMBER(4,0)" }]
rows = [
  ["1"],
  ["2"],
  ["NULL"],
]
query = "SELECT i.k, s.x FROM input i, LATERAL (SELECT i.k * 10 AS x WHERE i.k > 1) s ORDER BY i.k"
order = "ordered"
tags = ["null", "empty"]
