# Documents whose keys differ only by ASCII or Unicode case or normalisation.

category = "semi-structured-output"
construct = "fn:TO_JSON"
session_profile = "utc-v1"

[[case]]
id = "key_case_ascii_nested"
description = "Keys 'a' and 'A' in sibling and nested objects, written as text."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"o\":{\"A\":1,\"a\":2},\"O\":{\"a\":3}}')"],
]
query = "SELECT TO_VARCHAR(v) AS t, v::VARCHAR AS c, TO_JSON(v) AS j, MD5(TO_JSON(v)) AS m, v AS raw FROM input ORDER BY ordinal"
order = "ordered"
tags = ["nested", "case-sensitive-key", "unicode"]

[[case]]
id = "key_case_ascii_array_elements"
description = "Objects in one array keyed 'a', 'A' and both."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('[{\"a\":1},{\"A\":2},{\"a\":3,\"A\":4}]')"],
]
query = "SELECT TO_VARCHAR(v) AS t, v::VARCHAR AS c, TO_JSON(v) AS j, MD5(TO_JSON(v)) AS m, v AS raw FROM input ORDER BY ordinal"
order = "ordered"
tags = ["nested", "case-sensitive-key", "unicode"]

