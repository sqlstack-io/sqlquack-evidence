# Set operations that remove duplicate VARIANTs: UNION, EXCEPT and INTERSECT over objects with keys in
# different orders, strings beside numbers, JSON null and SQL NULL.
category = "semi-structured-output"
construct = "node:except"
session_profile = "utc-v1"

[[case]]
id = "except_variants"
description = "EXCEPT of VARIANTs: an object with its keys reordered removes its twin, 1 and \"1\" differ, JSON null and SQL NULL."
columns = [{ name = "s", type = "VARCHAR" }, { name = "side", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1,\"b\":2}'", "'l'"],
  ["'1'", "'l'"],
  ["'\"1\"'", "'l'"],
  ["'null'", "'l'"],
  ["NULL", "'l'"],
  ["'[1,2]'", "'l'"],
  ["'{\"b\":2,\"a\":1}'", "'r'"],
  ["'\"1\"'", "'r'"],
  ["NULL", "'r'"],
]
query = "SELECT TO_JSON(v) AS t FROM (SELECT PARSE_JSON(s) AS v FROM input WHERE side = 'l' EXCEPT SELECT PARSE_JSON(s) FROM input WHERE side = 'r') ORDER BY t NULLS LAST"
order = "ordered"
tags = ["null", "json-null", "nested"]

[[case]]
id = "intersect_and_union_variants"
description = "INTERSECT and UNION of VARIANTs with keys in different orders and duplicates."
columns = [{ name = "s", type = "VARCHAR" }, { name = "side", type = "VARCHAR" }]
rows = [
  ["'{\"a\":1,\"b\":[1,{\"y\":1,\"x\":2}]}'", "'l'"],
  ["'\"x\"'", "'l'"],
  ["'\"x\"'", "'l'"],
  ["'{\"b\":[1,{\"x\":2,\"y\":1}],\"a\":1}'", "'r'"],
  ["'true'", "'r'"],
]
query = "SELECT 'i' AS op, TO_JSON(v) AS t FROM (SELECT PARSE_JSON(s) AS v FROM input WHERE side = 'l' INTERSECT SELECT PARSE_JSON(s) FROM input WHERE side = 'r') UNION ALL SELECT 'u', TO_JSON(v) FROM (SELECT PARSE_JSON(s) AS v FROM input WHERE side = 'l' UNION SELECT PARSE_JSON(s) FROM input WHERE side = 'r') ORDER BY op, t"
order = "ordered"
tags = ["null", "json-null", "nested"]

[[case]]
id = "intersect_duplicates_both_sides"
description = "INTERSECT of VARIANTs duplicated on both sides keeps one of each shared value; catches INTERSECT ALL, a UNION, or a side treated as empty."
columns = [{ name = "s", type = "VARCHAR" }, { name = "side", type = "VARCHAR" }]
rows = [
  ["'\"x\"'", "'l'"],
  ["'\"x\"'", "'l'"],
  ["'{\"a\":1,\"b\":2}'", "'l'"],
  ["'1'", "'l'"],
  ["'\"x\"'", "'r'"],
  ["'\"x\"'", "'r'"],
  ["'{\"b\":2,\"a\":1}'", "'r'"],
  ["'2'", "'r'"],
]
query = "SELECT TO_JSON(v) AS t FROM (SELECT PARSE_JSON(s) AS v FROM input WHERE side = 'l' INTERSECT SELECT PARSE_JSON(s) FROM input WHERE side = 'r') ORDER BY t"
order = "ordered"
tags = ["null", "json-null", "nested"]
