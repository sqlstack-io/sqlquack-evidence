category = "semi-structured"
construct = "fn:OBJECT_CONSTRUCT"
session_profile = "utc-v1"

[[case]]
id = "object_construct_values"
description = "OBJECT_CONSTRUCT of literals, paths, JSON null and NULL, written as JSON and typed."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"a\":1,\"b\":\"x\",\"n\":null,\"o\":{\"k\":[1,2]},\"arr\":[1,\"x\",null,{\"k\":1},[2]],\"s\":\"t\"}')"],
  ["PARSE_JSON('{\"a\":2.5,\"arr\":[],\"o\":{}}')"],
  ["PARSE_JSON('{\"A\":3,\"arr\":[null],\"b\":true}')"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('null')"],
  ["NULL"],
]
query = "SELECT TO_JSON(OBJECT_CONSTRUCT('z', 1, 'a', v:a, 'b', v:b, 'n', v:n, 'o', v:o)) AS j, TYPEOF(OBJECT_CONSTRUCT('a', v:a)) AS t FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "json-null", "missing-key", "nested"]

