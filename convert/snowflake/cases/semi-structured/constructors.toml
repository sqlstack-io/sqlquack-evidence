[[case]]
id = "array_agg_values"
description = "ARRAY_AGG within groups, ordered, skipping NULL, written as JSON."
columns = [{ name = "g", type = "VARCHAR" }, { name = "k", type = "NUMBER(38,0)" }, { name = "s", type = "VARCHAR" }]
rows = [
  ["'a'", "3", "'c'"],
  ["'a'", "1", "NULL"],
  ["'a'", "2", "'b'"],
  ["'b'", "1", "NULL"],
  ["'c'", "NULL", "'z'"],
  ["'c'", "5", "'y'"],
]
query = "SELECT g, TO_JSON(ARRAY_AGG(s) WITHIN GROUP (ORDER BY k)) AS ss, TO_JSON(ARRAY_AGG(k) WITHIN GROUP (ORDER BY k DESC)) AS ks, ARRAY_SIZE(ARRAY_AGG(s) WITHIN GROUP (ORDER BY k)) AS n FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null", "all-null"]

