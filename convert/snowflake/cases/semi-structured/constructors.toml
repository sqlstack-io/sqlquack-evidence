[[case]]
id = "object_construct_scalars"
description = "OBJECT_CONSTRUCT of typed column values: numbers, text, booleans, dates and NULL."
columns = [{ name = "n", type = "NUMBER(10,2)" }, { name = "s", type = "VARCHAR" }, { name = "b", type = "BOOLEAN" }, { name = "d", type = "DATE" }]
rows = [
  ["1.50", "'x'", "TRUE", "'2024-02-29'"],
  ["-0.00", "''", "FALSE", "NULL"],
  ["NULL", "NULL", "NULL", "'0001-01-01'"],
  ["12345678.90", "'say \"hi\"'", "TRUE", "'9999-12-31'"],
]
query = "SELECT TO_JSON(OBJECT_CONSTRUCT('n', n, 's', s, 'b', b, 'd', d)) AS j FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "empty", "boundary"]

[[case]]
id = "object_construct_number_types"
description = "OBJECT_CONSTRUCT values from integers and FLOAT, read back by TYPEOF."
columns = [{ name = "i", type = "NUMBER(38,0)" }, { name = "f", type = "FLOAT" }]
rows = [
  ["0", "0.5"],
  ["-7", "1e300"],
  ["99999999999999999999999999999999999999", "-0.0"],
  ["NULL", "NULL"],
]
query = "SELECT TYPEOF(OBJECT_CONSTRUCT('i', i):i) AS ti, TYPEOF(OBJECT_CONSTRUCT('f', f):f) AS tf, TO_JSON(OBJECT_CONSTRUCT('i', i, 'f', f)) AS j FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "boundary"]
expected_divergence = "json_fidelity"

