category = "window"
construct = "fn:NTILE"
session_profile = "utc-v1"

[[case]]
id = "ntile_uneven_buckets"
description = "NTILE(3) of seven rows per partition puts the extra rows in the first buckets, ties on x broken by y; one single-row partition."
columns = [{ name = "grp", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }, { name = "y", type = "VARCHAR" }]
rows = [
  ["'a'", "1", "'p'"],
  ["'a'", "2", "'q'"],
  ["'a'", "2", "'r'"],
  ["'a'", "4", "'s'"],
  ["'a'", "5", "'t'"],
  ["'a'", "6", "'u'"],
  ["'a'", "7", "'v'"],
  ["'b'", "1", "'w'"],
]
query = "SELECT y, NTILE(3) OVER (PARTITION BY grp ORDER BY x, y) AS bucket FROM input"
order = "bag"
tags = ["ties", "single-row-partition"]

[[case]]
id = "ntile_more_buckets_than_rows"
description = "NTILE(5) of three rows gives buckets 1 to 3; NULL keys sort as Snowflake orders them."
columns = [{ name = "x", type = "NUMBER(38,0)" }, { name = "y", type = "VARCHAR" }]
rows = [
  ["NULL", "'p'"],
  ["2", "'q'"],
  ["1", "'r'"],
]
query = "SELECT y, NTILE(5) OVER (ORDER BY x, y) AS bucket, NTILE(5) OVER (ORDER BY x DESC, y) AS bucket_desc FROM input"
order = "bag"
tags = ["null"]

[[case]]
id = "ntile_one_bucket_type"
description = "NTILE(1) is 1 for every row, and its recorded result type."
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [["1"], ["2"]]
query = "SELECT x, NTILE(1) OVER (ORDER BY x) AS bucket FROM input"
order = "bag"
tags = []
