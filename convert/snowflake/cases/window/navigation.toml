category = "window"
construct = "fn:LAG"
session_profile = "utc-v1"

[[case]]
id = "lag_lead"
description = "LAG and LEAD with and without offsets and defaults."
columns = [{ name = "grp", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }, { name = "y", type = "VARCHAR" }]
rows = [
  ["'a'", "3", "'p'"],
  ["'a'", "NULL", "'q'"],
  ["'a'", "1", "'r'"],
  ["'a'", "3", "'s'"],
  ["'b'", "5", "NULL"],
  ["'b'", "NULL", "'t'"],
  ["'c'", "7", "'u'"],
]
query = "SELECT y, LAG(x) OVER (PARTITION BY grp ORDER BY y) AS prev, LEAD(x, 1, 0) OVER (PARTITION BY grp ORDER BY y) AS nxt, LAG(y, 2) OVER (PARTITION BY grp ORDER BY y) AS prev2 FROM input"
order = "bag"
tags = ["null", "ties", "single-row-partition"]

[[case]]
id = "first_last_value"
description = "FIRST_VALUE and LAST_VALUE over a whole partition."
columns = [{ name = "grp", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }, { name = "y", type = "VARCHAR" }]
rows = [
  ["'a'", "3", "'p'"],
  ["'a'", "NULL", "'q'"],
  ["'a'", "1", "'r'"],
  ["'a'", "3", "'s'"],
  ["'b'", "5", "NULL"],
  ["'b'", "NULL", "'t'"],
  ["'c'", "7", "'u'"],
]
query = "SELECT y, FIRST_VALUE(x) OVER (PARTITION BY grp ORDER BY y ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS f, LAST_VALUE(x) OVER (PARTITION BY grp ORDER BY y ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS l FROM input"
order = "bag"
tags = ["null", "ties", "single-row-partition"]

