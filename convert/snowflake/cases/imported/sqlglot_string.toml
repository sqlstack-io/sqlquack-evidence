[[case]]
id = "split_part_middle"
description = "SPLIT_PART picks the second part."
columns = []
rows = [[]]
expression = "SPLIT_PART('11.22.33', '.', 2)"
tags = ["third-party"]
origin = "sqlglot: tests/dialects/test_snowflake.py"
sqlglot_duckdb = "SELECT CASE WHEN '.' = '' THEN (CASE WHEN (CASE WHEN 2 = 0 THEN 1 ELSE 2 END) = 1 OR (CASE WHEN 2 = 0 THEN 1 ELSE 2 END) = -1 THEN '11.22.33' ELSE '' END) ELSE SPLIT_PART('11.22.33', '.', (CASE WHEN 2 = 0 THEN 1 ELSE 2 END)) END"

