[[case]]
id = "charindex_negative_start"
description = "CHARINDEX with a negative start position."
columns = []
rows = [[]]
expression = "CHARINDEX('sub', 'testsubstring', -1)"
tags = ["third-party"]
origin = "sqlglot: tests/dialects/test_snowflake.py"
sqlglot_duckdb = "SELECT CASE WHEN STRPOS(SUBSTRING('testsubstring', CASE WHEN -1 <= 0 THEN 1 ELSE -1 END), 'sub') = 0 THEN 0 ELSE STRPOS(SUBSTRING('testsubstring', CASE WHEN -1 <= 0 THEN 1 ELSE -1 END), 'sub') + CASE WHEN -1 <= 0 THEN 1 ELSE -1 END - 1 END"

[[case]]
id = "charindex_column_start"
description = "CHARINDEX with start positions from a column."
columns = [{ name = "p", type = "NUMBER(38,0)" }]
rows = [
  ["-1"],
  ["0"],
  ["1"],
  ["5"],
  ["6"],
  ["100"],
  ["NULL"],
]
expression = "CHARINDEX('sub', 'testsubstring', p)"
tags = ["third-party"]
origin = "sqlglot: tests/dialects/test_snowflake.py"
sqlglot_duckdb = "SELECT CASE WHEN STRPOS(SUBSTRING('testsubstring', CASE WHEN p <= 0 THEN 1 ELSE p END), 'sub') = 0 THEN 0 ELSE STRPOS(SUBSTRING('testsubstring', CASE WHEN p <= 0 THEN 1 ELSE p END), 'sub') + CASE WHEN p <= 0 THEN 1 ELSE p END - 1 END"
