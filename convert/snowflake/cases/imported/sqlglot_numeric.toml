category = "imported"
construct = "fn:ROUND"
session_profile = "utc-v1"

[[case]]
id = "square"
description = "SQUARE of a NUMBER."
columns = [{ name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["1.5"],
  ["-2"],
  ["0"],
  ["NULL"],
]
expression = "SQUARE(x)"
tags = ["third-party"]
origin = "sqlglot: tests/dialects/test_snowflake.py"
sqlglot_duckdb = "POWER(x, 2)"

