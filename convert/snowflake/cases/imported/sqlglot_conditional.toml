[[case]]
id = "div0_constants"
description = "DIV0 and DIV0NULL of constants, a zero divisor among them."
columns = [{ name = "n", type = "NUMBER(10,2)" }]
rows = [["4"], ["NULL"]]
query = "SELECT DIV0(1, 0) AS a, DIV0NULL(5, 0) AS b, DIV0(n, 0) AS c, DIV0(n, 2) AS d, DIV0NULL(n, NULL) AS e FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "zero"]
