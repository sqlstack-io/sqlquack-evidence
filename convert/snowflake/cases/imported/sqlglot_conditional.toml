[[case]]
id = "decode_pairs"
description = "DECODE matches NULL search values and falls back to the default."
columns = [{ name = "x", type = "NUMBER(38,0)" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }, { name = "c", type = "NUMBER(38,0)" }, { name = "d", type = "VARCHAR" }, { name = "e", type = "VARCHAR" }]
rows = [
  ["1", "1", "'one'", "2", "'two'", "'other'"],
  ["2", "1", "'one'", "2", "'two'", "'other'"],
  ["3", "1", "'one'", "2", "'two'", "'other'"],
  ["NULL", "NULL", "'null'", "2", "'two'", "'other'"],
  ["NULL", "1", "'one'", "2", "'two'", "NULL"],
]
expression = "DECODE(x, a, b, c, d, e)"
tags = ["third-party"]
origin = "sqlglot: tests/dialects/test_snowflake.py"
sqlglot_duckdb = "CASE WHEN x = a OR (x IS NULL AND a IS NULL) THEN b WHEN x = c OR (x IS NULL AND c IS NULL) THEN d ELSE e END"

[[case]]
id = "decode_true"
description = "DECODE on TRUE against a comparison."
columns = [{ name = "b", type = "VARCHAR" }]
rows = [
  ["'value'"],
  ["'other'"],
  ["NULL"],
  ["'value'"],
]
query = "SELECT DECODE(TRUE, a.b = 'value', 'value') AS value FROM input AS a"
order = "bag"
tags = ["third-party"]
origin = "sqlglot: tests/dialects/test_snowflake.py"
sqlglot_duckdb = "CASE WHEN TRUE = (a.b = 'value') OR (TRUE IS NULL AND (a.b = 'value') IS NULL) THEN 'value' END"

[[case]]
id = "equal_null"
description = "EQUAL_NULL treats two NULLs as equal."
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["1", "1"],
  ["1", "2"],
  ["NULL", "1"],
  ["NULL", "NULL"],
]
expression = "EQUAL_NULL(a, b)"
tags = ["third-party"]
origin = "sqlglot: tests/dialects/test_snowflake.py"
sqlglot_duckdb = "a IS NOT DISTINCT FROM b"

