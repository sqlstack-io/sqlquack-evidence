category = "semi-structured"
construct = "fn:FLATTEN"
session_profile = "utc-v1"
evidence = "typing"

[[case]]
id = "flatten_types"
description = "FLATTEN output columns over arrays, objects, JSON null, missing and case-differing paths: their types."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"o\":{\"a\":1,\"b\":[1,2]},\"x\":\"s\",\"items\":[1,\"x\",null]}')"],
  ["PARSE_JSON('{\"o\":{\"A\":1,\"a\":2},\"x\":null,\"items\":[]}')"],
  ["PARSE_JSON('{\"o\":{\"n\":{\"m\":[{\"k\":1}]}},\"x\":[[1],[2]],\"items\":[[1,2],{\"k\":1}]}')"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('null')"],
  ["NULL"],
]
query = "SELECT i.ordinal, f.seq, f.key, f.path, f.index, f.value, f.this FROM input i, LATERAL FLATTEN(input => i.v:items, outer => TRUE) f ORDER BY i.ordinal, f.index"
order = "ordered"
tags = ["null", "json-null", "missing-key", "nested", "array-index", "case-sensitive-key"]
values = false
