# BETWEEN mixing FLOAT and NUMBER near a double's precision, against the >= and <= pair it abbreviates.
category = "comparison"
construct = "node:between"
session_profile = "utc-v1"

[[case]]
id = "between_float_integer_bounds_past_2p53"
description = "A FLOAT between NUMBER(20,0) bounds past 2^53, where a bound rounded to a double ties onto the value."
columns = [{ name = "x", type = "FLOAT" }, { name = "lo", type = "NUMBER(20,0)" }, { name = "hi", type = "NUMBER(20,0)" }]
rows = [
  ["9007199254740992", "9007199254740993", "9007199254740993"],
  ["9007199254740992", "9007199254740993", "9007199254740995"],
  ["9007199254740996", "9007199254740995", "9007199254740995"],
  ["9007199254740994", "9007199254740993", "9007199254740993"],
  ["18014398509481984", "18014398509481986", "18014398509481986"],
  ["18014398509481992", "18014398509481990", "18014398509481990"],
  ["9007199254740992", "9007199254740991", "9007199254740991"],
  ["NULL", "9007199254740993", "9007199254740993"],
  ["9007199254740992", "NULL", "9007199254740993"],
]
query = "SELECT x BETWEEN lo AND hi AS b, x >= lo AND x <= hi AS p, x = lo AS e_lo, x = hi AS e_hi FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "ties", "mixed-types", "boundary"]

