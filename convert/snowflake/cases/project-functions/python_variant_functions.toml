[[case.function]]
name = "date_box"
language = "python"
handler = "box"
runtime_version = "3.12"
arguments = [{ name = "text", type = "VARCHAR" }]
returns = "VARIANT"
body = '''
import datetime

def box(text):
    day = datetime.date.fromisoformat(text)
    return {"d": day, "t": datetime.datetime(day.year, day.month, day.day, 12, 30, 15, 250000)}
'''

