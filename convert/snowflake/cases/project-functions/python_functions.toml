[[case.function]]
name = "argument_kinds"
language = "python"
handler = "kinds"
runtime_version = "3.12"
arguments = [{ name = "qty", type = "NUMBER(10,0)" }, { name = "price", type = "NUMBER(10,2)" }, { name = "ratio", type = "FLOAT" }, { name = "flag", type = "BOOLEAN" }]
returns = "VARCHAR"
body = '''
def kinds(qty, price, ratio, flag):
    return "|".join(f"{type(value).__name__}:{value}" for value in (qty, price, ratio, flag))
'''

