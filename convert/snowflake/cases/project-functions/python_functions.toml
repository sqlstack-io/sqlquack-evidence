runtime_version = "3.12"
arguments = [{ name = "qty", type = "NUMBER(10,0)" }]
returns = "NUMBER(38,0)"
body = '''
def triple(qty):
    if qty is None:
        return None
    if qty == 9:
        return 10**38 - 1
    return qty * 3
'''

