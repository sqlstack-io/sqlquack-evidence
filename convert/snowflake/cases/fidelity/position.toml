category = "string"
construct = "node:str_position"
session_profile = "utc-v1"
equivalence = "position_to_charindex"

[[case]]
id = "position_comma"
description = "POSITION(needle, haystack) with NULL, empty, whitespace, non-ASCII and absent needles."
columns = [{ name = "needle", type = "VARCHAR" }, { name = "haystack", type = "VARCHAR" }]
rows = [
  ["'b'", "'abcb'"],
  ["'z'", "'abc'"],
  ["''", "'abc'"],
  ["' '", "'a b'"],
  ["'é'", "'caféé'"],
  ["NULL", "'abc'"],
  ["'a'", "NULL"],
  ["''", "''"],
]
expression = "POSITION(needle, haystack)"
canonical = "CHARINDEX(needle, haystack)"
tags = ["null", "empty", "whitespace", "unicode"]

[[case]]
id = "position_in"
description = "POSITION(needle IN haystack)."
columns = [{ name = "needle", type = "VARCHAR" }, { name = "haystack", type = "VARCHAR" }]
rows = [["'b'", "'abcb'"], ["''", "'abc'"], ["NULL", "'abc'"]]
expression = "POSITION(needle IN haystack)"
canonical = "CHARINDEX(needle, haystack)"
tags = ["null", "empty"]

[[case]]
id = "position_from"
compile_error = true
description = "POSITION with a start position, including zero, negative and past-the-end starts."
columns = [{ name = "needle", type = "VARCHAR" }, { name = "haystack", type = "VARCHAR" }, { name = "start", type = "NUMBER(38,0)" }]
rows = [
  ["'b'", "'abcb'", "3"],
  ["'b'", "'abcb'", "1"],
  ["'b'", "'abcb'", "0"],
  ["'b'", "'abcb'", "-1"],
  ["'b'", "'abcb'", "9"],
  ["'b'", "'abcb'", "NULL"],
]
expression = "POSITION(needle, haystack, start)"
canonical = "CHARINDEX(needle, haystack, start)"
tags = ["null"]
