category = "temporal"
construct = "fn:YEAR"
session_profile = "utc-v1"
equivalence = "part_functions_to_date_part"

[[case]]
id = "year_of_timestamps"
description = "YEAR(t) of naive timestamps is DATE_PART(YEAR, t), around year ends and the epoch."
columns = [{ name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123456789'"],
  ["'2024-01-01 00:00:00'"],
  ["'2023-12-31 23:59:59.999999999'"],
  ["'1969-12-31 23:59:59.5'"],
  ["'2021-01-03 12:00:00'"],
  ["NULL"],
]
expression = "YEAR(t)"
canonical = "DATE_PART(YEAR, t)"
tags = ["null", "boundary"]

[[case]]
id = "year_of_dates"
description = "YEAR(d) of dates is DATE_PART(YEAR, d), including a leap day and year one."
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["'2024-02-29'"],
  ["'2024-01-01'"],
  ["'2023-12-31'"],
  ["'1969-12-31'"],
  ["'0001-01-01'"],
  ["NULL"],
]
expression = "YEAR(d)"
canonical = "DATE_PART(YEAR, d)"
tags = ["null", "boundary"]

