category = "temporal"
construct = "fn:TIMESTAMPDIFF"
session_profile = "utc-v1"
equivalence = "timestampdiff_to_datediff"

[[case]]
id = "timestampdiff_timestamp_units"
description = "TIMESTAMPDIFF counts unit boundaries between naive timestamps, as DATEDIFF does."
columns = [{ name = "a", type = "TIMESTAMP_NTZ(9)" }, { name = "b", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-01-31 23:59:59'", "'2024-02-01 00:00:01'"],
  ["'2023-12-31 23:00:00'", "'2024-01-01 01:00:00'"],
  ["'2024-02-29 12:00:00'", "'2024-02-28 13:00:00'"],
  ["NULL", "'2024-01-01 00:00:00'"],
  ["'2024-01-01 00:00:00.999999999'", "'2024-01-01 00:00:01.000000001'"],
]
expression = "TIMESTAMPDIFF(DAY, a, b)::VARCHAR || '|' || TIMESTAMPDIFF(MONTH, a, b)::VARCHAR || '|' || TIMESTAMPDIFF(HOUR, a, b)::VARCHAR || '|' || TIMESTAMPDIFF(YEAR, a, b)::VARCHAR"
canonical = "DATEDIFF(DAY, a, b)::VARCHAR || '|' || DATEDIFF(MONTH, a, b)::VARCHAR || '|' || DATEDIFF(HOUR, a, b)::VARCHAR || '|' || DATEDIFF(YEAR, a, b)::VARCHAR"
tags = ["null", "boundary"]

[[case]]
id = "timestampdiff_seconds"
description = "TIMESTAMPDIFF in seconds and milliseconds across fractions and the epoch."
columns = [{ name = "a", type = "TIMESTAMP_NTZ(9)" }, { name = "b", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-01-01 00:00:00.999'", "'2024-01-01 00:00:01.001'"],
  ["'2024-01-01 00:00:01.5'", "'2024-01-01 00:00:00.5'"],
  ["'1969-12-31 23:59:59.9'", "'1970-01-01 00:00:00.1'"],
  ["NULL", "NULL"],
]
expression = "TIMESTAMPDIFF(SECOND, a, b)::VARCHAR || '|' || TIMESTAMPDIFF(MILLISECOND, a, b)::VARCHAR"
canonical = "DATEDIFF(SECOND, a, b)::VARCHAR || '|' || DATEDIFF(MILLISECOND, a, b)::VARCHAR"
tags = ["null", "boundary"]

[[case]]
id = "timestampdiff_dates"
description = "TIMESTAMPDIFF between dates, over month ends and leap days, and the result type."
columns = [{ name = "a", type = "DATE" }, { name = "b", type = "DATE" }]
rows = [
  ["'2024-01-31'", "'2024-02-01'"],
  ["'2024-02-29'", "'2025-02-28'"],
  ["'2024-03-01'", "'2023-03-01'"],
  ["'2024-01-01'", "NULL"],
]
expression = "TIMESTAMPDIFF(DAY, a, b)"
canonical = "DATEDIFF(DAY, a, b)"
tags = ["null", "boundary"]

[[case]]
id = "timestampdiff_quoted_units"
description = "TIMESTAMPDIFF with its unit written as a quoted string, as DATEDIFF reads it."
columns = [{ name = "a", type = "TIMESTAMP_NTZ(9)" }, { name = "b", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-01-31 23:59:59'", "'2024-02-01 00:00:01'"],
  ["'2024-02-29 12:00:30'", "'2024-02-28 13:59:00'"],
  ["NULL", "'2024-01-01 00:00:00'"],
]
expression = "TIMESTAMPDIFF('minute', a, b)::VARCHAR || '|' || TIMESTAMPDIFF('HOUR', a, b)::VARCHAR || '|' || TIMESTAMPDIFF('Day', a, b)::VARCHAR"
canonical = "DATEDIFF(MINUTE, a, b)::VARCHAR || '|' || DATEDIFF(HOUR, a, b)::VARCHAR || '|' || DATEDIFF(DAY, a, b)::VARCHAR"
tags = ["null", "boundary"]
