category = "temporal"
construct = "fn:DATEADD"
session_profile = "utc-v1"

[[case]]
id = "dateadd_subquery_lookback"
description = "An incremental lookback: the rows within three days of the latest, through DATEADD of a scalar subquery."
columns = [{ name = "k", type = "NUMBER(38,0)" }, { name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["1", "'2026-01-10 00:00:00.123456789'"],
  ["2", "'2026-01-02 00:00:00'"],
  ["3", "'2026-01-07 00:00:00.123456789'"],
  ["4", "'2026-01-07 00:00:00.123456788'"],
  ["5", "NULL"],
]
query = "SELECT k FROM input WHERE t >= DATEADD(DAY, -3, (SELECT MAX(t) FROM input)) ORDER BY k"
order = "ordered"
tags = ["null", "boundary"]

[[case]]
id = "dateadd_subquery_nested"
description = "DATEADD of DATEADD of a scalar subquery keeps the nanoseconds of the latest row."
columns = [{ name = "k", type = "NUMBER(38,0)" }, { name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["1", "'2026-01-10 00:00:00.123456789'"],
  ["2", "'2026-01-02 00:00:00'"],
  ["3", "NULL"],
]
query = "SELECT k, DATEADD(HOUR, 37, DATEADD(DAY, -3, (SELECT MAX(t) FROM input))) AS cutoff FROM input ORDER BY k"
order = "ordered"
tags = ["null", "boundary"]
