category = "temporal"
construct = "fn:LAST_DAY"
session_profile = "utc-v1"

[[case]]
id = "last_day_of_dates"
description = "LAST_DAY of dates: leap and common Februaries, December, a month's last day itself, and year one."
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["'2024-02-10'"],
  ["'2023-02-28'"],
  ["'2023-12-01'"],
  ["'2024-04-30'"],
  ["'0001-01-15'"],
  ["NULL"],
]
expression = "LAST_DAY(d)"
tags = ["null", "boundary"]

[[case]]
id = "last_day_month_unit"
description = "LAST_DAY with the MONTH unit written as a keyword and as quoted text."
columns = [{ name = "d", type = "DATE" }]
rows = [["'2024-02-10'"], ["'2024-12-31'"], ["NULL"]]
expression = "LAST_DAY(d, month)::VARCHAR || '|' || LAST_DAY(d, 'month')::VARCHAR"
tags = ["null"]

[[case]]
id = "last_day_of_timestamps"
description = "LAST_DAY of naive timestamps is a DATE, also just before midnight at a month's end."
columns = [{ name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-01-31 23:59:59.999999999'"],
  ["'2024-02-01 00:00:00'"],
  ["NULL"],
]
expression = "LAST_DAY(t)"
tags = ["null", "boundary"]
