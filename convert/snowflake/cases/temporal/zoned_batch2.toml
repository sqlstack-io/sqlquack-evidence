# DATE_PART, TO_DATE and CONVERT_TIMEZONE over zoned values and zone columns.
category = "temporal"
construct = "fn:DATE_PART"
session_profile = "utc-v1"

[[case]]
id = "date_part_tz_epoch_second"
description = "DATE_PART('epoch_second') of TIMESTAMP_TZ values at several offsets."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'2024-03-10 02:30:00 -05:00'"],
  ["'2024-06-01 12:00:00.5 +05:30'"],
  ["'2024-12-31 23:59:59.999 -08:00'"],
  ["'2024-01-01 00:30:00 +14:00'"],
  ["'1970-01-01 00:00:00 +00:00'"],
  ["NULL"],
]
expression = "DATE_PART('epoch_second', t)"
tags = ["null", "boundary"]

