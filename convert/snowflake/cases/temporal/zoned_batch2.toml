[[case]]
id = "convert_timezone_source_column"
description = "CONVERT_TIMEZONE from a zone column to UTC, across DST changes."
columns = [{ name = "z", type = "VARCHAR" }, { name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'Europe/Paris'", "'2024-03-31 01:30:00'"],
  ["'America/New_York'", "'2024-11-03 01:30:00'"],
  ["'UTC'", "'2024-02-29 12:00:00'"],
  ["'Asia/Kolkata'", "'2024-02-29 12:00:00'"],
  ["NULL", "'2024-02-29 12:00:00'"],
  ["'Europe/Paris'", "NULL"],
]
expression = "CONVERT_TIMEZONE(z, 'UTC', t)"
tags = ["null", "boundary"]

[[case]]
id = "convert_timezone_target_column"
description = "CONVERT_TIMEZONE from UTC to a zone column."
columns = [{ name = "z", type = "VARCHAR" }, { name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'Europe/Paris'", "'2024-03-31 01:30:00'"],
  ["'America/New_York'", "'2024-11-03 01:30:00'"],
  ["'UTC'", "'2024-02-29 12:00:00'"],
  ["'Asia/Kolkata'", "'2024-02-29 12:00:00'"],
  ["NULL", "'2024-02-29 12:00:00'"],
  ["'Europe/Paris'", "NULL"],
]
expression = "CONVERT_TIMEZONE('UTC', z, t)"
tags = ["null", "boundary"]

[[case]]
id = "convert_timezone_source_coalesce"
description = "CONVERT_TIMEZONE from COALESCE(zone, a default)."
columns = [{ name = "z", type = "VARCHAR" }, { name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'Europe/Paris'", "'2024-03-31 01:30:00'"],
  ["'America/New_York'", "'2024-11-03 01:30:00'"],
  ["'UTC'", "'2024-02-29 12:00:00'"],
  ["'Asia/Kolkata'", "'2024-02-29 12:00:00'"],
  ["NULL", "'2024-02-29 12:00:00'"],
  ["'Europe/Paris'", "NULL"],
]
expression = "CONVERT_TIMEZONE(COALESCE(z, 'Europe/London'), 'UTC', t)"
tags = ["null", "boundary"]

[[case]]
id = "convert_timezone_two_column"
description = "Two-argument CONVERT_TIMEZONE to a zone column of a TIMESTAMP_TZ."
columns = [{ name = "z", type = "VARCHAR" }, { name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'Europe/Paris'", "'2024-03-31 01:30:00 +00:00'"],
  ["'America/New_York'", "'2024-11-03 05:30:00 +00:00'"],
  ["NULL", "'2024-02-29 12:00:00 +00:00'"],
]
expression = "CONVERT_TIMEZONE(z, t)"
tags = ["null", "boundary"]

[[case]]
id = "convert_timezone_bad_zone"
description = "CONVERT_TIMEZONE from an unknown zone column raises."
columns = [{ name = "z", type = "VARCHAR" }, { name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'Not/AZone'", "'2024-02-29 12:00:00'"],
]
expression = "CONVERT_TIMEZONE(z, 'UTC', t)"
tags = ["boundary"]
