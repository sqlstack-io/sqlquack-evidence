# Every time zone name in the pinned DuckDB's pg_timezone_names(), plus aliases and the
# project's names: whether Snowflake accepts it, and CONVERT_TIMEZONE from UTC at a winter, a
# summer and a 1970s instant and just after recent US, EU and Australian DST changes.
category = "temporal"
construct = "fn:CONVERT_TIMEZONE"
session_profile = "utc-v1"

[[case]]
id = "zone_name_act"
description = "CONVERT_TIMEZONE from UTC to ACT at six instants."
columns = [{ name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2026-01-15 12:00:00'"],
  ["'2026-07-15 12:00:00'"],
  ["'1975-06-15 12:00:00'"],
  ["'2026-03-08 07:30:00'"],
  ["'2026-03-29 01:30:00'"],
  ["'2026-04-05 16:30:00'"],
  ["NULL"],
]
query = "SELECT t, CONVERT_TIMEZONE('UTC', 'ACT', t) AS c FROM input ORDER BY t NULLS LAST"
order = "ordered"
tags = ["null", "boundary"]

