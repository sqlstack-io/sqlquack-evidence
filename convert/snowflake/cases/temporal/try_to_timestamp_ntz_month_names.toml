category = "temporal"
construct = "fn:TRY_TO_TIMESTAMP_NTZ"
session_profile = "utc-v1"

[[case]]
id = "try_ntz_format_dd_mon_yy_hh24mi"
description = "TRY_TO_TIMESTAMP_NTZ(x, 'DD-MON-YY HH24:MI'): month names in any case, two-digit years either side of the century start, and near misses."
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'05-Mar-24 14:30'"],
  ["'05-MAR-24 14:30'"],
  ["'05-mar-69 00:00'"],
  ["'31-Dec-70 23:59'"],
  ["'29-Feb-23 10:00'"],
  ["'5-Mar-24 14:30'"],
  ["'05-March-24 14:30'"],
  ["'05-Mar-2024 14:30'"],
  ["'05-Mar-24 24:00'"],
  ["''"],
  ["NULL"],
]
expression = "TRY_TO_TIMESTAMP_NTZ(x, 'DD-MON-YY HH24:MI')"
tags = ["null", "boundary"]

[[case]]
id = "try_ntz_format_dd_mon_yy_hh24mi_other_spellings"
description = "TRY_TO_TIMESTAMP_NTZ(x, 'DD-MON-YY HH24:MI') of text spelled in other layouts, as callback feeds mix them: ISO dates and timestamps, a T and Z, an offset, padding, fractions, an hour 24 and epoch digits."
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'2026-03-01T10:15:00Z'"],
  ["'2026-03-01 10:00:00 +05:45'"],
  ["'2026-03-01 23:59:59.9999995'"],
  ["'2026-03-01 24:00:00'"],
  ["'  2026-3-1 7:5:0  '"],
  ["'2026-01-31'"],
  ["'1772359200000'"],
  ["'01-MAR-26 10:15:30'"],
  ["'01-MAR-26'"],
  ["' 01-MAR-26 10:15 '"],
  ["'01 MAR 26 10:15'"],
]
expression = "TRY_TO_TIMESTAMP_NTZ(x, 'DD-MON-YY HH24:MI')"
tags = ["boundary", "whitespace"]
