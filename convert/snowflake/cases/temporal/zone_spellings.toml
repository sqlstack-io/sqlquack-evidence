# Which time zone spellings Snowflake accepts: each alone, two-argument, and as the target and
# the source of the three-argument form.
category = "temporal"
construct = "fn:CONVERT_TIMEZONE"
session_profile = "utc-v1"

[[case]]
id = "zone_spelling_two_args_utc_upper"
description = "Two-argument CONVERT_TIMEZONE to 'UTC' of a TIMESTAMP_TZ."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'2024-07-01 12:00:00 +00:00'"],
  ["NULL"],
]
query = "SELECT CONVERT_TIMEZONE('UTC', t)::VARCHAR AS c FROM input ORDER BY c NULLS LAST"
order = "ordered"
tags = ["boundary", "null"]

[[case]]
id = "zone_spelling_target_utc_upper"
