[[case]]
id = "try_tz_invalid"
description = "TRY_TO_TIMESTAMP_TZ: Text that is not a timestamp, impossible values and bad offsets."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'not a date'"],
  ["'2024-02-30T10:00:00Z'"],
  ["'2024-02-29T25:00:00Z'"],
  ["'2024-02-29T13:45:01+25:00'"],
  ["'2024-02-29T13:45:01 UTC'"],
  ["'2024-02-29T13:45:01+2'"],
]
expression = "TRY_TO_TIMESTAMP_TZ(s)"
tags = ["boundary"]
expected_divergence = "date_text_spelling"

