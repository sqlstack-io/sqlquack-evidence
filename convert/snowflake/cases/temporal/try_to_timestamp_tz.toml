[[case]]
id = "try_tz_of_variant_text"
description = "TRY_TO_TIMESTAMP_TZ of a JSON string read as text, JSON null and a missing key."
columns = [{ name = "v", type = "VARIANT" }]
rows = [
  ["PARSE_JSON('{\"t\":\"2024-02-29T13:45:01.5+02:00\"}')"],
  ["PARSE_JSON('{\"t\":\"2024-02-29T13:45:01Z\"}')"],
  ["PARSE_JSON('{\"t\":null}')"],
  ["PARSE_JSON('{}')"],
  ["PARSE_JSON('{\"t\":17}')"],
  ["NULL"],
]
expression = "TRY_TO_TIMESTAMP_TZ(v:t::VARCHAR)"
tags = ["null", "boundary"]
