# TRY_TO_TIMESTAMP_TZ of text, as models use it: without a format.
category = "temporal"
construct = "fn:TRY_TO_TIMESTAMP_TZ"
session_profile = "utc-v1"

[[case]]
id = "try_tz_zulu"
description = "TRY_TO_TIMESTAMP_TZ: ISO times ending in Z."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'2024-02-29T13:45:01Z'"],
  ["'2024-02-29T13:45:01.123Z'"],
  ["'2024-02-29T13:45:01.123456789Z'"],
  ["'2024-02-29T00:00:00z'"],
  ["NULL"],
]
expression = "TRY_TO_TIMESTAMP_TZ(s)"
tags = ["null", "boundary"]
expected_divergence = "timestamp_tz_submicro"

[[case]]
id = "try_tz_zulu_utc"
description = "CONVERT_TIMEZONE('UTC', TRY_TO_TIMESTAMP_TZ(s)) as TIMESTAMP_NTZ: ISO times ending in Z."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'2024-02-29T13:45:01Z'"],
  ["'2024-02-29T13:45:01.123Z'"],
  ["'2024-02-29T13:45:01.123456789Z'"],
  ["'2024-02-29T00:00:00z'"],
  ["NULL"],
]
expression = "CONVERT_TIMEZONE('UTC', TRY_TO_TIMESTAMP_TZ(s))::TIMESTAMP_NTZ"
tags = ["null", "boundary"]
expected_divergence = "timestamp_tz_submicro"

