# TRY_TO_TIMESTAMP_NTZ of text, without and with the formats models use.
category = "temporal"
construct = "fn:TRY_TO_TIMESTAMP_NTZ"
session_profile = "utc-v1"

[[case]]
id = "try_ntz_iso_basic"
description = "TRY_TO_TIMESTAMP_NTZ without a format: ISO dates and times with a space or T, with and without seconds."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'2024-02-29 13:45:01'"],
  ["'2024-02-29T13:45:01'"],
  ["'2024-02-29 13:45'"],
  ["'2024-02-29T13:45'"],
  ["'2024-02-29'"],
  ["NULL"],
]
expression = "TRY_TO_TIMESTAMP_NTZ(s)"
tags = ["null", "boundary"]

[[case]]
id = "try_ntz_iso_fraction"
description = "TRY_TO_TIMESTAMP_NTZ without a format: ISO times with one to nine fractional digits."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'2024-02-29 13:45:01.5'"],
  ["'2024-02-29 13:45:01.123'"],
  ["'2024-02-29T13:45:01.123456'"],
  ["'2024-02-29T13:45:01.123456789'"],
  ["'2024-02-29 13:45:01.1234567891'"],
  ["NULL"],
]
expression = "TRY_TO_TIMESTAMP_NTZ(s)"
tags = ["null", "boundary"]

[[case]]
id = "try_ntz_iso_zone"
description = "TRY_TO_TIMESTAMP_NTZ without a format: ISO times with Z and numeric offsets, which TIMESTAMP_NTZ drops."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'2024-02-29T13:45:01Z'"],
  ["'2024-02-29T13:45:01.123Z'"],
  ["'2024-02-29T13:45:01+02:00'"],
  ["'2024-02-29T13:45:01-05:30'"],
  ["'2024-02-29 13:45:01 +0200'"],
  ["'2024-02-29T13:45:01+0000'"],
  ["NULL"],
]
expression = "TRY_TO_TIMESTAMP_NTZ(s)"
tags = ["null", "boundary"]

[[case]]
id = "try_ntz_iso_case"
description = "TRY_TO_TIMESTAMP_NTZ without a format: Lower-case t and z separators."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'2024-02-29t13:45:01'"],
  ["'2024-02-29T13:45:01z'"],
  ["'2024-02-29t13:45:01.5z'"],
  ["NULL"],
]
expression = "TRY_TO_TIMESTAMP_NTZ(s)"
tags = ["null", "boundary"]

[[case]]
id = "try_ntz_spaces"
description = "TRY_TO_TIMESTAMP_NTZ without a format: Leading and trailing spaces, tabs and line feeds around ISO text."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["' 2024-02-29 13:45:01'"],
  ["'2024-02-29 13:45:01 '"],
  ["'\t2024-02-29\n'"],
  ["'2024-02-29  13:45:01'"],
  ["NULL"],
]
expression = "TRY_TO_TIMESTAMP_NTZ(s)"
tags = ["null", "boundary"]
expected_divergence = "date_text_spelling"

