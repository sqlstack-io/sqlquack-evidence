category = "temporal"
construct = "node:cast"
session_profile = "utc-v1"

[[case]]
id = "ntz9_values_in_range"
description = "Nanosecond naive timestamps inside DuckDB's nanosecond range."
columns = [{ name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123456789'"],
  ["'1970-01-01 00:00:00'"],
  ["'1969-12-31 23:59:59.999999999'"],
  ["'1677-09-22 00:00:00.000000001'"],
  ["'2262-04-10 23:59:59.999999999'"],
  ["NULL"],
]
expression = "t"
tags = ["null", "boundary"]

[[case]]
id = "tz9_microsecond_values"
description = "Zoned timestamps of precision 9 whose values stop at microseconds."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123456 +02:00'"],
  ["'2024-02-29 13:45:01.5 -05:30'"],
  ["'2024-02-29 00:00:00 +00:00'"],
  ["'1969-12-31 23:59:59.999999 +00:00'"],
  ["NULL"],
]
expression = "t"
tags = ["null", "boundary"]

[[case]]
id = "ltz9_microsecond_values"
description = "Local-zone timestamps of precision 9 whose values stop at microseconds."
columns = [{ name = "t", type = "TIMESTAMP_LTZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123456 +02:00'"],
  ["'2024-02-29 13:45:01.5 -05:30'"],
  ["'2024-02-29 00:00:00 +00:00'"],
  ["'1969-12-31 23:59:59.999999 +00:00'"],
  ["NULL"],
]
expression = "t"
tags = ["null", "boundary"]

[[case]]
id = "tz9_min_max_microseconds"
description = "MIN and MAX of zoned timestamps compare instants across offsets."
columns = [{ name = "t", type = "TIMESTAMP_TZ(9)" }]
rows = [
  ["'2024-01-01 10:00:00 +00:00'"],
  ["'2024-01-01 11:30:00 +02:00'"],
  ["'2024-01-01 09:00:00.000001 +00:00'"],
  ["NULL"],
]
query = "SELECT MIN(t) AS lo, MAX(t) AS hi FROM input"
order = "ordered"
tags = ["null", "boundary"]

[[case]]
id = "ntz9_to_tz_microseconds"
description = "Naive nanosecond timestamps without sub-microsecond digits cast to TIMESTAMP_TZ."
columns = [{ name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123456'"],
  ["'1969-12-31 23:59:59.999999'"],
  ["NULL"],
]
expression = "CAST(t AS TIMESTAMP_TZ)"
tags = ["null", "boundary"]

[[case]]
id = "ntz9_to_tz6"
