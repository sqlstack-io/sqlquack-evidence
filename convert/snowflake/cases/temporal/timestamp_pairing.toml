[[case]]
id = "tz_ltz_comparison"
description = "Zoned and local-zone timestamps compare as instants."
columns = [{ name = "a", type = "TIMESTAMP_TZ(9)" }, { name = "b", type = "TIMESTAMP_LTZ(9)" }]
rows = [
  ["'2024-01-01 12:00:00 +02:00'", "'2024-01-01 10:00:00 +00:00'"],
  ["'2024-01-01 12:00:00 +00:00'", "'2024-01-01 12:00:00.000001 +00:00'"],
  ["NULL", "'2024-01-01 00:00:00 +00:00'"],
]
expression = "a = b"
tags = ["null", "boundary"]

[[case]]
id = "ntz3_max_by_group"
description = "MAX of millisecond timestamps per group."
columns = [{ name = "g", type = "VARCHAR" }, { name = "t", type = "TIMESTAMP_NTZ(3)" }]
rows = [
  ["'a'", "'2024-01-01 00:00:00.001'"],
  ["'a'", "'2024-01-01 00:00:00.002'"],
  ["'b'", "NULL"],
  ["'c'", "'1969-12-31 23:59:59.999'"],
  ["'c'", "'1969-12-31 23:59:59.998'"],
]
query = "SELECT g, MAX(t) AS latest FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null", "boundary"]
