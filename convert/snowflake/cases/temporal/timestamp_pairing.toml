rows = [
  ["'0001-01-01 00:00:00'"],
]
expression = "CAST(t AS TIMESTAMP_NTZ(9))"
tags = ["boundary"]
expected_divergence = "timestamp_range"

[[case]]
id = "ntz6_to_date"
