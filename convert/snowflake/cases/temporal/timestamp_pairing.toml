  ["'1969-12-31 23:59:59.9999995'"],
  ["'2024-02-29 23:59:59.999999999'"],
  ["NULL"],
]
expression = "CAST(t AS TIMESTAMP_TZ(6))"
tags = ["null", "boundary"]

