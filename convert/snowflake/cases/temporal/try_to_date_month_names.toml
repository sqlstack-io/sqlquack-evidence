category = "temporal"
construct = "fn:TRY_TO_DATE"
session_profile = "utc-v1"

[[case]]
id = "try_to_date_dd_mon_yyyy_months"
description = "TRY_TO_DATE with DD MON YYYY for every month's abbreviation."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'01 Jan 2024'"],
  ["'02 Feb 2024'"],
  ["'03 Mar 2024'"],
  ["'04 Apr 2024'"],
  ["'05 May 2024'"],
  ["'06 Jun 2024'"],
  ["'07 Jul 2024'"],
  ["'08 Aug 2024'"],
  ["'09 Sep 2024'"],
  ["'01 Oct 2024'"],
  ["'02 Nov 2024'"],
  ["'03 Dec 2024'"],
]
expression = "TRY_TO_DATE(s, 'DD MON YYYY')"
tags = ["boundary"]

