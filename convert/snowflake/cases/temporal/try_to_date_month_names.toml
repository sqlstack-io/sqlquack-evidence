[[case]]
id = "try_to_date_month_format_case"
description = "Month-name formats written in lower and mixed case."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'05 Mar 2024'"],
  ["'March 05 2024'"],
  ["NULL"],
]
expression = "TRY_TO_DATE(s, 'dd mon yyyy')::VARCHAR || '|' || TRY_TO_DATE(s, 'Mmmm Dd Yyyy')::VARCHAR"
tags = ["null"]

