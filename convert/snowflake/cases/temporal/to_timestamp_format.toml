# TO_TIMESTAMP and TO_TIMESTAMP_NTZ of text with a literal format, and TRY_CAST of text to
# TIMESTAMP_NTZ.
category = "temporal"
construct = "fn:TO_TIMESTAMP"
session_profile = "utc-v1"

[[case]]
id = "to_timestamp_format_values"
description = "TO_TIMESTAMP and TO_TIMESTAMP_NTZ with YYYY-MM-DD HH24:MI:SS: padded and unpadded fields, midnight, a leap day and NULL."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'2024-02-29 13:45:01'"],
  ["'2024-02-29 9:5:1'"],
  ["'2024-03-01 00:00:00'"],
  ["'1999-12-31 23:59:59'"],
  ["NULL"],
]
query = "SELECT TO_TIMESTAMP(s, 'YYYY-MM-DD HH24:MI:SS') AS ts, TO_TIMESTAMP_NTZ(s, 'YYYY-MM-DD HH24:MI:SS') AS ntz FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "boundary"]

[[case]]
id = "to_timestamp_format_concatenated"
description = "TO_TIMESTAMP of a delivery date written by TO_VARCHAR and a time of day, joined by a space."
columns = [{ name = "d", type = "DATE" }, { name = "t", type = "VARCHAR" }]
rows = [
  ["'2024-02-29'", "'13:45:00'"],
  ["'2024-03-01'", "'7:05:09'"],
  ["NULL", "'10:00:00'"],
  ["'2024-03-01'", "NULL"],
]
expression = "TO_TIMESTAMP(TO_VARCHAR(d, 'YYYY-MM-DD') || ' ' || t, 'YYYY-MM-DD HH24:MI:SS')"
tags = ["null", "boundary"]

[[case]]
id = "to_timestamp_format_impossible_date"
description = "TO_TIMESTAMP with a format of an impossible date, which Snowflake rejects."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [["'2023-02-29 10:00:00'"]]
expression = "TO_TIMESTAMP(s, 'YYYY-MM-DD HH24:MI:SS')"
tags = ["null", "boundary"]

[[case]]
id = "to_timestamp_format_hour_out_of_range"
description = "TO_TIMESTAMP_NTZ with a format of hour 24, which Snowflake rejects."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [["'2024-02-29 24:00:00'"]]
expression = "TO_TIMESTAMP_NTZ(s, 'YYYY-MM-DD HH24:MI:SS')"
tags = ["null", "boundary"]

[[case]]
id = "to_timestamp_format_empty"
description = "TO_TIMESTAMP with a format of empty text, which Snowflake rejects."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [["''"]]
expression = "TO_TIMESTAMP(s, 'YYYY-MM-DD HH24:MI:SS')"
tags = ["null", "boundary"]

[[case]]
id = "to_timestamp_format_other_spelling"
description = "TO_TIMESTAMP with a format of text with a fraction, which the format does not spell."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [["'2024-02-29 13:45:01.5'"]]
expression = "TO_TIMESTAMP(s, 'YYYY-MM-DD HH24:MI:SS')"
tags = ["null", "boundary"]

[[case]]
id = "to_timestamp_format_hh24mi"
description = "TO_TIMESTAMP_NTZ with DD/MM/YYYY HH24:MI."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'29/02/2024 13:45'"],
  ["'1/3/2024 7:05'"],
  ["NULL"],
]
expression = "TO_TIMESTAMP_NTZ(s, 'DD/MM/YYYY HH24:MI')"
tags = ["null", "boundary"]

[[case]]
id = "try_cast_text_timestamp"
description = "TRY_CAST of text to TIMESTAMP and TIMESTAMP_NTZ(3): ISO dates and times with a space or T, fractions, offsets, impossible dates, empty and digitless text."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'2024-02-29 13:45:01'"],
  ["'2024-02-29T13:45:01.123456'"],
  ["'2024-02-29'"],
  ["'2024-02-29T13:45:01Z'"],
  ["'2024-02-29T13:45:01+02:00'"],
  ["'2023-02-29 10:00:00'"],
  ["'2024-02-29 25:00:00'"],
  ["''"],
  ["'n/a'"],
  ["NULL"],
]
query = "SELECT TRY_CAST(s AS TIMESTAMP) AS ts, TRY_CAST(s AS TIMESTAMP_NTZ(3)) AS ms FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null", "boundary"]

[[case]]
id = "try_cast_text_timestamp_epoch"
description = "TRY_CAST of integer text to TIMESTAMP, read by its magnitude."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [
  ["'1709214301'"],
  ["'1709214301123'"],
  ["'0'"],
  ["NULL"],
]
expression = "TRY_CAST(s AS TIMESTAMP)"
tags = ["null", "boundary"]

[[case]]
id = "try_cast_text_timestamp_other_spelling"
description = "TRY_CAST of text in a spelling no recording shows."
columns = [{ name = "s", type = "VARCHAR" }]
rows = [["'29 Feb 2024 13:45'"]]
expression = "TRY_CAST(s AS TIMESTAMP)"
tags = ["null", "boundary"]
expected_divergence = "date_text_spelling"
