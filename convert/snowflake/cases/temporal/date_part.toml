category = "temporal"
construct = "fn:DATE_PART"
session_profile = "utc-v1"

[[case]]
id = "date_part_year"
description = "DATE_PART YEAR of naive timestamps, around year ends and the epoch."
columns = [{ name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123456789'"],
  ["'2024-01-01 00:00:00'"],
  ["'2023-12-31 23:59:59.999999999'"],
  ["'1969-12-31 23:59:59.5'"],
  ["'2021-01-03 12:00:00'"],
  ["'2020-12-31 08:00:00'"],
  ["NULL"],
]
expression = "DATE_PART(YEAR, t)"
tags = ["null", "boundary"]

