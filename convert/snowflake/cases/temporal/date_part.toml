[[case]]
id = "extract_from_date"
description = "EXTRACT of year, month, day and day of week from dates."
columns = [{ name = "d", type = "DATE" }]
rows = [
  ["'2024-02-29'"],
  ["'2021-01-03'"],
  ["'1969-12-31'"],
  ["NULL"],
]
expression = "EXTRACT(YEAR FROM d) * 10000 + EXTRACT(MONTH FROM d) * 100 + EXTRACT(DAY FROM d) + EXTRACT(DAYOFWEEK FROM d) / 10"
tags = ["null", "boundary"]
