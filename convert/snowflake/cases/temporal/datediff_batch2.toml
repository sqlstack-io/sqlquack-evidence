# DATEDIFF with quoted and keyword units over DATE and TIMESTAMP_NTZ.
category = "temporal"
construct = "fn:DATEDIFF"
session_profile = "utc-v1"

[[case]]
id = "datediff_date_day"
description = "DATEDIFF('day') between DATEs across month and year ends."
columns = [{ name = "a", type = "DATE" }, { name = "b", type = "DATE" }]
rows = [
  ["'2024-01-31'", "'2024-02-29'"],
  ["'2024-02-29'", "'2025-02-28'"],
  ["'2024-03-01'", "'2024-02-28'"],
  ["'2023-12-31'", "'2024-01-01'"],
  ["'2024-01-01'", "'2024-01-01'"],
  ["NULL", "'2024-01-01'"],
]
expression = "DATEDIFF('day', a, b)"
tags = ["null", "boundary"]

[[case]]
id = "datediff_date_day_keyword"
description = "DATEDIFF(day) with the unit as a keyword."
columns = [{ name = "a", type = "DATE" }, { name = "b", type = "DATE" }]
